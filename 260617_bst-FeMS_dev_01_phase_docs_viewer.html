const PH=[{"id": "p0", "title": "Phase 0 — 인프라 기반", "status": "완료", "color": "#3fb950", "dir": "phase0_infra"}, {"id": "p1", "title": "Phase 1 — 마스터 데이터", "status": "완료", "color": "#3fb950", "dir": "phase1_master_data"}, {"id": "p2", "title": "Phase 2 — 시뮬레이터", "status": "부분완료", "color": "#d29922", "dir": "phase2_simulator"}, {"id": "p3", "title": "Phase 3 — 수집/처리 강화", "status": "대부분완료", "color": "#58a6ff", "dir": "phase3_collection"}, {"id": "p4", "title": "Phase 4 — 다중집계/피크", "status": "대부분완료", "color": "#58a6ff", "dir": "phase4_aggregation"}, {"id": "p5", "title": "Phase 5 — 전체 Frontend", "status": "대부분완료", "color": "#58a6ff", "dir": "phase5_frontend"}, {"id": "p6", "title": "Phase 6 — 분석/리포트", "status": "대부분완료", "color": "#58a6ff", "dir": "phase6_reports"}, {"id": "p7", "title": "Phase 7 — 인증/보안", "status": "구현예정", "color": "#f85149", "dir": "phase7_auth"}];
const LABS=["기획서","설계서","개발계획"];
const DX={"p0_0": "# Phase 0 — 인프라 기반 (Step 1~7) 기획서\n\n> 상태: **완료** (2026-06-11)\n\n---\n\n## 목적\n\nFeMS 전체 서비스가 실행될 Docker Compose 기반 인프라를 구축한다.  \n데이터베이스 이중화(설정 DB / 데이터 DB), 메시지 큐(Kafka KRaft), 캐시(Redis),  \n마이크로서비스(Collector / Processor / API), SPA 프론트엔드(React + Nginx)를  \n단일 명령(`make step7`)으로 기동 가능하도록 한다.\n\n---\n\n## 범위\n\n| Step | 내용 | 포트 |\n|------|------|------|\n| Step 1 | 설정 DB (PostgreSQL 16, df_fems_setting) | 5432 |\n| Step 2 | Modbus TCP 시뮬레이터 | 502 |\n| Step 3 | Kafka KRaft (메시지 브로커) | 9094 |\n| Step 4 | 데이터 DB (TimescaleDB 2.x, df_fems_data) | 5433 |\n| Step 5 | Processor (FastAPI, usage_1m 집계) | 8003 |\n| Step 6 | API Service (FastAPI + Redis) | 8090 |\n| Step 7 | Frontend (React 18 + Vite → Nginx) | 3000 |\n| Step 6b | Collector — Modbus (FastAPI) | 8001 |\n| Step 6c | Collector — OPC-UA (FastAPI) | 8002 |\n| 공통 | Redis 7 캐시 | 6379 |\n\n---\n\n## 기술 스택\n\n| 계층 | 기술 | 버전 | 역할 |\n|------|------|------|------|\n| Container | Docker Compose + profiles | 최신 | 서비스 오케스트레이션 |\n| 설정 DB | PostgreSQL 16 | 16.x | 장비/태그/서비스 설정 |\n| 데이터 DB | TimescaleDB | 2.x | 수집/집계 시계열 데이터 |\n| 메시지 큐 | Kafka KRaft (Bitnami) | 3.x | Collector → Processor 연결 |\n| 캐시 | Redis 7 | 7.x | API 응답 캐시 |\n| 수집 | Python 3.12 + pymodbus 3.13 | 최신 | Modbus/OPC-UA 장비 폴링 |\n| 처리 | Python 3.12 + asyncpg | 최신 | Kafka 소비 + TimescaleDB 적재 |\n| API | FastAPI 0.115 + uvicorn | 최신 | RESTful API + Swagger |\n| 프론트엔드 | React 18 + Vite 5 + TypeScript 5 | 최신 | SPA |\n| 스타일 | Tailwind CSS 3 + shadcn/ui 없음 | 최신 | CSS-only 커스텀 |\n| 차트 | Recharts 2 | 최신 | BarChart / LineChart / AreaChart / PieChart |\n| 상태 관리 | TanStack Query v5 | 5.x | 서버 상태 캐싱 |\n| 빌드 도구 | Docker Compose make | - | Makefile 기반 명령 |\n\n---\n\n## 비기능 요건\n\n- 단일 명령 기동: `make step7`\n- 컨테이너 간 네트워크: `fems-net` 내부 통신\n- 헬스체크: 각 DB/Redis에 `condition: service_healthy` 대기\n- 환경변수: `.env` 파일 (git-ignore, 비밀번호 저장)\n- 비밀번호: `.env`의 변수명만 DB에 저장, 평문 금지\n\n---\n\n## 산출물\n\n| 파일 | 내용 |\n|------|------|\n| `fems/infra/docker-compose.yml` | 전체 서비스 정의 (profiles: step1~step7) |\n| `fems/infra/Makefile` | step1~step7 + 각 Phase 타겟 |\n| `fems/infra/.env.example` | 환경변수 예시 |\n| `fems/infra/seeds/01~06_*.sql` | 기반 스키마 + 초기 설정 |\n| `fems/02_device/simulators/modbus_sim.py` | Modbus TCP 시뮬레이터 |\n| `fems/04_processor/app/` | Kafka Consumer + TimescaleDB Writer |\n| `fems/07_api/app/` | FastAPI 서비스 + Redis 캐시 |\n| `fems/08_frontend/` | React 18 SPA |\n", "p0_1": "# Phase 0 — 인프라 기반 설계서\n\n> 상태: **완료** (2026-06-11)\n\n---\n\n## 전체 아키텍처\n\n```\n[현장 계측 장비]  JB/EL 가스보정기 · LS/MI/ECO 전력량계 · OPC-UA 장비\n       ↓  Modbus TCP(502) / OPC-UA(4840)\n[fems-modbus-sim:502]   (Step 2 — 시뮬레이터, 실장비 없을 때 대체)\n       ↓\n[fems-collector-modbus:8001]  Collector Modbus (pymodbus 3.13)\n[fems-collector-opcua:8002]   Collector OPC-UA (asyncua)\n       ↓  Kafka fems.raw.data (JSON payload)\n[fems-kafka:9094]   KRaft 모드 (ZooKeeper 없음)\n       ↓\n[fems-processor:8003]  Processor (asyncpg + aiokafka)\n       ├── usage_1m 적재\n       ├── virtual_tag_value 계산\n       └── system_event 알람 기록\n       ↓\n[fems-data-db:5433]   TimescaleDB (df_fems_data)\n  ├── raw_collect        (1m 원시 수집)\n  ├── usage_1m           (1m 집계)\n  ├── usage_5m/15m/30m/1h/1d/1month  (Cagg)\n  ├── peak_15m           (Cagg)\n  └── virtual_tag_value  (가상태그)\n\n[fems-setting-db:5432]  PostgreSQL 16 (df_fems_setting)\n  ├── device / device_register / device_opcua_node\n  ├── tag_master / virtual_tag\n  ├── collector_service / collector_device_mapping\n  ├── processor_service / processor_rule\n  ├── energy_conversion_factor\n  ├── system_event\n  ├── outlier_config\n  └── energy_goal\n\n[fems-redis:6379]   Redis 7 (API 응답 캐시, TTL 120s~1800s)\n       ↓\n[fems-api:8090]   FastAPI API Service\n  ├── /api/v1/realtime    실시간 태그값\n  ├── /api/v1/usage/*     집계 데이터\n  ├── /api/v1/analysis/*  분석\n  ├── /api/v1/export/*    CSV 내보내기\n  ├── /api/v1/goals/*     목표 관리\n  ├── /api/v1/master/*    기준정보 CRUD\n  ├── /api/v1/settings/*  시스템 설정\n  ├── /api/v1/tags        태그 목록\n  └── /api/v1/status      서비스 상태\n       ↓\n[fems-frontend:3000]  React 18 + Nginx\n  Nginx 리버스 프록시: /api/* → fems-api:8090\n```\n\n---\n\n## Docker Compose 프로파일 구조\n\n```yaml\nprofiles:\n  step1: [setting-db]\n  step2: [setting-db, modbus-sim]\n  step3: [setting-db, modbus-sim, kafka]\n  step4: [setting-db, modbus-sim, kafka, data-db, redis]\n  step5: [step4 + processor]\n  step6: [...step5 + collector-modbus, collector-opcua, api]\n  step7: [...step6 + frontend]\n```\n\n프로파일 단계별 기동 (`make step1` ~ `make step7`):  \n각 단계는 이전 단계를 포함 — `make step7` 하나로 전체 스택 기동.\n\n---\n\n## 설정 DB 스키마 요약 (df_fems_setting)\n\n### 장비 관련\n\n| 테이블 | 역할 |\n|--------|------|\n| `device` | 장비 마스터 (IP, 포트, 슬레이브ID, 통신 타입) |\n| `device_register` | Modbus 레지스터 맵 (FC, addr, data_type, scale) |\n| `device_opcua_node` | OPC-UA 노드 경로 |\n| `tag_master` | 태그 마스터 (에너지종류, 단위, 보정계수) |\n| `virtual_tag` | 가상 태그 수식 (formula, formula_tags[]) |\n\n### 서비스 관련\n\n| 테이블 | 역할 |\n|--------|------|\n| `collector_service` | 수집 서비스 정의 (주기, 토픽, 활성 여부) |\n| `collector_device_mapping` | 서비스↔장비 N:M 매핑 |\n| `processor_service` | 처리 서비스 정의 |\n| `processor_rule` | 처리 규칙 (delta/avg, 대상 태그) |\n\n### 운영 관련\n\n| 테이블 | 역할 |\n|--------|------|\n| `energy_conversion_factor` | TJ/TOE/tCO₂ 단위 변환 계수 |\n| `system_event` | 수집/처리 오류 이벤트 로그 |\n| `outlier_config` | 이상치 탐지 파라미터 (window_size, threshold) |\n| `energy_goal` | 에너지 목표값 (factory_id, energy_kind, 연월) |\n\n---\n\n## 데이터 DB 스키마 요약 (df_fems_data)\n\n### 하이퍼테이블\n\n| 테이블 | 시간컬럼 | 청크 간격 | 보존 정책 |\n|--------|---------|----------|---------|\n| `raw_collect` | `time` | 1일 | 90일 (예정) |\n| `usage_1m` | `time` | 1일 | 365일 |\n| `virtual_tag_value` | `time` | 1일 | 90일 |\n\n### Continuous Aggregate 뷰\n\n| 뷰 | 소스 | 버킷 | 새로고침 주기 |\n|----|------|------|------------|\n| `usage_5m` | usage_1m | 5분 | 5분 |\n| `usage_15m` | usage_1m | 15분 | 15분 |\n| `usage_30m` | usage_1m | 30분 | 30분 |\n| `usage_1h` | usage_1m | 1시간 | 1시간 |\n| `usage_1d` | usage_1h | 1일 | 1일 |\n| `usage_1month` | usage_1m | 1개월 | 1일 |\n| `peak_15m` | usage_1m | 15분 | 15분 |\n\n---\n\n## Kafka 설계\n\n```\n브로커: fems-kafka:9094 (KRaft — 외부 ZooKeeper 불필요)\n토픽: fems.raw.data\n  파티션: 3\n  리텐션: 7일 (기본)\n  프로듀서: Collector Modbus / OPC-UA\n  컨슈머: Processor (consumer_group: fems-processor)\n```\n\n메시지 구조:\n```json\n{\n  \"tag_id\": \"JB_S3_CORR\",\n  \"device_id\": \"DEV_JB_S3\",\n  \"factory_id\": \"S3\",\n  \"energy_kind\": 2,\n  \"unit\": \"Nm3\",\n  \"value\": 850123.45,\n  \"quality\": 0,\n  \"collected_at\": \"2026-06-17T10:30:00Z\"\n}\n```\n\n---\n\n## 환경변수 (.env)\n\n```bash\n# 설정 DB\nSETTING_DB_PASS=<비밀번호>\n\n# 데이터 DB\nTIMESCALEDB_PASS=<비밀번호>\n\n# Redis\nREDIS_PASSWORD=<비밀번호>\n\n# Kafka\nKAFKA_ADVERTISED_LISTENERS=PLAINTEXT://fems-kafka:9094\n```\n\n**보안 규칙**: DB 저장 시 비밀번호 컬럼에는 환경변수 이름만 저장 (`TIMESCALEDB_PASS`), 실제 값은 절대 저장하지 않음.\n\n---\n\n## 헬스체크 설정\n\n```yaml\nsetting-db:\n  healthcheck:\n    test: [\"CMD\", \"pg_isready\", \"-U\", \"fems\"]\n    interval: 5s\n    timeout: 5s\n    retries: 10\n\ndata-db:\n  healthcheck:  # 동일\n\nredis:\n  healthcheck:\n    test: [\"CMD\", \"redis-cli\", \"-a\", \"$REDIS_PASSWORD\", \"ping\"]\n```\n\nAPI 서비스는 DB/Redis `service_healthy` 조건 충족 후 시작.\n", "p0_2": "# Phase 0 — 인프라 기반 개발 계획\n\n> 상태: **완료** (2026-06-11)\n\n---\n\n## 구현 범위\n\n| 파일 | 설명 | 상태 |\n|------|------|------|\n| `fems/infra/docker-compose.yml` | 전체 Docker Compose 서비스 정의 | ✅ 완료 |\n| `fems/infra/Makefile` | step1~step7 + Phase 시드 타겟 | ✅ 완료 |\n| `fems/infra/.env.example` | 환경변수 예시 | ✅ 완료 |\n| `fems/infra/seeds/01_setting_schema.sql` | 설정 DB 기본 스키마 | ✅ 완료 |\n| `fems/infra/seeds/02_data_schema.sql` | 데이터 DB 하이퍼테이블 스키마 | ✅ 완료 |\n| `fems/infra/seeds/03_step2_test_devices.sql` | Step 2 테스트 장비 시드 | ✅ 완료 |\n| `fems/infra/seeds/04_step4_processor.sql` | Processor 기본 규칙 시드 | ✅ 완료 |\n| `fems/infra/seeds/05_step4_cagg.sql` | usage_1h / usage_1d Cagg 생성 | ✅ 완료 |\n| `fems/infra/seeds/06_step6_api.sql` | API 서비스 초기 설정 | ✅ 완료 |\n| `fems/02_device/simulators/modbus_sim.py` | Modbus TCP 시뮬레이터 (Step 2) | ✅ 완료 |\n| `fems/03_collector/app/` | Collector 서비스 (Modbus + OPC-UA) | ✅ 완료 |\n| `fems/04_processor/app/` | Processor 서비스 (Kafka → TimescaleDB) | ✅ 완료 |\n| `fems/07_api/app/` | API 서비스 (FastAPI + Redis) | ✅ 완료 |\n| `fems/08_frontend/` | React 18 SPA (Vite + TypeScript) | ✅ 완료 |\n\n---\n\n## Step별 실행 순서\n\n### Step 1 — 설정 DB\n\n```bash\ncd fems/infra\nmake step1          # PostgreSQL 16 컨테이너 시작 + 스키마 초기화\nmake check-setting  # 테이블 목록 확인\n```\n\n생성 테이블:\n- device, device_register, device_opcua_node\n- tag_master, virtual_tag\n- collector_service, collector_device_mapping\n- processor_service, processor_rule\n\n### Step 2 — Modbus 시뮬레이터\n\n```bash\nmake step2          # modbus-sim 컨테이너 빌드 + 시작\nmake step2-seed     # 테스트 장비 (DEV_SIM_ELEC, DEV_SIM_GAS) 시드\n```\n\n테스트 슬레이브:\n- Slave 1: 테스트용 임시 장비 (FC3, HR 100번대)\n\n### Step 3 — Kafka KRaft\n\n```bash\nmake step3          # Kafka 브로커 + fems.raw.data 토픽 생성\n```\n\n확인:\n```bash\ndocker exec fems-kafka kafka-topics.sh --list --bootstrap-server localhost:9094\n```\n\n### Step 4 — 데이터 DB + Redis\n\n```bash\nmake step4          # TimescaleDB + Redis 시작 + 집계 뷰 초기화\nmake check-data     # 하이퍼테이블 목록 확인\n```\n\n생성 테이블/뷰:\n- raw_collect (hypertable)\n- usage_1m (hypertable)\n- virtual_tag_value (hypertable)\n- usage_1h, usage_1d (Continuous Aggregate)\n\n### Step 5 — Processor\n\n```bash\nmake step5          # Processor 컨테이너 시작 (Kafka Consumer 대기 상태)\nmake processor-seed # Processor 서비스 + 규칙 시드\n```\n\nProcessor 기본 동작:\n- `fems.raw.data` 토픽 소비\n- `PROC_USAGE_1M` 규칙 → usage_1m 적재\n- 가상 태그 수식 계산 → virtual_tag_value 적재\n\n### Step 6 — Collector + API\n\n```bash\nmake step6          # Collector Modbus/OPC-UA + API 서비스 시작\n```\n\nCollector 동작 (활성화 후):\n- 60초마다 설정 DB에서 장비/태그 로드\n- Modbus TCP 폴링 → Kafka 발행\n- 재시도 초과 시 system_event CRITICAL 기록\n\nAPI 기본 엔드포인트:\n```\nhttp://localhost:8090/health         헬스체크\nhttp://localhost:8090/docs           Swagger UI\nhttp://localhost:8090/api/v1/status  서비스 상태\n```\n\n### Step 7 — Frontend\n\n```bash\nmake step7          # 전체 스택 (Frontend 포함) 한번에 시작\n```\n\n확인:\n```\nhttp://localhost:3000               대시보드\nhttp://localhost:3000/api/v1/status Nginx 프록시 경유 API\n```\n\n---\n\n## 전체 기동 (신규 환경)\n\n```bash\ncd fems/infra\n\n# .env 파일 복사 + 비밀번호 설정\ncp .env.example .env\n# vi .env  → SETTING_DB_PASS, TIMESCALEDB_PASS, REDIS_PASSWORD 입력\n\n# 전체 스택 기동 (DB → Kafka → Processor → Collector → API → Frontend)\nmake step7\n\n# 기반 시드 (최초 1회)\nmake step2-seed\nmake processor-seed\n\n# Phase 시드 (최초 1회, 실 장비 마스터 등록 후)\nmake phase1-seed\nmake phase2-seed\nmake phase3-seed\nmake phase3-conv-seed\nmake phase4-30m-seed\nmake phase4-peak-seed\nmake phase6-goal-seed\n```\n\n---\n\n## 서비스 포트 요약\n\n| 서비스 | 컨테이너명 | 호스트 포트 | 용도 |\n|--------|---------|----------|------|\n| PostgreSQL 16 | fems-setting-db | 5432 | 설정 DB |\n| TimescaleDB | fems-data-db | 5433 | 데이터 DB |\n| Redis 7 | fems-redis | 6379 | API 캐시 |\n| Kafka KRaft | fems-kafka | 9094 | 메시지 큐 |\n| Modbus 시뮬 | fems-modbus-sim | 502 | 장비 시뮬 |\n| Collector Modbus | fems-collector-modbus | 8001 | 수집 서비스 |\n| Collector OPC-UA | fems-collector-opcua | 8002 | OPC-UA 수집 |\n| Processor | fems-processor | 8003 | 처리 서비스 |\n| API Service | fems-api | 8090 | REST API |\n| Frontend | fems-frontend | 3000 | React SPA |\n\n---\n\n## 주요 Makefile 타겟\n\n| 타겟 | 설명 |\n|------|------|\n| `make step7` | 전체 스택 기동 |\n| `make check-setting` | 설정 DB 테이블 현황 |\n| `make check-data` | 데이터 DB 집계 현황 |\n| `make check-collect` | 수집 현황 (raw_collect 통계) |\n| `make check-usage` | usage_1m 현황 |\n| `make psql-setting` | 설정 DB psql 접속 |\n| `make psql-data` | 데이터 DB psql 접속 |\n| `make logs-collector` | Collector 로그 |\n| `make logs-processor` | Processor 로그 |\n| `make logs-api` | API 로그 |\n\n---\n\n## 알려진 제약\n\n| 항목 | 내용 |\n|------|------|\n| pymodbus 버전 | 3.13에서 `slave=` → `device_id=` 파라미터 변경 필요 |\n| TimescaleDB 압축 | `timescaledb.compress=true` 먼저 설정 후 policy 추가 순서 중요 |\n| Kafka 첫 시작 | 토픽 자동 생성 설정 확인 또는 `kafka-topics.sh --create` 수동 실행 |\n| Redis 비밀번호 | `redis-cli -a $REDIS_PASSWORD` 형식 필요 |\n", "p1_0": "# Phase 1 — 마스터 데이터 관리 (기준정보) 기획서\n\n## 목적\n\n기존 Oracle/MySQL/MongoDB에 분산되어 있던 설정 정보를 신규 PostgreSQL(df_fems_setting)로 일원화하고,\nFrontend에서 모든 설정을 추가·수정·삭제할 수 있도록 CRUD UI를 구축한다.\n\n## 범위\n\n| 항목 | 기존 위치 | 신규 위치 |\n|------|---------|---------|\n| 장비 마스터 (DEVICE_MASTER) | Oracle BESTSF | device 테이블 |\n| 태그 마스터 (TAG_MASTER) | Oracle BESTSF | tag_master 테이블 |\n| Modbus 레지스터 설정 | conf 파일 (LS.conf, JB.conf 등) | device_register 테이블 |\n| OPC-UA 노드 설정 | Autobase 설정 파일 | device_opcua_node 테이블 |\n| 가상 태그 수식 | VIRTUAL_TAG_FORMULA 컬럼 | virtual_tag 테이블 |\n| 집계 처리 규칙 | mm_11_summary.py 하드코딩 | processor_rule 테이블 |\n| 에너지 변환 계수 | 소스 코드 내 상수 | energy_conversion 테이블 |\n| 수집 서비스 설정 | 환경 변수 | collector_service 테이블 |\n| 프로세서 서비스 설정 | 환경 변수 | processor_service 테이블 |\n\n## 신규 기능 요건\n\n### R1. 실제 장비 전체 등록\n- JB 가스보정기 2대 (C00001, C00002)\n- EL 가스보정기 2대 (E00001, E00002)  \n- LS 전력량계 다수 (주요 계통별)\n- MI/VI/ECO 전력량계 (공장별)\n- Autobase OPC-UA 1세트\n- Citech PLC OPC-UA 1세트\n\n### R2. 전체 74개+ 태그 등록\n- 에너지 종류별 (전력 1, 가스 2, 수도 3)\n- 가상태그 포함 (수식 기반 합산/연산)\n- 보정계수 기본값 설정\n\n### R3. 수식 편집 UI (가상태그)\n- Frontend에서 수식 입력: `(TAG_001 + TAG_002) * 1.05`\n- 수식 문법 검증 (허용 함수: sum, abs, round, sqrt, min, max)\n- 실시간 미리보기\n\n### R4. 집계 주기 설정 UI\n- 1m / 5m / 15m / 30m / 1h / 1d / 1month 각각 on/off\n- 집계 대상 태그 선택\n- 집계 방법 설정 (SUM / AVG / MAX / MIN)\n\n### R5. 보정계수 관리\n- 태그별 correct_ratio Frontend 편집\n- 변경 이력 저장\n\n## 비기능 요건\n\n- 모든 CRUD 작업은 관리자 권한 필요\n- 설정 변경 즉시 Collector/Processor에 반영 (재시작 불필요)\n- 설정 변경 이력 (audit log) 보관\n\n## 산출물\n\n| 파일 | 내용 |\n|------|------|\n| `01_planning.md` | 이 문서 (기획) |\n| `02_design.md` | DB/API/UI 설계 |\n| `03_dev_plan.md` | 개발 작업 분해 |\n| seeds/07_phase1_real_devices.sql | 실제 장비·태그 Seed SQL |\n| `fems/07_api/app/routers/master.py` | 마스터 데이터 CRUD API |\n| `fems/08_frontend/src/pages/master/` | 기준정보 CRUD 화면 |\n", "p1_1": "# Phase 1 — 마스터 데이터 설계서\n\n## DB 설계 요약\n\n| 테이블 | 역할 | 비고 |\n|-------|------|------|\n| `device` | 현장 계측 장비 마스터 | IP·포트·슬레이브주소 포함 |\n| `device_register` | Modbus 레지스터 맵 | FC/addr/type/scale |\n| `device_opcua_node` | OPC-UA 노드 경로 | OPC-UA 전용 |\n| `tag_master` | 태그 마스터 (실+가상) | energy_kind / unit / correct_ratio |\n| `virtual_tag` | 가상 태그 수식 | formula / formula_tags / calc_interval |\n| `collector_service` | 수집 서비스 정의 | 주기·토픽·활성 여부 |\n| `collector_device_mapping` | 수집서비스↔장비 N:M 매핑 | collect_order / enabled |\n| `processor_service` | 처리 서비스 정의 | consumer_group / target_table |\n| `processor_rule` | 처리 규칙 | delta / avg rule_type |\n\n## 현장 장비 목록 (07_phase1_real_devices.sql 기준)\n\n### 가스 보정기\n\n| device_id | 제조사 | IP | 포트 | 상태 | 구역 |\n|-----------|-------|-----|------|------|------|\n| DEV_JB_S3 | JB SF2200 | 10.1.2.146 | 1470 | ● 활성 | S3 |\n| DEV_JB_S2 | JB SF2200 | 10.1.2.147 | 1470 | 비활성 | S3 |\n| DEV_JB_S4 | JB SF2200 | 10.1.2.148 | 1470 | 비활성 | S3 |\n| DEV_JB_Q6 | JB SF2200 | 10.1.2.134 | 1470 | 비활성 | Q6 |\n| DEV_JB_Q7 | JB SF2200 | 10.1.2.139 | 1470 | 비활성 | Q7 |\n| DEV_JB_Q8 | JB SF2200 | 10.1.2.140 | 1470 | 비활성 | Q8 |\n| DEV_JB_Q9 | JB SF2200 | 10.1.2.152 | 1470 | 비활성 | Q9 |\n| DEV_JB_42 | JB SF2200 | 10.1.2.127 | 1470 | 비활성 | 42 |\n| DEV_EL_Z0 | EL Elinko GSU | 10.1.2.136 | 1470 | ● 활성 | Z0 |\n\n가스 보정기 레지스터 맵 (FC4, Big Endian):\n```\naddr 0-1 : CORR   UINT32 × 0.01  Nm³   보정 적산량\naddr 2-3 : UNCORR UINT32 × 0.01  Nm³   미보정 적산량\naddr 4-5 : FLOW   FLOAT32 × 1.0  Nm³/h 순시 유량\naddr 6-7 : TEMP   FLOAT32 × 1.0  °C    가스 온도\naddr 8-9 : PRESS  FLOAT32 × 1.0  kPa   가스 압력\n```\n\n### 전력량계\n\n| device_id | 제조사 | IP | 포트 | 상태 | 구역 |\n|-----------|-------|-----|------|------|------|\n| DEV_LS_F1 | LS GIMAC-i | 10.1.2.169 | 1470 | ● 활성 | F1 |\n| DEV_MI_MAIN | Mitsubishi ME110NSR-MB | 10.1.2.171 | 1470 | ● 활성 | F1 |\n| DEV_MI_41 ~ Z4 | Mitsubishi ME110NSR-MB | 10.1.2.131~161 | 1470 | 비활성 | 41~Z4 |\n| DEV_VI_158 | Vitzro VIPAM3300-F | 10.1.2.158 | 1470 | 비활성 | V |\n| DEV_ECO_I1 | Ecosense ES-WCTN | 10.1.2.151 | 1470 | ● 활성 | I1 |\n\nLS GIMAC-i 레지스터 맵 (FC3, Big Endian):\n```\naddr 0-1 : KWH   INT32   × 0.1  kWh  누적 전력량\naddr 2   : KW    INT16   × 0.1  kW   수요전력\naddr 3   : V     UINT16  × 0.1  V    선간전압\naddr 4   : A     UINT16  × 0.01 A    전류\naddr 5   : PF    INT16   × 0.01 %    역률\naddr 6-7 : KVAR  INT32   × 0.1  kVAr 무효전력\n```\n\nMI/VI/ECO 레지스터 맵 (FC3, FLOAT32):\n```\naddr 0-1 : KWH   FLOAT32 kWh\naddr 2-3 : KW    FLOAT32 kW\naddr 4-5 : V     FLOAT32 V\naddr 6-7 : A     FLOAT32 A\naddr 8-9 : PF    FLOAT32 %\naddr 10-11: KVAR FLOAT32 kVAr\n```\n\n### OPC-UA 장비\n\n| device_id | 제조사 | endpoint | 상태 |\n|-----------|-------|----------|------|\n| DEV_AUTO_DCS | Autobase | opc.tcp://10.1.2.200:4840 | ● 활성 |\n| DEV_CIT_PLC  | Citech   | opc.tcp://10.1.2.201:4840 | ● 활성 |\n\n## 태그 수 집계\n\n| 구분 | 태그 수 |\n|------|--------|\n| JB 가스 태그 (8 devices × 5) | 40 |\n| EL 가스 태그 (1 device × 5) | 5 |\n| LS 전력 태그 (1 × 6) | 6 |\n| MI 전력 태그 (8 × 5~6) | 37 |\n| VI 전력 태그 (1 × 5) | 5 |\n| ECO 전력 태그 (1 × 6) | 6 |\n| OPC-UA 태그 (2 × 5) | 10 |\n| 가상 태그 | 6 |\n| **합계** | **115** |\n\n## API 설계\n\n### 기준정보 CRUD API (`/api/v1/master/`)\n\n```\nGET    /api/v1/master/devices              장비 목록 (페이징/필터)\nPOST   /api/v1/master/devices              장비 등록\nGET    /api/v1/master/devices/{id}         장비 상세\nPUT    /api/v1/master/devices/{id}         장비 수정\nDELETE /api/v1/master/devices/{id}         장비 삭제\n\nGET    /api/v1/master/devices/{id}/registers   레지스터 목록\nPUT    /api/v1/master/devices/{id}/registers   레지스터 일괄 수정\n\nGET    /api/v1/master/tags                 태그 목록 (페이징/필터)\nPOST   /api/v1/master/tags                 태그 등록\nGET    /api/v1/master/tags/{tag_id}        태그 상세\nPUT    /api/v1/master/tags/{tag_id}        태그 수정\nDELETE /api/v1/master/tags/{tag_id}        태그 삭제\n\nGET    /api/v1/master/virtual-tags         가상 태그 목록\nPOST   /api/v1/master/virtual-tags         가상 태그 등록\nPUT    /api/v1/master/virtual-tags/{id}    가상 태그 수정\nPOST   /api/v1/master/virtual-tags/validate  수식 유효성 검증\n```\n\n## Frontend 화면 설계\n\n### `/master/devices` — 장비 관리\n\n- 테이블: device_id, 제조사, 모델, IP, 포트, 공장, 에너지 종류, 활성 여부\n- 행 클릭 → 상세/수정 슬라이드 패널\n- \"+ 장비 추가\" 버튼 → 모달 폼\n- 활성 토글 스위치 (use_yn 즉시 변경)\n- 하위 탭: \"레지스터 맵\" → 인라인 편집 그리드\n\n### `/master/tags` — 태그 관리\n\n- 필터: 에너지 종류 / 수집 여부 / 가상 여부\n- 보정계수 인라인 편집 (숫자 입력)\n- 수집 여부 토글\n- 가상 태그 수식 편집기 (모달 텍스트 에어리어 + 참조 태그 자동완성)\n- 수식 미리보기: 마지막 계산값 표시\n\n## 개발 순서\n\n1. `fems/07_api/app/routers/master.py` — CRUD 엔드포인트\n2. `fems/08_frontend/src/pages/master/DevicePage.tsx` — 장비 관리\n3. `fems/08_frontend/src/pages/master/TagPage.tsx` — 태그 관리\n4. `fems/08_frontend/src/pages/master/VirtualTagPage.tsx` — 가상 태그 + 수식 편집기\n5. 사이드바 메뉴 `/master` 하위 메뉴 연결\n", "p1_2": "# Phase 1 — 마스터 데이터 관리 개발 계획\n\n> 상태: **개발 완료 / 버그 수정 완료** (2026-06-11)\n\n---\n\n## 구현 범위\n\n| 구분 | 파일 | 설명 | 상태 |\n|------|------|------|------|\n| DB 시드 | `fems/infra/seeds/07_phase1_real_devices.sql` | 실 장비 21대, 레지스터 맵, 115개 태그, 가상 태그 6개, 수집/처리 서비스 설정 | ✅ 완료 |\n| API | `fems/07_api/app/routers/master.py` | 장비/레지스터/태그/가상태그 CRUD, 수식 검증 | ✅ 완료 |\n| API main | `fems/07_api/app/main.py` | master 라우터 등록, CORS PUT/DELETE 추가 | ✅ 완료 |\n| 모델 | `fems/07_api/app/models.py` | TagInfo에 correct_ratio 필드 추가 | ✅ 완료 |\n| 기존 태그 API | `fems/07_api/app/routers/tags.py` | GET /tags SELECT에 correct_ratio 추가 | ✅ 완료 |\n| 프론트 API | `fems/08_frontend/src/api/client.ts` | master CRUD 메서드, TagInfo correct_ratio 추가 | ✅ 완료 |\n| 프론트 페이지 | `fems/08_frontend/src/pages/master/DevicePage.tsx` | 장비 관리 CRUD UI | ✅ 완료 |\n| 프론트 페이지 | `fems/08_frontend/src/pages/master/TagPage.tsx` | 태그 관리 CRUD + 인라인 보정계수 편집 | ✅ 완료 |\n| 프론트 페이지 | `fems/08_frontend/src/pages/master/VirtualTagPage.tsx` | 가상 태그 + 수식 편집·검증 | ✅ 완료 |\n| 라우팅 | `fems/08_frontend/src/App.tsx` | master/* 라우트 추가 | ✅ 완료 |\n| 레이아웃 | `fems/08_frontend/src/components/layout/Layout.tsx` | 기준정보 하위 메뉴 (접이식) | ✅ 완료 |\n| Makefile | `fems/infra/Makefile` | `phase1-seed` 타겟 추가 | ✅ 완료 |\n\n---\n\n## 버그 수정 내역\n\n### BUG-01: asyncpg JSONB 파라미터 오류\n\n**증상**: `create_virtual_tag` / `update_virtual_tag` 호출 시 JSONB 컬럼에 Python list가 아닌 JSON 문자열이 전달되어 asyncpg 오류 발생 가능.\n\n**원인**: asyncpg는 Python `list`를 `ARRAY`로 해석. JSONB 컬럼에 list를 전달하려면 SQL에서 `::jsonb` 캐스트 + `json.dumps()` 문자열 조합이 필요.\n\n**수정**:\n- `create_virtual_tag`: INSERT SQL의 formula_tags 파라미터를 `$4::jsonb`로 변경\n- `update_virtual_tag`: `set_clauses` 생성 시 `formula_tags` 컬럼만 `$N::jsonb` 캐스트 적용\n\n```python\n# 수정 전\nset_clauses = \", \".join(f\"{k} = ${i+2}\" for i, k in enumerate(updates))\n\n# 수정 후\nset_clauses = \", \".join(\n    f\"{k} = ${i+2}::jsonb\" if k == \"formula_tags\" else f\"{k} = ${i+2}\"\n    for i, k in enumerate(updates)\n)\n```\n\n### BUG-02: correct_ratio 필드 누락\n\n**증상**: GET /tags 응답에 `correct_ratio`가 없어 프론트엔드 인라인 편집 기능이 동작하지 않음. 타입 캐스트 우회코드 사용.\n\n**수정**:\n- `models.py` `TagInfo`: `correct_ratio: float = 1.0` 추가\n- `tags.py` GET /tags, GET /tags/{tag_id}: `COALESCE(correct_ratio, 1.0) AS correct_ratio` SELECT 추가\n- `client.ts` `TagInfo`: `correct_ratio: number` 추가\n- `TagPage.tsx`: 타입 캐스트 제거, 직접 필드 접근으로 변경\n\n---\n\n## 시드 실행 방법\n\n```bash\ncd fems/infra\n\n# Phase 1 실 장비 마스터 데이터 삽입\nmake phase1-seed\n\n# 삽입 결과 확인\nmake check-setting\n```\n\n### 시드 내용 요약\n\n| 항목 | 수량 |\n|------|------|\n| 장비 (실 장비) | 21대 (활성 6 + 비활성 15) |\n| 논리 장비 (가상 태그 전용) | 1대 (DEV_BST_VIRTUAL) |\n| 레지스터 맵 | JB/EL: 5×9=45, LS: 7×1=7, MI: 6×8=48, VI: 6×1=6, ECO: 6×1=6 |\n| 태그 (실 태그) | ~109개 |\n| 태그 (가상 태그) | 6개 (BST 전체 합산) |\n| 수집 서비스 | 3개 (GAS, ELEC, OPC-UA) — enabled=false |\n| 처리 규칙 | 4개 (가스 delta, 전기 delta, kW avg, V avg) |\n\n> **주의**: 수집 서비스는 실 장비 연결 확인 후 Frontend에서 개별 활성화 필요.\n\n---\n\n## API 엔드포인트 목록\n\n```\nPOST   /api/v1/master/devices                        장비 생성\nPUT    /api/v1/master/devices/{device_id}            장비 수정\nDELETE /api/v1/master/devices/{device_id}            장비 삭제\nGET    /api/v1/master/devices/{device_id}/registers  레지스터 목록\nPOST   /api/v1/master/devices/{device_id}/registers  레지스터 생성\nPUT    /api/v1/master/devices/{device_id}/registers/{id}  레지스터 수정\nDELETE /api/v1/master/devices/{device_id}/registers/{id}  레지스터 삭제\nGET    /api/v1/master/tags                           태그 목록 (correct_ratio 포함)\nPOST   /api/v1/master/tags                           태그 생성\nPUT    /api/v1/master/tags/{tag_id}                  태그 수정 (보정계수 포함)\nDELETE /api/v1/master/tags/{tag_id}                  태그 삭제\nGET    /api/v1/master/virtual-tags                   가상 태그 목록\nPOST   /api/v1/master/virtual-tags                   가상 태그 생성\nPUT    /api/v1/master/virtual-tags/{vtag_id}         가상 태그 수정\nDELETE /api/v1/master/virtual-tags/{vtag_id}         가상 태그 삭제\nPOST   /api/v1/master/virtual-tags/validate          수식 검증\n```\n\n---\n\n## 다음 단계: Phase 2 — 시뮬레이터 확장\n\n**목표**: 실 장비 레지스터 맵을 Modbus 시뮬레이터에 적용하여 실 장비 없이도 수집 파이프라인 전체 검증 가능.\n\n**작업**:\n1. `fems/02_modbus_sim/` — JB/EL/LS/MI/ECO 21대 레지스터 맵 구현\n2. Docker Compose 시뮬레이터 포트 설정 (장비별 분리 또는 slave_id 구분)\n3. 에너지 시계열 패턴 데이터 생성 (주간/야간 부하 패턴)\n4. `07_phase1_real_devices.sql` 수집 서비스 `enabled=true`로 전환 (시뮬레이터 연결 시)\n", "p2_0": "# Phase 2 — 현실적 시뮬레이터 확장 기획서\n\n> 상태: **부분 완료** (완료 5/9 장비, 2026-06-11)  \n> 참고: 상세 기획/설계는 [`../phase2_sim_expansion/`](../phase2_sim_expansion/) 참조\n\n---\n\n## 목적\n\nPhase 1에서 등록된 실 장비 21대의 레지스터 맵을 Modbus TCP 시뮬레이터에 적용하여,  \n실 장비 없이도 수집 → 처리 → API → Frontend 전체 파이프라인을 검증 가능하게 한다.\n\n---\n\n## 범위\n\n### 완료 (2026-06-11)\n\n| 장비 | Slave ID | 타입 | FC | 비고 |\n|------|----------|------|----|------|\n| DEV_JB_S3 (JB SF2200 가스보정기) | 11 | GAS_CORRECT | FC4 | UINT32/FLOAT32 |\n| DEV_EL_Z0 (Elinko GSU 가스보정기) | 12 | GAS_CORRECT | FC4 | UINT32/FLOAT32 |\n| DEV_LS_F1 (LS GIMAC-i 전력량계) | 13 | MODBUS_TCP | FC3 | INT32/INT16/UINT16 |\n| DEV_MI_MAIN (Mitsubishi ME110) | 14 | MODBUS_TCP | FC3 | FLOAT32 |\n| DEV_ECO_I1 (Ecosense ES-WCTN) | 15 | MODBUS_TCP | FC3 | FLOAT32 |\n\n시뮬 기준값:\n- 가스 총 피크: **127 Nm³/h** (JB S3: 105 + EL Z0: 22)\n- 전기 총 피크: **680 kW** (LS F1: 180 + MI MAIN: 420 + ECO I1: 80)\n\n### 미완료 (낮은 우선순위)\n\n| 장비 | 이유 |\n|------|------|\n| DEV_VI_158 (Vitzro 전력량계) | 레지스터 맵 확인 필요 |\n| DEV_AUTO_DCS (Autobase OPC-UA) | OPC-UA 시뮬레이터 별도 구조 필요 |\n| DEV_CIT_PLC (Citech PLC OPC-UA) | 동일 |\n| DEV_JB_S2/S4/Q6~Q9/42 (비활성 JB) | 현장 연결 불필요 |\n| DEV_EL_E0/E2 (비활성 EL) | 현장 연결 불필요 |\n\n---\n\n## 핵심 설계 결정\n\n### 멀티 슬레이브 Modbus\n\n```\nmodbus-sim:502\n  Slave  1 → DEV_SIM_ELEC/GAS (Step 2 테스트 호환)\n  Slave 11 → DEV_JB_S3\n  Slave 12 → DEV_EL_Z0\n  Slave 13 → DEV_LS_F1\n  Slave 14 → DEV_MI_MAIN\n  Slave 15 → DEV_ECO_I1\n```\n\n- `single=False`: 슬레이브 ID별 독립 데이터 블록\n- FC4 IR 블록: 가스 보정기 전용 (Input Register)\n- FC3 HR 블록: 전력량계 전용 (Holding Register)\n\n### 부하율 패턴\n\n```\n주간 (08:00-18:00): 0.70 ~ 1.00 (sin 곡선)\n과도기 (06-08, 18-20): 0.40\n야간 (20-06): 0.25\n```\n\n---\n\n## 검증 목표\n\n- [ ] raw_collect: 5개 장비 태그 60초 주기 수집\n- [ ] usage_1m: 가스 delta + 전력 delta/kW avg 1분 집계\n- [ ] virtual_tag_value: 합산 가상태그 정상 계산\n- [ ] Frontend 대시보드/트렌드: 실 장비 태그 값 표시\n\n---\n\n## 실행 방법\n\n```bash\ncd fems/infra\nmake step2           # 시뮬레이터 재빌드 포함 기동\nmake step2-seed      # 테스트 장비 시드\nmake phase1-seed     # 실 장비 마스터 등록\nmake phase2-seed     # 시뮬레이터 리디렉션 + 수집 서비스 활성화\ndocker restart fems-collector-modbus fems-processor\nmake check-collect   # 수집 확인\n```\n", "p2_1": "# Phase 2 — 시뮬레이터 설계서\n\n> 상태: **완료** (2026-06-11)  \n> 상세 설계: [`../phase2_sim_expansion/02_design.md`](../phase2_sim_expansion/02_design.md)\n\n---\n\n## 레지스터 맵 상세\n\n### JB SF2200 / Elinko GSU (Slave 11, 12 — FC4 Input Register)\n\n| addr | 타입 | scale | 단위 | 내용 |\n|------|------|-------|------|------|\n| 0-1 | UINT32 | 0.01 | Nm³ | 보정 적산량 |\n| 2-3 | UINT32 | 0.01 | Nm³ | 미보정 적산량 |\n| 4-5 | FLOAT32 | 1.0 | Nm³/h | 순시 유량 |\n| 6-7 | FLOAT32 | 1.0 | °C | 가스 온도 |\n| 8-9 | FLOAT32 | 1.0 | kPa | 가스 압력 |\n\n시뮬 기준: JB S3 누적 85만 Nm³, 피크 105 Nm³/h / EL Z0 누적 23만 Nm³, 피크 22 Nm³/h\n\n### LS GIMAC-i (Slave 13 — FC3 Holding Register)\n\n| addr | 타입 | scale | 단위 | 내용 |\n|------|------|-------|------|------|\n| 0-1 | INT32 | 0.1 | kWh | 전력량 누적 |\n| 2 | INT16 | 0.1 | kW | 수요전력 |\n| 3 | UINT16 | 0.1 | V | 전압 |\n| 4 | UINT16 | 0.01 | A | 전류 |\n| 5 | INT16 | 0.01 | % | 역률 |\n| 6-7 | INT32 | 0.1 | kVAR | 무효전력 |\n\n시뮬 기준: 피크 180 kW, 역률 0.88~0.93\n\n### Mitsubishi ME110 / Ecosense ES-WCTN (Slave 14, 15 — FC3 HR, FLOAT32)\n\n| addr | 타입 | scale | 단위 | 내용 |\n|------|------|-------|------|------|\n| 0-1 | FLOAT32 | 1.0 | kWh | 전력량 누적 |\n| 2-3 | FLOAT32 | 1.0 | kW | 수요전력 |\n| 4-5 | FLOAT32 | 1.0 | V | 전압 |\n| 6-7 | FLOAT32 | 1.0 | A | 전류 |\n| 8-9 | FLOAT32 | 1.0 | % | 역률 |\n| 10-11 | FLOAT32 | 1.0 | kVAR | 무효전력 |\n\n시뮬 기준: MI MAIN 피크 420 kW / ECO I1 피크 80 kW\n\n---\n\n## FLOAT32 인코딩 (Big Endian)\n\n```python\ndef _float32(v: float) -> list[int]:\n    b = struct.pack('>f', v)\n    return [struct.unpack('>H', b[0:2])[0], struct.unpack('>H', b[2:4])[0]]\n```\n\nIEEE 754 Big Endian — 2개의 UINT16(Hi, Lo 순서)로 분할.\n\n---\n\n## 수집 설정 리디렉션 (08_phase2_sim_config.sql)\n\n```sql\n-- 활성 장비 IP를 시뮬레이터로 리디렉션\nUPDATE device SET ip_address='modbus-sim', port=502, slave_id=11 WHERE device_id='DEV_JB_S3';\nUPDATE device SET ip_address='modbus-sim', port=502, slave_id=12 WHERE device_id='DEV_EL_Z0';\nUPDATE device SET ip_address='modbus-sim', port=502, slave_id=13 WHERE device_id='DEV_LS_F1';\nUPDATE device SET ip_address='modbus-sim', port=502, slave_id=14 WHERE device_id='DEV_MI_MAIN';\nUPDATE device SET ip_address='modbus-sim', port=502, slave_id=15 WHERE device_id='DEV_ECO_I1';\n\n-- 수집 서비스 활성화\nUPDATE collector_service SET enabled=true WHERE service_id IN ('COLL_REAL_GAS','COLL_REAL_ELEC');\nUPDATE processor_service SET enabled=true WHERE service_id='PROC_REAL_1M';\n```\n\n복원 (`make phase2-restore`):  \n원래 실 장비 IP/포트 복원 + 서비스 비활성화.\n\n---\n\n## 수집 흐름\n\n```\nmodbus-sim:502 (slave 11~15)\n       ↓ pymodbus 3.13 read_input_registers(FC4) / read_holding_registers(FC3)\nfems-collector-modbus\n       ↓ JSON payload → Kafka fems.raw.data\nfems-kafka:9094\n       ↓ aiokafka consumer (consumer_group: fems-processor)\nfems-processor\n       ├── GAS_CORRECT: CORR값 delta → usage_1m (energy_kind=2, unit=Nm³)\n       ├── MODBUS_TCP KWH: delta → usage_1m (energy_kind=1, unit=kWh)\n       └── MODBUS_TCP KW: avg → usage_1m (energy_kind=1, unit=kW)\n```\n\n---\n\n## 검증 쿼리\n\n```sql\n-- raw_collect: 5개 실 장비 태그 수집 확인\nSELECT tag_id, COUNT(*), MAX(time)\nFROM raw_collect\nWHERE tag_id IN ('JB_S3_CORR','JB_S3_FLOW','EL_Z0_CORR',\n  'LS_F1_KWH','LS_F1_KW','MI_MAIN_KWH','MI_MAIN_KW','ECO_I1_KWH','ECO_I1_KW')\nGROUP BY tag_id ORDER BY tag_id;\n\n-- usage_1m: 처리 확인\nSELECT tag_id, SUM(value), MAX(time)\nFROM usage_1m WHERE tag_id LIKE 'JB%' OR tag_id LIKE 'LS%'\nGROUP BY tag_id ORDER BY tag_id;\n\n-- virtual_tag_value: 가상태그 합산 확인\nSELECT vtag_id, value, time FROM virtual_tag_value\nWHERE vtag_id IN ('VTAG_BST_ELEC_KW','VTAG_BST_GAS_FLOW')\nORDER BY time DESC LIMIT 5;\n```\n", "p2_2": "# Phase 2 — 시뮬레이터 개발 계획\n\n> 상태: **부분 완료** (5/9 장비, 2026-06-11)\n\n---\n\n## 구현 범위\n\n| 파일 | 설명 | 상태 |\n|------|------|------|\n| `fems/02_device/simulators/modbus_sim.py` | 멀티슬레이브 Modbus 시뮬레이터 전면 재작성 | ✅ 완료 |\n| `fems/infra/seeds/08_phase2_sim_config.sql` | 활성 장비 5대 시뮬레이터 리디렉션 | ✅ 완료 |\n| `fems/infra/Makefile` | `phase2-seed`, `phase2-restore` 타겟 | ✅ 완료 |\n| VI 전력량계 (Vitzro VIPAM3300) | 레지스터 맵 구현 | ❌ 미완료 |\n| Autobase OPC-UA 시뮬레이터 | OPC-UA 노드 시뮬레이션 | ❌ 미완료 |\n| Citech PLC OPC-UA | OPC-UA 노드 시뮬레이션 | ❌ 미완료 |\n\n---\n\n## 주요 변경 상세\n\n### modbus_sim.py 주요 변경\n\n| 항목 | 변경 전 | 변경 후 |\n|------|---------|---------|\n| `single` 모드 | `True` | `False` (멀티 슬레이브) |\n| 슬레이브 수 | 1 | 6 (1, 11-15) |\n| FC4 IR 블록 | ❌ | ✅ (JB/EL 가스보정기) |\n| FLOAT32 인코딩 | ❌ | ✅ (`_float32()`) |\n| INT32 부호 있는 | UINT32만 | INT32 + UINT32 분리 |\n| 부하 패턴 | 단순 sin | 주야간 시계열 패턴 |\n\n새 인코딩 함수:\n```python\n_uint32(v)  → Big Endian UINT32 → [hi, lo]\n_int32(v)   → Big Endian INT32  → [hi, lo]\n_float32(v) → Big Endian FLOAT32 → [hi, lo]\n_i16(v)     → INT16  → [word]\n_u16(v)     → UINT16 → [word]\n```\n\n### 알려진 제약\n\n| 항목 | 내용 |\n|------|------|\n| pymodbus 3.13 호환 | `slave=x` → `device_id=x` 파라미터명 변경 |\n| Processor 단일 consumer_group | PROC_USAGE_1M과 PROC_REAL_1M 중 먼저 로드된 것 적용 |\n| OPC-UA 시뮬레이터 | Phase 2 미구현 — 별도 확장 필요 |\n\n---\n\n## 실행 순서\n\n```bash\ncd fems/infra\n\n# 1. 시뮬레이터 이미지 재빌드 + 기동\nmake step2\n\n# 2. 시드 (최초 1회)\nmake step2-seed        # 테스트 장비\nmake phase1-seed       # 실 장비 마스터\nmake phase2-seed       # 시뮬레이터 리디렉션 + 서비스 활성화\n\n# 3. 서비스 재시작 (설정 반영)\ndocker restart fems-collector-modbus fems-processor\n\n# 4. 수집 확인 (1~2분 후)\nmake check-collect\nmake check-usage\nmake check-virtual\n```\n\n---\n\n## 검증 쿼리 (예상값 포함)\n\n### raw_collect 수집 확인\n\n```sql\n-- 5개 실 장비 태그 수집 현황 (1~2분 후 확인)\nSELECT tag_id, COUNT(*), MAX(time)\nFROM raw_collect\nWHERE tag_id IN (\n  'JB_S3_CORR','JB_S3_FLOW','EL_Z0_CORR',\n  'LS_F1_KWH','LS_F1_KW',\n  'MI_MAIN_KWH','MI_MAIN_KW',\n  'ECO_I1_KWH','ECO_I1_KW'\n)\nGROUP BY tag_id ORDER BY tag_id;\n```\n\n예상값 (주간 부하 70% 기준):\n\n- `JB_S3_CORR`: ~850,000 Nm³ (시뮬레이터 기준 누적값)\n- `LS_F1_KW`: ~126 kW (피크 180 kW × 0.70)\n- `MI_MAIN_KW`: ~294 kW (피크 420 kW × 0.70)\n- `ECO_I1_KW`: ~56 kW (피크 80 kW × 0.70)\n\n### usage_1m 처리 확인\n\n```sql\nSELECT tag_id, SUM(value), MAX(time)\nFROM usage_1m\nWHERE tag_id IN ('JB_S3_CORR','LS_F1_KWH','MI_MAIN_KWH','ECO_I1_KWH')\nGROUP BY tag_id;\n```\n\n예상 delta:\n\n- 가스: ~0.10~0.12 Nm³/분 (105 Nm³/h 기준)\n- 전력 delta: ~3.0~7.0 kWh/분 (피크 180~420 kW 기준)\n\n### virtual_tag_value 확인\n\n```sql\nSELECT vtag_id, value, time\nFROM virtual_tag_value\nWHERE vtag_id IN ('VTAG_BST_ELEC_KW','VTAG_BST_GAS_FLOW')\nORDER BY time DESC LIMIT 5;\n```\n\n예상값:\n\n- `VTAG_BST_ELEC_KW`: ~476 kW (180 + 420×0.7 + 80×0.7, 주간)\n- `VTAG_BST_GAS_FLOW`: ~89 Nm³/h (105 + 22, 주간 0.70 부하)\n\n---\n\n### 시뮬레이터 복원 (`make phase2-restore`)\n\n운영 환경으로 전환 시 실 장비 IP/포트로 되돌림:\n\n```bash\ncd fems/infra\nmake phase2-restore    # device IP/port 원복 + 수집 서비스 비활성화\ndocker restart fems-collector-modbus fems-processor\n```\n\n복원 SQL (`08_phase2_sim_config.sql` 역순):\n\n1. `device` 테이블: 실 장비 원래 ip_address/port/slave_id 복원\n2. `collector_service`: COLL_REAL_GAS, COLL_REAL_ELEC `enabled=false`\n3. `processor_service`: PROC_REAL_1M `enabled=false`\n\n---\n\n## 미완료 항목 (다음 세션 작업)\n\n### VI 전력량계 (Vitzro VIPAM3300-F)\n\n- 현재 상태: `DEV_VI_158` 장비 마스터 등록 완료, 시뮬레이터 미구현\n- 필요 작업:\n  1. VIPAM3300-F 레지스터 맵 확인 (FC3, FLOAT32 추정)\n  2. `modbus_sim.py`에 Slave 16 추가\n  3. `08_phase2_sim_config.sql`에 DEV_VI_158 리디렉션 추가\n\n### Autobase OPC-UA DCS\n\n- 현재 상태: 장비 마스터 등록, OPC-UA Collector 미활성화\n- 필요 작업:\n  1. OPC-UA 시뮬레이터 서버 (asyncua 기반) 구현\n  2. 노드 ID 체계 정의 (ns=2;s=Energy.*)\n  3. `08_phase2_sim_config.sql`에 OPC-UA 서비스 활성화 추가\n\n### Citech PLC OPC-UA\n\n- 동일 구조 (OPC-UA 시뮬레이터 서버 공유 가능)\n", "p3_0": "# Phase 3 — 수집/처리 로직 강화 기획서\n\n> 상태: **대부분 완료** (90%, 2026-06-17)\n\n---\n\n## 목적\n\nCollector와 Processor의 운영 견고성을 높이고, 에너지 단위 변환을 코드 상수에서 DB로 이관하며,  \n이상치 자동 탐지 + 시스템 이벤트 알람 기능을 추가한다.  \n관리자가 Frontend에서 이상치 감도와 변환 계수를 직접 조정할 수 있도록 한다.\n\n---\n\n## 범위\n\n### In Scope\n\n**DB (설정 DB)**\n\n| 항목 | 내용 |\n|------|------|\n| `energy_conversion_factor` 테이블 | 에너지원별 TJ/TOE/tCO₂ 변환 계수 (DB화) |\n| `system_event` 테이블 | 수집/처리 오류 이벤트 로그 |\n| `outlier_config` 테이블 | 이상치 탐지 파라미터 (window_size, threshold) |\n\n**Processor 강화**\n\n| 항목 | 내용 |\n|------|------|\n| 동적 변환계수 로드 | 시작 시 DB에서 로드, 5분마다 갱신, 실패 시 하드코딩 fallback |\n| 이상치 탐지 | 롤링 중앙값 × threshold 초과 시 quality=1(Bad) |\n| AlarmWriter | max_retry 초과 시 system_event CRITICAL 기록 |\n\n**API**\n\n| 엔드포인트 | 내용 |\n|-----------|------|\n| `GET/PUT /api/v1/settings/conversion-factors` | 에너지 변환 계수 조회/수정 |\n| `GET/PUT /api/v1/settings/outlier-config` | 이상치 설정 조회/수정 |\n| `GET /api/v1/settings/system-events` | 시스템 이벤트 조회 |\n| `PUT /api/v1/settings/system-events/{id}/acknowledge` | 이벤트 확인 처리 |\n| `GET /api/v1/settings/aggregation` | 집계 뷰 현황 |\n\n**Frontend**\n\n| 페이지 | 경로 | 내용 |\n|--------|------|------|\n| ConversionFactorPage | `/system/conversion-factors` | 에너지 변환 계수 편집 |\n| OutlierConfigPage | `/system/outlier` | 이상치 슬라이더 설정 |\n| SystemEventsPage | `/system/events` | 이벤트 필터 + 확인 처리 |\n\n### Out of Scope\n\n- mm_16_1m_use.py 전체 이식 (delta/avg 외 복잡한 처리 로직)\n- 열량(Heat) 계산 — LNG Nm³ × 단위열량 (Phase 4 연기)\n- pg_notify 런타임 설정 리로드 (재시작으로 대체)\n\n---\n\n## 비기능 요건\n\n- 변환계수 변경: 다음 Processor 재시작 시 반영 (런타임 핫스왑 불필요)\n- 이상치 탐지: 메모리 내 롤링 윈도우, DB 조회 없음 (실시간 성능 유지)\n- 시스템 이벤트: 중복 방지 (동일 오류 1시간 내 1건만 기록)\n\n---\n\n## 산출물\n\n| 파일 | 내용 |\n|------|------|\n| `fems/infra/seeds/10_phase3_conv_factors.sql` | 변환 계수 + system_event + outlier_config 테이블 생성 + 초기값 |\n| `fems/05_processor/app/config_loader.py` | OutlierConfig + ConversionFactor DB 로드 |\n| `fems/05_processor/app/processors/usage.py` | 이상치 탐지 `_check_outlier()` + 동적 변환계수 적용 |\n| `fems/03_collector/app/alarm_writer.py` | AlarmWriter (system_event 기록) |\n| `fems/07_api/app/routers/settings.py` | settings 라우터 (변환계수/이상치/이벤트/집계) |\n| `fems/08_frontend/src/pages/settings/ConversionFactorPage.tsx` | 변환계수 편집 UI |\n| `fems/08_frontend/src/pages/system/OutlierConfigPage.tsx` | 이상치 슬라이더 UI |\n| `fems/08_frontend/src/pages/system/SystemEventsPage.tsx` | 이벤트 뷰어 UI |\n", "p3_1": "# Phase 3 — 수집/처리 로직 강화 설계서\n\n> 상태: **완료** (2026-06-17)\n\n---\n\n## DB 설계\n\n### energy_conversion_factor 테이블 (설정 DB)\n\n```sql\nCREATE TABLE energy_conversion_factor (\n    energy_kind INT    PRIMARY KEY,  -- 1=전기 2=가스 3=스팀 4=수도\n    tj_per_unit  FLOAT NOT NULL,     -- 1 단위당 TJ\n    toe_per_unit FLOAT NOT NULL,     -- 1 단위당 TOE\n    tco2_per_unit FLOAT NOT NULL,    -- 1 단위당 tCO₂\n    unit         TEXT  NOT NULL,     -- kWh / Nm³ / ton / m³\n    note         TEXT,\n    updated_at   TIMESTAMPTZ DEFAULT NOW()\n);\n```\n\n초기값:\n\n| energy_kind | 단위 | TJ/단위 | TOE/단위 | tCO₂/단위 |\n|-------------|------|---------|---------|----------|\n| 1 (전기) | kWh | 0.0000036 | 0.000215 | 0.000461 |\n| 2 (가스) | Nm³ | 0.0000391 | 0.00091 | 0.00227 |\n| 3 (스팀) | ton | 0.002793 | 0.0665 | 0.1329 |\n| 4 (수도) | m³ | 0.0000063 | 0.00015 | 0.000288 |\n\n### system_event 테이블 (설정 DB)\n\n```sql\nCREATE TABLE system_event (\n    event_id    SERIAL PRIMARY KEY,\n    event_time  TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    severity    TEXT NOT NULL,         -- INFO / WARNING / CRITICAL\n    source      TEXT NOT NULL,         -- collector / processor\n    device_id   TEXT,\n    tag_id      TEXT,\n    message     TEXT NOT NULL,\n    acknowledged BOOL NOT NULL DEFAULT FALSE,\n    ack_time    TIMESTAMPTZ\n);\n```\n\n### outlier_config 테이블 (설정 DB)\n\n```sql\nCREATE TABLE outlier_config (\n    config_id    SERIAL PRIMARY KEY,\n    energy_kind  INT,                   -- NULL = 전체 적용\n    window_size  INT  NOT NULL DEFAULT 10,   -- 롤링 윈도우 크기\n    threshold    FLOAT NOT NULL DEFAULT 3.0, -- 중앙값 대비 배수\n    enabled      BOOL NOT NULL DEFAULT TRUE,\n    updated_at   TIMESTAMPTZ DEFAULT NOW()\n);\n```\n\n---\n\n## Processor 이상치 탐지 설계\n\n### 알고리즘\n\n```\n입력: 새로 계산된 delta 값 (v)\n상태: 태그별 deque(window_size=10)\n1. deque에 v 추가\n2. 중앙값(m) 계산\n3. if v > m × threshold → quality = 1 (Bad)\n4. else quality = 0 (Good)\n```\n\n```python\nfrom collections import deque\nimport statistics\n\nclass _check_outlier:\n    def __init__(self, window_size=10, threshold=3.0):\n        self._windows: dict[str, deque] = {}\n\n    def check(self, tag_id: str, value: float) -> int:\n        w = self._windows.setdefault(tag_id, deque(maxlen=self.window_size))\n        w.append(value)\n        if len(w) < 3:\n            return 0  # 초기 데이터 부족 시 Good\n        median = statistics.median(w)\n        if median > 0 and value > median * self.threshold:\n            return 1  # Bad\n        return 0  # Good\n```\n\n### 동적 변환계수 로드\n\n```python\nclass ConversionFactor:\n    async def load(self, pool):\n        rows = await pool.fetch(\"SELECT * FROM energy_conversion_factor\")\n        self._factors = {r['energy_kind']: dict(r) for r in rows}\n\n    def get(self, energy_kind: int) -> dict:\n        return self._factors.get(energy_kind, HARDCODED_FALLBACK[energy_kind])\n```\n\nProcessor 시작 시 로드 + 5분마다 갱신. DB 실패 시 하드코딩 fallback.\n\n---\n\n## AlarmWriter 설계\n\n```python\nclass AlarmWriter:\n    async def write_critical(self, device_id: str, tag_id: str, message: str):\n        # 1시간 내 동일 device_id + 동일 message → 중복 스킵\n        existing = await conn.fetchval(\"\"\"\n            SELECT 1 FROM system_event\n            WHERE device_id=$1 AND message=$2\n            AND event_time > NOW() - INTERVAL '1 hour'\n            LIMIT 1\n        \"\"\", device_id, message)\n        if existing:\n            return\n        await conn.execute(\"\"\"\n            INSERT INTO system_event(severity, source, device_id, tag_id, message)\n            VALUES('CRITICAL', 'collector', $1, $2, $3)\n        \"\"\", device_id, tag_id, message)\n```\n\nCollector: `max_retry` 초과 → `AlarmWriter.write_critical()` 호출.\n\n---\n\n## API 설계 (/api/v1/settings/)\n\n```\nGET  /api/v1/settings/conversion-factors      에너지 변환 계수 전체 조회\nPUT  /api/v1/settings/conversion-factors/{id}  개별 계수 수정\n\nGET  /api/v1/settings/outlier-config          이상치 설정 조회\nPUT  /api/v1/settings/outlier-config          이상치 설정 수정\n\nGET  /api/v1/settings/system-events           이벤트 목록 (필터: severity, ack, from, to)\nPUT  /api/v1/settings/system-events/{id}/acknowledge  이벤트 확인 처리\n\nGET  /api/v1/settings/aggregation             TimescaleDB Cagg 현황\n```\n\n---\n\n## Frontend 화면 설계\n\n### ConversionFactorPage (`/system/conversion-factors`)\n\n- 테이블: 에너지 종류 / 단위 / TJ / TOE / tCO₂ / 수정일\n- 행 인라인 편집 (숫자 입력, 저장 버튼)\n- 저장 시 Processor 재시작 안내 (변경은 재시작 시 반영)\n\n### OutlierConfigPage (`/system/outlier`)\n\n- 슬라이더: window_size (5~50), threshold (1.5~10.0)\n- 에너지 종류별 개별 설정 가능\n- \"저장\" 버튼 → PUT /api/v1/settings/outlier-config\n- Processor 재시작 안내\n\n### SystemEventsPage (`/system/events`)\n\n- 테이블: 발생시간 / 중요도 / 소스 / 장비 / 태그 / 메시지 / 확인 여부\n- 필터: severity(INFO/WARNING/CRITICAL) + 확인 여부\n- \"확인\" 버튼: PUT .../acknowledge (행 즉시 갱신)\n- 60초 자동 새로고침\n", "p3_2": "# Phase 3 — 수집/처리 로직 강화 개발 계획\n\n> 상태: **대부분 완료** (90%, 2026-06-17)\n\n---\n\n## 구현 범위\n\n| 파일 | 설명 | 상태 |\n|------|------|------|\n| `fems/infra/seeds/10_phase3_conv_factors.sql` | energy_conversion_factor + system_event + outlier_config 테이블 + 초기값 | ✅ 완료 |\n| `fems/infra/Makefile` | `phase3-conv-seed` 타겟 추가 | ✅ 완료 |\n| `fems/05_processor/app/config_loader.py` | `OutlierConfig` 데이터클래스 + `ConversionFactor` DB 로드 | ✅ 완료 |\n| `fems/05_processor/app/processors/usage.py` | `_check_outlier()` 메서드 + 동적 변환계수 적용 | ✅ 완료 |\n| `fems/03_collector/app/alarm_writer.py` | AlarmWriter (중복 방지 + system_event 기록) | ✅ 완료 |\n| `fems/07_api/app/routers/settings.py` | 변환계수 / 이상치 / 이벤트 / 집계 4개 섹션 | ✅ 완료 |\n| `fems/07_api/app/main.py` | settings 라우터 등록 | ✅ 완료 |\n| `fems/08_frontend/src/pages/settings/ConversionFactorPage.tsx` | 변환계수 편집 UI | ✅ 완료 |\n| `fems/08_frontend/src/pages/system/OutlierConfigPage.tsx` | 이상치 슬라이더 UI | ✅ 완료 |\n| `fems/08_frontend/src/pages/system/SystemEventsPage.tsx` | 이벤트 뷰어 UI | ✅ 완료 |\n| `fems/08_frontend/src/api/client.ts` | settings API 타입 + 함수 추가 | ✅ 완료 |\n| mm_16_1m_use.py 전체 이식 | delta/avg 외 복잡 처리 로직 | ❌ 미완료 |\n\n---\n\n## 실행 순서\n\n```bash\ncd fems/infra\n\n# Phase 3 테이블 + 초기값 생성 (설정 DB)\nmake phase3-conv-seed\n\n# Processor + API 재시작 (새 테이블 인식)\ndocker restart fems-processor fems-api fems-frontend\n```\n\n---\n\n## 핵심 구현 상세\n\n### config_loader.py — OutlierConfig 데이터클래스\n\n```python\n@dataclass\nclass OutlierConfig:\n    window_size: int = 10\n    threshold: float = 3.0\n    enabled: bool = True\n\nasync def load_outlier_config(pool) -> dict[int | None, OutlierConfig]:\n    rows = await pool.fetch(\"SELECT * FROM outlier_config WHERE enabled=true\")\n    return {r['energy_kind']: OutlierConfig(...) for r in rows}\n```\n\n### usage.py — 이상치 탐지 통합\n\n```python\n# Processor 초기화 시\nself._outlier_windows: dict[str, deque] = {}\nself._outlier_config = await load_outlier_config(setting_pool)\n\n# delta 계산 후\nquality = self._check_outlier(tag_id, delta_value, energy_kind)\n\ndef _check_outlier(self, tag_id, value, energy_kind) -> int:\n    cfg = self._outlier_config.get(energy_kind) or self._outlier_config.get(None)\n    if not cfg or not cfg.enabled:\n        return 0\n    w = self._outlier_windows.setdefault(tag_id, deque(maxlen=cfg.window_size))\n    w.append(value)\n    if len(w) < 3:\n        return 0\n    median = statistics.median(w)\n    return 1 if (median > 0 and value > median * cfg.threshold) else 0\n```\n\n### settings.py — 집계 현황 API\n\n```python\n@router.get(\"/aggregation\")\nasync def get_aggregation_status(db: Database = Depends(get_db)):\n    rows = await db.data.fetch(\"\"\"\n        SELECT view_name, compression_enabled,\n               last_run_started_at, next_start_time\n        FROM timescaledb_information.continuous_aggregates ca\n        LEFT JOIN timescaledb_information.jobs j\n          ON j.application_name LIKE '%' || ca.view_name || '%'\n        ORDER BY view_name\n    \"\"\")\n    return ApiResponse(ok=True, data=[dict(r) for r in rows])\n```\n\n---\n\n## 버그 픽스 기록\n\n### BUG-03: asyncpg JSONB 읽기 오류\n\n**증상**: outlier_config 테이블에서 JSONB 컬럼 읽기 시 `str` 반환 → `json.loads()` 필요.  \n**수정**: JSONB 컬럼 반환값에 `json.loads()` 방어 코드 추가.\n\n### BUG-04: 이상치 탐지 초기값 NaN\n\n**증상**: 처음 수집되는 큰 누적값(예: 850,000 Nm³)을 delta 계산 없이 그대로 이상치 탐지에 넣으면 항상 Bad 판정.  \n**수정**: delta 계산 후 값을 이상치 탐지에 입력하도록 순서 조정. 초기 3건 미만일 때 quality=0 고정.\n\n---\n\n## 검증\n\n```bash\n# 변환 계수 API 확인\ncurl http://localhost:8090/api/v1/settings/conversion-factors\n\n# 이상치 설정 확인\ncurl http://localhost:8090/api/v1/settings/outlier-config\n\n# 집계 현황 확인\ncurl http://localhost:8090/api/v1/settings/aggregation\n\n# 시스템 이벤트 (수집 오류 발생 후)\ncurl http://localhost:8090/api/v1/settings/system-events\n```\n\nFrontend 확인:\n- `http://localhost:3000/system/conversion-factors` — 에너지 변환 계수 편집\n- `http://localhost:3000/system/outlier` — 이상치 슬라이더\n- `http://localhost:3000/system/events` — 이벤트 로그\n\n---\n\n## 미완료 항목\n\n| 항목 | 내용 | 우선순위 |\n|------|------|---------|\n| mm_16_1m_use.py 이식 | 기존 시스템의 복잡한 delta/avg 처리 로직 | 낮음 |\n| 열량(Heat) 계산 | LNG Nm³ × 단위열량 → kJ | 낮음 (Phase 4 연기) |\n| pg_notify 런타임 리로드 | DB 변경 시 Processor 재시작 없이 반영 | 낮음 |\n", "p4_0": "# Phase 4 — 다중 집계 주기 + 피크 계산 기획서\n\n> 상태: **대부분 완료** (85%, 2026-06-17)  \n> 참고: 5m/15m Cagg + Trend 페이지 초기 구현은 [`../phase3_aggregation/`](../phase3_aggregation/) 참조\n\n---\n\n## 목적\n\n1분 단위 `usage_1m` 데이터를 5분·15분·30분·1시간·1일·1개월 6개 집계 주기로 확장하고,  \n15분 피크 수요전력(`peak_15m`) 집계를 추가한다.  \nFrontend 에서 에너지 분석(기간별 에너지 분석, 피크 분석)과 집계 설정 UI를 제공한다.\n\n---\n\n## 범위\n\n### Continuous Aggregate 전체 목록\n\n| 뷰 이름 | 소스 | 버킷 | 새로고침 주기 | 시드 파일 |\n|--------|------|------|------------|---------|\n| usage_5m | usage_1m | 5분 | 5분 | 09_phase3_aggregates.sql |\n| usage_15m | usage_1m | 15분 | 15분 | 09_phase3_aggregates.sql |\n| usage_1h | usage_1m | 1시간 | 1시간 | 05_step4_cagg.sql |\n| usage_1d | usage_1h | 1일 | 1일 | 05_step4_cagg.sql |\n| usage_30m | usage_1m | 30분 | 30분 | 11_phase4_30m.sql ← **신규** |\n| usage_1month | usage_1m | 1개월 | 1일 | 12_phase4_peak.sql ← **신규** |\n| peak_15m | usage_1m | 15분 | 15분 | 12_phase4_peak.sql ← **신규** |\n\n### 신규 API 엔드포인트\n\n| 엔드포인트 | 내용 |\n|-----------|------|\n| `GET /api/v1/usage/agg?interval=30m` | 30분 집계 (기존 agg에 interval 추가) |\n| `GET /api/v1/usage/agg?interval=1month` | 월 집계 (기존 agg에 interval 추가) |\n| `GET /api/v1/analysis/peak` | 피크 수요전력 조회 |\n| `GET /api/v1/analysis/period` | 기간별 에너지 분석 (에너지원별 합산) |\n| `GET /api/v1/analysis/compare` | 현재기간 vs 이전동일기간 비교 |\n\n### 신규 Frontend 페이지\n\n| 페이지 | 경로 | 내용 |\n|--------|------|------|\n| PeakPage | `/monitoring/peak` | 실시간 피크 LineChart + Top5 테이블 |\n| PeakAnalysisPage | `/analysis/peak` | 월별 최대피크 Bar + 시간대 히트맵 |\n| PeriodAnalysisPage | `/analysis/period` | 기간별 에너지 BarChart + KPI 4종 |\n| AggregationPage | `/system/aggregation` | Cagg 현황 + 다음 실행 시간 |\n\n### Out of Scope\n\n- 열량(Heat) 계산 — LNG Nm³ × 단위열량 (계수 DB는 Phase 3에서 준비됨)\n- 배치 스케줄러 (APScheduler) — Cagg Policy로 대체\n\n---\n\n## 비기능 요건\n\n- peak_15m: 한국전력 15분 최대 수요전력 산정 방식 (15분 내 1분 평균 kW의 MAX)\n- usage_1month policy: `start_offset=3month, end_offset=1month` (2 버킷 이상 필요)\n- 집계 API: Redis 캐시 TTL (30m: 300s, 1month: 3600s)\n\n---\n\n## 산출물\n\n| 파일 | 내용 |\n|------|------|\n| `fems/infra/seeds/11_phase4_30m.sql` | usage_30m Cagg 생성 + policy + 백필 |\n| `fems/infra/seeds/12_phase4_peak.sql` | peak_15m + usage_1month Cagg + policy + 백필 |\n| `fems/07_api/app/routers/analysis.py` | 기간분석 / 피크 / 비교 3개 엔드포인트 |\n| `fems/07_api/app/routers/usage.py` | `/usage/agg` 에 30m, 1month 인터벌 추가 |\n| `fems/08_frontend/src/pages/monitoring/PeakPage.tsx` | 피크 모니터링 페이지 |\n| `fems/08_frontend/src/pages/analysis/PeakAnalysisPage.tsx` | 피크 분석 전용 페이지 |\n| `fems/08_frontend/src/pages/analysis/PeriodAnalysisPage.tsx` | 기간별 에너지 분석 |\n| `fems/08_frontend/src/pages/system/AggregationPage.tsx` | 집계 설정 UI |\n", "p4_1": "# Phase 4 — 다중 집계 + 피크 설계서\n\n> 상태: **완료** (2026-06-17)\n\n---\n\n## Continuous Aggregate 전체 계층\n\n```\nusage_1m  (1분, 하이퍼테이블)\n  ├── usage_5m    (5분  Cagg) — schedule 5분\n  ├── usage_15m   (15분 Cagg) — schedule 15분\n  ├── usage_30m   (30분 Cagg) — schedule 30분  ← Phase 4 신규\n  ├── usage_1h    (1시간 Cagg) — schedule 1시간\n  ├── usage_1month (1개월 Cagg) — schedule 1일  ← Phase 4 신규\n  └── peak_15m    (15분 피크 Cagg) — schedule 15분  ← Phase 4 신규\n        └── quality=0 필터 적용 (정상 데이터만)\n\nusage_1h (1시간 Cagg)\n  └── usage_1d  (1일 Cagg) — schedule 1일\n```\n\n---\n\n## usage_30m Cagg 정의 (11_phase4_30m.sql)\n\n```sql\nCREATE MATERIALIZED VIEW IF NOT EXISTS usage_30m\nWITH (timescaledb.continuous) AS\nSELECT\n    time_bucket('30 minutes', time) AS bucket,\n    tag_id, factory_id, energy_kind,\n    SUM(value)  AS total_value,\n    SUM(tj)     AS total_tj,\n    SUM(toe)    AS total_toe,\n    SUM(tco2)   AS total_tco2,\n    COUNT(*)    AS data_points\nFROM usage_1m WHERE quality = 0\nGROUP BY bucket, tag_id, factory_id, energy_kind WITH NO DATA;\n\nSELECT add_continuous_aggregate_policy('usage_30m',\n    start_offset => INTERVAL '1 hour',\n    end_offset   => INTERVAL '30 minutes',\n    schedule_interval => INTERVAL '30 minutes');\n\nCALL refresh_continuous_aggregate('usage_30m', NOW() - INTERVAL '7 days', NULL);\n```\n\n---\n\n## peak_15m Cagg 정의 (12_phase4_peak.sql)\n\n```sql\nCREATE MATERIALIZED VIEW IF NOT EXISTS peak_15m\nWITH (timescaledb.continuous) AS\nSELECT\n    time_bucket('15 minutes', time) AS bucket,\n    tag_id, factory_id, energy_kind, unit,\n    MAX(value) AS peak_value,     -- 15분 내 최대 1분 평균 kW\n    AVG(value) AS avg_value,\n    MIN(value) AS min_value,\n    COUNT(*)   AS data_points\nFROM usage_1m WHERE quality = 0\nGROUP BY bucket, tag_id, factory_id, energy_kind, unit WITH NO DATA;\n\nSELECT add_continuous_aggregate_policy('peak_15m',\n    start_offset      => INTERVAL '2 hours',\n    end_offset        => INTERVAL '15 minutes',\n    schedule_interval => INTERVAL '15 minutes');\n\nCALL refresh_continuous_aggregate('peak_15m', NOW() - INTERVAL '7 days', NULL);\n```\n\n**설계 근거**: 한국전력 15분 최대 수요전력 산정 기준 — 15분 윈도우 내 1분 평균 kW 값의 MAX.\n\n---\n\n## usage_1month Cagg 정의 (12_phase4_peak.sql)\n\n```sql\nCREATE MATERIALIZED VIEW IF NOT EXISTS usage_1month\nWITH (timescaledb.continuous) AS\nSELECT\n    time_bucket('1 month', time) AS bucket,\n    tag_id, factory_id, energy_kind,\n    SUM(value)  AS total_value,\n    SUM(tj)     AS total_tj,\n    SUM(toe)    AS total_toe,\n    SUM(tco2)   AS total_tco2,\n    COUNT(*)    AS data_points\nFROM usage_1m WHERE quality = 0\nGROUP BY bucket, tag_id, factory_id, energy_kind WITH NO DATA;\n\nSELECT add_continuous_aggregate_policy('usage_1month',\n    start_offset      => INTERVAL '3 months',   -- 최소 2 bucket 필요 → 3month\n    end_offset        => INTERVAL '1 month',\n    schedule_interval => INTERVAL '1 day');\n\nCALL refresh_continuous_aggregate('usage_1month', NOW() - INTERVAL '12 months', NULL);\n```\n\n**주의**: `start_offset=2month, end_offset=1day`는 1month 버킷 기준 2개 미만 → 정책 오류.  \n`start_offset=3month, end_offset=1month`로 수정.\n\n---\n\n## API 설계 (analysis.py)\n\n### GET /api/v1/analysis/period\n\n```\n?interval=1d|1month\n&from=2026-01-01T00:00:00Z\n&to=2026-12-31T23:59:59Z\n&energy_kind=1\n&limit=500\n```\n\n응답: 에너지원별 합산 → 일별/월별 배열\n\n```json\n{\n  \"ok\": true,\n  \"data\": [\n    {\n      \"bucket\": \"2026-06-01T00:00:00+00:00\",\n      \"energy_kind\": 1,\n      \"energy_kind_label\": \"전기\",\n      \"unit\": \"kWh\",\n      \"total_value\": 45210.5,\n      \"total_toe\": 9.72,\n      \"total_tco2\": 20.84\n    }\n  ]\n}\n```\n\n### GET /api/v1/analysis/peak\n\n```\n?from=&to=&tag_id=LS_F1_KW&limit=500\n```\n\n소스: `peak_15m` 뷰. 응답: `[{ bucket, tag_id, peak_value, avg_value }]`\n\n### GET /api/v1/analysis/compare\n\n```\n?from=2026-06-01&to=2026-06-17&interval=1d\n```\n\n현재기간 vs 이전동일기간(자동 계산) — 비교 분석용.\n\n---\n\n## /usage/agg 인터벌 확장\n\n```python\n_AGG_VIEWS = {\n    '5m':     ('usage_5m',     'bucket',     6,    120),\n    '15m':    ('usage_15m',    'bucket',     24,   300),\n    '30m':    ('usage_30m',    'bucket',     48,   300),   # ← 신규\n    '1h':     ('usage_1h',     'bucket',     168,  300),\n    '1d':     ('usage_1d',     'day_bucket', 720,  1800),\n    '1month': ('usage_1month', 'bucket',     8760, 3600),  # ← 신규\n}\n```\n\n`usage_1d`는 `day_bucket` 컬럼 사용 + `data_points` 없음 → `NULL::BIGINT AS data_points`.\n\n---\n\n## Frontend 화면 설계\n\n### PeakPage (`/monitoring/peak`)\n\n- LineChart: 15분 피크 수요전력 (최근 24시간)\n- ReferenceLine: 계약 전력 (설정값, 예: 1,000 kW)\n- Top5 테이블: 일별 최대 피크 + 발생 시각\n- 15초 자동 새로고침\n\n### PeakAnalysisPage (`/analysis/peak`)\n\n- 월별 최대 피크 BarChart (최근 12개월)\n- **시간대별 히트맵**: CSS 12열 그리드 (0~23시 × 요일), 값 → 색상 강도\n- 태그별 요약 테이블 (피크값, 평균, 발생 시각)\n\n### PeriodAnalysisPage (`/analysis/period`)\n\n- 에너지원 탭 (전체 / 전기 / 가스 / 스팀 / 수도)\n- StackedBarChart: 에너지원별 TOE 기여\n- KPI 4종: 총 TOE / 총 tCO₂ / 전기 사용량 / 가스 사용량\n- 기간 선택: 일간 / 월간 + from/to DatePicker\n\n### AggregationPage (`/system/aggregation`)\n\n- 테이블: 뷰명 / 압축 여부 / 마지막 실행 / 다음 실행 예정\n- 데이터 소스: `GET /api/v1/settings/aggregation` (timescaledb_information 쿼리)\n- 60초 자동 새로고침\n\n### Trend.tsx (`/trend`) — 인터벌 선택 + 동적 태그\n\n인터벌별 기본 조회 범위 (max limit 2,000):\n\n- `1m` — 최근 1시간\n- `5m` — 최근 6시간\n- `15m` — 최근 24시간\n- `1h` — 최근 7일\n- `1d` — 최근 30일\n\n인터벌별 기간 프리셋:\n\n- `1분` — 최근 1시간 / 최근 6시간 / 최근 24시간\n- `5분` — 최근 6시간 / 최근 24시간 / 최근 7일\n- `15분` — 최근 24시간 / 최근 7일 / 최근 30일\n- `1시간` — 최근 7일 / 최근 30일 / 최근 90일\n- `1일` — 최근 30일 / 최근 90일\n\nX축 시간 포맷:\n\n- `1분, 5분, 15분` — `HH:mm` (예: 14:30)\n- `1시간` — `M/DD HH:00` (예: 6/10 14:00)\n- `1일` — `M/DD` (예: 6/10)\n\n태그 목록: `api.master.tags({ coll_yn: true, is_virtual: false })` 동적 로드 → 에너지 종류별 그룹핑\n\n데이터 변환:\n\n```text\n1분:  raw1m[]  → { bucket: r.time,   tag_id, value: r.value }\n집계: rawAgg[] → { bucket: r.bucket, tag_id, value: r.total_value }\n       ↓\nbucket 기준 Map → { time, TAG_A: v, TAG_B: v, ... }\n       ↓\n시간순 정렬 (ASC) → X축 포맷 적용 → Recharts LineChart\n```\n\n툴팁: `태그명 (단위): 값.00` (예: `JB S3 보정유량 (Nm³/h): 87.45`)\n", "p4_2": "# Phase 4 — 다중 집계 + 피크 개발 계획\n\n> 상태: **대부분 완료** (85%, 2026-06-17)\n\n---\n\n## 구현 범위\n\n| 파일 | 설명 | 상태 |\n|------|------|------|\n| `fems/infra/seeds/09_phase3_aggregates.sql` | usage_5m, usage_15m Cagg (Phase 3에서 구현) | ✅ 완료 |\n| `fems/infra/seeds/11_phase4_30m.sql` | usage_30m Cagg + policy + 백필 | ✅ 완료 |\n| `fems/infra/seeds/12_phase4_peak.sql` | peak_15m + usage_1month Cagg + policy + 백필 | ✅ 완료 |\n| `fems/infra/Makefile` | `phase4-30m-seed`, `phase4-peak-seed` 타겟 | ✅ 완료 |\n| `fems/07_api/app/routers/usage.py` | `/usage/agg` 30m, 1month 인터벌 추가 | ✅ 완료 |\n| `fems/07_api/app/routers/analysis.py` | `/analysis/period`, `/analysis/peak`, `/analysis/compare` | ✅ 완료 |\n| `fems/07_api/app/models.py` | `PeakRecord`, `MonthlyRecord` 모델 추가 | ✅ 완료 |\n| `fems/07_api/app/main.py` | analysis 라우터 등록 | ✅ 완료 |\n| `fems/08_frontend/src/api/client.ts` | `api.analysis.{period,peak,compare}` 추가 | ✅ 완료 |\n| `fems/08_frontend/src/pages/monitoring/PeakPage.tsx` | 피크 모니터링 | ✅ 완료 |\n| `fems/08_frontend/src/pages/analysis/PeakAnalysisPage.tsx` | 피크 분석 전용 | ✅ 완료 |\n| `fems/08_frontend/src/pages/analysis/PeriodAnalysisPage.tsx` | 기간별 에너지 분석 | ✅ 완료 |\n| `fems/08_frontend/src/pages/system/AggregationPage.tsx` | 집계 현황 UI | ✅ 완료 |\n| 열량(Heat) 계산 | LNG Nm³ × 단위열량 | ❌ 미완료 |\n\n---\n\n## 실행 순서\n\n```bash\ncd fems/infra\n\n# Phase 3 집계 (5m/15m) - 선행 필요\nmake phase3-seed\n\n# Phase 4 신규 집계 (30m)\nmake phase4-30m-seed\n\n# Phase 4 피크 + 월 집계 (peak_15m + usage_1month)\nmake phase4-peak-seed\n\n# 서비스 재시작 (새 인터벌 반영)\ndocker restart fems-api fems-frontend\n```\n\n---\n\n## 버그 픽스 기록\n\n### BUG-05: usage_1d data_points 컬럼 없음\n\n**증상**: `usage_1d`에서 `data_points` 컬럼을 SELECT 시 오류.  \n**원인**: usage_1d는 usage_1h 기반 집계 뷰로 data_points를 포함하지 않음.  \n**수정**: `usage.py` `/usage/agg` 엔드포인트에서 `interval == '1d'`일 때 `NULL::BIGINT AS data_points` 삽입.\n\n```python\ndp_col = \"NULL::BIGINT AS data_points\" if interval == '1d' else \"data_points\"\nsql = f\"SELECT bucket, tag_id, ..., {dp_col} FROM {view_name} ...\"\n```\n\n### BUG-06: usage_1month policy window 너무 작음\n\n**증상**: `add_continuous_aggregate_policy('usage_1month', start_offset='2 months', end_offset='1 day')` 실행 시:  \n`ERROR: policy refresh window too small — must cover at least two buckets`  \n**원인**: 1month 버킷에서 start_offset(2m) - end_offset(1d)가 2 버킷 미만.  \n**수정**: `start_offset='3 months', end_offset='1 month'`로 변경.\n\n### BUG-07: psql stdin 파이프와 Cagg policy 실패\n\n**증상**: `make phase4-peak-seed`가 \"완료\" 출력해도 peak_15m, usage_1month 뷰 미생성.  \n**원인**: `docker exec ... psql -f /dev/stdin < sql_file` 파이프 방식에서 Cagg 생성 후 policy 추가 시 조용히 실패.  \n**수정**: 각 SQL 구문을 `psql -c \"...\"` 형식으로 직접 실행.\n\n```bash\ndocker exec fems-data-db psql -U fems -d df_fems_data -c \"CREATE MATERIALIZED VIEW ...\"\ndocker exec fems-data-db psql -U fems -d df_fems_data -c \"SELECT add_continuous_aggregate_policy(...)\"\ndocker exec fems-data-db psql -U fems -d df_fems_data -c \"CALL refresh_continuous_aggregate(...)\"\n```\n\n### BUG-08: PeakPage 미사용 import TS6133\n\n**증상**: `PeakRecord`, `TagInfo` 타입을 import했으나 실제 사용하지 않아 TypeScript 빌드 경고.  \n**수정**: 불필요한 import 제거.\n\n---\n\n## 검증 쿼리\n\n```sql\n-- Cagg 목록 확인 (4종 이상 있어야 함)\nSELECT view_name, compression_enabled\nFROM timescaledb_information.continuous_aggregates\nORDER BY view_name;\n-- 기대 결과: peak_15m, usage_1d, usage_1h, usage_1month, usage_15m, usage_30m, usage_5m\n\n-- peak_15m 데이터 확인\nSELECT bucket, tag_id, peak_value, avg_value\nFROM peak_15m ORDER BY bucket DESC LIMIT 10;\n\n-- usage_1month 데이터 확인 (시뮬레이터 데이터 있을 때)\nSELECT bucket, energy_kind, SUM(total_value)\nFROM usage_1month GROUP BY bucket, energy_kind ORDER BY bucket;\n```\n\nAPI 테스트:\n```bash\ncurl \"http://localhost:8090/api/v1/usage/agg?interval=30m&limit=5\"\ncurl \"http://localhost:8090/api/v1/usage/agg?interval=1month&limit=3\"\ncurl \"http://localhost:8090/api/v1/analysis/peak?limit=10\"\ncurl \"http://localhost:8090/api/v1/analysis/period?interval=1d&limit=7\"\n```\n\n---\n\n## 미완료 항목\n\n| 항목 | 내용 | 우선순위 |\n|------|------|---------|\n| 열량(Heat) 계산 | Processor에서 LNG Nm³ × 단위열량 → kJ → TOE 변환 | 낮음 |\n| 30m Trend 프리셋 | Trend.tsx에 30분 인터벌 버튼 + 프리셋 추가 | 낮음 |\n| 집계 설정 수정 UI | AggregationPage에서 policy 시간 수정 기능 | 낮음 |\n", "p5_0": "# Phase 5 — 전체 Frontend 메뉴 구조 기획서\n\n> 상태: **대부분 완료** (90%, 2026-06-17)\n\n---\n\n## 목적\n\nFeMS의 모든 기능을 접근 가능한 9개 1차 메뉴 체계로 구성하고,  \n다크/라이트 테마 전환, 실시간 모니터링, 에너지 트렌드 조회,  \n기준정보 CRUD, 시스템 설정 기능을 완전히 구현한다.\n\n---\n\n## 메뉴 구조 (사이드바)\n\n```\n📊 대시보드           /\n🖥️ 모니터링\n    ├── 실시간 현황    /monitoring\n    └── 피크 수요전력  /monitoring/peak\n📈 에너지 트렌드      /trend\n🔬 에너지 분석\n    ├── 기간별 분석   /analysis/period\n    ├── 피크 분석     /analysis/peak\n    ├── 에너지 효율   /analysis/efficiency\n    └── 온실가스      /analysis/emissions\n📋 리포트\n    ├── 월간 리포트   /report/monthly\n    └── 데이터 내보내기 /report/export\n💾 데이터 조회\n    ├── 검침 데이터   /data/meter\n    └── 추정 요금     /data/billing\n🎯 목표 관리\n    ├── 목표 설정     /goal/targets\n    └── 실적 비교     /goal/compare\n📁 기준정보\n    ├── 장비 관리     /master/devices\n    ├── 태그 관리     /master/tags\n    └── 가상 태그     /master/virtual-tags\n⚙️ 시스템\n    ├── 변환 계수     /system/conversion-factors\n    ├── 이상치 설정   /system/outlier\n    ├── 집계 현황     /system/aggregation\n    └── 시스템 이벤트 /system/events\n```\n\n---\n\n## 기술 스택\n\n| 항목 | 선택 | 이유 |\n|------|------|------|\n| Framework | React 18 + TypeScript 5 | 타입 안전성 |\n| Build | Vite 5 | 빠른 HMR |\n| Routing | React Router 6 | Nested routes |\n| 서버 상태 | TanStack Query v5 | useQuery / useMutation |\n| 스타일 | Tailwind CSS 3 | dark: 지원 |\n| 차트 | Recharts 2 | BarChart/LineChart/AreaChart/PieChart |\n| 테마 | ThemeContext + localStorage | class=\"dark\" 토글 |\n| 코드 | 컴포넌트별 파일 분리 | PascalCase |\n\n---\n\n## 완료된 페이지 목록 (22개 라우트)\n\n| 경로 | 컴포넌트 | 상태 |\n|------|---------|------|\n| `/` | Dashboard.tsx | ✅ |\n| `/monitoring` | Monitoring.tsx | ✅ |\n| `/monitoring/peak` | PeakPage.tsx | ✅ |\n| `/trend` | Trend.tsx | ✅ |\n| `/analysis/period` | PeriodAnalysisPage.tsx | ✅ |\n| `/analysis/peak` | PeakAnalysisPage.tsx | ✅ |\n| `/analysis/efficiency` | EfficiencyPage.tsx | ✅ |\n| `/analysis/emissions` | EmissionsPage.tsx | ✅ |\n| `/report/monthly` | MonthlyReportPage.tsx | ✅ |\n| `/report/export` | ExportPage.tsx | ✅ |\n| `/data/meter` | MeterDataPage.tsx | ✅ |\n| `/data/billing` | BillingPage.tsx | ✅ |\n| `/goal/targets` | GoalPage (defaultTab=\"edit\") | ✅ |\n| `/goal/compare` | GoalPage (defaultTab=\"compare\") | ✅ |\n| `/master/devices` | DevicePage.tsx | ✅ |\n| `/master/tags` | TagPage.tsx | ✅ |\n| `/master/virtual-tags` | VirtualTagPage.tsx | ✅ |\n| `/system/conversion-factors` | ConversionFactorPage.tsx | ✅ |\n| `/system/outlier` | OutlierConfigPage.tsx | ✅ |\n| `/system/aggregation` | AggregationPage.tsx | ✅ |\n| `/system/events` | SystemEventsPage.tsx | ✅ |\n| `/status` | Status.tsx | ✅ |\n\n---\n\n## 비기능 요건\n\n- 다크/라이트 테마: localStorage 영속, `<html class=\"dark\">` 토글\n- 실시간 갱신: TanStack Query `refetchInterval` (15~60초)\n- 반응형: md(768px) 이상에서 사이드바 고정, 이하에서 햄버거 메뉴\n- 접근성: aria-label, semantic HTML (nav, main, section)\n- 빌드 최적화: Vite code-split (Recharts lazy import 권장)\n\n---\n\n## 산출물\n\n| 파일 | 내용 |\n|------|------|\n| `fems/08_frontend/src/App.tsx` | 전체 라우팅 (22개 Route) |\n| `fems/08_frontend/src/context/ThemeContext.tsx` | 다크/라이트 테마 Context |\n| `fems/08_frontend/src/components/layout/Layout.tsx` | 사이드바 + 헤더 + Outlet |\n| `fems/08_frontend/src/api/client.ts` | API 클라이언트 (모든 타입 + 함수) |\n| `fems/08_frontend/src/pages/**` | 22개 페이지 컴포넌트 |\n", "p5_1": "# Phase 5 — Frontend 설계서\n\n> 상태: **완료** (2026-06-17)\n\n---\n\n## 컴포넌트 구조\n\n```\nsrc/\n├── App.tsx                          # 전체 라우팅 (React Router 6)\n├── main.tsx                         # 앱 진입점 + ThemeProvider + QueryClientProvider\n├── api/\n│   └── client.ts                    # API 클라이언트 (타입 + fetch 래퍼)\n├── context/\n│   └── ThemeContext.tsx              # 다크/라이트 테마 Context\n├── components/\n│   └── layout/\n│       └── Layout.tsx               # 사이드바 + 헤더 + Outlet\n└── pages/\n    ├── Dashboard.tsx\n    ├── Monitoring.tsx\n    ├── Trend.tsx\n    ├── Status.tsx\n    ├── Tags.tsx                     # 구 경로 호환\n    ├── analysis/\n    │   ├── PeriodAnalysisPage.tsx\n    │   ├── PeakAnalysisPage.tsx\n    │   ├── EfficiencyPage.tsx\n    │   └── EmissionsPage.tsx\n    ├── monitoring/\n    │   └── PeakPage.tsx\n    ├── report/\n    │   ├── MonthlyReportPage.tsx\n    │   └── ExportPage.tsx\n    ├── data/\n    │   ├── MeterDataPage.tsx\n    │   └── BillingPage.tsx\n    ├── goal/\n    │   └── GoalPage.tsx\n    ├── master/\n    │   ├── DevicePage.tsx\n    │   ├── TagPage.tsx\n    │   └── VirtualTagPage.tsx\n    ├── settings/\n    │   └── ConversionFactorPage.tsx\n    └── system/\n        ├── OutlierConfigPage.tsx\n        ├── AggregationPage.tsx\n        └── SystemEventsPage.tsx\n```\n\n---\n\n## ThemeContext 설계\n\n```typescript\ntype Theme = 'light' | 'dark'\n\nconst ThemeContext = createContext<{\n  theme: Theme\n  toggle: () => void\n}>({ theme: 'light', toggle: () => {} })\n\nexport function ThemeProvider({ children }: { children: React.ReactNode }) {\n  const [theme, setTheme] = useState<Theme>(() =>\n    (localStorage.getItem('fems-theme') as Theme) ?? 'light'\n  )\n  useEffect(() => {\n    document.documentElement.classList.toggle('dark', theme === 'dark')\n    localStorage.setItem('fems-theme', theme)\n  }, [theme])\n  return (\n    <ThemeContext.Provider value={{ theme, toggle: () => setTheme(t => t === 'light' ? 'dark' : 'light') }}>\n      {children}\n    </ThemeContext.Provider>\n  )\n}\n```\n\nTailwind 설정:\n```javascript\n// tailwind.config.js\nmodule.exports = { darkMode: 'class', ... }\n```\n\n---\n\n## API 클라이언트 (client.ts) 구조\n\n```typescript\n// 기반 fetch 래퍼\nasync function get<T>(path: string): Promise<T>\nasync function mutate<T>(method: string, path: string, body?: unknown): Promise<T>\n\n// API 객체\nexport const api = {\n  realtime:  { list, get, virtual },\n  usage:     { list1m, agg },\n  analysis:  { period, peak, compare },\n  export:    { csv },\n  goals:     { list, upsert, compare },\n  tags:      { list, get },\n  master:    { devices: {...}, tags: {...}, virtualTags: {...} },\n  settings:  { conversionFactors: {...}, outlierConfig: {...}, systemEvents: {...}, aggregation },\n  status:    { get, data },\n}\n```\n\n핵심 타입:\n\n```typescript\nexport interface TagInfo {\n  tag_id: string; tag_name: string; energy_kind: number; unit: string\n  coll_yn: boolean; is_virtual: boolean; correct_ratio: number\n  factory_id: string\n}\nexport interface AggRecord {\n  bucket: string; tag_id: string; factory_id: string; energy_kind: number\n  total_value: number; total_tj: number | null; total_toe: number | null\n  total_tco2: number | null; data_points: number | null\n}\nexport interface GoalRecord {\n  goal_id: number; factory_id: string; energy_kind: number\n  energy_kind_label: string; unit: string; target_year: number\n  target_month: number; goal_value: number; goal_toe: number | null\n  goal_tco2: number | null; note: string | null; updated_at: string | null\n}\nexport interface GoalCompareRecord {\n  energy_kind: number; energy_kind_label: string; unit: string\n  target_month: number; goal_value: number; goal_toe: number | null\n  goal_tco2: number | null; actual_value: number; actual_toe: number\n  actual_tco2: number; achievement_pct: number | null\n}\n```\n\n---\n\n## Layout.tsx 사이드바 설계\n\n```typescript\nconst NAV_ITEMS = [\n  { label: '대시보드', path: '/', icon: '📊' },\n  {\n    label: '모니터링', icon: '🖥️',\n    children: [\n      { label: '실시간 현황', path: '/monitoring' },\n      { label: '피크 수요전력', path: '/monitoring/peak' },\n    ]\n  },\n  { label: '에너지 트렌드', path: '/trend', icon: '📈' },\n  {\n    label: '에너지 분석', icon: '🔬',\n    children: [\n      { label: '기간별 분석', path: '/analysis/period' },\n      { label: '피크 분석', path: '/analysis/peak' },\n      { label: '에너지 효율', path: '/analysis/efficiency' },\n      { label: '온실가스', path: '/analysis/emissions' },\n    ]\n  },\n  // ... 나머지 5개 그룹\n]\n```\n\n- 활성 경로: `useMatch()` 또는 `useLocation()` 비교\n- 상위 그룹: 하위 경로 중 하나 활성이면 그룹 색상 강조\n- 접이식(Accordion): 초기에 현재 그룹만 열림\n\n---\n\n## 실시간 데이터 갱신 (TanStack Query v5)\n\n```typescript\n// 15초 자동 갱신 (모니터링)\nconst { data } = useQuery({\n  queryKey: ['realtime'],\n  queryFn: () => api.realtime.list(),\n  refetchInterval: 15_000,\n  staleTime: 10_000,\n})\n\n// 60초 자동 갱신 (검침 데이터)\nconst { data } = useQuery({\n  queryKey: ['meter', filters],\n  queryFn: () => api.usage.list1m(filters),\n  refetchInterval: 60_000,\n})\n```\n\n---\n\n## Tailwind 다크 모드 패턴\n\n```tsx\n// 배경\n<div className=\"bg-white dark:bg-gray-900\">\n\n// 텍스트\n<p className=\"text-gray-900 dark:text-gray-100\">\n\n// 테이블 행\n<tr className=\"odd:bg-gray-50 dark:odd:bg-gray-800\">\n\n// 버튼\n<button className=\"bg-blue-600 hover:bg-blue-700 text-white\">\n\n// 입력\n<input className=\"border border-gray-300 dark:border-gray-600 dark:bg-gray-700\">\n```\n\n---\n\n## 빌드 설정\n\n```typescript\n// vite.config.ts\nexport default defineConfig({\n  build: {\n    rollupOptions: {\n      output: {\n        manualChunks: {\n          recharts: ['recharts'],\n          tanstack: ['@tanstack/react-query'],\n        }\n      }\n    }\n  }\n})\n```\n\n빌드 결과 (2026-06-17 기준):\n- 모듈: 904개\n- 총 JS: 792 KB (gzip 212 KB)\n- Recharts 청크: 450 KB (가장 큰 청크 — 정상)\n", "p5_2": "# Phase 5 — Frontend 개발 계획\n\n> 상태: **대부분 완료** (90%, 2026-06-17)\n\n---\n\n## 구현 범위\n\n| 파일 | 설명 | 상태 |\n|------|------|------|\n| `fems/08_frontend/src/App.tsx` | 22개 라우트 완전 연결, PlaceholderPage 전체 제거 | ✅ 완료 |\n| `fems/08_frontend/src/context/ThemeContext.tsx` | 다크/라이트 테마 Context + localStorage | ✅ 완료 |\n| `fems/08_frontend/src/components/layout/Layout.tsx` | 9개 그룹 사이드바 + 헤더 + 테마 토글 | ✅ 완료 |\n| `fems/08_frontend/src/api/client.ts` | 전체 API 타입 + 함수 (goals/analysis/export 포함) | ✅ 완료 |\n| `fems/08_frontend/src/pages/Dashboard.tsx` | KPI 카드 + 실시간 요약 | ✅ 완료 |\n| `fems/08_frontend/src/pages/Monitoring.tsx` | 태그 카드 + Good/Bad 뱃지 + 15초 갱신 | ✅ 완료 |\n| `fems/08_frontend/src/pages/Trend.tsx` | 인터벌/태그 선택 + LineChart + 동적 로드 | ✅ 완료 |\n| `fems/08_frontend/src/pages/master/DevicePage.tsx` | 장비 CRUD UI | ✅ 완료 |\n| `fems/08_frontend/src/pages/master/TagPage.tsx` | 태그 CRUD + 보정계수 인라인 편집 | ✅ 완료 |\n| `fems/08_frontend/src/pages/master/VirtualTagPage.tsx` | 가상태그 + 수식 편집기 | ✅ 완료 |\n| `fems/08_frontend/src/pages/settings/ConversionFactorPage.tsx` | 에너지 변환 계수 편집 | ✅ 완료 |\n| `fems/08_frontend/src/pages/system/OutlierConfigPage.tsx` | 이상치 슬라이더 설정 | ✅ 완료 |\n| `fems/08_frontend/src/pages/system/AggregationPage.tsx` | Cagg 현황 + 다음 실행 | ✅ 완료 |\n| `fems/08_frontend/src/pages/system/SystemEventsPage.tsx` | 이벤트 목록 + 확인 기능 | ✅ 완료 |\n\n---\n\n## 핵심 구현 상세\n\n### App.tsx — 라우팅 (전체 22 Route)\n\n```tsx\n<Routes>\n  <Route element={<Layout />}>\n    <Route index element={<Dashboard />} />\n    <Route path=\"monitoring\" element={<Monitoring />} />\n    <Route path=\"monitoring/peak\" element={<PeakPage />} />\n    <Route path=\"trend\" element={<Trend />} />\n    <Route path=\"analysis/period\" element={<PeriodAnalysisPage />} />\n    <Route path=\"analysis/peak\" element={<PeakAnalysisPage />} />\n    <Route path=\"analysis/efficiency\" element={<EfficiencyPage />} />\n    <Route path=\"analysis/emissions\" element={<EmissionsPage />} />\n    <Route path=\"report/monthly\" element={<MonthlyReportPage />} />\n    <Route path=\"report/export\" element={<ExportPage />} />\n    <Route path=\"data/meter\" element={<MeterDataPage />} />\n    <Route path=\"data/billing\" element={<BillingPage />} />\n    <Route path=\"goal/targets\" element={<GoalPage defaultTab=\"edit\" />} />\n    <Route path=\"goal/compare\" element={<GoalPage defaultTab=\"compare\" />} />\n    <Route path=\"master/devices\" element={<DevicePage />} />\n    <Route path=\"master/tags\" element={<TagPage />} />\n    <Route path=\"master/virtual-tags\" element={<VirtualTagPage />} />\n    <Route path=\"system/conversion-factors\" element={<ConversionFactorPage />} />\n    <Route path=\"system/outlier\" element={<OutlierConfigPage />} />\n    <Route path=\"system/aggregation\" element={<AggregationPage />} />\n    <Route path=\"system/events\" element={<SystemEventsPage />} />\n    <Route path=\"status\" element={<Status />} />\n  </Route>\n</Routes>\n```\n\n### Docker 이미지 재빌드 규칙\n\n소스 코드 변경 시 컨테이너가 구버전 이미지로 실행 중일 수 있음:\n\n```bash\n# 소스 변경 후 반드시 재빌드\ndocker compose --profile step7 build frontend\ndocker compose --profile step7 up -d frontend\n```\n\n코드 변경을 바로 확인하려면 로컬 개발 서버 사용:\n```bash\ncd fems/08_frontend\nnpm install\nnpm run dev    # http://localhost:5173 (Vite HMR)\n```\n\n---\n\n## 버그 픽스 기록\n\n### BUG-09: PlaceholderPage 미사용 import (TS6133)\n\n**증상**: 모든 PlaceholderPage → 실제 컴포넌트 교체 후 `PlaceholderPage` import가 남아 빌드 경고.  \n**수정**: App.tsx에서 `import PlaceholderPage` 줄 제거.\n\n### BUG-10: EfficiencyPage PieLabel `name` 미사용 (TS6133)\n\n**증상**: Recharts에서 넘겨주는 `name` prop을 destructuring에 포함하면 미사용 경고.  \n**수정**: destructuring에서 제거하되 type annotation에는 유지 (Recharts API 호환성).\n\n```typescript\nfunction PieLabel({ cx, cy, midAngle, innerRadius, outerRadius, percent }: {\n  cx: number; cy: number; midAngle: number; innerRadius: number\n  outerRadius: number; percent: number; name: string  // type에만 존재\n})\n```\n\n### BUG-11: EfficiencyPage cur/prev 인덱싱 (TS7053)\n\n**증상**: `areaData` 배열 요소를 동적 키로 인덱싱 시 TypeScript 오류.  \n**수정**: `as Record<string, unknown>` 캐스팅.\n\n```typescript\nconst cur  = (months2[1] ?? {}) as Record<string, unknown>\nconst val  = (cur[k.label] as number) ?? 0\n```\n\n### BUG-12: EmissionsPage `.at()` 미지원 (TS2550)\n\n**증상**: `tsconfig.json` target `ES2020`에서 `Array.prototype.at()` 미지원.  \n**수정**: `arr.at(-1)` → `arr[arr.length - 1]`.\n\n### BUG-13: GoalPage 타입 불일치 (TS2352)\n\n**증상**: `GoalCompareRecord`에 `energy_kind_label`, `unit`, `achievement_pct` 필드 누락.  \n**수정**: `client.ts`의 `GoalRecord`/`GoalCompareRecord` 인터페이스를 API 응답 형태와 정확히 일치시킴.\n\n### BUG-14: MonthlyReportPage `MONTH_LABELS` 미사용 (TS6133)\n\n**증상**: 상수 정의 후 실제 JSX에서 사용하지 않아 빌드 경고.  \n**수정**: `MONTH_LABELS` 상수 제거.\n\n---\n\n## 빌드 검증\n\n```bash\ncd fems/08_frontend\n\n# 타입 체크\nnpx tsc --noEmit\n\n# 빌드\nnpm run build\n# 기대: 0 TypeScript 에러, 0 경고 (Recharts 청크 크기 INFO는 무해)\n```\n\n---\n\n## 미완료 항목\n\n| 항목 | 내용 | 우선순위 |\n|------|------|---------|\n| 로그인 페이지 | JWT 인증 + 로그인 폼 | Phase 7에서 구현 |\n| 반응형 모바일 | 320px 이하 햄버거 메뉴 | 낮음 |\n| E2E 테스트 | Playwright 22개 라우트 smoke test | 낮음 |\n| 번들 최적화 | Recharts lazy import (현재 all-in-one) | 낮음 |\n", "p6_0": "# Phase 6 — 분석 / 리포트 / 데이터 / 목표 기획서\n\n> 상태: **대부분 완료** (90%, 2026-06-17)\n\n---\n\n## 목적\n\n에너지 데이터를 다각도로 분석하고 보고서를 생성하며, 에너지 목표를 설정·관리할 수 있도록 한다.  \n기간별·에너지원별 비교 분석, 피크 분석, 에너지 효율, 온실가스 산정, CSV 내보내기,  \n월간 보고서 인쇄, 검침 데이터 조회, 추정 요금 계산, 목표 vs 실적 비교를 모두 제공한다.\n\n---\n\n## 범위\n\n### 에너지 분석 (4개 페이지)\n\n| 페이지 | 경로 | 주요 기능 |\n|--------|------|---------|\n| 기간별 에너지 분석 | `/analysis/period` | 기간/에너지원별 BarChart, KPI 4종 (TOE/tCO₂/사용량/비교) |\n| 피크 분석 | `/analysis/peak` | 월별 최대피크 Bar + 시간대 히트맵(CSS 12열 그리드) + 태그 요약 |\n| 에너지 효율 | `/analysis/efficiency` | PieChart(도넛 TOE 비중) + MoM 델타바 + AreaChart 스택 |\n| 온실가스 | `/analysis/emissions` | tCO₂ KPI 4종 + 에너지원별 스택 BarChart + 기간합계 테이블 |\n\n### 리포트 (2개 페이지)\n\n| 페이지 | 경로 | 주요 기능 |\n|--------|------|---------|\n| 월간 리포트 | `/report/monthly` | 인쇄용 월별 에너지 리포트 (window.print), KPI + 일별 BarChart |\n| 데이터 내보내기 | `/report/export` | CSV 다운로드 (1m/1d/1month 선택, utf-8-sig 한글 Excel) |\n\n### 데이터 조회 (2개 페이지)\n\n| 페이지 | 경로 | 주요 기능 |\n|--------|------|---------|\n| 검침 데이터 | `/data/meter` | 1분 원시 데이터, 품질/태그 필터, 50건 페이지, 60초 갱신 |\n| 추정 요금 | `/data/billing` | 에너지원별 단가 설정 + 월별 추정 요금 BarChart + 요약 테이블 |\n\n### 목표 관리 (1개 페이지, 2개 탭)\n\n| 탭 | 경로 | 주요 기능 |\n|----|------|---------|\n| 목표 설정 | `/goal/targets` | 연도/에너지원별 월별 목표값 인라인 편집 + PUT upsert |\n| 실적 비교 | `/goal/compare` | 목표 vs 실적 BarChart + 달성률 색상 코딩 (≤90%:green, ≤100%:blue, ≤110%:yellow, >110%:red) |\n\n### Backend 신규 API\n\n| 파일 | 엔드포인트 | 내용 |\n|------|-----------|------|\n| `analysis.py` | GET /api/v1/analysis/period | 기간별 에너지 집계 (에너지원별 합산) |\n| `analysis.py` | GET /api/v1/analysis/peak | 15분 피크 수요전력 조회 |\n| `analysis.py` | GET /api/v1/analysis/compare | 현재기간 vs 이전동일기간 비교 |\n| `export.py` | GET /api/v1/export/csv | StreamingResponse CSV 내보내기 |\n| `goal.py` | GET /api/v1/goals | 연도별 목표 목록 (Redis 캐시 5분) |\n| `goal.py` | PUT /api/v1/goals | 목표 upsert (ON CONFLICT DO UPDATE) |\n| `goal.py` | GET /api/v1/goals/compare | 목표 vs 실적 비교 (cross-DB 병합) |\n\n### DB 신규 테이블\n\n| 테이블 | DB | 내용 |\n|--------|-----|------|\n| `energy_goal` | df_fems_setting | 에너지 목표값 (factory_id, energy_kind, 연/월, goal_value, goal_toe, goal_tco2) |\n\n---\n\n## 핵심 설계 결정\n\n### CSV Export — utf-8-sig 인코딩\n\n한글이 포함된 CSV를 Windows Excel에서 열 때 BOM 없으면 깨짐.  \n`StreamingResponse`에서 `﻿` (BOM) 선행 + `utf-8` 인코딩 = `utf-8-sig` 효과.\n\n### 목표 vs 실적 비교 — Cross-DB 쿼리\n\n- 목표 데이터: `db.setting.acquire()` → `energy_goal` 테이블\n- 실적 데이터: `db.data.acquire()` → `usage_1month` 뷰\n- 파이썬 코드에서 `(energy_kind, month)` 키로 딕셔너리 병합\n\n### 달성률 색상 코딩\n\n```\nachievement_pct ≤ 90%:  초록 (미달)\nachievement_pct ≤ 100%: 파랑 (정상)\nachievement_pct ≤ 110%: 노랑 (초과)\nachievement_pct > 110%: 빨강 (위험)\n```\n\n### 추정 요금 — 클라이언트 사이드\n\nDB에 요금 테이블 없음. 단가 State를 Frontend에서 관리, `총사용량 × 단가` 클라이언트 계산.  \n기본 단가: `{ 1: 120, 2: 1050, 3: 35000, 4: 850 }` (원/kWh, Nm³, ton, m³)\n\n---\n\n## 산출물\n\n| 파일 | 내용 |\n|------|------|\n| `fems/infra/seeds/13_phase6_goal.sql` | energy_goal 테이블 + 2026년 샘플 목표 (24건) |\n| `fems/07_api/app/routers/analysis.py` | period/peak/compare 엔드포인트 |\n| `fems/07_api/app/routers/export.py` | CSV StreamingResponse |\n| `fems/07_api/app/routers/goal.py` | 목표 CRUD + compare 크로스 DB |\n| `fems/08_frontend/src/pages/analysis/PeriodAnalysisPage.tsx` | 기간별 에너지 분석 |\n| `fems/08_frontend/src/pages/analysis/PeakAnalysisPage.tsx` | 피크 분석 |\n| `fems/08_frontend/src/pages/analysis/EfficiencyPage.tsx` | 에너지 효율 |\n| `fems/08_frontend/src/pages/analysis/EmissionsPage.tsx` | 온실가스 |\n| `fems/08_frontend/src/pages/report/MonthlyReportPage.tsx` | 월간 리포트 (인쇄) |\n| `fems/08_frontend/src/pages/report/ExportPage.tsx` | CSV 내보내기 |\n| `fems/08_frontend/src/pages/data/MeterDataPage.tsx` | 검침 데이터 조회 |\n| `fems/08_frontend/src/pages/data/BillingPage.tsx` | 추정 요금 |\n| `fems/08_frontend/src/pages/goal/GoalPage.tsx` | 목표 설정 + 실적 비교 (탭) |\n", "p6_1": "# Phase 6 — 분석/리포트 설계서\n\n> 상태: **완료** (2026-06-17)\n\n---\n\n## DB 설계\n\n### energy_goal 테이블 (df_fems_setting)\n\n```sql\nCREATE TABLE IF NOT EXISTS energy_goal (\n    goal_id      SERIAL PRIMARY KEY,\n    factory_id   TEXT    NOT NULL DEFAULT 'MAIN',\n    energy_kind  INT     NOT NULL,     -- 1=전기 2=가스 3=스팀 4=수도\n    target_year  INT     NOT NULL,\n    target_month INT     NOT NULL CHECK (target_month BETWEEN 1 AND 12),\n    goal_value   FLOAT   NOT NULL,     -- 해당 에너지 단위 (kWh, Nm³, ton, m³)\n    goal_toe     FLOAT,\n    goal_tco2    FLOAT,\n    note         TEXT,\n    created_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    updated_at   TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    UNIQUE (factory_id, energy_kind, target_year, target_month)\n);\n```\n\nUPSERT: `ON CONFLICT (factory_id, energy_kind, target_year, target_month) DO UPDATE SET ...`\n\n---\n\n## API 설계\n\n### GET /api/v1/analysis/period\n\n```\n?interval=1d|1month\n&from=2026-01-01T00:00:00Z  &to=2026-12-31T23:59:59Z\n&energy_kind=1  &limit=500\n```\n\n쿼리 소스: `usage_1d` (interval=1d) 또는 `usage_1month` (interval=1month)  \n집계: 에너지원별 factory_id 합산 (`SUM(total_value)`, `SUM(total_toe)`, `SUM(total_tco2)`)\n\n### GET /api/v1/export/csv\n\n```\n?interval=1m|1d|1month\n&from=&to=&tag_id=\n&limit=50000\n```\n\n응답:\n```python\nasync def export_csv(...) -> StreamingResponse:\n    yield \"﻿\"  # UTF-8 BOM (Excel 한글 호환)\n    yield \"bucket,tag_id,factory_id,energy_kind,total_value,...\\n\"\n    async with db.data.acquire() as conn:\n        async for row in conn.cursor(sql, *params):\n            yield \",\".join(str(v) for v in row.values()) + \"\\n\"\n```\n\n`StreamingResponse(generate(), media_type=\"text/csv\")`\n\n### GET /api/v1/goals (목표 목록)\n\n```\n?year=2026 &energy_kind=1 &factory_id=MAIN\n```\n\n응답에 `energy_kind_label`, `unit` 필드 조인 (`_KIND_LABEL`, `_KIND_UNIT` 딕셔너리).\n\n### GET /api/v1/goals/compare (목표 vs 실적)\n\nCross-DB 병합 패턴:\n```python\n# 목표 (설정 DB)\nasync with db.setting.acquire() as sg_conn:\n    goal_rows = await sg_conn.fetch(goal_sql, *goal_params)\n\n# 실적 (데이터 DB)\nasync with db.data.acquire() as dt_conn:\n    act_rows = await dt_conn.fetch(act_sql, *act_params)\n\n# 파이썬 병합\nact_map = {(r[\"energy_kind\"], r[\"target_month\"]): dict(r) for r in act_rows}\nresult = [\n    { \"energy_kind\": ek, \"goal_value\": g[\"goal_value\"],\n      \"actual_value\": act_map.get((ek, mo), {}).get(\"actual_value\", 0.0),\n      \"achievement_pct\": round(actual / goal * 100, 1) if goal > 0 else None,\n      ...}\n    for g in goal_rows\n]\n```\n\n---\n\n## Frontend 화면 설계\n\n### PeriodAnalysisPage (`/analysis/period`)\n\n```\n[인터벌 선택: 일간|월간]  [에너지종류: 전체|전기|가스|스팀|수도]  [날짜범위 from-to]\n\nKPI 카드 ×4:\n  총 TOE | 총 tCO₂ | 전기(kWh) | 가스(Nm³)\n\nStackedBarChart (Recharts):\n  X축: 날짜 / Y축: TOE\n  각 에너지원 별도 색상 스택\n\n에너지원별 합계 테이블:\n  에너지종류 | 사용량 | TOE | tCO₂ | 비중(%) | 전기대비\n```\n\n### EfficiencyPage (`/analysis/efficiency`)\n\n```\nPieChart 도넛:\n  에너지원별 TOE 비중, 중앙 합계 표시, 커스텀 SVG 레이블\n\nMoM 델타바:\n  이번달 vs 전달 비교 BarChart (음수/양수 색상 구분)\n\nAreaChart 스택:\n  월별 에너지원 TOE 누적 추이 (최근 12개월)\n```\n\n### MonthlyReportPage (`/report/monthly`)\n\n```\n[월/연도 선택]  [인쇄 버튼 → window.print()]\n\n인쇄 레이아웃:\n  헤더: 공장명 + 보고 기간\n  KPI: 총 TOE / 총 tCO₂ / 전월 대비(%) / 집계 일수\n  에너지원별 테이블: 사용량, TOE, tCO₂, 비중\n  일별 BarChart (TOE by 에너지원)\n  전월 비교 패널\n\nprint:hidden 클래스: 버튼 등 인터랙티브 요소 인쇄 시 숨김\nhidden print:block 클래스: 인쇄 전용 제목 블록\n```\n\n### GoalPage (`/goal/targets`, `/goal/compare`)\n\n```\n탭: [목표 설정] [실적 비교]\n\n목표 설정 탭:\n  행별 인라인 편집 (goal_value 숫자 입력)\n
