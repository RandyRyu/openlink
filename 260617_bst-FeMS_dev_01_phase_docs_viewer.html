  저장: PUT /api/v1/goals (upsert)\n\n실적 비교 탭:\n  GroupedBarChart: 목표(회색) vs 실적(에너지종류 색상)\n  달성률 색상 배지 (≤90%: 초록, ≤100%: 파랑, ≤110%: 노랑, >110%: 빨강)\n  테이블: 월별 목표/실적/달성률\n```\n\n`GoalPage`의 `defaultTab` prop:\n```typescript\nexport default function GoalPage({ defaultTab = 'compare' }: { defaultTab?: 'compare' | 'edit' }) {\n  const [activeTab, setActiveTab] = useState<'compare' | 'edit'>(defaultTab)\n```\n\n---\n\n## 라우터 등록 순서 (FastAPI)\n\n`/goals/compare`는 `/goals/{id}` 경로 앞에 정의해야 함. goal.py의 현재 구조:\n\n```python\nrouter = APIRouter(prefix=\"/api/v1/goals\", tags=[\"goals\"])\n\n@router.get(\"\")        # GET /api/v1/goals\n@router.put(\"\")        # PUT /api/v1/goals  (upsert)\n@router.get(\"/compare\")  # GET /api/v1/goals/compare — ★ 반드시 /{id} 앞에\n```\n\n---\n\n## Redis 캐싱 전략\n\n| 엔드포인트 | 캐시 키 | TTL |\n|-----------|---------|-----|\n| GET /goals | `goals:{factory_id}:{year}:{energy_kind}` | 300s |\n| GET /goals/compare | `goals:compare:{factory_id}:{year}:{energy_kind}` | 600s |\n| GET /analysis/period | `analysis:period:{interval}:{from}:{to}:{ek}` | 300s |\n| GET /analysis/peak | `analysis:peak:{from}:{to}:{tag_id}` | 120s |\n\nPUT /goals 시 관련 캐시 무효화:\n```python\nawait cache.delete(f\"goals:{factory_id}:{year}:{energy_kind}\")\nawait cache.delete(f\"goals:{factory_id}:{year}:None\")\n```\n", "p6_2": "# Phase 6 — 분석/리포트 개발 계획\n\n> 상태: **대부분 완료** (90%, 2026-06-17)\n\n---\n\n## 구현 범위\n\n| 파일 | 설명 | 상태 |\n|------|------|------|\n| `fems/infra/seeds/13_phase6_goal.sql` | energy_goal 테이블 + 샘플 2026년 목표 24건 | ✅ 완료 |\n| `fems/infra/Makefile` | `phase6-goal-seed` 타겟 | ✅ 완료 |\n| `fems/07_api/app/routers/analysis.py` | /analysis/period, /analysis/peak, /analysis/compare | ✅ 완료 |\n| `fems/07_api/app/routers/export.py` | /export/csv (StreamingResponse) | ✅ 완료 |\n| `fems/07_api/app/routers/goal.py` | /goals (list/upsert/compare) | ✅ 완료 |\n| `fems/07_api/app/main.py` | analysis/export/goal 라우터 등록 | ✅ 완료 |\n| `fems/08_frontend/src/api/client.ts` | GoalRecord/GoalCompareRecord/GoalUpsert 타입 + api.goals | ✅ 완료 |\n| `fems/08_frontend/src/pages/analysis/PeriodAnalysisPage.tsx` | 기간별 에너지 분석 | ✅ 완료 |\n| `fems/08_frontend/src/pages/analysis/PeakAnalysisPage.tsx` | 피크 분석 + 히트맵 | ✅ 완료 |\n| `fems/08_frontend/src/pages/analysis/EfficiencyPage.tsx` | 에너지 효율 분석 | ✅ 완료 |\n| `fems/08_frontend/src/pages/analysis/EmissionsPage.tsx` | 온실가스 분석 | ✅ 완료 |\n| `fems/08_frontend/src/pages/report/MonthlyReportPage.tsx` | 월간 리포트 (인쇄) | ✅ 완료 |\n| `fems/08_frontend/src/pages/report/ExportPage.tsx` | CSV 내보내기 | ✅ 완료 |\n| `fems/08_frontend/src/pages/data/MeterDataPage.tsx` | 검침 데이터 조회 | ✅ 완료 |\n| `fems/08_frontend/src/pages/data/BillingPage.tsx` | 추정 요금 계산 | ✅ 완료 |\n| `fems/08_frontend/src/pages/goal/GoalPage.tsx` | 목표 설정 + 실적 비교 | ✅ 완료 |\n\n---\n\n## 실행 순서\n\n```bash\ncd fems/infra\n\n# Phase 6: energy_goal 테이블 생성 + 2026년 샘플 목표 (설정 DB)\nmake phase6-goal-seed\n\n# API 이미지 재빌드 (소스 변경 반영)\ndocker compose --profile step6 build api\ndocker compose --profile step6 up -d api\n\n# Frontend 이미지 재빌드\ndocker compose --profile step7 build frontend\ndocker compose --profile step7 up -d frontend\n\n# 검증\ncurl \"http://localhost:8090/api/v1/goals?year=2026\"\ncurl \"http://localhost:8090/api/v1/goals/compare?year=2026\"\n```\n\n---\n\n## 버그 픽스 기록\n\n### BUG-15: 13_phase6_goal.sql `\\c` 메타커맨드\n\n**증상**: `make phase6-goal-seed` 실행 후 \"완료\" 출력되지만 테이블 미생성.  \n**원인**: `\\c df_fems_setting;` psql 메타커맨드가 stdin 파이프를 파괴.  \n**수정**: `13_phase6_goal.sql`에서 `\\c df_fems_setting;` 줄 제거.  \n**회피**: 테이블 + INSERT를 각각 `psql -c \"...\"` 플래그로 직접 실행.\n\n### BUG-16: GoalRecord 인터페이스 필드 누락\n\n**증상**: `GoalPage.tsx`에서 `client.ts`의 `GoalRecord`/`GoalCompareRecord` 캐스팅 실패 (TS2352).  \n**원인**: `GoalCompareRecord`에 `energy_kind_label`, `unit`, `achievement_pct` 누락.  \n         `GoalRecord`에 `energy_kind_label`, `unit` 누락.  \n**수정**: `client.ts` 인터페이스를 API 응답 JSON 형태와 정확히 일치시킴:\n\n```typescript\nexport interface GoalRecord {\n  goal_id: number; factory_id: string; energy_kind: number\n  energy_kind_label: string; unit: string          // ← 추가\n  target_year: number; target_month: number\n  goal_value: number; goal_toe: number | null\n  goal_tco2: number | null; note: string | null\n  created_at: string; updated_at: string | null\n}\nexport interface GoalCompareRecord {\n  energy_kind: number; energy_kind_label: string; unit: string  // ← 추가\n  target_year: number; target_month: number\n  goal_value: number; goal_toe: number | null; goal_tco2: number | null\n  actual_value: number; actual_toe: number; actual_tco2: number\n  achievement_pct: number | null               // ← 추가 (기존: achievement_rate)\n}\n```\n\n### BUG-17: API 이미지 구버전 문제\n\n**증상**: goal.py 라우터 등록 후에도 `/api/v1/goals` 404 반환.  \n**원인**: Docker 컨테이너가 코드 변경 전 이미지로 실행 중.  \n         (`docker restart`는 이미지를 교체하지 않음)  \n**수정**: `docker compose build api` + `docker compose up -d api` 순서로 재빌드.\n\n### BUG-18: usage_1month Cagg 미존재 → goals/compare 500\n\n**증상**: `/api/v1/goals/compare` 500 Internal Server Error.  \n**원인**: `goal.py`의 compare 엔드포인트가 `usage_1month` 뷰를 조회하는데 뷰가 없었음.  \n**수정**: `peak_15m` + `usage_1month` Cagg를 직접 `psql -c` 방식으로 생성.\n\n---\n\n## 검증\n\n```bash\n# 목표 목록\ncurl \"http://localhost:8090/api/v1/goals?year=2026\" | python3 -m json.tool\n\n# 목표 vs 실적 비교\ncurl \"http://localhost:8090/api/v1/goals/compare?year=2026\" | python3 -m json.tool\n\n# 기간별 분석\ncurl \"http://localhost:8090/api/v1/analysis/period?interval=1d&limit=7\"\n\n# 피크 분석\ncurl \"http://localhost:8090/api/v1/analysis/peak?limit=5\"\n\n# CSV 내보내기\ncurl -o test.csv \"http://localhost:8090/api/v1/export/csv?interval=1d&limit=100\"\nfile test.csv  # UTF-8 Unicode text 확인\n```\n\nFrontend 확인:\n```\nhttp://localhost:3000/analysis/period    기간별 에너지 분석\nhttp://localhost:3000/analysis/peak      피크 분석\nhttp://localhost:3000/analysis/efficiency 에너지 효율\nhttp://localhost:3000/analysis/emissions  온실가스\nhttp://localhost:3000/report/monthly     월간 리포트 (인쇄)\nhttp://localhost:3000/report/export      CSV 내보내기\nhttp://localhost:3000/data/meter         검침 데이터\nhttp://localhost:3000/data/billing       추정 요금\nhttp://localhost:3000/goal/targets       목표 설정\nhttp://localhost:3000/goal/compare       실적 비교\n```\n\n---\n\n## 미완료 항목\n\n| 항목 | 내용 | 우선순위 |\n|------|------|---------|\n| 목표 삭제 기능 | DELETE /api/v1/goals/{id} + Frontend 삭제 버튼 | 낮음 |\n| 공장별 목표 | factory_id 파라미터 UI 지원 (현재 MAIN 고정) | 낮음 |\n| 실제 요금 테이블 | DB에 요금 단가 테이블 추가 (현재 클라이언트 사이드 추정) | 중간 |\n| 보고서 PDF 서버사이드 | WeasyPrint/ReportLab 기반 PDF 생성 | 낮음 |\n", "p7_0": "# Phase 7 — 인증 / 보안 / SSO 기획서\n\n> 상태: **미시작** (0%, 예정)\n\n---\n\n## 목적\n\n현재 FeMS는 인증 없이 모든 기능에 접근 가능한 상태.  \nJWT 기반 로그인, 역할 기반 접근 제어(RBAC), Google OAuth SSO를 구현하여  \n운영 환경 배포 전 보안 요건을 충족한다.\n\n---\n\n## 배경\n\n| 항목 | 현재 상태 | 목표 상태 |\n|------|---------|---------|\n| 인증 | 없음 (미인증 접근 허용) | JWT Bearer Token |\n| 사용자 관리 | 없음 | user 테이블 (설정 DB) |\n| 역할 구분 | 없음 | admin / operator / viewer |\n| SSO | 없음 | Google OAuth 2.0 |\n| API 보안 | CORS * 허용 | 도메인 제한 + 인증 헤더 |\n| 세션 | 없음 | Redis 세션 or JWT (무상태) |\n\n---\n\n## 범위\n\n### 사용자 인증 (JWT)\n\n- `POST /auth/login` — 이메일 + 비밀번호 → JWT Access Token + Refresh Token\n- `POST /auth/refresh` — Refresh Token → 새 Access Token\n- `POST /auth/logout` — Redis에서 Refresh Token 무효화\n- JWT 미들웨어: FastAPI `Depends(get_current_user)`\n- Access Token TTL: 15분 / Refresh Token TTL: 7일\n\n### 사용자 관리 DB (설정 DB)\n\n```sql\nCREATE TABLE fems_user (\n    user_id   SERIAL PRIMARY KEY,\n    email     TEXT UNIQUE NOT NULL,\n    name      TEXT NOT NULL,\n    password_hash TEXT,             -- Google SSO 사용자는 NULL\n    role      TEXT NOT NULL DEFAULT 'viewer', -- admin / operator / viewer\n    google_id TEXT UNIQUE,          -- Google OAuth subject\n    last_login TIMESTAMPTZ,\n    is_active BOOL NOT NULL DEFAULT TRUE,\n    created_at TIMESTAMPTZ DEFAULT NOW()\n);\n```\n\n### 역할 기반 접근 제어 (RBAC)\n\n| 역할 | 권한 |\n|------|------|\n| `admin` | 전체 접근 + 사용자 관리 + 설정 변경 |\n| `operator` | 기준정보 CRUD + 목표 설정 + 분석/리포트 |\n| `viewer` | 조회 전용 (분석/리포트/대시보드) |\n\nFastAPI Depends 패턴:\n```python\ndef require_role(*roles: str):\n    async def check(user = Depends(get_current_user)):\n        if user.role not in roles:\n            raise HTTPException(403, \"권한 없음\")\n        return user\n    return check\n\n@router.put(\"/goals\")\nasync def upsert_goal(\n    ...,\n    user = Depends(require_role(\"admin\", \"operator\"))\n):\n```\n\n### Google OAuth 2.0 SSO\n\n- `GET /auth/google` → Google OAuth 동의 화면 리디렉션\n- `GET /auth/google/callback` → code → 토큰 교환 → user 조회/생성 → JWT 발급\n- Google API: `userinfo.email`, `userinfo.profile`\n- 신규 Google 사용자: 자동 생성 (role=viewer)\n\n### Frontend 인증 처리\n\n```typescript\n// axios/fetch interceptor\napi.interceptors.request.use(config => {\n  const token = localStorage.getItem('fems_access_token')\n  if (token) config.headers['Authorization'] = `Bearer ${token}`\n  return config\n})\n\n// 401 자동 토큰 갱신\napi.interceptors.response.use(null, async error => {\n  if (error.response?.status === 401) {\n    await refreshToken()  // Refresh Token으로 재발급\n    return api.request(error.config)\n  }\n  throw error\n})\n```\n\n---\n\n## 비기능 요건\n\n- HTTPS 필수 (운영 환경)\n- bcrypt 비밀번호 해싱 (rounds=12)\n- JWT 서명: RS256 (비대칭 키) 또는 HS256 (대칭 키 + 환경변수)\n- Refresh Token: Redis 저장 (무효화 가능)\n- CORS: 운영 도메인만 허용 (현재 `*` → 도메인 제한)\n- Rate Limiting: /auth/login 엔드포인트 (5회/분)\n\n---\n\n## 산출물 (예정)\n\n| 파일 | 내용 |\n|------|------|\n| `fems/infra/seeds/14_phase7_auth.sql` | fems_user 테이블 + 초기 관리자 계정 |\n| `fems/07_api/app/auth.py` | JWT 발급/검증 + Google OAuth |\n| `fems/07_api/app/routers/auth.py` | /auth/* 엔드포인트 |\n| `fems/07_api/app/deps.py` | `get_current_user`, `require_role` Depends |\n| `fems/08_frontend/src/pages/LoginPage.tsx` | 로그인 폼 + Google 로그인 버튼 |\n| `fems/08_frontend/src/context/AuthContext.tsx` | 인증 상태 Context |\n| `fems/08_frontend/src/components/ProtectedRoute.tsx` | 미인증 → /login 리디렉션 |\n\n---\n\n## 구현 우선순위\n\n1. **1단계 (필수)**: 이메일/비밀번호 로그인 + JWT + ProtectedRoute\n2. **2단계 (권장)**: RBAC (admin/operator/viewer 역할 구분)\n3. **3단계 (선택)**: Google OAuth SSO\n4. **4단계 (선택)**: 사용자 관리 UI (admin 전용)\n", "p7_1": "# Phase 7 — 인증 / 보안 설계서\n\n> 상태: **미시작** (0%, 예정)\n\n---\n\n## 아키텍처 개요\n\n```\nBrowser (React)\n  │\n  ├─ LoginPage → POST /auth/login → JWT Access + Refresh Token\n  │\n  ├─ AuthContext (localStorage: fems_access_token, fems_refresh_token)\n  │\n  ├─ api/client.ts axios interceptor → Authorization: Bearer <token>\n  │                  ↑ 401 → POST /auth/refresh → 재시도\n  │\n  └─ ProtectedRoute → 미인증 시 /login 리디렉션\n\nFastAPI\n  │\n  ├─ /auth/login  → bcrypt.verify() → JWT 발급 + Redis에 Refresh Token 저장\n  ├─ /auth/refresh → Redis Refresh 검증 → 새 Access Token\n  ├─ /auth/logout  → Redis에서 Refresh Token 삭제\n  ├─ /auth/google  → Google OAuth 동의 화면 리디렉션\n  ├─ /auth/google/callback → code 교환 → JWT 발급\n  │\n  └─ 보호된 라우터\n       Depends(get_current_user) → JWT 검증 → user 객체 반환\n       Depends(require_role(\"admin\")) → role 검증\n```\n\n---\n\n## DB 설계\n\n### fems_user 테이블 (df_fems_setting)\n\n```sql\nCREATE TABLE IF NOT EXISTS fems_user (\n    user_id       SERIAL PRIMARY KEY,\n    email         TEXT UNIQUE NOT NULL,\n    name          TEXT NOT NULL,\n    password_hash TEXT,\n    role          TEXT NOT NULL DEFAULT 'viewer'\n                    CHECK (role IN ('admin', 'operator', 'viewer')),\n    google_id     TEXT UNIQUE,\n    last_login    TIMESTAMPTZ,\n    is_active     BOOL NOT NULL DEFAULT TRUE,\n    created_at    TIMESTAMPTZ NOT NULL DEFAULT NOW(),\n    updated_at    TIMESTAMPTZ NOT NULL DEFAULT NOW()\n);\n\nCREATE INDEX idx_fems_user_email    ON fems_user(email);\nCREATE INDEX idx_fems_user_google   ON fems_user(google_id);\n```\n\n초기 관리자 계정 (시드):\n```sql\n-- 비밀번호는 환경변수에서만 관리, DB에 평문 저장 금지\n-- 아래는 bcrypt hash 예시 (실제 hash는 시드 스크립트에서 생성)\nINSERT INTO fems_user (email, name, password_hash, role)\nVALUES ('admin@seah.co.kr', 'FeMS 관리자', '$2b$12$...', 'admin')\nON CONFLICT (email) DO NOTHING;\n```\n\n---\n\n## JWT 설계\n\n### 토큰 구조\n\n**Access Token** (JWT, HS256 또는 RS256):\n```json\n{\n  \"sub\": \"42\",\n  \"email\": \"admin@seah.co.kr\",\n  \"role\": \"admin\",\n  \"exp\": 1700000000\n}\n```\n\n**Refresh Token**: UUID v4 (opaque) → Redis에 저장\n\n```\nRedis key:   refresh:{uuid}\nRedis value: user_id (정수)\nRedis TTL:   7일 (604800초)\n```\n\n### 환경변수\n\n```env\nJWT_SECRET=<256bit 이상 랜덤 문자열>   # HS256 서명 키\nJWT_ALGORITHM=HS256\nACCESS_TOKEN_EXPIRE_MINUTES=15\nREFRESH_TOKEN_EXPIRE_DAYS=7\nGOOGLE_CLIENT_ID=<Google OAuth Client ID>\nGOOGLE_CLIENT_SECRET=<Google OAuth Client Secret>\nGOOGLE_REDIRECT_URI=http://localhost:8090/auth/google/callback\n```\n\n> 환경변수 값은 `.env` 파일에 저장, git-ignored.  \n> DB에는 환경변수 이름만 참조 (실제 값 저장 금지).\n\n---\n\n## API 설계\n\n### POST /auth/login\n\n```\nRequest:\n  { \"email\": \"admin@seah.co.kr\", \"password\": \"...\" }\n\nResponse 200:\n  {\n    \"access_token\": \"<JWT>\",\n    \"refresh_token\": \"<UUID>\",\n    \"token_type\": \"bearer\",\n    \"expires_in\": 900\n  }\n\nResponse 401:\n  { \"detail\": \"이메일 또는 비밀번호가 올바르지 않습니다.\" }\n```\n\n처리 흐름:\n1. `fems_user` 조회 (by email, is_active=TRUE)\n2. `bcrypt.checkpw(password, password_hash)`\n3. Access Token 생성 (JWT, 15분 TTL)\n4. Refresh Token 생성 (UUID) → `SETEX refresh:{uuid} 604800 {user_id}`\n5. `last_login` 업데이트\n6. 두 토큰 반환\n\n### POST /auth/refresh\n\n```\nRequest:\n  { \"refresh_token\": \"<UUID>\" }\n\nResponse 200:\n  { \"access_token\": \"<새 JWT>\", \"expires_in\": 900 }\n\nResponse 401:\n  { \"detail\": \"만료되었거나 유효하지 않은 토큰입니다.\" }\n```\n\n### POST /auth/logout\n\n```\nRequest (Header): Authorization: Bearer <token>\nRequest Body:     { \"refresh_token\": \"<UUID>\" }\n\nResponse 200: { \"message\": \"로그아웃되었습니다.\" }\n```\n\nRedis에서 Refresh Token 삭제 (`DEL refresh:{uuid}`)\n\n### GET /auth/google\n\nGoogle OAuth 동의 화면으로 302 리디렉션:\n```\nhttps://accounts.google.com/o/oauth2/auth\n  ?client_id={GOOGLE_CLIENT_ID}\n  &redirect_uri={GOOGLE_REDIRECT_URI}\n  &response_type=code\n  &scope=openid email profile\n  &state={csrf_state}  ← Redis에 임시 저장 (5분 TTL)\n```\n\n### GET /auth/google/callback\n\n```\n?code=<authorization_code>&state=<csrf_state>\n\n처리:\n1. state 검증 (Redis에서 CSRF 토큰 확인)\n2. code → Google 토큰 교환 (POST https://oauth2.googleapis.com/token)\n3. GET https://www.googleapis.com/oauth2/v2/userinfo\n4. fems_user에서 google_id 또는 email로 조회\n   - 없으면 자동 생성 (role=viewer)\n5. Access + Refresh Token 발급\n6. Frontend 리디렉션: http://localhost:3000/?access_token=...\n```\n\n---\n\n## FastAPI 인증 미들웨어\n\n### auth.py\n\n```python\nfrom jose import jwt, JWTError\nimport bcrypt, uuid\nfrom datetime import datetime, timedelta\n\nSECRET = os.environ[\"JWT_SECRET\"]\nALGO   = os.environ.get(\"JWT_ALGORITHM\", \"HS256\")\n\ndef create_access_token(user_id: int, email: str, role: str) -> str:\n    payload = {\n        \"sub\": str(user_id),\n        \"email\": email,\n        \"role\": role,\n        \"exp\": datetime.utcnow() + timedelta(minutes=15)\n    }\n    return jwt.encode(payload, SECRET, algorithm=ALGO)\n\nasync def create_refresh_token(user_id: int, redis) -> str:\n    token = str(uuid.uuid4())\n    await redis.setex(f\"refresh:{token}\", 604800, user_id)\n    return token\n\ndef verify_access_token(token: str) -> dict:\n    return jwt.decode(token, SECRET, algorithms=[ALGO])\n```\n\n### deps.py\n\n```python\nfrom fastapi import Depends, HTTPException, Header\nfrom .auth import verify_access_token\n\nasync def get_current_user(authorization: str = Header(...)):\n    if not authorization.startswith(\"Bearer \"):\n        raise HTTPException(401, \"인증 정보가 없습니다.\")\n    try:\n        payload = verify_access_token(authorization[7:])\n        return payload\n    except Exception:\n        raise HTTPException(401, \"토큰이 만료되었거나 유효하지 않습니다.\")\n\ndef require_role(*roles: str):\n    async def check(user = Depends(get_current_user)):\n        if user[\"role\"] not in roles:\n            raise HTTPException(403, \"접근 권한이 없습니다.\")\n        return user\n    return check\n```\n\n---\n\n## Frontend 설계\n\n### AuthContext.tsx\n\n```typescript\ninterface AuthState {\n  user: { userId: number; email: string; role: string } | null\n  accessToken: string | null\n  login: (email: string, password: string) => Promise<void>\n  logout: () => Promise<void>\n}\n\n// localStorage 키\nconst ACCESS_KEY  = 'fems_access_token'\nconst REFRESH_KEY = 'fems_refresh_token'\n```\n\n### ProtectedRoute.tsx\n\n```tsx\nexport function ProtectedRoute({ children }: { children: ReactNode }) {\n  const { accessToken } = useAuth()\n  if (!accessToken) return <Navigate to=\"/login\" replace />\n  return <>{children}</>\n}\n```\n\n### api/client.ts interceptor 추가\n\n```typescript\n// 요청에 토큰 삽입\napi.interceptors.request.use(config => {\n  const token = localStorage.getItem('fems_access_token')\n  if (token) config.headers['Authorization'] = `Bearer ${token}`\n  return config\n})\n\n// 401 시 자동 토큰 갱신\nlet isRefreshing = false\napi.interceptors.response.use(null, async error => {\n  if (error.response?.status === 401 && !isRefreshing) {\n    isRefreshing = true\n    const refreshToken = localStorage.getItem('fems_refresh_token')\n    if (refreshToken) {\n      const res = await axios.post('/auth/refresh', { refresh_token: refreshToken })\n      localStorage.setItem('fems_access_token', res.data.access_token)\n      error.config.headers['Authorization'] = `Bearer ${res.data.access_token}`\n      isRefreshing = false\n      return api.request(error.config)\n    }\n  }\n  isRefreshing = false\n  throw error\n})\n```\n\n### LoginPage.tsx\n\n```\n[FeMS 로고]\n\n이메일 입력\n비밀번호 입력\n[로그인 버튼]\n\n──────── 또는 ────────\n\n[G Google 계정으로 로그인]\n\n로그인 실패 시 에러 메시지 표시\n```\n\n---\n\n## 사이드바 라우팅 변경\n\nPhase 7 완료 후 App.tsx 변경:\n\n```tsx\n// 현재 (Phase 6)\n<Route element={<Layout />}>\n  <Route index element={<Dashboard />} />\n  ...\n</Route>\n\n// Phase 7 이후\n<Route path=\"/login\" element={<LoginPage />} />\n<Route element={<ProtectedRoute><Layout /></ProtectedRoute>}>\n  <Route index element={<Dashboard />} />\n  ...\n</Route>\n```\n\n---\n\n## CORS 설정 (운영 환경)\n\n현재 (`main.py`):\n```python\nallow_origins=[\"*\"]\n```\n\nPhase 7 이후:\n```python\norigins = os.environ.get(\"CORS_ORIGINS\", \"http://localhost:3000\").split(\",\")\napp.add_middleware(\n    CORSMiddleware,\n    allow_origins=origins,\n    allow_credentials=True,\n    allow_methods=[\"GET\", \"POST\", \"PUT\", \"DELETE\"],\n    allow_headers=[\"Authorization\", \"Content-Type\"],\n)\n```\n\n---\n\n## Rate Limiting (/auth/login)\n\n`slowapi` 라이브러리 사용:\n```python\nfrom slowapi import Limiter\nfrom slowapi.util import get_remote_address\n\nlimiter = Limiter(key_func=get_remote_address)\n\n@router.post(\"/login\")\n@limiter.limit(\"5/minute\")\nasync def login(request: Request, ...):\n```\n\n또는 Redis 기반 자체 구현:\n```python\nkey = f\"login_attempts:{ip}\"\ncount = await redis.incr(key)\nif count == 1:\n    await redis.expire(key, 60)  # 1분 TTL\nif count > 5:\n    raise HTTPException(429, \"잠시 후 다시 시도해 주세요.\")\n```\n", "p7_2": "# Phase 7 — 인증 / 보안 개발 계획\n\n> 상태: **미시작** (0%, 예정)\n\n---\n\n## 구현 범위\n\n| 파일 | 설명 | 상태 |\n|------|------|------|\n| `fems/infra/seeds/14_phase7_auth.sql` | fems_user 테이블 + 인덱스 + 초기 관리자 시드 | ⬜ 예정 |\n| `fems/infra/Makefile` | `phase7-auth-seed` 타겟 | ⬜ 예정 |\n| `fems/07_api/requirements.txt` | `python-jose`, `bcrypt`, `slowapi` 추가 | ⬜ 예정 |\n| `fems/07_api/app/auth.py` | JWT 발급/검증, bcrypt, Refresh Token (Redis) | ⬜ 예정 |\n| `fems/07_api/app/deps.py` | `get_current_user`, `require_role` Depends | ⬜ 예정 |\n| `fems/07_api/app/routers/auth.py` | /auth/login, /refresh, /logout, /google, /google/callback | ⬜ 예정 |\n| `fems/07_api/app/main.py` | auth 라우터 등록, CORS 수정 (env 기반) | ⬜ 예정 |\n| `fems/08_frontend/src/context/AuthContext.tsx` | 인증 상태 Context + localStorage 관리 | ⬜ 예정 |\n| `fems/08_frontend/src/components/ProtectedRoute.tsx` | 미인증 → /login 리디렉션 | ⬜ 예정 |\n| `fems/08_frontend/src/pages/LoginPage.tsx` | 로그인 폼 + Google 로그인 버튼 | ⬜ 예정 |\n| `fems/08_frontend/src/api/client.ts` | axios 인터셉터 (토큰 삽입 + 401 자동 갱신) | ⬜ 예정 |\n| `fems/08_frontend/src/App.tsx` | ProtectedRoute로 기존 Route 래핑 | ⬜ 예정 |\n\n---\n\n## 실행 순서\n\n### 1단계: DB 준비\n\n```bash\n# fems_user 테이블 생성 + 초기 관리자 계정 시드\ncd fems/infra\nmake phase7-auth-seed\n\n# 검증\ndocker exec fems-setting-db psql -U fems -d df_fems_setting \\\n  -c \"SELECT user_id, email, role, is_active FROM fems_user;\"\n```\n\n### 2단계: API 의존성 추가\n\n```bash\n# requirements.txt 수정\necho \"python-jose[cryptography]==3.3.0\" >> fems/07_api/requirements.txt\necho \"bcrypt==4.1.2\" >> fems/07_api/requirements.txt\necho \"slowapi==0.1.9\" >> fems/07_api/requirements.txt\necho \"httpx==0.27.0\" >> fems/07_api/requirements.txt  # Google OAuth 토큰 교환용\n```\n\n### 3단계: auth.py, deps.py, routers/auth.py 구현\n\n순서:\n1. `auth.py` — JWT 함수, bcrypt, Refresh Token Redis 연동\n2. `deps.py` — `get_current_user`, `require_role`\n3. `routers/auth.py` — /auth/* 엔드포인트\n4. `main.py` — auth 라우터 등록, CORS 환경변수 기반 수정\n\n### 4단계: 기존 라우터에 인증 적용\n\n```python\n# 예시: goal.py PUT 엔드포인트에 role 제한 추가\nfrom app.deps import require_role\n\n@router.put(\"\")\nasync def upsert_goal(\n    ...,\n    _user = Depends(require_role(\"admin\", \"operator\"))\n):\n```\n\n적용 범위:\n- `GET` 엔드포인트: `Depends(get_current_user)` (viewer 이상)\n- `PUT/POST/DELETE` 엔드포인트: `Depends(require_role(\"admin\", \"operator\"))`\n- 사용자 관리 엔드포인트: `Depends(require_role(\"admin\"))`\n\n### 5단계: API 이미지 재빌드\n\n```bash\ncd fems/infra\ndocker compose --profile step6 build api\ndocker compose --profile step6 up -d api\n```\n\n### 6단계: Frontend 구현\n\n순서:\n1. `AuthContext.tsx` — login/logout/refresh 함수 + localStorage\n2. `client.ts` — axios interceptor 추가\n3. `ProtectedRoute.tsx` — 미인증 리디렉션\n4. `LoginPage.tsx` — 로그인 폼 UI\n5. `App.tsx` — `/login` 라우트 추가, 기존 라우트 ProtectedRoute 래핑\n\n### 7단계: Frontend 이미지 재빌드\n\n```bash\ncd fems/infra\ndocker compose --profile step7 build frontend\ndocker compose --profile step7 up -d frontend\n```\n\n---\n\n## Makefile 타겟 (추가 예정)\n\n```makefile\nphase7-auth-seed:\n\tdocker exec -i fems-setting-db psql -U fems -d df_fems_setting \\\n\t  -f /dev/stdin < seeds/14_phase7_auth.sql\n\t@echo \"Phase 7: fems_user 테이블 및 초기 관리자 계정 시드 완료\"\n```\n\n---\n\n## 환경변수 추가 (.env)\n\n```env\n# JWT 인증\nJWT_SECRET=<256bit_random_string>\nJWT_ALGORITHM=HS256\nACCESS_TOKEN_EXPIRE_MINUTES=15\nREFRESH_TOKEN_EXPIRE_DAYS=7\n\n# Google OAuth (선택)\nGOOGLE_CLIENT_ID=<client_id>\nGOOGLE_CLIENT_SECRET=<client_secret>\nGOOGLE_REDIRECT_URI=http://localhost:8090/auth/google/callback\n\n# CORS (운영 환경)\nCORS_ORIGINS=http://localhost:3000\n```\n\n`.env.example`에도 키 이름만 추가 (값은 비워둠):\n```env\nJWT_SECRET=\nJWT_ALGORITHM=HS256\nACCESS_TOKEN_EXPIRE_MINUTES=15\nGOOGLE_CLIENT_ID=\nGOOGLE_CLIENT_SECRET=\nGOOGLE_REDIRECT_URI=\nCORS_ORIGINS=http://localhost:3000\n```\n\n---\n\n## 검증\n\n```bash\n# 로그인\ncurl -X POST http://localhost:8090/auth/login \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"email\":\"admin@seah.co.kr\",\"password\":\"...\"}'\n# 기대: { \"access_token\": \"...\", \"refresh_token\": \"...\", \"token_type\": \"bearer\" }\n\n# 인증 헤더로 보호된 엔드포인트 호출\nTOKEN=\"<access_token>\"\ncurl -H \"Authorization: Bearer $TOKEN\" \\\n  \"http://localhost:8090/api/v1/goals?year=2026\"\n# 기대: 기존과 동일한 200 응답\n\n# 인증 없이 호출\ncurl \"http://localhost:8090/api/v1/goals?year=2026\"\n# 기대: 401 Unauthorized\n\n# 토큰 갱신\ncurl -X POST http://localhost:8090/auth/refresh \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"refresh_token\":\"<uuid>\"}'\n\n# 로그아웃\ncurl -X POST http://localhost:8090/auth/logout \\\n  -H \"Authorization: Bearer $TOKEN\" \\\n  -d '{\"refresh_token\":\"<uuid>\"}'\n```\n\nFrontend 확인:\n```\nhttp://localhost:3000/login          로그인 페이지 (미인증)\nhttp://localhost:3000/               → /login 리디렉션 (미인증)\nhttp://localhost:3000/               대시보드 (로그인 후)\n```\n\n---\n\n## 미완료 항목 (Phase 7 내)\n\n| 항목 | 내용 | 우선순위 |\n|------|------|---------|\n| 이메일/비밀번호 로그인 | JWT + bcrypt + ProtectedRoute | 필수 |\n| RBAC 역할 제한 | admin/operator/viewer Depends 적용 | 권장 |\n| Google OAuth SSO | 소셜 로그인 버튼 + callback | 선택 |\n| 사용자 관리 UI | admin 전용 사용자 CRUD 페이지 | 선택 |\n| Rate Limiting | /auth/login 5회/분 제한 | 권장 |\n| HTTPS (운영) | Nginx SSL 터미네이션 or Let's Encrypt | 운영 필수 |\n| 비밀번호 변경 | POST /auth/change-password | 선택 |\n| 비밀번호 초기화 | 이메일 발송 + 임시 토큰 | 선택 |\n\n---\n\n## 보안 체크리스트\n\n- [ ] 비밀번호는 bcrypt (rounds=12) 해싱, 평문 저장 금지\n- [ ] JWT_SECRET은 환경변수, 소스 코드에 하드코딩 금지\n- [ ] Refresh Token은 Redis에만 저장 (DB 저장 금지)\n- [ ] Google OAuth CSRF state 검증 구현\n- [ ] 로그인 실패 시 \"이메일 또는 비밀번호\" 통합 에러 메시지 (계정 존재 유무 노출 금지)\n- [ ] CORS origins 환경변수 기반 제한 (운영 시 `*` 금지)\n- [ ] /auth/login Rate Limiting 적용\n- [ ] Access Token 만료: 15분 (길게 설정 금지)\n"};
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function inl(s){
  s=esc(s);
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/`([^`]+)`/g,"<code>$1</code>");
  return s;
}
function renderMd(md){
  var lines=md.split("\n"),out="",inC=false,cBuf=[],inT=false,tBuf=[],lBuf=[],lt="ul",inL=false;
  function flushL(){
    if(!lBuf.length)return;
    out+="<"+lt+">"+lBuf.map(function(x){return"<li>"+inl(x)+"</li>"}).join("")+"</"+lt+">";
    lBuf=[];inL=false;
  }
  function flushT(){
    if(!tBuf.length)return;
    var head="",body="",isH=true;
    tBuf.forEach(function(row){
      var cells=row.map(function(c){return c.trim()});
      if(cells.every(function(c){return/^:?-+:?$/.test(c)})){isH=false;return}
      if(isH)head+="<tr>"+cells.map(function(c){return"<th>"+inl(c)+"</th>"}).join("")+"</tr>";
      else body+="<tr>"+cells.map(function(c){return"<td>"+inl(c)+"</td>"}).join("")+"</tr>";
    });
    out+="<table><thead>"+head+"</thead><tbody>"+body+"</tbody></table>";
    tBuf=[];inT=false;
  }
  lines.forEach(function(line){
    if(line.slice(0,3)==="```"){
      if(inC){out+="<pre><code>"+cBuf.join("\n")+"</code></pre>";inC=false;cBuf=[];}
      else{flushL();flushT();inC=true;}
      return;
    }
    if(inC){cBuf.push(esc(line));return}
    if(line.charAt(0)==="|"){
      if(!inT){flushL();inT=true;}
      tBuf.push(line.split("|").slice(1,-1));
      return;
    }
    if(inT)flushT();
    var hm=line.match(/^(#{1,4})\s(.*)/);
    if(hm){flushL();var n=hm[1].length;out+="<h"+n+">"+inl(hm[2])+"</h"+n+">";return}
    if(/^-{3,}$/.test(line.trim())){flushL();out+="<hr>";return}
    if(line.slice(0,2)==="> "){flushL();out+="<blockquote><p>"+inl(line.slice(2))+"</p></blockquote>";return}
    var ulm=line.match(/^[-*]\s(.+)/);
    if(ulm){if(!inL||lt!=="ul"){flushL();inL=true;lt="ul"}lBuf.push(ulm[1]);return}
    var olm=line.match(/^\d+\.\s(.+)/);
    if(olm){if(!inL||lt!=="ol"){flushL();inL=true;lt="ol"}lBuf.push(olm[1]);return}
    if(!line.trim()){flushL();return}
    flushL();
    out+="<p>"+inl(line)+"</p>";
  });
  flushL();flushT();
  return out;
}
function buildNav(){

    var hd=document.createElement("div");hd.className="ph";

    var bd=document.createElement("span");bd.className="bd";bd.textContent=ph.status;
    bd.style.background=ph.color+"22";bd.style.color=ph.color;
    hd.appendChild(pn);hd.appendChild(bd);
    var pd=document.createElement("div");pd.className="pd";
    if(pi===0)pd.classList.add("open");
    hd.onclick=function(){pd.classList.toggle("open")};
    LABS.forEach(function(lbl,di){
      var it=document.createElement("div");it.className="di";
      it.setAttribute("data-pi",String(pi));it.setAttribute("data-di",String(di));

function selectDoc(pi,di){
