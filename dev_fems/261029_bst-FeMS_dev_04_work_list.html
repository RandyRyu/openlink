Metabase 화면 구성 (P1 조기 화면 + P3 4주)", "content": "# 09. P3 Grafana·Metabase 화면 구성 (P1 조기 화면 + P3 4주)\n\n**목적**: 현행 Java 조회 화면을 Grafana(실시간·모니터링)와 Metabase(리포트·분석)로 대체합니다. P1에서는 `fems_legacy.*`로 **조기 화면**을 열고, P3에서 데이터 원본을 `fems_calc.*`로 바꿔 공식 화면으로 승인받습니다.\n\n**범위 밖**: 입력·관리 기능(기준정보, 목표, ISMART 입력, 사용자·권한)은 Grafana·Metabase로 대체할 수 없습니다. 이관 기간에는 **현행 Java 관리 화면 + 구 `SF_FEMS`**를 그대로 쓰고(W0-02 동기화로 신규 DB·DataForge에 반영), 이후 VNTG MES 또는 DataForge 관리 화면으로 옮깁니다(P5).\n\n## 9.1 W3-01 현행 화면 → 대상 매핑\n\n현행 화면 소스: `src_frontend/FEMS_SEAH/src/mapper/mappers/` (매퍼 XML 88개, 같은 구성의 사본 `trunk/FEMS_SEAH2` 존재).\n\n| 현행 영역(매퍼) | 화면 | 현행 데이터 | 대상 | 대상 데이터(P1 → P3) |\n|---|---|---|---|---|\n| `dashboard/dashboard01~06`, `dashboard02_1~14` | 공장·설비 대시보드 | Mongo 요약 15M/1H/DAY/MONTH, 피크 | **Grafana** 대시보드 \"FeMS 개요\"·\"공장별\" | `fems_legacy.summary` → `fems_calc.summary_*` |\n| `dashboard05·06` + `WebConsumer.java` | 실시간 주요설비 현황(Kafka `collect1m` WebSocket) | 전기로 4기(E00091/95/97/108), 2차가공 가스 C00024~C00036 | **Grafana** \"실시간 주요설비\"(10초~1분 갱신) | `fems_raw.raw_collect`(최근값) |\n| `dashboard/diagram01~05`, `diagram` | 에너지 흐름도(EFD) | `ENERGY_FLOW_DIAGRAM` + 요약 | **Grafana** Canvas 패널 | `fems_master.efd` + 요약 |\n| `monitoring/realTime` | 실시간 태그 값 | Mongo 원시, `TAG_STATUS` | **Grafana** \"실시간 태그\" | `fems_raw` + `fems_calc.tag_status` |\n| `monitoring/factoryEnergy`, `buildingEnergy`, `detailEnergy` | 공장·건물·상세 사용량 | Mongo 요약 | **Grafana** | 요약 |\n| `monitoring/energyCost` | 에너지 비용 | 요약 `cost` | **Metabase** \"에너지 비용\" | 요약 + `fems_master.energy_*` |\n| `monitoring/*`(제품 생산 현황) | Heat별 에너지 | Mongo `HEAT_ENERGY_15M` | **Metabase** \"Heat별 에너지\" | `fems_legacy.heat` → `fems_calc.heat_energy` |\n| `analysis/period`, `facEnergyAnalysis`, `buildingEnergyAnalysis`, `floorEnergyAnalysis` | 기간·공장·건물·층별 분석 | Mongo 요약 | **Metabase** 질의(필터: 기간·공장·공정) | 요약 + `fems_master.process_*` |\n| `analysis/peak`, `factoryLoad` | 피크·부하 분석 | 피크, `lod` | **Grafana**(추이) + **Metabase**(월간 표) | `fems_calc.peak*` |\n| `analysis/efficiency`, `monthWonAnalysis`, `result` | 원단위·효율·월 원단위 | Oracle `TAG_SUM_TIME_29_DAY/MONTH`, `UNIT_LEVEL_*` | **Metabase** \"원단위\" | `fems_legacy.basic_unit_*`·`unit_level_*` → `fems_calc.basic_unit_*` |\n| `goal/energyCorrelationship`, `energyPrediction` | 목표·상관·예측 | `PEAK_GOAL`, `USAGE_GOAL` + 요약 | **Metabase** \"목표 대비 실적\" | `fems_master.goal_*` + 요약 |\n| `data/meter`, `bill`, `threshold` | 계측 데이터·요금·임계값 조회 | 요약·코드 | **Metabase** | 요약 + 코드 |\n| `info/ismartView` | ISMART 조회 | `TBL_ISMART` | **Metabase** | `fems_master.ismart` |\n| `main/main` | 메인 화면 | 요약 | **Grafana** 홈 대시보드 | 요약 |\n| `info/*` 관리(`tagMaster`, `machineMngr`, `deviceModel`, `energyMngr`, `energyEFDMngr`, `ismartMngr`, `monthWonWrite`, `energyCostForm`, `elecTime`, `holiday` 등) | **입력·관리** | Oracle 쓰기 | **현행 유지** | - |\n| `system/*`, `cmmn/login` | 사용자·권한·메뉴·로그인 | `TBL_SYS_*` | Grafana·Metabase 자체 권한 | - |\n\n## 9.2 W1-08 / W3-02 Grafana 대시보드 목록\n\n| # | 대시보드 | 주요 패널 | 데이터 | 갱신 |\n|---|---|---|---|---|\n| G1 | FeMS 개요(홈) | 공장별 오늘 누적(06시 기준·전기 00시 기준), 이번 달 누적, 전일 대비 | 일·월 요약 | 1분 |\n| G2 | 실시간 주요설비 | 전기로 4기 전력, 2차가공 가열로 가스 1분 추이 | 원시·1분 | 10초 |\n| G3 | 공장·건물 사용량 | 15분·1시간 추이, 에너지 종류별 | 15분·1시간 요약 | 1분 |\n| G4 | 피크 | 15분 수요 추이, 일·월 최대수요와 시각, 목표 대비 | 피크 + 목표 | 1분 |\n| G5 | 실시간 태그·수집 상태 | 태그 최근값, 비정상 태그 목록·알림 | 원시, 태그 상태 | 30초 |\n| G6 | 에너지 흐름도 | EFD Canvas | EFD + 요약 | 1분 |\n| G7 | 이관 감시(운영자용) | NiFi 지연, DLQ, 분당 건수 현행 대비 | 감시 지표 | 1분 |\n\n## 9.3 W3-03 Metabase 리포트 목록\n\n| # | 리포트 | 내용 | 데이터 |\n|---|---|---|---|\n| M1 | 일·월 에너지 사용 보고 | 공장·공정·에너지 종류별 일·월 사용량, TJ·TOE·tCO2 | 요약 + 기준정보 |\n| M2 | 에너지 비용 | 부하시간대별·확정/추정 단가별 비용 | 1분·요약 비용 |\n| M3 | 원단위 | 일·월 원단위, ERP 원단위 | 원단위 |\n| M4 | Heat별 에너지 | 전기로·2차가공 Heat별 사용량, 생산량 대비 | Heat 에너지 |\n| M5 | 목표 대비 실적 | 사용량·피크 목표 대비 | 목표 + 요약 + 피크 |\n| M6 | 기간·설비 분석 | 임의 기간·설비 필터 | 요약 |\n| M7 | ISMART | ISMART 조회 | ISMART |\n| M8 | **이관 비교 리포트**(운영자용) | `fems_cmp.*` 일일 비교, 미분류 차이 | 비교 뷰([08](08_P2_병행검증_비교체계.md)) |\n\n## 9.4 W3-04 권한·접근\n\n| 항목 | 내용 |\n|---|---|\n| 사용자 | 현행 `TBL_SYS_USER`(구 `SF_FEMS`)는 이관하지 않음. DataForge 표준 사용자 체계(SSO 등)로 Grafana·Metabase 계정 발급 |\n| 권한 | 공장별 폴더·컬렉션 권한(현행 `AUTH_DEPT_MAPPING` 참고) |\n| 고객 접근 | W0-05 결과(DataForge 고객 접근 방식)에 따름 |\n\n## 9.5 W3-05 데이터 원본 전환 (P1 → P3)\n\n| 단계 | 화면 데이터 원본 |\n|---|---|\n| P1 조기 화면 | `fems_legacy.*` (현행과 같은 숫자) |\n| P2 비교 기간 | 운영자용 G7·M8에서 두 원본 비교 |\n| P3 공식화 | `fems_calc.*`로 전환 — **대시보드 SQL이 뷰 이름만 참조하도록** `fems_view.*` 뷰 계층을 두고, 뷰 정의만 legacy → calc로 교체 |\n\n```sql\n-- 화면은 항상 fems_view.* 만 조회\nCREATE OR REPLACE VIEW fems_view.summary_1d AS\nSELECT * FROM fems_legacy.summary WHERE unit = '1d';     -- P1\n-- P3 전환: 정의만 교체\nCREATE OR REPLACE VIEW fems_view.summary_1d AS\nSELECT from_date, tag_id, kind, factory_id, value, kg, mj, toe, tco2, cost, total\n  FROM fems_calc.summary_1d;\n```\n\n> 두 원본의 컬럼 구성이 같도록 뷰에서 이름을 맞춥니다([11](11_DDL_및_토픽_명세.md) 11.6).\n\n## 9.6 W3-06·07 사용자 병행·승인\n\n- 주요 사용자(에너지 담당, 공장별 담당)가 2주간 현행 화면과 새 화면을 함께 사용\n- 메뉴 대응표(9.1) 기준으로 \"대응 완료 / 폐기 합의 / 보완 필요\" 판정\n- 관리 기능은 현행 유지 확인(W3-07)\n\n## 9.7 G3 체크리스트\n\n- [ ] 9.1 조회 메뉴 100% 대응 또는 폐기 합의\n- [ ] G1~G7, M1~M8 완성\n- [ ] 화면 원본 `fems_calc` 전환, 수치 확인\n- [ ] 사용자 승인\n"}, {"id": "10", "file": "10_P4_P5_후속단계.md", "title": "P4·P5 후속 단계 (개요)", "content": "# 10. P4·P5 후속 단계 (개요)\n\nP3(G3)까지 끝나면 **현행을 그대로 둔 상태에서 모든 데이터가 DataForge에서 정상 계산·조회**됩니다. P4·P5는 현행을 실제로 걷어 내는 단계로, 현행 설정을 바꾸는 작업이 처음 들어갑니다. 상세 절차는 P3 완료 시점에 별도 문서로 확정합니다.\n\n## 10.1 P4 수집 이관 (8주, 게이트웨이 수에 비례)\n\n**목적**: Modbus 수집을 현행 Python 수집기에서 **KepServerEX → NiFi(F5) → `fems.raw`**로 옮깁니다.\n\n| 작업 | 내용 | 근거 |\n|---|---|---|\n| W4-01 게이트웨이 목록 | `SFMZ0101`의 `DEVICE_TYPE='D'` 게이트웨이와 하위 계측기, 제조사별 분류([03](03_SQL_신규명칭_재작성_명세.md) Q1) | 현행 `mm_00_collect` 조회 SQL |\n| W4-02 동시 접속 시험 | 비가동 시간대에 게이트웨이별로 현행 수집기와 KepServerEX 동시 접속 시험 | 작업-03 03 3.3 |\n| W4-03 KepServerEX 프로젝트 | 제조사별 데이터 타입·워드 순서·블록 분해(작업-03 03 3.2), 태그 ID 규칙 `{DEVICE_ID}_{ITEM}` 유지 | |\n| W4-04 F5 흐름 | KepServerEX → NiFi → `fems.raw`(`source='kepserver'`, `correct_applied=false` → 계산 서비스가 `CORRECT_RATIO` 적용) | |\n| W4-05 역공급 흐름 | 현행 가공·관리 화면이 남아 있으면 NiFi로 현행 Kafka `collect`에 현행 형식 발행 | |\n| W4-06 전환 | 순서: LS·ECO·MI·WON → VI·MPM·AVT·DEVC·VITZRO → JB·J2·DA·AUTO → EL. 게이트웨이별로 현행 수집기 정지(`fems.monitoring` 해당 행 `EXECUTE_TYPE='N'`) → 2주 무결 확인 | |\n| 롤백 | KepServerEX 채널 비활성 → 해당 행 `EXECUTE_TYPE='Y'` → 1분 내 현행 수집기 자동 재기동 | |\n\n> P4부터 F1(현행 Kafka 탭)과 F5가 같은 태그를 보낼 수 있습니다. 전환된 게이트웨이의 태그는 F1에서 걸러 내도록 NiFi에 **전환 태그 목록 필터**를 둡니다.\n\n## 10.2 P5 현행 제거 (4주)\n\n| 순서 | 대상 | 조건 |\n|---|---|---|\n| 1 | Java **조회** 화면 | G3 이후 1개월 무사용 |\n| 2 | F2 산출물 복제 흐름, 현행 가공 cron(`mm_226`, `mm_246`, `mm_24month`, `mm_266`, `mm_256`, `mm_27`, `mm_146`) | `fems_calc`가 원본으로 인정된 후 |\n| 3 | `mm_28` Oracle 원단위 적재 | 구·신 Oracle 원단위 테이블(`SFMZ0306/0307`) 사용처가 없을 때(D4) |\n| 4 | Autobase·Level-2 현행 수집(`mm_Autobase`, `mm_206`) | DataForge 직접 수집 또는 MES 데이터셋(F4)으로 대체 |\n| 5 | Java **관리** 화면 | 관리 기능이 VNTG MES 또는 DataForge 관리 화면으로 이전된 후 |\n| 6 | MongoDB, MariaDB, 현행 Kafka, Redis, 현행 서버 | 보존 기간 경과, 백업 후 |\n| 7 | 구 `SF_FEMS`, S1 동기화 | MES 팀 결정 |\n\n## 10.3 P4·P5 착수 조건\n\n- [ ] G3 통과\n- [ ] KepServerEX 라이선스(태그 수·Modbus 드라이버) 확보\n- [ ] 관리 기능 이전처(VNTG MES / DataForge 관리 화면) 결정\n- [ ] 현행 운영 담당자와 전환·롤백 절차 합의\n"}, {"id": "11", "file": "11_DDL_및_토픽_명세.md", "title": "DDL 및 토픽 명세", "content": "# 11. DDL 및 토픽 명세\n\nDataForge PostgreSQL(+TimescaleDB)에 만들 스키마·테이블과 Kafka 토픽입니다. 이름·타입은 DataForge 표준(W0-05)에 맞춰 조정할 수 있습니다. 원시 시계열 표준이 InfluxDB라면 `fems_raw`만 InfluxDB measurement로 바꾸고 나머지는 그대로 둡니다.\n\n## 11.1 스키마 구성\n\n| 스키마 | 내용 | 생성 단계 |\n|---|---|---|\n| `fems_raw` | 원시 계측값 | P1 |\n| `fems_master` | 기준정보(MES 팀 DB `SFMZ*` 동기화본) | P1 |\n| `fems_legacy` | 현행 산출물 복제본(비교 기준·조기 화면) | P1 |\n| `fems_mes` | MES Heat·Level-2 | P2 |\n| `fems_calc` | DataForge 계산 결과·상태 | P2 |\n| `fems_cmp` | 비교 뷰 | P2 |\n| `fems_view` | 화면 조회용 뷰(원본 전환 계층) | P1 |\n\n## 11.2 `fems_raw`\n\n```sql\nCREATE SCHEMA IF NOT EXISTS fems_raw;\n\nCREATE TABLE fems_raw.raw_collect (\n    time             timestamptz      NOT NULL,          -- 계측 시각(Asia/Seoul 해석)\n    tag_id           text             NOT NULL,\n    value            double precision,\n    kind             text,                               -- 현행 DEVICE_USE 코드(1,2,..,A,Z)\n    factory_id       text,\n    source           text             NOT NULL,          -- legacy-collect | legacy-backfill | kepserver\n    correct_applied  boolean          NOT NULL DEFAULT true,\n    raw_text         text,                               -- 현행 원본 문자열(F1)\n    ingested_at      timestamptz      NOT NULL DEFAULT now()\n);\nSELECT create_hypertable('fems_raw.raw_collect', 'time', chunk_time_interval => INTERVAL '1 day');\nCREATE UNIQUE INDEX ON fems_raw.raw_collect (tag_id, time, source);\n-- 보존·압축 정책은 W0-05 결정에 따름\nSELECT add_compression_policy('fems_raw.raw_collect', INTERVAL '7 days');\n```\n\n## 11.3 `fems_master` (주요 테이블)\n\n```sql\nCREATE SCHEMA IF NOT EXISTS fems_master;\n\n-- SFMZ0104 (TAG_MASTER) — 컬럼은 W0-03 검증 결과로 확정. 아래는 현행 소스가 쓰는 컬럼\nCREATE TABLE fems_master.tag (\n    tag_id               text PRIMARY KEY,\n    device_id            text,\n    data_address         text,\n    correct_ratio        double precision,\n    coll_yn              char(1),\n    virtual_tag_yn       char(1),\n    virtual_tag_formula  text,\n    factory_id           text,\n    order_seq            integer,\n    remark               text,\n    coll_interval        text,\n    sens_kind            text,\n    status_threshold_min integer DEFAULT 30,              -- 태그 상태 판정용(현행 mm_146 std_not_time = 30분)\n    src_hash             text,                            -- 변경 감지\n    synced_at            timestamptz NOT NULL DEFAULT now(),\n    deleted_at           timestamptz\n);\n\n-- SFMZ0101 (DEVICE_MASTER)\nCREATE TABLE fems_master.device (\n    device_id              text PRIMARY KEY,\n    device_type            text,          -- C 가스보정기 / E 전력량계 / D 게이트웨이\n    maker                  text,\n    device_address         text,\n    com_connect_device_id  text,\n    device_use             text,          -- 에너지 종류 코드\n    energy_kind_detail     text,          -- CODEDETAIL FE113 키\n    factory_id             text,\n    use_yn                 char(1),       -- Y / M / N\n    src_hash text, synced_at timestamptz NOT NULL DEFAULT now(), deleted_at timestamptz\n);\n\n-- SFMZ0001/0002 (CODEMASTER/CODEDETAIL)\nCREATE TABLE fems_master.code_detail (\n    code_type text, code text, code_name text, mgt_char1 text,\n    payload jsonb,                          -- 나머지 컬럼 원본 보존\n    synced_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (code_type, code)\n);\n\n-- SFMZ0914 / 0919 / 0920 (요약 정의·매핑)\nCREATE TABLE fems_master.summary_info  (summary_id text PRIMARY KEY, data_range text, execute_command text, cycle_time text, payload jsonb, synced_at timestamptz DEFAULT now());\nCREATE TABLE fems_master.summary_from  (tag_summary_id text PRIMARY KEY, tag_id text, from_store_table_id text, summary_id text, synced_at timestamptz DEFAULT now());\nCREATE TABLE fems_master.summary_to    (from_summary_id text, to_summary_id text, synced_at timestamptz DEFAULT now(), PRIMARY KEY (from_summary_id, to_summary_id));\n\n-- 파생 뷰: 요약·피크·Heat 대상 (sql_20 / sql_22 / sql_05 대응)\nCREATE VIEW fems_master.summary_target AS\nSELECT DISTINCT f.tag_id, (d.device_id LIKE 'E%') AS is_elec, c.mgt_char1 AS kg_factor\n  FROM fems_master.summary_from f\n  JOIN fems_master.summary_to   t ON f.tag_summary_id = t.from_summary_id\n  JOIN fems_master.summary_info s ON f.summary_id = s.summary_id\n  JOIN fems_master.tag          g ON g.tag_id = f.tag_id\n  JOIN fems_master.device       d ON d.device_id = g.device_id\n  LEFT JOIN fems_master.code_detail c ON c.code_type = 'FE113' AND c.code = d.energy_kind_detail\n WHERE s.data_range = '15mi' AND s.execute_command = '사용량';\n\nCREATE VIEW fems_master.peak_target AS\nSELECT DISTINCT f.tag_id FROM fems_master.summary_from f WHERE f.summary_id = '20';\n```\n\n나머지 `SFMZ*`(공정·위치·EFD·목표·ISMART·에너지·사이트·기타)는 `payload jsonb` + 키 컬럼 형태로 단순 복제하고, 화면에서 필요한 컬럼만 뷰로 펼칩니다.\n\n## 11.4 `fems_legacy`\n\n```sql\nCREATE SCHEMA IF NOT EXISTS fems_legacy;\n\n-- Mongo collect_m1\nCREATE TABLE fems_legacy.usage_1m (\n    time timestamptz NOT NULL, tag text NOT NULL, vtag char(1) NOT NULL,\n    val double precision, kg double precision, total double precision,\n    before_tag_value double precision, bf_time text,\n    current_tag_value double precision, curr_time text,\n    tj double precision, toe double precision, tco2 double precision,\n    cost double precision, conf char(1), lod_tmzon char(1),\n    kind text, fid text, create_time text,\n    time_text text NOT NULL,                       -- 현행 원본 시각 문자열\n    copied_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (tag, time, vtag)\n);\nSELECT create_hypertable('fems_legacy.usage_1m', 'time', chunk_time_interval => INTERVAL '7 days');\n\n-- Mongo TAG_SUM_TIME_29_15M/1H/DAY/MONTH\nCREATE TABLE fems_legacy.summary (\n    unit text NOT NULL,                           -- 15m | 1h | 1d | 1d_elc | 1mon | 1mon_elc\n    tag text NOT NULL, from_date timestamptz NOT NULL, to_date timestamptz,\n    value double precision, total double precision, kg double precision, acc_value double precision,\n    tj double precision, toe double precision, tco2 double precision, cost double precision,\n    lod char(1), group_time text, kind text, factory_id text,\n    copied_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (unit, tag, from_date)\n);\n\n-- Mongo PEAK_SUM_TIME_29_15M\nCREATE TABLE fems_legacy.peak (\n    tag text NOT NULL, from_date timestamptz NOT NULL, to_date timestamptz,\n    m15_mxmm_kw double precision, hh_mxmm_kw double precision, de_mxmm_kw double precision,\n    mt_mxmm_kw double precision, yy_mxmm_kw double precision,\n    m15_mxmm_time text, hh_mxmm_time text, de_mxmm_time text, mt_mxmm_time text, yy_mxmm_time text,\n    copied_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (tag, from_date)\n);\n\n-- Mongo HEAT_ENERGY_15M\nCREATE TABLE fems_legacy.heat (\n    heat_no text NOT NULL, tag_id text NOT NULL, irn_code text, irn_name text, hogi text,\n    eaf_wrk_date text, from_time text, to_time text, eaf_wrk_tot_times text, proc_wgt double precision,\n    pon text, plan_code text, total_use double precision, tj_total double precision,\n    toe_total double precision, tco2_total double precision, cost_total double precision,\n    create_from_date text, create_to_date text,\n    copied_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (heat_no, tag_id)\n);\n\n-- Oracle SFMZ0306 / 0307 (중복 행 보존을 위해 원천 ROWID 키)\nCREATE TABLE fems_legacy.basic_unit_day (\n    src_rowid text PRIMARY KEY, tag text, value_heat double precision, value_am6 double precision,\n    from_date timestamp, to_date timestamp, std_date timestamp,\n    tj double precision, toe double precision, tco2 double precision, cost double precision,\n    factory_id text, kind text, min_acc_value double precision, max_acc_value double precision,\n    copied_at timestamptz NOT NULL DEFAULT now()\n);\nCREATE TABLE fems_legacy.basic_unit_month (src_rowid text PRIMARY KEY, payload jsonb, tag text, from_date timestamp, to_date timestamp, copied_at timestamptz DEFAULT now());\n\n-- Oracle SFMZ0917\nCREATE TABLE fems_legacy.tag_status (\n    tag_id text PRIMARY KEY, tag_status text, tag_value text, tag_time text,\n    device_use text, factory_id text, copied_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE fems_legacy.backfill_log (\n    id bigserial PRIMARY KEY, source text, range_from text, range_to text,\n    rows_read bigint, rows_written bigint, started_at timestamptz, finished_at timestamptz, note text\n);\n```\n\n## 11.5 `fems_mes`, `fems_calc`\n\n```sql\nCREATE SCHEMA IF NOT EXISTS fems_mes;\nCREATE TABLE fems_mes.heat_work (\n    heat_no text NOT NULL, line text NOT NULL,            -- EAF | SECOND\n    tag_id text NOT NULL, irn_code text, irn_name text, hogi text, equip_name text,\n    work_date date, from_time timestamptz, to_time timestamptz,\n    work_cnt integer, prod_wgt double precision, pon text,\n    raw jsonb, received_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (heat_no, line, tag_id)\n);\n\nCREATE SCHEMA IF NOT EXISTS fems_calc;\nCREATE TABLE fems_calc.usage_1m (\n    time timestamptz NOT NULL,                 -- 귀속 분(정각)\n    tag_id text NOT NULL, is_virtual boolean NOT NULL DEFAULT false,\n    val double precision, kg double precision, total double precision,\n    before_val double precision, bf_time timestamptz,\n    current_val double precision, curr_time timestamptz,\n    mj double precision, toe double precision, tco2 double precision,\n    cost double precision, conf char(1), lod char(1),\n    kind text, factory_id text,\n    quality smallint NOT NULL DEFAULT 0,       -- 0 Good / 1 Bad / 2 Uncertain\n    calc_version text, created_at timestamptz NOT NULL DEFAULT now(),\n    PRIMARY KEY (tag_id, time, is_virtual)\n);\nSELECT create_hypertable('fems_calc.usage_1m', 'time', chunk_time_interval => INTERVAL '7 days');\n\nCREATE TABLE fems_calc.calc_state (            -- 계산 서비스 재시작 복구\n    tag_id text PRIMARY KEY, current_val double precision, curr_time timestamptz,\n    total double precision, total_month date, updated_at timestamptz NOT NULL DEFAULT now()\n);\n\nCREATE TABLE fems_calc.heat_energy (\n    heat_no text NOT NULL, line text, tag_id text NOT NULL,\n    from_time timestamptz, to_time timestamptz, prod_wgt double precision, pon text,\n    total_use double precision, mj_total double precision, toe_total double precision,\n    tco2_total double precision, cost_total double precision, plan_code text,\n    PRIMARY KEY (heat_no, tag_id)\n);\n\nCREATE TABLE fems_calc.basic_unit_day (\n    tag text NOT NULL, std_date date NOT NULL, value_heat double precision, value_am6 double precision,\n    mj double precision, toe double precision, tco2 double precision, cost double precision,\n    factory_id text, kind text, PRIMARY KEY (tag, std_date)\n);\n-- 연속 집계 summary_15m / 1h / 1d / 1d_elc / 1mon / 1mon_elc, peak_15m 등은 07 문서\n```\n\n## 11.6 `fems_view` (화면 원본 전환 계층)\n\n화면은 `fems_view.*`만 조회합니다. P1에서는 `fems_legacy`, P3에서는 `fems_calc`를 가리키도록 **뷰 정의만** 교체합니다. 두 원본의 차이(`tj` ↔ `mj`, `tag` ↔ `tag_id`, `vtag` ↔ `is_virtual`)는 뷰에서 이름을 맞춥니다.\n\n| 뷰 | P1 원본 | P3 원본 |\n|---|---|---|\n| `fems_view.usage_1m` | `fems_legacy.usage_1m` | `fems_calc.usage_1m` |\n| `fems_view.summary_{15m,1h,1d,1d_elc,1mon,1mon_elc}` | `fems_legacy.summary` | `fems_calc.summary_*` |\n| `fems_view.peak` | `fems_legacy.peak` | `fems_calc.peak*` |\n| `fems_view.heat` | `fems_legacy.heat` | `fems_calc.heat_energy` |\n| `fems_view.basic_unit` | `fems_legacy.basic_unit_*` | `fems_calc.basic_unit_*` |\n| `fems_view.tag_status` | `fems_legacy.tag_status` | `fems_calc.tag_status` |\n\n## 11.7 Kafka 토픽\n\n| 토픽 | 단위 | 키 | 생산 | 소비 | 파티션(안) | 보존(안) |\n|---|---|---|---|---|---|---|\n| `fems.raw` | 태그 | `tag_id` | F1, F5 | 계산 서비스, 적재 | 12 | 7일 |\n| `fems.raw.dlq` | 태그 | - | F1, F5 | 운영 확인 | 1 | 30일 |\n| `fems.usage.1m` | 태그 | `tag_id` | 계산 서비스 | 적재(`fems_calc.usage_1m`), BigQuery | 12 | 7일 |\n| `fems.legacy.usage1m` / `.summary` / `.peak` / `.heat` / `.oracle` | 데이터셋 | 원천 키 | F2 | 적재(`fems_legacy`) | 3 | 3일 |\n| `fems.master.<entity>` | 데이터셋 | 기본 키 | F3 | 적재(`fems_master`) | 1 | compact |\n| `fems.master.changed` | 이벤트 | 엔티티명 | F3 | 계산 서비스 | 1 | 1일 |\n| `fems.mes.heat` | 데이터셋 | `heat_no` | F4 | 적재(`fems_mes`) | 1 | 7일 |\n\n**`fems.raw` 레코드(JSON, 표준 스키마 확정 전 초안)**\n\n```json\n{\n  \"tag_id\": \"E00091_Total Active Energy\",\n  \"ts\": \"2026-10-29T09:31:00.123456+09:00\",\n  \"value\": 1234567.8,\n  \"kind\": \"1\",\n  \"factory_id\": \"GS\",\n  \"source\": \"legacy-collect\",\n  \"correct_applied\": true,\n  \"raw\": \"E00091_Total Active Energy||1234567.8||2026-10-29 09:31:00.123456||1||GS\"\n}\n```\n"}, {"id": "12", "file": "12_체크리스트_결정사항_확인필요.md", "title": "체크리스트·결정 사항·확인 필요", "content": "# 12. 체크리스트·결정 사항·확인 필요\n\n## 12.1 결정 사항 (W0-06, P2 이전 확정)\n\n| # | 결정 | 선택지 | 권장 | 영향 |\n|---|---|---|---|---|\n| D1 | 적산값 롤오버 처리 | 현행처럼 0 / 보정(10의 거듭제곱 기준) | **현행과 동일(0)** 후 P3 이후 재검토 | 1분 사용량, K4 |\n| D2 | 전기 00시 기준 집계 유지 | 유지 / 폐지 | **유지**(`summary_1d_elc`, `_1mon_elc`) | 요약·화면 |\n| D3 | 에너지 종류 코드 | 현행 `DEVICE_USE` 11종(1~9, A, Z) 그대로 / 신규 4종 축약 | **현행 11종 유지** | 전 테이블 `kind` |\n| D4 | Oracle 원단위 테이블(`SFMZ0306/0307`) 계속 채우기 | DataForge가 채움 / 현행 `mm_28`이 채움 / 중단 | **현행 `mm_28` 유지, DataForge는 쓰지 않음** | P5 순서 |\n| D5 | 과거 데이터 보존 범위 | 전체 / 최근 N년 | 용량 측정(W0-05) 후 결정 | 백필 기간 |\n| D6 | `tj` 필드 단위·피크 단위 | 현행 그대로(MJ 함수 결과를 `tj`로, 15분 피크 kWh) / 정정 | **DataForge는 정확한 이름(`mj`, `demand_kw`)으로 저장, 화면에서 단위 표기** — 함수 본문 확인(W0-03) 후 | 환산·피크·화면 |\n| D7 | 환산 방식 | TO-BE 함수 호출(A) / 로직 이식(B) | **P2 A → P3 이후 B** | 계산 서비스 |\n| D8 | 동기화 방식(W0-02) | S1 / S2 / S3 / S4 | **S1 + 준비 전 S2** | F2-O, F3 |\n\n## 12.2 확인 필요 정보\n\n| # | 항목 | 담당 | 쓰이는 곳 | 상태 |\n|---|---|---|---|---|\n| Q01 | MES 팀 DB 접속 정보·TO-BE 소유 스키마 | MES 팀 | 전 SQL | 미확인 |\n| Q02 | 구 → 신 동기화 가능 여부·주기(S1) | MES 팀 | W0-02 | 미확인 |\n| Q03 | 구·신 컬럼명 동일 여부 | MES 팀·FeMS | [03](03_SQL_신규명칭_재작성_명세.md) | 미확인 |\n| Q04 | 환산 함수 4종 본문과 구·신 결과 일치 | MES 팀·FeMS | 계산 서비스 | 미확인 |\n| Q05 | `DATA_ERP_*`·`DATA_WON_DAN_WEE_DAY*`·`DATA_FIX_SET_DAY` 실행 주체(DB Job)·신규 DB 가동 여부 | MES 팀 | D13 | 미확인 |\n| Q06 | `GMES.*` 8개 테이블 위치·권한, VNTG MES 일정 | MES 팀 | F4 | 미확인 |\n| Q07 | DataForge 기존 MES·Level-2 데이터셋 범위 | DataForge | F4 재사용 | 미확인 |\n| Q08 | DataForge 표준 메시지 스키마·토픽 규칙·스키마 레지스트리 | DataForge | [11](11_DDL_및_토픽_명세.md) | 미확인 |\n| Q09 | NiFi 버전, Kafka·Mongo 프로세서 가용성 | DataForge | F1·F2 | 미확인 |\n| Q10 | 원시 시계열 표준 저장소(InfluxDB/TimescaleDB), 할당 용량 | DataForge | [11](11_DDL_및_토픽_명세.md) | 미확인 |\n| Q11 | Grafana·Metabase 운영 방식·고객 접근 | DataForge | [09](09_P3_Grafana_Metabase_화면구성.md) | 미확인 |\n| Q12 | 운영 규모(분당 메시지, 활성 태그, Mongo 용량) | 현행 운영 | 용량·백필 | 미확인 |\n| Q13 | 현행 Kafka 보존 기간 | 현행 운영 | F1 장애 복구 한도 | 미확인 |\n| Q14 | `mm_collec.py`·`eco*.sh` 실제 가동 여부(`ps aux`) | 현행 운영 | D01 범위(신망 MPM/AVT/DEVC/VITZRO 태그가 F1에 들어오는지) | 미확인 |\n| Q15 | `SUMMARY_INFO`에서 \"15mi·사용량\"의 `SUMMARY_ID` | FeMS | 요약 대상 | 미확인 |\n| Q16 | `DEVICE_MASTER.USE_YN='M'` 의미 | MES 팀 | 대상 판정 | 미확인 |\n| Q17 | 태그 상태 판정 임계값 | FeMS | [07](07_P2_집계_피크_Heat_원단위_SQL.md) 7.6 | ✅ 확인 — `mm_146` 95행 `std_not_time = 30`(분) |\n\n## 12.3 단계별 체크리스트 (요약)\n\n### P0\n- [ ] 접속 5종 확인, 전용 읽기 계정 발급(평문 공유 금지)\n- [ ] 동기화 방식(D8) 결정\n- [ ] 신규 객체 검증(컬럼·행 수·함수)\n- [ ] GMES·DB Job 확인\n- [ ] DataForge 표준·운영 규모 확보\n- [ ] D1~D8 결정, 알려진 차이 K1~K9 합의\n\n### P1\n- [ ] 스키마·토픽 생성\n- [ ] F1·F2-M·F2-O·F3 흐름 가동\n- [ ] 백필 완료\n- [ ] 조기 대시보드(현행과 같은 숫자)\n- [ ] G1 지표 7일 연속 충족\n\n### P2\n- [ ] 계산 서비스 T1~T7 통과, 매분 발행\n- [ ] 연속 집계·피크·Heat·원단위·태그 상태 동작\n- [ ] 비교 뷰·일일 리포트\n- [ ] 미분류 차이 0건 14일 연속(G2)\n\n### P3\n- [ ] 조회 메뉴 100% 대응\n- [ ] 화면 원본 `fems_calc` 전환\n- [ ] 사용자 승인(G3)\n\n## 12.4 작업-02·작업-03 문서 정정 사항\n\n| 문서 | 기존 서술 | 정정 |\n|---|---|---|\n| 작업-02 02 2.2, 작업-03 02·05·07 | MariaDB 프로시저 5종(`SP_GET_SQL`, `SP_ORACLE_CONN`, `SP_GET_CONNECT_INFO`, `SP_GET_SAVE_INFO`, `SP_GET_SUM_INTERVAL`) | MariaDB는 `SP_GET_SQL`·`SP_ORACLE_CONN` 2종. 나머지 3종은 **Oracle `SF_FEMS` 프로시저**(→ `SP_SFMZ_*`) |\n| 작업-03 04·10 | 신규 bst_FeMS `05_processor`는 \"구현됨/재사용\", 가상태그 \"`eval` 미사용\" | 현행과 계산 방식이 달라 **재구현 수준 수정 필요**, 가상태그는 제한된 `eval` 사용 중([06](06_P2_FeMS계산서비스_개발.md)) |\n| 작업-03 07·10 | Oracle 기준정보는 구 `SF_FEMS`에서 동기화 | **MES 팀 DB의 TO-BE 객체(`SFMZ*`)**에서 동기화, 구 DB는 S2 기간에만 |\n| 작업-03 08 피크 | 15분 수요 × 4 = kW | 현행 15분 피크 값은 ×4 없음(kWh), 시·일·월·연만 ×4 (K9) |\n"}];

const listEl = document.getElementById('doc-list');
const docEl = document.getElementById('doc');
const crumbEl = document.getElementById('doc-crumb');
const fileEl = document.getElementById('doc-file');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const sidebar = document.getElementById('sidebar');

let current = 0;

function isDark(){
  const forced = document.documentElement.dataset.theme;
  if (forced) return forced === 'dark';
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function initMermaid(){
  if (!window.mermaid) return;
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'neutral', fontFamily: 'IBM Plex Sans KR, sans-serif' });
}

function buildNav(){
  DOCS.forEach((d, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.index = String(i);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d.id;
    const label = document.createElement('span');
    label.textContent = d.title;
    btn.append(num, label);
    btn.addEventListener('click', () => show(i));
    li.append(btn);
    listEl.append(li);
  });
}

function renderMarkdown(text){
  if (!window.marked){
    const pre = document.createElement('pre');
    pre.textContent = text;
    return pre.outerHTML;
  }
  return marked.parse(text, { gfm: true });
}

async function renderMermaid(){
  const blocks = docEl.querySelectorAll('pre > code.language-mermaid');
  for (const code of blocks){
    const box = document.createElement('div');
    box.className = 'mermaid-box';
    const source = code.textContent;
    code.parentElement.replaceWith(box);
    if (!window.mermaid){ box.textContent = source; continue; }
    try {
      const { svg } = await mermaid.render('mmd-' + (++mermaidSeq), source);
      box.innerHTML = svg;
    } catch (err) {
      const pre = document.createElement('pre');
      pre.textContent = source;
      box.replaceChildren(pre);
      console.error('mermaid 렌더링 실패', err);
    }
  }
}

function wireLinks(){
  docEl.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    const name = decodeURIComponent(href.split('#')[0].split('/').pop());
    const isLocal = !href.includes('/') || href.startsWith('./');
    if (isLocal && name in byFile){
      a.addEventListener('click', e => { e.preventDefault(); show(byFile[name]); });
    } else if (/^https?:/.test(href) || href.startsWith('../')){
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
  docEl.querySelectorAll('table').forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.replaceWith(wrap);
    wrap.append(t);
  });
}

async function show(i){
  current = i;
  const d = DOCS[i];
  docEl.innerHTML = renderMarkdown(d.content);
  crumbEl.textContent = d.id + ' / ' + String(DOCS.length - 1).padStart(2, '0');
  fileEl.textContent = d.file;
  listEl.querySelectorAll('button').forEach(b => {
    if (Number(b.dataset.index) === i) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  const prev = DOCS[i - 1], next = DOCS[i + 1];
  prevBtn.hidden = !prev; nextBtn.hidden = !next;
  prevBtn.textContent = prev ? '← ' + prev.id + ' ' + prev.title : '';
  nextBtn.textContent = next ? next.id + ' ' + next.title + ' →' : '';
  wireLinks();
  try { history.replaceState(null, '', '#' + d.id); } catch (e) { /* file:// 등에서 실패해도 무시 */ }
  sidebar.dataset.open = 'false';
  menuBtn.setAttribute('aria-expanded', 'false');
  window.scrollTo({ top: 0 });
  await renderMermaid();
}

prevBtn.addEventListener('click', () => current > 0 && show(current - 1));
nextBtn.addEventListener('click', () => current < DOCS.length - 1 && show(current + 1));
menuBtn.addEventListener('click', () => {
  const open = sidebar.dataset.open !== 'true';
  sidebar.dataset.open = String(open);
  menuBtn.setAttribute('aria-expanded', String(open));
});
document.getElementById('theme-toggle').addEventListener('click', () => {
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('fems-migration-work-theme', document.documentElement.dataset.theme); } catch (e) { /* 저장 불가 환경 */ }
  initMermaid();
  show(current);
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight' && current < DOCS.length - 1) show(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) show(current - 1);
});

try {
  const saved = localStorage.getItem('fems-migration-work-theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
} catch (e) { /* 저장 불가 환경 */ }

initMermaid();
buildNav();
const start = DOCS.findIndex(d => '#' + d.id === location.hash);
show(start >= 0 ? start : 0);
</script>
</body>
</html>
