<style>
  :root{

      --surface-2: #26221d;
      --border: #3a342c;
      --text: #ece6dc;
      --text-dim: #b3a99a;
      --text-faint: #7f7568;
      --accent: #e08a5c;
      --accent-soft: #3a2619;
      --link: #7cb7e0;
      --ok: #6cc08d;

  }
  :root[data-theme="dark"]{
    --bg: #141210;
    --surface: #1c1916;
    --surface-2: #26221d;
    --border: #3a342c;
    --text: #ece6dc;
    --text-dim: #b3a99a;
    --text-faint: #7f7568;
    --accent: #e08a5c;
    --accent-soft: #3a2619;
    --link: #7cb7e0;
    --ok: #6cc08d;
    --code-bg: #24201b;
  }

  *{ box-sizing: border-box; }
  html, body{ margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body{ font-family: var(--font-body); font-size: var(--text-base); line-height: 1.7; -webkit-font-smoothing: antialiased; }

  .layout{ display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); min-height: 100vh; }

  /* ── sidebar ── */

  .brand-kicker{ font-size: 0.72rem; letter-spacing: 0.14em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .brand-title{ font-family: var(--font-display); font-size: 1.3rem; line-height: 1.3; margin: 0.35rem 0 0.4rem; }
  .brand-meta{ font-size: 0.8rem; color: var(--text-faint); }

  .doc-nav ol{ list-style: none; margin: 0; padding: 0; }
  .doc-nav button{
    display: grid; grid-template-columns: 2.1rem 1fr; align-items: baseline; gap: 0.25rem;
    width: 100%; text-align: left; background: none; border: 0; border-radius: 8px;
    padding: 0.55rem 0.6rem; color: var(--text-dim); font: inherit; font-size: 0.9rem; cursor: pointer;

  .doc-nav button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 1px; }

  .doc-nav .num{ font-family: var(--font-mono); font-size: 0.78rem; color: var(--accent); }

  .theme-toggle{
    margin: 1.25rem 0.6rem 0; font: inherit; font-size: 0.8rem; color: var(--text-dim);
    background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 0.3rem 0.8rem; cursor: pointer;

  .theme-toggle:hover{ color: var(--text); }

  /* ── content ── */
  main{ min-width: 0; padding: clamp(1.5rem, 1rem + 3vw, 3.5rem) clamp(1rem, 0.5rem + 3vw, 4rem) 5rem; }
  article{ overflow-wrap: break-word; word-break: keep-all; }
  article pre, article code{ word-break: normal; }
  .doc-head{ max-width: 980px; margin: 0 auto 0.5rem; display: flex; justify-content: space-between; gap: 1rem; flex-wrap: wrap; font-size: 0.8rem; color: var(--text-faint); }
  .doc-head code{ font-family: var(--font-mono); }
  article{ max-width: 980px; margin: 0 auto; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: clamp(1.25rem, 1rem + 2vw, 3rem); box-shadow: 0 1px 0 rgba(0,0,0,0.03), 0 12px 32px -20px rgba(60,40,20,0.25); }

  article h1{ font-family: var(--font-display); font-size: var(--text-h1); line-height: 1.25; margin: 0 0 1.25rem; letter-spacing: -0.01em; }
  article h2{ font-family: var(--font-display); font-size: 1.35rem; margin: 2.6rem 0 0.9rem; padding-top: 1.2rem; border-top: 1px solid var(--border); }
  article h3{ font-size: 1.08rem; margin: 1.9rem 0 0.6rem; }
  article h4{ font-size: 0.98rem; margin: 1.4rem 0 0.5rem; color: var(--text-dim); }
  article p, article li{ color: var(--text); }

  article hr{ border: 0; border-top: 1px dashed var(--border); margin: 2.2rem 0; }
  article hr + h2{ border-top: 0; padding-top: 0; margin-top: 0; }
  article blockquote{ margin: 1.2rem 0; padding: 0.8rem 1.1rem; background: var(--accent-soft); border-left: 3px solid var(--accent); border-radius: 0 8px 8px 0; color: var(--text); }
  article blockquote p{ margin: 0.3rem 0; }
  article code{ font-family: var(--font-mono); font-size: 0.86em; background: var(--code-bg); padding: 0.1em 0.35em; border-radius: 4px; }
  article pre{ background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px; padding: 0.9rem 1rem; overflow-x: auto; }
  article pre code{ background: none; padding: 0; font-size: 0.84rem; }

  .table-wrap{ overflow-x: auto; margin: 1rem 0 1.4rem; border: 1px solid var(--border); border-radius: 8px; }
  article table{ border-collapse: collapse; width: 100%; font-size: 0.88rem; }
  article th, article td{ padding: 0.55rem 0.75rem; border-bottom: 1px solid var(--border); vertical-align: top; text-align: left; }
  article th{ background: var(--surface-2); font-weight: 600; white-space: nowrap; }
  article tr:last-child td{ border-bottom: 0; }
  article tbody tr:hover td{ background: color-mix(in srgb, var(--surface-2) 55%, transparent); }

  .mermaid-box{ margin: 1.2rem 0 1.6rem; padding: 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--bg); overflow-x: auto; text-align: center; }
  .mermaid-box svg{ max-width: 100%; height: auto; }

  .pager{ max-width: 980px; margin: 1.5rem auto 0; display: flex; justify-content: space-between; gap: 1rem; }
  .pager button{ font: inherit; font-size: 0.88rem; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 0.6rem 1rem; color: var(--text-dim); cursor: pointer; max-width: 48%; text-align: left; }
  .pager button:hover{ color: var(--text); border-color: var(--accent); }
  .pager button[hidden]{ visibility: hidden; display: block; }

  .menu-btn{ display: none; }

  @media (max-width: 860px){
    .layout{ grid-template-columns: minmax(0, 1fr); }
    .sidebar{ position: fixed; inset: 0 auto 0 0; width: min(86vw, 320px); transform: translateX(-100%); transition: transform 300ms var(--ease-out-expo); z-index: 20; box-shadow: 0 0 40px rgba(0,0,0,0.25); }
    .sidebar[data-open="true"]{ transform: translateX(0); }
    .menu-btn{ display: inline-flex; position: sticky; top: 0.75rem; margin: 0.75rem 16px 0; z-index: 10; font: inherit; font-size: 0.85rem; background: var(--surface); border: 1px solid var(--border); border-radius: 999px; padding: 0.4rem 0.9rem; color: var(--text); }
    main{ padding: 1rem 16px 4rem; }

  @media (prefers-reduced-motion: reduce){ *{ transition: none !important; } }

const DOCS = [{"id": "00", "file": "00_작업개요_및_진행순서.md", "title": "작업 개요 및 진행 순서", "content": "# 00. 작업 개요 및 진행 순서\n\n| 항목 | 내용 |\n|---|---|\n| 근거 | [작업-03-이관작업기안](../작업-03-이관작업기안/index.html) 권고안(5안) 채택 · `MES 매핑 정보.xlsx`(SF_FEMS → MES 팀 DB(\"품질DB\") 객체 매핑 126건) · [작업-02-현행소스분석](../작업-02-현행소스분석/index.html) |\n| 작성일 | 2026-10-29 |\n| 목표 | **현행 FeMS를 그대로 둔 상태에서** FeMS의 모든 데이터(원시·1분·가상태그·요약·피크·Heat·원단위·태그 상태·기준정보)를 DataForge 데이터 플랫폼으로 옮기고, DataForge에서 정상 계산·조회되게 한다 |\n| 이번 정리 범위 | **P0~P3(데이터 이관 완료까지)는 실행 수준**으로, P4(수집 이관)·P5(현행 제거)는 후속 단계로 개요만 |\n\n## 1. 작업 원칙\n\n| # | 원칙 | 의미 |\n|---|---|---|\n| R1 | **현행 무변경** | 현행 FeMS(Python 3.6 수집·가공, Mongo, MariaDB, Kafka 2.2.1, Java 화면)의 소스·설정·cron·`fems.monitoring`을 고치지 않는다. 현행 쪽 작업은 **읽기 전용 계정 발급과 방화벽 개방**뿐 |\n| R2 | **DataForge 표준 준수** | 수집·적재는 NiFi, 버스는 Kafka, 저장은 PostgreSQL·TimescaleDB(또는 InfluxDB)·BigQuery, 화면은 Grafana·Metabase |\n| R3 | **설정 정보는 MES 팀 DB(신규 명칭)를 기준** | DataForge가 읽는 기준정보·환산 함수는 `MES 매핑 정보.xlsx`의 **TO-BE 이름**(`SFMZ0104`, `SF_SFMZ_ENG_CONVERSION` 등)만 쓴다. 객체명은 NiFi 파라미터·계산 서비스 설정으로 두어 DB 전환 시 코드 수정이 없게 한다 |\n| R4 | **같은 입력, 같은 DB에서 비교** | 현행 결과(`legacy_*`)와 DataForge 결과를 같은 PostgreSQL에 두고 매일 비교한다 |\n| R5 | **자격증명 비노출** | 계정·비밀번호는 NiFi 파라미터 컨텍스트(민감 값)·시크릿 저장소에만. 문서·코드·SQL 본문에 평문 금지(현행 `SQL_INFO.sql_03` 같은 방식 금지) |\n\n## 2. 이번 정리에서 새로 반영한 사실\n\n| # | 사실 | 영향 | 문서 |\n|---|---|---|---|\n| N1 | Oracle `SF_FEMS`의 테이블 62·뷰 6·함수 5·프로시저 9·시퀀스 5·인덱스 39(합계 126건)가 **MES 팀 DB로 새 이름**(예: `TAG_MASTER` → `SFMZ0104`)으로 이관됨 | DataForge의 모든 Oracle 조회 SQL을 TO-BE 이름으로 재작성 | [01](01_MES_DB_객체매핑_및_영향분석.md), [03](03_SQL_신규명칭_재작성_명세.md) |\n| N2 | **현행 FeMS는 여전히 구 `SF_FEMS`(bestmes)에 읽고 쓴다** — `mm_28`(원단위), `mm_146`(태그 상태), Java 관리 화면(태그·장비·목표·ISMART 등) | 신규 DB가 1회성 복사본이면 시간이 갈수록 어긋남 → **동기화 방식 결정이 P0 최우선 과제** | [01](01_MES_DB_객체매핑_및_영향분석.md) 1.4 |\n| N3 | `SP_GET_CONNECT_INFO`·`SP_GET_SAVE_INFO`·`SP_GET_SUM_INTERVAL`은 **Oracle 프로시저**(`common.my_table_select()`가 이름과 달리 cx_Oracle로 호출). MariaDB 프로시저는 `SP_GET_SQL`·`SP_ORACLE_CONN` 둘뿐 | 작업-02·03의 \"MariaDB 프로시저 5종\" 서술 정정 | [01](01_MES_DB_객체매핑_및_영향분석.md) 1.5 |\n| N4 | `DATA_ERP_*`·`DATA_WON_DAN_WEE_DAY*`·`DATA_FIX_SET_DAY` 프로시저는 현행 Python·Java 어디서도 호출하지 않음 → **Oracle DB Job으로 실행 중일 가능성** | 신규 DB에서 Job이 함께 이관·가동 중인지 확인 필요(`UNIT_LEVEL_*`, `TBL_FIX_VALUE_*` 생산자) | [01](01_MES_DB_객체매핑_및_영향분석.md) 1.6 |\n| N5 | 신규 bst_FeMS `05_processor`는 현행과 **계산 방식이 다름**: 1분 사용량을 \"1분 버퍼 안 마지막−처음\"으로 계산(분 경계 증가분 누락), `CORRECT_RATIO` 재곱셈, 가상태그는 제한된 `eval`로 원시값에 적용·의존 순서 없음 | 계산 서비스 재구현 범위가 커짐(작업-03의 \"재사용\" 전제 수정) | [06](06_P2_FeMS계산서비스_개발.md) |\n| N6 | 현행 피크는 부하시간대 **M·H(중간·최대) 구간의 1분값만** 대상 | DataForge 피크 SQL에 반영 | [07](07_P2_집계_피크_Heat_원단위_SQL.md) |\n\n## 3. 전체 진행 순서\n\n```mermaid\nflowchart TB\n    subgraph P0[\"P0 준비 (3주)\"]\n        W001[\"W0-01 접속 경로·전용 계정\"]\n        W002[\"W0-02 ★ SF_FEMS↔MES DB 동기화 방식 결정\"]\n        W003[\"W0-03 신규 객체 검증<br/>(컬럼·행 수·함수 결과)\"]\n        W004[\"W0-04 GMES·DB Job 확인\"]\n        W005[\"W0-05 DataForge 표준·용량\"]\n        W006[\"W0-06 정책 결정 D1~D6\"]\n    end\n    subgraph P1[\"P1 그림자 이관 (4주)\"]\n        W101[\"W1-01 DB 스키마·토픽 생성\"]\n        W103[\"W1-03 F1 원시값 탭\"]\n        W104[\"W1-04 F2 Mongo 산출물 복제\"]\n        W105[\"W1-05 F2 Oracle 산출물 복제\"]\n        W106[\"W1-06 F3 기준정보 동기화\"]\n        W107[\"W1-07 과거 데이터 백필\"]\n        W108[\"W1-08 조기 대시보드\"]\n    end\n    subgraph P2[\"P2 자체 계산 병행 (6주)\"]\n        W201[\"W2-01~06 FeMS 계산 서비스<br/>1분·가상태그·환산\"]\n        W207[\"W2-07~12 연속 집계·피크<br/>Heat(F4)·원단위·태그 상태\"]\n        W213[\"W2-13~14 비교·차이 판정\"]\n    end\n    subgraph P3[\"P3 화면 공식화 (4주)\"]\n        W301[\"W3-01~07 Grafana·Metabase<br/>원본 전환·사용자 승인\"]\n    end\n    P4[\"P4 수집 이관 (후속)\"]\n    P5[\"P5 현행 제거 (후속)\"]\n\n    W001 --> W003\n    W002 --> W003 --> W106\n    W004 --> W207\n    W005 --> W101\n    W006 --> W201\n    W101 --> W103 & W104 & W105 & W106\n    W103 --> W201\n    W104 & W105 --> W108\n    W106 --> W201\n    W107 --> W213\n    W201 --> W207 --> W213 --> W301\n    W301 --> P4 --> P5\n```\n\n## 4. 작업 목록 (WBS)\n\n| ID | 작 n\n| 객체 유형 | 건수 | TO-BE 명명 규칙 | 예 |\n|---|---|---|---|\n| TABLE | 62 | `SFMZ` + 4자리 번호 (백업·테스트 테이블은 `_BK`·`_BAK`·`_TEST`·`_TMP` 유지) | `TAG_MASTER` → `SFMZ0104` |\n| VIEW | 6 | `SFMZ_` + 기존명 | `VCODEDETAIL` → `SFMZ_VCODEDETAIL` |\n| FUNCTION | 5 | `SF_SFMZ_` + 기존명에서 `FN_` 제거 | `FN_ENG_CONVERSION` → `SF_SFMZ_ENG_CONVERSION` |\n| PROCEDURE | 9 | `SP_SFMZ_` + 기존명(`SP_` 제거) | `SP_GET_SAVE_INFO` → `SP_SFMZ_GET_SAVE_INFO` |\n| SEQUENCE | 5 | `SFMZ_` + 기존명 | `TAG_SEQ` → `SFMZ_TAG_SEQ` |\n| INDEX | 39 | 4건만 새 이름, 35건은 TO-BE 이름 공란(자동 생성 추정) | `IDX_TAG_SUM_TIME_29_DAY_TAG` → `IDX_SFMZ0306_TAG` |\n| **합계** | **126** | 전 건 `VALID`, 이관 `Y` (단 `SYSTEM_HISTORY`는 **데이터 미이관**) | |\n\n**테이블 번호 체계(추정)**: `SFMZ000x` 공통 코드·파일, `SFMZ01xx` 장비·태그·공정 기준정보, `SFMZ02xx` 에너지·EFD, `SFMZ03xx` 원단위·요약·ISMART, `SFMZ04xx` 사이트, `SFMZ09xx` 기타·연계·시스템.\n\n## 1.2 DataForge 이관에 직접 쓰이는 핵심 객체\n\n| 용도 | AS-IS | TO-BE | DataForge에서 쓰는 곳 |\n|---|---|---|---|\n| 태그 기준정보 | `TAG_MASTER` | `SFMZ0104` | F3 동기화, 계산 서비스(태그·수식·보정계수) |\n| 장비 기준정보 | `DEVICE_MASTER` | `SFMZ0101` | F3, 계산 서비스(`DEVICE_USE`, `FACTORY_ID`, `ENERGY_KIND_DETAIL`), P4 수집 |\n| 공통 코드(가스 kg 계수 FE113 등) | `CODEDETAIL` / `CODEMASTER` | `SFMZ0002` / `SFMZ0001` | F3, 계산 서비스 |\n| 요약 정의·매핑 | `SUMMARY_INFO`, `TAG_SUMMARY_MAPPING_FROM/TO` | `SFMZ0914`, `SFMZ0919`, `SFMZ0920` | 요약·피크 대상 태그 선정(`sql_20`, `sql_22`) |\n| 저장소 라우팅 | `TAG_STORE_TABLE_INFO`, `TAG_MAPPING_STORE`, `CONNECT_INFO` | `SFMZ0918`, `SFMZ0916`, `SFMZ0902` | F2 복제 대상 컬렉션 판단(참고용). DataForge 저장소 라우팅에는 불필요 |\n| 환산 함수 | `FN_ENG_CONVERSION`, `FN_LOD_CONVERSION`, `FN_PRDT_COST_CONVERSION`, `FN_CONF_COST_CONVERSION` | `SF_SFMZ_ENG_CONVERSION`, `SF_SFMZ_LOD_CONVERSION`, `SF_SFMZ_PRDT_COST_CONVERSION`, `SF_SFMZ_CONF_COST_CONVERSION` | 계산 서비스 환산(`sql_27`, `sql_23` 대응) |\n| 환산 기초 데이터(추정) | `TBL_ENG`, `TBL_ENG_CEF`, `TBL_GAB_RATE` | `SFMZ0201`, `SFMZ0202`, `SFMZ0305` | 환산 함수 이식 시 근거 테이블(W0-03에서 함수 본문으로 확인) |\n| 산출물(현행 → Oracle) | `TAG_SUM_TIME_29_DAY/MONTH`, `TAG_STATUS` | `SFMZ0306`, `SFMZ0307`, `SFMZ0917` | F2-O 복제, 원단위·태그 상태 비교 |\n| 원단위·ERP 연계 | `UNIT_LEVEL_DAY/MONTH/SUM`, `TBL_FIX_VALUE_DD/SUM` | `SFMZ0301`~`0303`, `SFMZ0922`, `SFMZ0923` | Metabase 원단위 리포트 원천(1.6 DB Job 확인 후) |\n| 목표·ISMART·공정 | `PEAK_GOAL`, `USAGE_GOAL`, `TBL_ISMART`, `PROCESS_HIERACHY`, `LOCATION` | `SFMZ0910`, `SFMZ0929`, `SFMZ0304`, `SFMZ0106`, `SFMZ0105` | F3, Metabase 목표 대비·공정별 리포트 |\n\n## 1.3 현행 FeMS의 객체 사용 현황\n\n| 사용 주체 | 사용하는 SF_FEMS 객체 | 비고 |\n|---|---|---|\n| 수집기 `mm_00_collect`(·`_v1`) | `DEVICE_MASTER`, `TAG_MASTER`, `CONNECT_INFO`, `MESSAGE_QUEUE` | 매분 조회 |\n| `mm_collec` | `CONNECT_INFO`, `MESSAGE_QUEUE` | Kafka 접속만 |\n| `mm_Autobase` | `TAG_MASTER`(`REMARK='Autobase'`, `ORDER_SEQ`), `CONNECT_INFO`, `MESSAGE_QUEUE`, `SP_GET_SAVE_INFO` | |\n| `mm_creatVTag` | `TAG_MASTER`, `DEVICE_MASTER` | 하드코딩 접속 |\n| `mm_02`, `mm_07`, `mm_21` | `SP_GET_CONNECT_INFO`(Kafka), `SP_GET_SAVE_INFO`(Mongo) | **Oracle 프로시저** |\n| `mm_226`, `mm_236` | `TAG_MASTER`, `DEVICE_MASTER`, `TAG_SUMMARY_MAPPING_FROM/TO`, `TAG_STORE_TABLE_INFO`, `CONNECT_INFO` + 함수(`sql_27`, `sql_23`) | |\n| `mm_246`, `mm_24month`, `mm_266`, `mm_256`, `mm_27` | `sql_02`·`sql_20`·`sql_21/22`·`sql_04/05/28` 경유 | |\n| `mm_28` | **쓰기** `TAG_SUM_TIME_29_DAY/MONTH` | |\n| `mm_146` | **쓰기** `TAG_STATUS`(UPDATE·MERGE) | |\n| `mm_03_summary`·`summary.py` | `SP_GET_SAVE_INFO`, `SP_GET_SUM_INTERVAL`, `TAG_SUM_TIME_29_DAY/MONTH`, `FN_ENG_CONVERSION` | Ecosense 루프(이관 제외) |\n| Java 화면 | 매퍼 88개 중 다수 — `DEVICE_MASTER`(41), `TAG_MASTER`(36), `PROCESS_HIERACHY`(32), `PEAK_GOAL`(21), `CODEDETAIL`(9), `TBL_CMMN_DATA`(8), `FN_ENG_CONVERSION`(6) 등. **기준정보·목표·ISMART·사용자 테이블에 쓰기** | |\n\n## 1.4 ★ 핵심 문제 — 현행은 여전히 구 `SF_FEMS`에 쓴다\n\n현행 FeMS의 접속처는 소스·설정에 고정되어 있습니다(`connect.conf`, `common.py` → `bestmes@172.31.209.30`의 `SF_FEMS`, `mm_creatVTag.py` 하드코딩). 권고안 원칙(R1 현행 무변경)상 이 접속처는 바꾸지 않습니다. 그러면 아래 쓰기는 **구 `SF_FEMS`에만** 반영됩니다.\n\n| 쓰는 주체 | 대상(구 → 신) | 빈도 |\n|---|---|---|\n| `mm_28_basic_unit` | `TAG_SUM_TIME_29_DAY/MONTH` → `SFMZ0306/0307` | 매일 10:30 |\n| `mm_146_correction_tag` | `TAG_STATUS` → `SFMZ0917` | 15분 |\n| Java 관리 화면 | `TAG_MASTER`, `DEVICE_MASTER`, `PEAK_GOAL`, `USAGE_GOAL`, `TBL_ISMART`, `PROCESS_HIERACHY`, `TBL_SYS_*`, `ATTECH_FILE` 등 | 수시 |\n| Oracle DB Job(추정, 1.6) | `UNIT_LEVEL_*`, `TBL_FIX_VALUE_*` | 일·월 |\n\n**신규 DB가 1회성 복사본이면, 위 데이터는 복사 시점 이후 신규 DB에 반영되지 않습니다.** DataForge가 신규 DB만 보면 기준정보·원단위·태그 상태가 점점 낡습니다.\n\n### W0-02 동기화 방식 선택지\n\n| 안 | 내용 | 현행 영향 | 장단점 |\n|---|---|---|---|\n| **S1 (권장)** MES 팀이 구 → 신 증분 동기화 | DB 링크 + 주기 `MERGE`(또는 MES 팀 표준 복제 도구)로 `SF_FEMS.*` → `SFMZ*` | 없음 | DataForge는 신규 이름만 사용(R3 충족). MES 팀 작업 필요 |\n| S2 DataForge가 이관 기간 동안 구 `SF_FEMS` 직접 읽기 | NiFi 파라미터로 원천만 구 DB로 지정, SQL은 AS-IS 이름 | 없음 | 즉시 가능. VNTG MES 전환 시 다시 바꿔야 함 |\n| S3 신규 DB에 구 이름 동의어(synonym)/뷰 | 신규 DB에 `TAG_MASTER` → `SFMZ0104` 동의어 생성 | 없음 | 현행을 신규 DB로 돌릴 때만 의미. 이번 범위와 무관 |\n| S4 현행 접속처를 신규 DB로 전환 | `connect.conf`·`mm_creatVTag` 등 수정 + 신규 DB에 구 이름 동의어 | **현행 수정** | R1 위배. 비권장 |\n\n**권장: S1.** 단, S1이 준비되기 전에는 **S2로 P1을 시작**하고 NiFi 파라미터 `fems.master.source`만 바꿔 S1로 넘어가도록 설계합니다([05](05_P1_NiFi_그림자이관_구성.md) 5.2). 두 원천의 SQL 차이는 객체명뿐이므로 [03](03_SQL_신규명칭_재작성_명세.md)의 AS-IS/TO-BE 두 벌을 파라미터로 관리합니다.\n\n## 1.5 정정 사항 — Oracle 프로시저와 MariaDB 프로시저\n\n`common.py`의 `my_table_select()`는 이름과 달리 **cx_Oracle**로 접속합니다. 따라서 아래 3종은 **Oracle `SF_FEMS` 프로시저**이며 이번 매핑에 포함되어 있습니다.\n\n| 프로시저 | TO-BE | 반환 | 호출 |\n|---|---|---|---|\n| `SP_GET_CONNECT_INFO` | `SP_SFMZ_GET_CONNECT_INFO` | Kafka ip·port·topic·user·pw | `mm_02`, `mm_07`, `mm_21` |\n| `SP_GET_SAVE_INFO` | `SP_SFMZ_GET_SAVE_INFO` | Mongo ip·port (`MongoCon001/002`) | `mm_02`, `mm_Autobase`, `mm_03_summary` |\n| `SP_GET_SUM_INTERVAL` | `SP_SFMZ_GET_SUM_INTERVAL` | 요약 주기·테이블 | `mm_03_summary` |\n\nMariaDB 프로시저는 `common.my_select()`(pymysql)로 호출하는 **`SP_GET_SQL`, `SP_ORACLE_CONN` 2종뿐**입니다. 작업-02 02번 2.2절, 작업-03 02·05·07번의 \"MariaDB 프로시저 5종\" 서술은 이 기준으로 읽어 주세요. DataForge는 세 Oracle 프로시저 모두 **사용하지 않습니다**(접속 정보는 NiFi 파라미터로 관리).\n\n## 1.6 확인이 필요한 객체\n\n| 객체 | 왜 확인해야 하나 | 확인 방법(W0-04) |\n|---|---| 계 |\n|---|---|---|---|---|---|---|---|---|\n| D01 | 원시 계측값 | Kafka `collect` (메시지 1개 = 태그 값 1건) | 수집기 5종 | **F1** NiFi 탭 → `fems.raw` | `fems_raw.raw_collect` | ✓ | Mongo `collect_YYYYMM` | P1 |\n| D02 | 원시 계측값(과거) | Mongo `collect_YYYYMM` | `mm_02` | 백필 흐름 | `fems_raw.raw_collect` | - | ✓ | P1 |\n| D03 | 1분 사용량(현행 계산) | Mongo `collect_m1` (`vtag='N'`) | `mm_226` | **F2-M** 증분 복제 | `fems_legacy.usage_1m` | ✓(1분) | ✓ | P1 |\n| D04 | 1분 가상태그(현행 계산) | Mongo `collect_m1` (`vtag='Y'`) | `mm_236` | F2-M | `fems_legacy.usage_1m` | ✓ | ✓ | P1 |\n| D05 | 15분 요약 | `TAG_SUM_TIME_29_15M_YYYYMM` | `mm_246 minute` | F2-M UPSERT | `fems_legacy.summary`(`15m`) | ✓(15분) | ✓ | P1 |\n| D06 | 1시간 요약 | `TAG_SUM_TIME_29_1H_YYYYMM` | `mm_246 hour` | F2-M UPSERT(진행 구간 재조회) | `fems_legacy.summary`(`1h`) | ✓ | ✓ | P1 |\n| D07 | 일 요약(06시·전기 00시) | `TAG_SUM_TIME_29_DAY` | `mm_246 day/day_elc` | F2-M UPSERT | `fems_legacy.summary`(`1d`,`1d_elc`) | ✓ | ✓ | P1 |\n| D08 | 월 요약 | `TAG_SUM_TIME_29_MONTH` | `mm_24month month/month_elc` | F2-M UPSERT | `fems_legacy.summary`(`1mon`,`1mon_elc`) | ✓ | ✓ | P1 |\n| D09 | 피크(15분·시·일·월·연) | `PEAK_SUM_TIME_29_15M_YYYYMM` | `mm_266` | F2-M UPSERT | `fems_legacy.peak` | ✓ | ✓ | P1 |\n| D10 | Heat 에너지 | `HEAT_ENERGY_15M_YYYYMM` | `mm_256`, `mm_27` | F2-M UPSERT(`heat_no`) | `fems_legacy.heat` | ✓(07·10시) | ✓ | P1 |\n| D11 | 원단위 일·월(Oracle) | `TAG_SUM_TIME_29_DAY/MONTH` → `SFMZ0306/0307` | `mm_28` | **F2-O** | `fems_legacy.basic_unit_day/month` | ✓(일) | ✓ | P1 |\n| D12 | 태그 수집 상태 | `TAG_STATUS` → `SFMZ0917` | `mm_146` | F2-O | `fems_legacy.tag_status` | ✓(15분) | 최신만 | P1 |\n| D13 | 원단위·ERP 연계 | `UNIT_LEVEL_DAY/MONTH/SUM`, `TBL_FIX_VALUE_DD/SUM` → `SFMZ0301~0303`, `SFMZ0922/0923` | Oracle DB Job(추정) | F2-O | `fems_legacy.unit_level_*`, `fix_value_*` | ✓(일) | ✓ | P1 (W0-04 확인 후) |\n| D14 | 1분 사용량(DataForge 계산) | `fems.raw` | - | 계산 서비스 → `fems.usage.1m` | `fems_calc.usage_1m` | ✓ | 원시 재처리 | P2 |\n| D15 | 1분 가상태그(DataForge 계산) | `fems.usage.1m` | - | 계산 서비스 → `fems.vtag.1m` | `fems_calc.usage_1m`(`is_virtual`) | ✓ | 재처리 | P2 |\n| D16 | 15분·시간·일·월 요약 | `fems_calc.usage_1m` | - | TimescaleDB 연속 집계 | `fems_calc.summary_*` | ✓ | 자동 | P2 |\n| D17 | 피크 | `fems_calc.usage_1m` | - | SQL 작업 | `fems_calc.peak` | ✓ | 재계산 | P2 |\n| D18 | MES Heat 조업 정보 | `GMES.SPRB3010` 등(`sql_04/05/28`) | - | **F4** NiFi | `fems_mes.heat_work` | ✓(일 2회) | ✓ | P2 |\n| D19 | Heat 에너지 | D14 + D18 | - | SQL 작업 | `fems_calc.heat_energy` | ✓ | 재계산 | P2 |\n| D20 | 원단위 | D16 + 생산량 | - | SQL 작업 | `fems_calc.basic_unit_*` | ✓ | 재계산 | P2 |\n| D21 | 태그 수집 상태 | `fems_raw.raw_collect` 최종 수신 시각 | - | SQL 뷰 + Grafana 알림 | `fems_calc.tag_status`(뷰) | ✓ | - | P2 |\n| D22 | Level-2 가열로 값 | `GMES.SPRC3059`, `SPRF3640`(`sql_25`) | `mm_206` → Kafka | 초기 D01에 포함(F1) / 이후 F4 | `fems_raw.raw_collect` | ✓ | D02에 포함 | P1 / P2 |\n| D23 | Autobase 값 | Mongo `Autobase` → `mm_Autobase` → Kafka | `mm_Autobase` | D01에 포함(F1) | `fems_raw.raw_collect` | ✓ | D02에 포함 | P1 |\n\n## 2.2 기준정보·관리 데이터 (F3, MES 팀 DB `SFMZ*` 기준)\n\n| # | 데이터셋 | AS-IS | TO-BE | 대상 | 주기 | 용도 |\n|---|---|---|---|---|---|---|\n| M01 | 태그 | `TAG_MASTER` | `SFMZ0104` | `fems_master.tag` | 10분 + 수동 | 계산·화면 전체 |\n| M02 | 장비 | `DEVICE_MASTER` | `SFMZ0101` | `fems_master.device` | 10분 + 수동 | 계산·화면·P4 |\n| M03 | 장비 모델·항목 | `DEVICE_MODEL`, `DEVICE_MODEL_ITEM` | `SFMZ0102`, `SFMZ0103` | `fems_master.device_model*` | 일 | P4 수집 설정 참고 |\n| M04 | 공통 코드 | `CODEMASTER`, `CODEDETAIL`, `TBL_CMMN_MST`, `TBL_CMMN_DATA` | `SFMZ0001`, `SFMZ0002`, `SFMZ0003`, `SFMZ0004` | `fems_master.code_*` | 일 | 코드명, 가스 kg 계수(FE113) |\n| M05 | 요약 정의·매핑 | `SUMMARY_INFO`, `TAG_SUMMARY_MAPPING_FROM/TO`, `TAG_SUM_STORE_TABLE` | `SFMZ0914`, `SFMZ0919`, `SFMZ0920`, `SFMZ0921` | `fems_master.summary_*` | 일 | 요약·피크 대상 |\n| M06 | 저장소 라우팅 | `TAG_STORE_TABLE_INFO`, `TAG_MAPPING_STORE`, `CONNECT_INFO`, `MESSAGE_QUEUE` | `SFMZ0918`, `SFMZ0916`, `SFMZ0902`, `SFMZ0906` | `fems_master.legacy_route_*` | 일 | F2 복제 대상 확인(참고) |\n| M07 | 공정·위치·설비 | `PROCESS_HIERACHY`, `LOCATION`, `FACILITY_MASTER_INFO`, `FACILITY_INFORMATION`, `PROCESS_DEPT_MAPPING` | `SFMZ0106`, `SFMZ0105`, `SFMZ0107`, `SFMZ0108`, `SFMZ0911` | `fems_master.process_*` | 일 | 공정별 리포트 |\n| M08 | 에너지·환산 | `TBL_ENG`, `TBL_ENG_CEF`, `TBL_GAB_RATE` | `SFMZ0201`, `SFMZ0202`, `SFMZ0305` | `fems_master.energy_*` | 일 | 환산·단가(함수 이식 근거) |\n| M09 | EFD | `ENERGY_FLOW_DIAGRAM` | `SFMZ0203` | `fems_master.efd` | 일 | 흐름도 화면 |\n| M10 | 목표 | `PEAK_GOAL`, `USAGE_GOAL` | `SFMZ0910`, `SFMZ0929` | `fems_master.goal_*` | 일 | 목표 대비 리포트 |\n| M11 | ISMART | `TBL_ISMART` | `SFMZ0304` | `fems_master.ismart` | 일 | ISMART 리포트 |\n| M12 | 사이트 | `T_SITE_INFO`, `T_SITE_YEAR_RECORD` | `SFMZ0401`, `SFMZ0402` | `fems_master.site_*` | 일 | |\n| M13 | 기타 연계 | `FACTORY_ELEC_MON`, `PRODUCT_TIME_WAIT_MAPP`, `ETC`, `DEVICE_CALB_LIST` | `SFMZ0905`, `SFMZ0912`, `SFMZ0904`, `SFMZ0903` | `fems_master.etc_*` | 일 | 사용처 확인 후 |\n\n**이관하지 않는 것**: 사용자·권한·메뉴(`TBL_SYS_*` → `SFMZ0924~0927`, `AUTH_DEPT_MAPPING`; Grafana·Metabase가 자체 권한 사용), 시스템 이력(`SYSTEM_HISTORY`), 첨부파일(`ATTECH_FILE`, 별도 요청 시), 백업·테스트 테이블(`*_BK`, `*_BAK*`, `*_TEST`, `*_TMP`, `NEW_*`, `ZZZ_VTAG_LIST`, `MES_RP_TEMP`, `T_DATA`).\n\n## 2.3 이관 제외 데이터\n\n| 데이터 | 이유 |\n|---|---|\n| Mongo 1세대 DB(`FEMS_5MIN_DATA`, `FEMS_5M_DATA`, `BigDataCollector`, `SEAH_5MIN_DATA`) | 2020-04 이후 미사용(작업-02 02 2.4) |\n| Ecosense 루프 결과(`TAG_SUM_TIME_29_15M_202001`·`_1H_202001` 고정 기록분) | 결함(CRIT-10). D05·D06은 월 컬렉션의 정상분만 복제 |\n| `mm_30_val_summary` 결과 | 저장되지 않음 |\n| Mongo `Autobase` 원본 컬렉션 | D23으로 태그 값이 이미 들어옴 |\n| MariaDB `SQL_INFO`·`monitoring`·`err_log` | 데이터가 아니라 설정·운영 정보 → SQL은 [03](03_SQL_신규명칭_재작성_명세.md)으로 코드화, 감시는 NiFi·컨테이너로 대체 |\n| Redis 캐시 | 휘발성 |\n\n## 2.4 데이터 흐름 한 장 요약\n\n```mermaid\nflowchart LR\n    subgraph LEG[\"현행 (무변경)\"]\n        K{{\"Kafka collect\"}}\n        MG[(\"Mongo SEAH_FEMS\")]\n        OLD[(\"구 Oracle SF_FEMS\")]\n    end\n    NEW[(\"MES 팀 DB<br/>SFMZ* (신규 명칭)\")]\n    GM[(\"GMES (MES 원천)\")]\n    OLD -. \"W0-02 동기화(S1)\" .-> NEW\n    K -->|F1| RAW[(\"fems_raw\")]\n    MG -->|F2-M| LG[(\"fems_legacy\")]\n    NEW -->|F2-O| LG\n    NEW -->|F3| MS[(\"fems_master\")]\n    GM -->|F4| MES[(\"fems_mes\")]\n    RAW --> CALC[\"계산 서비스\"] --> CL[(\"fems_calc\")]\n    MS --> CALC\n    MES --> CL\n    LG & CL --> CMP[\"비교 뷰 (P2)\"]\n    CL & MS --> UI[\"Grafana · Metabase\"]\n    LG -. \"P1 조기 화면\" .-> UI\n```\n"}, {"id": "03", "file": "03_SQL_신규명칭_재작성_명세.md", "title": "SQL 신규 명칭 재작성 명세", "content": "# 03. SQL 신규 명칭 재작성 명세\n\n> 대상: ① MariaDB `SQL_INFO`의 운영 키 16개(현행이 `SP_GET_SQL`로 꺼내 Oracle에서 실행) ② 현행 Python 소스에 직접 들어 있는 Oracle SQL.\n> 방법: `MES 매핑 정보.xlsx`의 AS-IS → TO-BE 이름으로 객체명만 치환(대소문자 무관, 단어 단위). 3.1의 SQL은 스크립트로 자동 생성했고, 3.2는 수작업으로 정리했습니다.\n> 용도: **DataForge가 MES 팀 DB를 조회할 때 쓰는 SQL**(NiFi `ExecuteSQLRecord`·`QueryDatabaseTableRecord`, 계산 서비스). 현행 소스는 바꾸지 않습니다.\n\n## 3.0 적용 규칙\n\n| 규칙 | 내용 |\n|---|---|\n| 스키마 접두어 | TO-BE 소유 스키마가 미확정이므로 SQL에는 넣지 않았습니다. 접속 계정 기본 스키마가 다르면 `#{fems.master.schema}.SFMZ0104`처럼 NiFi 파라미터로 붙입니다 |\n| 컬럼명 | **변경 없음을 전제**합니다. W0-03에서 컬럼 차이가 발견되면 이 문서를 고칩니다 |\n| `GMES.*` | 매핑표 대상이 아니므로 그대로 두었습니다. MES 팀 DB에서의 위치가 확정되면 `#{fems.mes.schema}`로 바꿉니다 |\n| 원천 전환(S2 → S1) | 같은 SQL을 AS-IS 이름으로도 보관합니다(작업-02 02 2.2). NiFi 파라미터 `fems.master.source`(값: `legacy` 또는 `mes`)에 따라 SQL 세트를 고릅니다 |\n| 문자열 포맷 인자 | 현행 SQL의 `{0}`, `{1}`(Python `format`)은 NiFi에서는 `${from_date}`·`?` 바인드로 바꿉니다. SQL 인젝션 위험이 있는 문자열 결합은 금지 |\n| `sql_03` | Oracle 접속정보(비밀번호 포함)를 SQL로 반환하는 행 — **이관 대상 아님**. DataForge는 시크릿 저장소 사용 |\n\n## 3.1 `SQL_INFO` 운영 키 → TO-BE SQL (자동 생성)\n\n| 키 | DataForge에서의 쓰임 |\n|---|---|\n| `sql_02` | 사용 안 함(현행 Mongo 대표 저장소 좌표). F2 복제 대상 컬렉션 확인용으로만 참고 |\n| `sql_04`, `sql_05`, `sql_28` | **F4 MES Heat 흐름**의 원천 SQL |\n| `sql_07`, `sql_08` | 사용 안 함(현행 `mm_02` 라우팅) |\n| `sql_18` | 태그 상태 계산의 대상 태그 목록 |\n| `sql_20`, `sql_20_elc` | **요약 대상 태그 + 가스 kg 계수** — 계산 서비스·연속 집계 대상 선정 |\n| `sql_21`, `sql_22` | **피크 대상 태그**(`SUMMARY_ID='20'`) |\n| `sql_23`, `sql_27` | **환산 함수 호출**(TO-BE 함수명) — 계산 서비스 |\n| `sql_25` | Level-2 가열로 값(F4로 전환 시) |\n| `sql_26`, `sql_29` | 태그 → 장비·공장·에너지 종류 |\n\n### `sql_02` — mongodb : 접속정보\n\n- 현행 사용 모듈: mm_246·mm_24month·mm_256·mm_27·mm_28\n- 치환 객체: `CONNECT_INFO` → `SFMZ0902`, `TAG_MAPPING_STORE` → `SFMZ0916`, `TAG_STORE_TABLE_INFO` → `SFMZ0918`\n\n```sql\nSELECT d.IP_ADDRESS, d.PORT, c.STORAGE_DB, c.STORAGE_TABLE, c.STORE_TABLE_CREATE_CYCLE\n  FROM SFMZ0916 b\n    INNER JOIN SFMZ0918 c\n        ON 1=1\n        AND b.TAG_STORE_TABLE_ID = c.TAG_STORE_TABLE_ID\n    INNER JOIN SFMZ0902 d\n        ON 1=1\n        AND c.CONNECT_ID = d.CONNECT_ID\n  WHERE b.TAG_ID IN ('E00108_Total Active Energy', 'E00091_Total Active Energy', 'E00095_Total Active Energy', 'E00097_Total Active Energy' )\n  GROUP BY c.STORAGE_DB, c.STORAGE_TABLE, d.IP_ADDRESS, d.PORT, c.STORE_TABLE_CREATE_CYCLE\n```\n\n### `sql_04` — ORACLE : 제강 : heat 정보\n\n- 현행 사용 모듈: mm_256_heat\n- 치환 객체: 없음\n- MES 원천(매핑표 외, 스키마 확인 필요): `GMES.FPRB2110`, `GMES.FPRB3010`, `GMES.FPRB3022`, `GMES.SPRB3010`, `GMES.SPRB3080`\n\n```sql\nSELECT heat_no, \n       '', \n       '', \n       '4',\n       'E00108_Total Active Energy', \n       STD_DATE as EAF_WRK_DATE,\n       '' AS EAF_SHFT_TY,\n       '' AS EAF_WRK_SHFT,\n       '' AS EAF_END_TY,\n       START_TIME AS INPT_STRT_TIME,\n       END_TIME AS EAF_CG_END_TIME,\n       11 AS EAF_WRK_TOT_TIMES, \n       PROD_WGT AS PROD_WGT\n  FROM (\n        SELECT \n             A.HEAT_NO\n              , MAX(A.STD_DATE) AS STD_DATE \n              --, MAX(A.STD_DATE) + 1 AS SEND_DATE \n              , ( select INPT_STRT_TIME1 from GMES.FPRB3010 WHERE HEAT_NO = A.heat_no) AS START_TIME\n              , MAX(A.CG_END_TIME) AS END_TIME\n              , SUM(A.CG_WGT) AS CG_WGT --출강실적\n              , SUM(NVL(CASE WHEN B.SPRB_HEAT_NO IS NULL \n                              THEN (SELECT SUM(PROD_WGT)\n                                      FROM GMES.FPRB3022\n                                     WHERE HEAT_NO = A.HEAT_NO)\n                          ELSE (SELECT SUM(PRODC_WGT) \n                                  FROM GMES.SPRB3080 \n                                 WHERE HEAT_NO = B.SPRB_HEAT_NO)\n                            END, 0))   AS  PROD_WGT --생산량\n        \n          FROM   GMES.FPRB3010 A\n          JOIN   GMES.FPRB2110 B ON A.HEAT_NO = B.HEAT_NO\n         WHERE  A.STD_DATE BETWEEN TO_DATE('{0}', 'YYYY-MM-DD')  AND TO_DATE('{1}', 'YYYY-MM-DD')\n        GROUP BY A.STD_DATE, A.HEAT_NO\n\n\n  )\n\n  UNION ALL\n\nSELECT HEAT_NO,\n       IRN_CODE,\n       IRN_NAME,\n       HOGI,\n       DECODE( SUBSTR( EAF_RTN_CD,0,2 ), 'E4', 'E00108_Total Active Energy',\n                                         'E1', 'E00091_Total Active Energy',\n                                         'E2', 'E00095_Total Active Energy',\n                                         'E3', 'E00097_Total Active Energy' ) AS ACT_ENERGY,\n       EAF_WRK_DATE,\n       EAF_SHFT_TY,\n       EAF_WRK_SHFT,\n       EAF_END_TY,\n       EAF_READY_STRT_TIME,\n       EAF_CG_END_TIME,\n       EAF_WRK_TOT_TIMES,\n       (SELECT SUM(PRODC_WGT) FROM GMES.SPRB3080 WHERE HEAT_NO = a.HEAT_NO) AS PRODC_WGT\n   FROM GMES.SPRB3010 a\n   WHERE EAF_WRK_DATE  BETWEEN TO_DATE('{0}', 'YYYY-MM-DD') AND TO_DATE('{1}', 'YYYY-MM-DD')\n         AND SUBSTR( EAF_RTN_CD,0,2 ) IN ('E1', 'E2', 'E3', 'E4' )\n```\n\n### `sql_05` — ORACLE : heat : tag list\n\n- 현행 사용 모듈: mm_256·mm_27\n- 치환 객체: 없음\n- MES 원천(매핑표 외, 스키마 확인 필요): `GMES.SPRB3010`\n\n```sql\nSELECT DECODE( SUBSTR( EAF_RTN_CD,0,2 ), 'E4', 'E00108_Total Active Energy',\n                                         'E1', 'E00091_Total Active Energy',\n                                         'E2', 'E00095_Total Active Energy',\n                                         'E3', 'E00097_Total Active Energy' ) AS ACT_ENERGY\n  from GMES.SPRB3010\n  WHERE SUBSTR( EAF_RTN_CD,0,2 ) IN ('E1', 'E2', 'E3', 'E4' )\n  GROUP BY SUBSTR( EAF_RTN_CD,0,2 )\n```\n\n### `sql_07` — mongodb : 접속정보\n\n- 현행 사용 모듈: mm_02\n- 치환 객체: `CONNECT_INFO` → `SFMZ0902`, `TAG_MAPPING_STORE` → `SFMZ0916`, `TAG_STORE_TABLE_INFO` → `SFMZ0918`\n\n```sql\nSELECT b.TAG_STORE_TABLE_ID, c.STORAGE_DB, c.STORAGE_TABLE, d.IP_ADDRESS, d.PORT, c.STORE_TABLE_CREATE_CYCLE\n  FROM SFMZ0916 b\n    INNER JOIN SFMZ0918 c\n        ON 1=1\n        AND b.TAG_STORE_TABLE_ID = c.TAG_STORE_TABLE_ID\n        AND c.TAG_STORE_TABLE_ID NOT IN ( '1', '5', '2' )\n    INNER JOIN SFMZ0902 d\n        ON 1=1\n        AND c.CONNECT_ID = d.CONNECT_ID\n  GROUP BY b.TAG_STORE_TABLE_ID, c.STORAGE_DB, c.STORAGE_TABLE, d.IP_ADDRESS, d.PORT, c.STORE_TABLE_CREATE_CYCLE\n```\n\n### `sql_08` — mongodb : tag : 연결\n\n- 현행 사용 모듈: mm_02\n- 치환 객체: `DEVICE_MASTER` → `SFMZ0101`, `TAG_MAPPING_STORE` → `SFMZ0916`, `TAG_MASTER` → `SFMZ0104`, `TAG_STORE_TABLE_INFO` → `SFMZ0918`\n\n```sql\nSELECT tm.TAG_ID, tsti.TAG_STORE_TABLE_ID\n  FROM SFMZ0104 tm\n\n  INNER JOIN SFMZ0101 dm\n  ON dm.DEVICE_ID = tm.DEVICE_ID\n  AND dm.USE_YN IN ( 'Y', 'M' )\n\n  INNER JOIN SFMZ0916 tms\n  ON tm.TAG_ID = tms.TAG_ID \n\n  INNER JOIN SFMZ0918 tsti\n  ON tsti.TAG_STORE_TABLE_ID = tms.TAG_STORE_TABLE_ID\n  AND tsti.TAG_STORE_TABLE_ID NOT IN ( '1', '5', '2' )\n```\n\n### `sql_18` — Redis : Oracle 동기화\n\n- 현행 사용 모듈: mm_146\n- 치환 객체: `DEVICE_MASTER` → `SFMZ0101`, `TAG_MASTER` → `SFMZ0104`\n\n```sql\nSELECT tm.TAG_ID\n  FROM SFMZ0104 tm\n\n  INNER JOIN SFMZ0101 dm\n  ON dm.DEVICE_ID = tm.DEVICE_ID\n  AND dm.USE_YN IN ( 'Y', 'M' )\n\nWHERE tm.COLL_YN = 'Y'\n```\n\n### `sql_20` — Oracle : 요약정보(15분) : tag_list\n\n- 현행 사용 모듈: mm_226·mm_246·mm_24month\n- 치환 객체: `CODEDETAIL` → `SFMZ0002`, `CONNECT_INFO` → `SFMZ0902`, `DEVICE_MASTER` → `SFMZ0101`, `SUMMARY_INFO` → `SFMZ0914`, `TAG_MASTER` → `SFMZ0104`, `TAG_STORE_TABLE_INFO` → `SFMZ0918`, `TAG_SUMMARY_MAPPING_FROM` → `SFMZ0919`, `TAG_SUMMARY_MAPPING_TO` → `SFMZ0920`\n\n```sql\nSELECT tm.TAG_ID, \n       tsti1.STORAGE_TABLE, \n       tsti2.STORAGE_TABLE,\n       ci1.IP_ADDRESS||ci1.PORT||tsti1.STORAGE_DB||tsti1.STORAGE_TABLE||tsti1.STORE_TABLE_CREATE_CYCLE,\n       ci2.IP_ADDRESS||ci2.PORT||tsti2.STORAGE_DB||tsti2.STORAGE_TABLE||tsti2.STORE_TABLE_CREATE_CYCLE,\n        c.mgt_char1 \nFROM SFMZ0104 tm\n\nINNER JOIN SFMZ0919 tsm\n  ON 1=1 \n  AND tm.TAG_ID = tsm.TAG_ID\n\nINNER JOIN SFMZ0920 tsmt\n  ON 1=1\n  AND tsm.TAG_SUMMARY_ID = tsmt.FROM_SUMMARY_ID\n  \nINNER JOIN SFMZ0914 si\n  ON 1=1\n  AND tsm.SUMMARY_ID = si.SUMMARY_ID\n\nINNER JOIN SFMZ0918 tsti1\n  ON 1=1\n  AND tsm.FROM_STORE_TABLE_ID = tsti1.TAG_STORE_TABLE_ID\n \nINNER JOIN SFMZ0918 tsti2\n  ON 1=1\n  AND tsmt.TO_SUMMARY_ID = tsti2.TAG_STORE_TABLE_ID\n\nINNER JOIN SFMZ0902 ci1\n  ON 1=1\n  AND ci1.CONNECT_ID = tsti1.CONNECT_ID\n  \nINNER JOIN SFMZ0902 ci2\n  ON 1=1\n  AND ci2.CONNECT_ID = tsti2.CONNECT_ID\n\nINNER JOIN SFMZ0101 dm\n  ON 1=1 \n  AND tm.DEVICE_ID = dm.DEVICE_ID\n\nLEFT OUTER JOIN SFMZ0002 c\n  ON 1=1 \n  AND dm.ENERGY_KIND_DETAIL = c.CODE\n  AND c.CODE_TYPE = 'FE113'\n\nWHERE si.DATA_RANGE = '15mi' AND si.EXECUTE_COMMAND = '사용량'\n```\n\n### `sql_22` — Oracle : 피크정보(15분) : tag_list\n\n- 현행 사용 모듈: mm_266\n- 치환 객체: `CONNECT_INFO` → `SFMZ0902`, `SUMMARY_INFO` → `SFMZ0914`, `TAG_MASTER` → `SFMZ0104`, `TAG_STORE_TABLE_INFO` → `SFMZ0918`, `TAG_SUMMARY_MAPPING_FROM` → `SFMZ0919`, `TAG_SUMMARY_MAPPING_TO` → `SFMZ0920`\n\n```sql\nSELECT        \n       tm.TAG_ID, \n       tsti1.STORAGE_TABLE, \n       tsti2.STORAGE_TABLE,\n       ci1.IP_ADDRESS||ci1.PORT||tsti1.STORAGE_DB||tsti1.STORAGE_TABLE||tsti1.STORE_TABLE_CREATE_CYCLE,\n       ci2.IP_ADDRESS||ci2.PORT||tsti2.STORAGE_DB||tsti2.STORAGE_TABLE||tsti2.STORE_TABLE_CREATE_CYCLE\n\nFROM SFMZ0104 tm\n\nINNER JOIN SFMZ0919 tsm\n  ON 1=1 \n  AND tm.TAG_ID = tsm.TAG_ID\n\nINNER JOIN SFMZ0920 tsmt\n  ON 1=1\n  AND tsm.TAG_SUMMARY_ID = tsmt.FROM_SUMMARY_ID\n  \nINNER JOIN SFMZ0914 si\n  ON 1=1\n  AND tsm.SUMMARY_ID = si.SUMMARY_ID\n\nINNER JOIN SFMZ0918 tsti1\n  ON 1=1\n  AND tsm.FROM_STORE_TABLE_ID = tsti1.TAG_STORE_TABLE_ID\n \nINNER JOIN SFMZ0918 tsti2\n  ON 1=1\n  AND tsmt.TO_SUMMARY_ID = tsti2.TAG_STORE_TABLE_ID\n\nINNER JOIN SFMZ0902 ci1\n  ON 1=1\n  AND ci1.CONNECT_ID = tsti1.CONNECT_ID\n\n  \nINNER JOIN SFMZ0902 ci2\n  ON 1=1\n  AND ci2.CONNECT_ID = tsti2.CONNECT_ID\n\nWHERE si.SUMMARY_ID = '20'\n```\n\n### `sql_21` — Oracle : 피크정보(15분) : 접속정보\n\n- 현행 사용 모듈: mm_266\n- 치환 객체: `CONNECT_INFO` → `SFMZ0902`, `SUMMARY_INFO` → `SFMZ0914`, `TAG_MASTER` → `SFMZ0104`, `TAG_STORE_TABLE_INFO` → `SFMZ0918`, `TAG_SUMMARY_MAPPING_FROM` → `SFMZ0919`, `TAG_SUMMARY_MAPPING_TO` → `SFMZ0920`\n\n```sql\nSELECT        \n       ci1.IP_ADDRESS, \n       ci1.PORT,  \n       tsti1.STORAGE_DB,\n       tsti1.STORAGE_TABLE, \n       tsti1.STORE_TABLE_CREATE_CYCLE,\n\n       ci2.IP_ADDRESS, \n       ci2.PORT,  \n       tsti2.STORAGE_DB,\n       tsti2.STORAGE_TABLE, \n       tsti2.STORE_TABLE_CREATE_CYCLE\n\nFROM SFMZ0104 tm\n\nINNER JOIN SFMZ0919 tsm\n  ON 1=1 \n  AND tm.TAG_ID = tsm.TAG_ID\n\nINNER JOIN SFMZ0920 tsmt\n  ON 1=1\n  AND tsm.TAG_SUMMARY_ID = tsmt.FROM_SUMMARY_ID\n  \nINNER JOIN SFMZ0914 si\n  ON 1=1\n  AND tsm.SUMMARY_ID = si.SUMMARY_ID\n\nINNER JOIN SFMZ0918 tsti1\n  ON 1=1\n  AND tsm.FROM_STORE_TABLE_ID = tsti1.TAG_STORE_TABLE_ID\n \nINNER JOIN SFMZ0918 tsti2\n  ON 1=1\n  AND tsmt.TO_SUMMARY_ID = tsti2.TAG_STORE_TABLE_ID\n\nINNER JOIN SFMZ0902 ci1\n  ON 1=1\n  AND ci1.CONNECT_ID = tsti1.CONNECT_ID\n\n  \nINNER JOIN SFMZ0902 ci2\n  ON 1=1\n  AND ci2.CONNECT_ID = tsti2.CONNECT_ID\n\nWHERE si.SUMMARY_ID = '20'\ngroup by        \n       ci1.IP_ADDRESS, \n       ci1.PORT,  \n       tsti1.STORAGE_DB,\n       tsti1.STORAGE_TABLE, \n       tsti1.STORE_TABLE_CREATE_CYCLE,\n\n       ci2.IP_ADDRESS, \n       ci2.PORT,  \n       tsti2.STORAGE_DB,\n       tsti2.STORAGE_TABLE, \n       tsti2.STORE_TABLE_CREATE_CYCLE\n```\n\n### `sql_23` — 전력량 함수(heat)-cost 빼고\n\n- 현행 사용 모듈: mm_236\n- 치환 객체: `FN_ENG_CONVERSION` → `SF_SFMZ_ENG_CONVERSION`, `FN_LOD_CONVERSION` → `SF_SFMZ_LOD_CONVERSION`\n\n```sql\nselect SF_SFMZ_ENG_CONVERSION('MJ', '{0}', '{1}', {2}) AS \"MJ\",\n         SF_SFMZ_ENG_CONVERSION('TOE', '{0}', '{1}', {2}) AS \"TOE\",\n         SF_SFMZ_ENG_CONVERSION('GHG', '{0}', '{1}', {2}) AS \"TCO2\",\n         SF_SFMZ_LOD_CONVERSION('LOD', '{0}', '{1}') AS LOAD \nFROM DUAL\n```\n\n### `sql_25` — 소형압연\n\n- 현행 사용 모듈: mm_206\n- 치환 객체: `DEVICE_MASTER` → `SFMZ0101`, `TAG_MASTER` → `SFMZ0104`\n- MES 원천(매핑표 외, 스키마 확인 필요): `GMES.SPRC3059`, `GMES.SPRF3640`\n\n```sql\nSELECT tag_id || '||' || val || '||' || TO_CHAR(tag_time, 'YYYY-MM-DD HH24:MI:SS') || '||' || DEVICE_USE || '||' || FACTORY_ID\n  FROM \n  (\n\nSELECT tm.TAG_ID, a.val, a.tag_time, dm.DEVICE_USE, tm.FACTORY_ID\n  FROM SFMZ0104 tm\n  INNER JOIN SFMZ0101 dm\n  ON 1=1\n  AND tm.DEVICE_ID = dm.DEVICE_ID\n  AND tm.TAG_ID = 'C00019_TOT-CORR-USAGE'\n  CROSS JOIN ( \n    SELECT tag_time, val\n    FROM(\n        SELECT '가열로1기' AS tag_ko_name,\n                STD_TIME AS tag_time,\n                CHK_WGT AS val,\n                CHK_WGT - LAG(CHK_WGT, 1, 0) OVER (ORDER BY STD_TIME) AS val_val\n           FROM GMES.SPRC3059\n           WHERE HTF_TY = 'W2'\n           ORDER BY 1 ASC,\n                    2 DESC\n        ) \n     WHERE ROWNUM = 1 \n  ) a\n\nunion all\n\n\nSELECT tm.TAG_ID, a.val, a.tag_time, dm.DEVICE_USE, tm.FACTORY_ID\n  FROM SFMZ0104 tm\n  INNER JOIN SFMZ0101 dm\n  ON 1=1\n  AND tm.DEVICE_ID = dm.DEVICE_ID\n  AND tm.TAG_ID = 'C00020_TOT-CORR-USAGE'\n  CROSS JOIN ( \n    SELECT tag_time, val\n    FROM(\n        SELECT '가열로2기' AS tag_ko_name,\n                STD_TIME AS tag_time,\n                CHK_WGT AS val,\n                CHK_WGT - LAG(CHK_WGT, 1, 0) OVER (ORDER BY STD_TIME) AS val_val\n           FROM GMES.SPRC3059\n           WHERE HTF_TY = 'W3'\n           ORDER BY 1 ASC,\n                    2 DESC\n        ) \n     WHERE ROWNUM = 1 \n  ) a\n\nunion all\n\nSELECT tm.TAG_ID, a.val, a.tag_time, dm.DEVICE_USE, tm.FACTORY_ID\n  FROM SFMZ0104 tm\n  INNER JOIN SFMZ0101 dm\n  ON 1=1\n  AND tm.DEVICE_ID = dm.DEVICE_ID\n  AND tm.TAG_ID = 'C00021_TOT-CORR-USAGE'\n  CROSS JOIN ( \n    SELECT std_time as tag_time, \n           adj_flux AS val\n    FROM(\n            SELECT *\n            FROM GMES.SPRF3640\n            WHERE STD_DATE >= to_date('2020-02-26','YYYY-MM-DD')\n            ORDER BY STD_TIME DESC\n        ) \n     WHERE ROWNUM = 1 \n  ) a\n \nunion all\n\nSELECT 'C00021_AVG-PRESS', a.val, a.tag_time, dm.DEVICE_USE, tm.FACTORY_ID\n  FROM SFMZ0104 tm\n  INNER JOIN SFMZ0101 dm\n  ON 1=1\n  AND tm.DEVICE_ID = dm.DEVICE_ID\n  AND tm.TAG_ID = 'C00021_TOT-CORR-USAGE'\n  CROSS JOIN ( \n    SELECT std_time as tag_time, \n           LNG_PRESS AS val\n    FROM(\n            SELECT *\n            FROM GMES.SPRF3640\n            WHERE STD_DATE >= to_date('2020-02-26','YYYY-MM-DD')\n            ORDER BY STD_TIME DESC\n        ) \n     WHERE ROWNUM = 1 \n  ) a\n\nunion all\n\nSELECT 'C00021_AVG-TEMP', a.val, a.tag_time, dm.DEVICE_USE, tm.FACTORY_ID\n  FROM SFMZ0104 tm\n  INNER JOIN SFMZ0101 dm\n  ON 1=1\n  AND tm.DEVICE_ID = dm.DEVICE_ID\n  AND tm.TAG_ID = 'C00021_TOT-CORR-USAGE'\n  CROSS JOIN ( \n    SELECT std_time as tag_time, \n           LNG_TMPRT AS val\n    FROM(\n            SELECT *\n            FROM GMES.SPRF3640 \n            WHERE STD_DATE >= to_date('2020-02-26','YYYY-MM-DD')\n            ORDER BY STD_TIME DESC\n        ) \n     WHERE ROWNUM = 1 \n  ) a\n  )\n```\n\n### `sql_26` — 디바이스 아이디 가지고 오기\n\n- 현행 사용 모듈: mm_21·mm_256·mm_27\n- 치환 객체: `TAG_MASTER` → `SFMZ0104`\n\n```sql\nselect tag_id, device_id\nfrom SFMZ0104\n```\n\n### `sql_27` — 전력 사용량 함수\n\n- 현행 사용 모듈: mm_226\n- 치환 객체: `FN_CONF_COST_CONVERSION` → `SF_SFMZ_CONF_COST_CONVERSION`, `FN_ENG_CONVERSION` → `SF_SFMZ_ENG_CONVERSION`, `FN_LOD_CONVERSION` → `SF_SFMZ_LOD_CONVERSION`, `FN_PRDT_COST_CONVERSION` → `SF_SFMZ_PRDT_COST_CONVERSION`\n\n```sql\nselect SF_SFMZ_ENG_CONVERSION('MJ', '{0}', '{1}', {2}) AS \"MJ\",\n         SF_SFMZ_ENG_CONVERSION('TOE', '{0}', '{1}', {2}) AS \"TOE\",\n         SF_SFMZ_ENG_CONVERSION('GHG', '{0}', '{1}', {2}) AS \"TCO2\",\n         SF_SFMZ_LOD_CONVERSION('LOD', '{0}', '{1}') AS \"LOAD\",\n         SF_SFMZ_PRDT_COST_CONVERSION('COST', '{0}', '{1}', {2}, '{3}') AS \"COST\" ,\n         SF_SFMZ_CONF_COST_CONVERSION( 'COST', '{0}', '{1}', {2}, '{3}') AS \"tmp_COST\" \n      \nFROM DUAL\n```\n\n### `sql_28` — 2차가공 : heat 정보\n\n- 현행 사용 모듈: mm_27_heat_LNG\n- 치환 객체: 없음\n- MES 원천(매핑표 외, 스키마 확인 필요): `GMES.SF_CODE_NAME`, `GMES.SPRI3010`\n\n```sql\nSELECT \n        HEAT_NO\n       , ''-- IRN_CODE \n       ,IRN_NAME --IRN_NAME\n       ,GMES.SF_CODE_NAME ('SI10', EQUIP_NAME) AS 설비명\n       ,DECODE( EQUIP_NAME, \n                            '700A', 'C00024_TOT-CORR-USAGE',\n                            '706A', 'C00025_TOT-CORR-USAGE',\n                            '706B', 'C00026_TOT-CORR-USAGE',\n                            '706C', 'C00027_TOT-CORR-USAGE',\n                            '723A', 'C00045_TOT-CORR-USAGE',\n                            '725A', 'C00030_TOT-CORR-USAGE',\n                            '702A', 'C00032_TOT-CORR-USAGE',\n                            '722A', 'C00033_TOT-CORR-USAGE',\n                            '703A', 'C00035_TOT-CORR-USAGE',\n                            '705A', 'C00036_TOT-CORR-USAGE' ) AS ACT_ENERGY\n\n       , MIN(STD_DATE) AS 기준시간 \n       , '' --EAF_SHFT_TY\n       , WRK_CNT AS 작업차수\n       , '' --EAF_END_TY\n       , MIN (WRK_STRT_TIME) AS 작업시작시간\n       , MAX (WRK_END_TIME) AS 작업종료시간\n       , ROUND ( (MAX (WRK_END_TIME) - MIN (WRK_STRT_TIME)) * 24 * 60, 0) AS 가동시간\n       , SUM (BNDL_WGT) AS 작업중량\n       , PON\nFROM GMES.SPRI3010\nWHERE 1=1\n      AND WRK_CNT < 11\n      AND STD_DATE between to_date('{0}','YYYY-MM-DD') and to_date('{1}','YYYY-MM-DD')\n      AND EQUIP_NAME IN ('700A', '706A', '706B', '706C', '723A', '725A', '702A', '722A', '703A', '705A')\nGROUP BY PON\n        , HEAT_NO\n        , EQUIP_NAME\n        , WRK_CNT\n        , IRN_NAME\n```\n\n### `sql_29` — tag : factory_id, kind 가지고 오기\n\n- 현행 사용 모듈: mm_28\n- 치환 객체: `DEVICE_MASTER` → `SFMZ0101`, `TAG_MASTER` → `SFMZ0104`\n\n```sql\nSELECT tm.TAG_ID, dm.FACTORY_ID, dm.DEVICE_USE\n  FROM SFMZ0104 tm\n  INNER JOIN SFMZ0101 dm\n  ON 1=1\n  AND tm.DEVICE_ID = dm.DEVICE_ID\n```\n\n### `sql_20_elc` — Oracle : 요약정보(일) : tag_id : storge\n\n- 현행 사용 모듈: mm_246·mm_24month\n- 치환 객체: `CODEDETAIL` → `SFMZ0002`, `CONNECT_INFO` → `SFMZ0902`, `DEVICE_MASTER` → `SFMZ0101`, `SUMMARY_INFO` → `SFMZ0914`, `TAG_MASTER` → `SFMZ0104`, `TAG_STORE_TABLE_INFO` → `SFMZ0918`, `TAG_SUMMARY_MAPPING_FROM` → `SFMZ0919`, `TAG_SUMMARY_MAPPING_TO` → `SFMZ0920`\n\n```sql\nSELECT tm.TAG_ID, \n       tsti1.STORAGE_TABLE, \n       tsti2.STORAGE_TABLE,\n       ci1.IP_ADDRESS||ci1.PORT||tsti1.STORAGE_DB||tsti1.STORAGE_TABLE||tsti1.STORE_TABLE_CREATE_CYCLE,\n       ci2.IP_ADDRESS||ci2.PORT||tsti2.STORAGE_DB||tsti2.STORAGE_TABLE||tsti2.STORE_TABLE_CREATE_CYCLE,\n        c.mgt_char1 \nFROM SFMZ0104 tm\n\nINNER JOIN SFMZ0919 tsm\n  ON 1=1 \n  AND tm.TAG_ID = tsm.TAG_ID\n\nINNER JOIN SFMZ0920 tsmt\n  ON 1=1\n  AND tsm.TAG_SUMMARY_ID = tsmt.FROM_SUMMARY_ID\n  \nINNER JOIN SFMZ0914 si\n  ON 1=1\n  AND tsm.SUMMARY_ID = si.SUMMARY_ID\n\nINNER JOIN SFMZ0918 tsti1\n  ON 1=1\n  AND tsm.FROM_STORE_TABLE_ID = tsti1.TAG_STORE_TABLE_ID\n \nINNER JOIN SFMZ0918 tsti2\n  ON 1=1\n  AND tsmt.TO_SUMMARY_ID = tsti2.TAG_STORE_TABLE_ID\n\nINNER JOIN SFMZ0902 ci1\n  ON 1=1\n  AND ci1.CONNECT_ID = tsti1.CONNECT_ID\n  \nINNER JOIN SFMZ0902 ci2\n  ON 1=1\n  AND ci2.CONNECT_ID = tsti2.CONNECT_ID\n\nINNER JOIN SFMZ0101 dm\n  ON 1=1 \n  AND tm.DEVICE_ID = dm.DEVICE_ID\n\nLEFT OUTER JOIN SFMZ0002 c\n  ON 1=1 \n  AND dm.ENERGY_KIND_DETAIL = c.CODE\n  AND c.CODE_TYPE = 'FE113'\n\nWHERE si.DATA_RANGE = '15mi' AND si.EXECUTE_COMMAND = '사용량' AND tm.DEVICE_ID LIKE 'E%'\n```\n\n## 3.2 현행 소스 내장 SQL → TO-BE SQL\n\nDataForge에 대응 기능이 필요한 것만 정리했습니다.\n\n### Q1. 수집 대상 장비·태그 (`mm_00_collect.py` 118·172·211·223행) — P4 KepServerEX 설정 근거, F3 검증\n\n```sql\n-- 게이트웨이 목록 (DEVICE_TYPE: 'C' 가스보정기 / 'E' 전력량계)\nSELECT DISTINCT(COM_CONNECT_DEVICE_ID) AS DEVICE_ID\n  FROM SFMZ0101\n WHERE DEVICE_TYPE = :device_type AND USE_YN = 'Y' AND MAKER LIKE '%' || :maker || '%'\n ORDER BY DEVICE_ID;\n\n-- 게이트웨이 IP (DEVICE_TYPE 'D')\nSELECT DEVICE_ADDRESS FROM SFMZ0101\n WHERE DEVICE_TYPE = 'D' AND USE_YN = 'Y' AND DEVICE_ID = :gateway_id;\n\n-- 하위 계측기\nSELECT DEVICE_ID, DEVICE_ADDRESS, DEVICE_USE FROM SFMZ0101\n WHERE DEVICE_TYPE = :device_type AND USE_YN = 'Y'\n   AND COM_CONNECT_DEVICE_ID = :gateway_id AND MAKER LIKE '%' || :maker || '%';\n\n-- 계측기별 수집 태그·레지스터·보정계수\nSELECT a.TAG_ID, a.DATA_ADDRESS, b.FACTORY_ID, a.CORRECT_RATIO\n  FROM SFMZ0104 a\n  JOIN SFMZ0101 b ON a.DEVICE_ID = b.DEVICE_ID\n WHERE a.VIRTUAL_TAG_YN = 'N' AND a.COLL_YN = 'Y' AND a.DEVICE_ID = :device_id;\n```\n\n> 현행 211행 바로 아래의 `COM_CONNECT_DEVICE_ID = 'D00007'` 하드코딩 SQL은 미사용 변수이므로 제외했습니다.\n\n### Q2. Autobase 태그 순서 (`mm_Autobase.py` 26행) — `VAL` 파이프 문자열 위치 매핑 검증\n\n```sql\nSELECT TAG_ID, FACTORY_ID, COLL_INTERVAL, CORRECT_RATIO\n  FROM SFMZ0104\n WHERE REMARK = 'Autobase'\n ORDER BY ORDER_SEQ;\n```\n\n### Q3. 1분 사용량 대상 태그와 저장소 (`mm_226_1m_use.py` 118행) — 계산 서비스 대상 선정\n\n```sql\nSELECT tm.TAG_ID, tm.VIRTUAL_TAG_FORMULA, tm.FACTORY_ID, dm.DEVICE_USE,\n       ci.IP_ADDRESS, ci.PORT, tsti.STORAGE_DB, tsti.STORAGE_TABLE, tsti.STORE_TABLE_CREATE_CYCLE,\n       ci_1.IP_ADDRESS, ci_1.PORT, tsti_1.STORAGE_DB, tsti_1.STORAGE_TABLE, tsti_1.STORE_TABLE_CREATE_CYCLE\n  FROM SFMZ0104 tm\n  JOIN SFMZ0919 tsmf ON tm.TAG_ID = tsmf.TAG_ID\n  JOIN SFMZ0101 dm   ON tm.DEVICE_ID = dm.DEVICE_ID\n  JOIN SFMZ0920 tsmt ON tsmf.TAG_SUMMARY_ID = tsmt.FROM_SUMMARY_ID AND tsmf.SUMMARY_ID = '14'\n  JOIN SFMZ0918 tsti   ON tsmf.FROM_STORE_TABLE_ID = tsti.TAG_STORE_TABLE_ID\n  JOIN SFMZ0918 tsti_1 ON tsmt.TO_SUMMARY_ID = tsti_1.TAG_STORE_TABLE_ID\n  JOIN SFMZ0902 ci     ON ci.CONNECT_ID = tsti.CONNECT_ID\n  JOIN SFMZ0902 ci_1   ON ci_1.CONNECT_ID = tsti_1.CONNECT_ID\n WHERE tm.VIRTUAL_TAG_YN != 'Y';\n```\n\nDataForge 계산 서비스는 저장소 좌표 컬럼이 필요 없으므로 아래처럼 줄여 씁니다.\n\n```sql\nSELECT tm.TAG_ID, tm.FACTORY_ID, dm.DEVICE_USE, dm.ENERGY_KIND_DETAIL\n  FROM SFMZ0104 tm\n  JOIN SFMZ0919 tsmf ON tm.TAG_ID = tsmf.TAG_ID AND tsmf.SUMMARY_ID = '14'\n  JOIN SFMZ0101 dm   ON tm.DEVICE_ID = dm.DEVICE_ID\n WHERE tm.VIRTUAL_TAG_YN != 'Y';\n```\n\n### Q4. 1분 가상태그 대상과 수식 (`mm_236_vtag_1m_use.py` 133행, `vtag1`)\n\n```sql\nSELECT c.TAG_ID, c.VIRTUAL_TAG_FORMULA, d.FACTORY_ID, d.DEVICE_USE\n  FROM SFMZ0919 a\n  JOIN SFMZ0920 b ON a.TAG_SUMMARY_ID = b.FROM_SUMMARY_ID AND a.SUMMARY_ID = '14'\n  JOIN SFMZ0104 c ON c.TAG_ID = a.TAG_ID\n  JOIN SFMZ0101 d ON c.DEVICE_ID = d.DEVICE_ID\n WHERE c.COLL_YN = 'Y' AND c.VIRTUAL_TAG_YN = 'Y'\n ORDER BY c.TAG_ID;\n```\n\n### Q5. 실시간 가상태그 (`mm_creatVTag.py` 83행) — Grafana 실시간 가상태그용\n\n```sql\nSELECT a.TAG_ID, a.VIRTUAL_TAG_FORMULA, a.FACTORY_ID, b.DEVICE_USE\n  FROM SFMZ0104 a\n  JOIN SFMZ0101 b ON a.DEVICE_ID = b.DEVICE_ID\n WHERE a.VIRTUAL_TAG_YN = 'Y' AND a.VIRTUAL_TAG_FORMULA IS NOT NULL AND a.COLL_YN = 'Y';\n```\n\n### Q6. 원단위 Oracle 테이블 (`mm_28_basic_unit.py` 122·160·231행) — F2-O 복제 SQL\n\n현행은 `INSERT`만 하므로(CRIT-2) DataForge는 **읽기만** 합니다.\n\n```sql\n-- 일 원단위 증분 복제 (to_date 기준)\nSELECT TAG, VALUE_HEAT, FROM_DATE, TO_DATE, TJ, TOE, TCO2, COST, FACTORY_ID, KIND,\n       MIN_ACC_VALUE, MAX_ACC_VALUE, STD_DATE, VALUE_AM6, ROWID AS SRC_ROWID\n  FROM SFMZ0306\n WHERE TO_DATE > :last_to_date;\n\n-- 월 원단위\nSELECT t.*, ROWID AS SRC_ROWID FROM SFMZ0307 t WHERE TO_DATE >= :month_start;\n```\n\n> `ROWID`를 함께 가져와 중복 행(같은 `TAG`·`FROM_DATE`가 여러 번 INSERT된 경우)을 DataForge에서 식별합니다.\n\n### Q7. 태그 상태 (`mm_146_correction_tag.py` 103·109행) — F2-O 복제 SQL\n\n```sql\nSELECT TAG_ID, TAG_STATUS, TAG_VALUE, TAG_TIME, DEVICE_USE, FACTORY_ID FROM SFMZ0917;\n```\n\n> 주의: 테이블명 `TAG_STATUS`와 **같은 이름의 컬럼** `TAG_STATUS`가 있습니다. 자동 치환 시 컬럼까지 바뀌지 않도록 이 SQL은 수작업으로 작성했습니다.\n\n### Q8. Oracle 프로시저 3종 — DataForge 미사용\n\n`SP_SFMZ_GET_CONNECT_INFO`(Kafka), `SP_SFMZ_GET_SAVE_INFO`(Mongo), `SP_SFMZ_GET_SUM_INTERVAL`(요약 주기)은 현행 접속정보 조회용입니다. DataForge는 NiFi 파라미터·시크릿 저장소를 쓰므로 호출하지 않습니다.\n\n## 3.3 환산 함수 호출 시그니처 (TO-BE)\n\n현행 `sql_27`·`sql_23`의 포맷 인자 순서를 그대로 둔 바인드 형태입니다. 인자 의미는 W0-03에서 함수 본문으로 확정합니다.\n\n| 함수 | 현행 호출 형태 | 반환(현행 사용) |\n|---|---|---|\n| `SF_SFMZ_ENG_CONVERSION(kind_code, energy_kind, ts_str, value)` | `('MJ' / 'TOE' / 'GHG', '{kind}', '{시각}', {값})` | MJ(→ 현행은 `tj` 필드에 저장, 단위 확인 필요), TOE, tCO2 |\n| `SF_SFMZ_LOD_CONVERSION('LOD', energy_kind, ts_str)` | | 부하시간대 L/M/H |\n| `SF_SFMZ_PRDT_COST_CONVERSION('COST', energy_kind, ts_str, value, device_id)` | | 비용(추정 단가) |\n| `SF_SFMZ_CONF_COST_CONVERSION('COST', energy_kind, ts_str, value, device_id)` | | 비용(확정 단가, 없으면 NULL → 추정 사용, `conf='N'`) |\n\n> `ts_str` 형식: 현행 `mm_226`은 `str(insert_time - 1분).replace(' ', '')`를 넘깁니다 → **`'2026-10-2909:30:00'`처럼 날짜와 시각 사이 공백이 없는 문자열**. 함수 본문(W0-03)으로 형식 해석 방식을 확인하고, 계산 서비스도 같은 형식을 써야 결과가 같습니다.\n\n```sql\n-- 계산 서비스 배치 환산 (태그 키를 반드시 포함 — CRIT-4 재발 방지)\nSELECT :tag_id AS TAG_ID,\n       SF_SFMZ_ENG_CONVERSION('MJ',  :kind, :ts, :val)               AS MJ,\n       SF_SFMZ_ENG_CONVERSION('TOE', :kind, :ts, :val)               AS TOE,\n       SF_SFMZ_ENG_CONVERSION('GHG', :kind, :ts, :val)               AS TCO2,\n       SF_SFMZ_LOD_CONVERSION('LOD', :kind, :ts)                     AS LOD,\n       SF_SFMZ_PRDT_COST_CONVERSION('COST', :kind, :ts, :val, :dev)  AS COST_EST,\n       SF_SFMZ_CONF_COST_CONVERSION('COST', :kind, :ts, :val, :dev)  AS COST_CONF\n  FROM DUAL;\n```\n"}, {"id": "04", "file": "04_P0_준비작업.md", "title": "P0 준비 작업 (3주)", "content": "# 04. P0 준비 작업 (3주)\n\n**목적**: P1을 시작하기 전에 ① 접속 경로와 계정 ② 신규 MES DB의 정합성 ③ DataForge 표준 ④ 정책 결정을 확보합니다. P0의 산출물이 없으면 이후 단계의 SQL·흐름·비교 기준이 모두 흔들립니다.\n\n**현행 영향**: 없음. 현행 쪽 작업은 읽기 계정 발급·방화벽 개방뿐입니다.\n\n```mermaid\nflowchart LR\n    W001[\"W0-01 접속·계정\"] --> W003[\"W0-03 신규 객체 검증\"]\n    W002[\"W0-02 ★ 동기화 방식\"] --> W003\n    W001 --> W004[\"W0-04 GMES · DB Job\"]\n    W005[\"W0-05 DataForge 표준·규모\"]\n    W006[\"W0-06 정책 결정\"]\n    W003 & W004 & W005 & W006 --> G0{{\"G0 게이트\"}}\n```\n\n---\n\n## W0-01. 접속 경로·전용 계정\n\n| # | 접속 | 주체 → 대상 | 용도 | 계정 요건 | 요청처 |\n|---|---|---|---|---|---|\n| 1 | 현행 Kafka `172.17.1.34:9092` | DataForge NiFi → 현행 서버 | F1 원시 탭 | 인증 없음(현행). 방화벽에서 NiFi 노드 IP만 허용 | 인프라 |\n| 2 | 현행 MongoDB `172.17.1.35:17001` / `SEAH_FEMS` | NiFi → 현행 | F2-M 복제, 백필 | **읽기 전용 사용자 신규 생성**(`read` 역할, `SEAH_FEMS`만) — 현행 `eco` 계정 재사용 금지 | 현행 운영 |\n| 3 | MES 팀 DB(TO-BE `SFMZ*`) | NiFi·계산 서비스 → MES 팀 DB | F2-O, F3, 환산 함수 | `SFMZ*` 테이블 SELECT, `SF_SFMZ_*` 함수 EXECUTE | MES 팀 |\n| 4 | 구 Oracle `bestmes` `SF_FEMS` (S2 기간) | NiFi → 구 DB | S2 동기화 전 원천 | `SF_FEMS` 테이블 SELECT 전용 계정 — 현행 `SF_FEMS` 계정 재사용 금지 | DBA |\n| 5 | MES 원천 `GMES.*` | NiFi → MES 팀 DB 또는 구 DB | F4 Heat·Level-2 | `FPRB3010`, `FPRB2110`, `FPRB3022`, `SPRB3010`, `SPRB3080`, `SPRI3010`, `SPRC3059`, `SPRF3640` SELECT | MES 팀 |\n\n**산출물**: 접속 확인 결과(포트 개방·로그인·샘플 조회 1건), 계정은 NiFi 파라미터 컨텍스트의 **민감 값**으로만 등록.\n\n**확인 명령 예**\n\n```bash\n# NiFi 노드에서\nnc -vz 172.17.1.34 9092\nnc -vz 172.17.1.35 17001\n```\n\n---\n\n## W0-02. ★ 구 `SF_FEMS` ↔ MES 팀 DB 동기화 방식 결정\n\n[01](01_MES_DB_객체매핑_및_영향분석.md) 1.4절의 S1~S4 중 하나를 MES 팀과 확정합니다. **권장: S1(MES 팀이 구 → 신 증분 동기화) + 준비 전까지 S2(DataForge가 구 DB 직접 읽기).**\n\nS1을 택할 경우 MES 팀에 요청할 동기화 대상:\n\n| 대상(구 → 신) | 쓰는 주체 | 권장 주기 | 방식 |\n|---|---|---|---|\n| `TAG_MASTER` → `SFMZ0104`, `DEVICE_MASTER` → `SFMZ0101` | 현행 관리 화면 | 10분 | 전체 MERGE(키: `TAG_ID`, `DEVICE_ID`) |\n| `TAG_SUMMARY_MAPPING_FROM/TO` → `SFMZ0919/0920` | 운영자(`read_me.txt` 절차) | 1시간 | 전체 MERGE |\n| `CODEMASTER/CODEDETAIL` → `SFMZ0001/0002` | 관리 화면 | 1일 | 전체 MERGE |\n| `TAG_SUM_TIME_29_DAY/MONTH` → `SFMZ0306/0307` | `mm_28` | 매일 11:00 | 증분(`TO_DATE` 기준) |\n| `TAG_STATUS` → `SFMZ0917` | `mm_146` | 15분 | 전체 MERGE(키: `TAG_ID`) |\n| `PEAK_GOAL`, `USAGE_GOAL`, `TBL_ISMART`, `PROCESS_HIERACHY`, `LOCATION` 등 | 관리 화면 | 1일 | 전체 MERGE |\n| `UNIT_LEVEL_*`, `TBL_FIX_VALUE_*` | Oracle DB Job(추정) | Job 이후 | W0-04 결과에 따라(신규 DB에서 Job이 직접 돌면 동기화 불필요) |\n\n**산출물**: 동기화 방식 결정서(대상·주기·지연 허용치·장애 시 연락 체계).\n\n---\n\n## W0-03. 신규 객체 검증\n\nMES 팀 DB가 구 `SF_FEMS`와 **같은 데이터·같은 동작**을 하는지 확인합니다.\n\n| # | 검증 | 방법 | 통과 기준 |\n|---|---|---|---|\n| 1 | 컬럼 구조 | 구 `USER_TAB_COLUMNS`(`SF_FEMS`) 대 신 `ALL_TAB_COLUMNS`(`SFMZ*`) — 테이블별 컬럼명·타입·순서 비교 | 차이 0, 차이가 있으면 [03](03_SQL_신규명칭_재작성_명세.md) 수정 |\n| 2 | 행 수 | 핵심 테이블 20개(02 문서 M01~M13, D11~D13 대상) `COUNT(*)` 비교 | S1이면 동기화 지연 이내 일치 |\n| 3 | 키 데이터 | `TAG_MASTER`·`DEVICE_MASTER` 전체 행 해시 비교 | 일치 |\n| 4 | 환산 함수 | 표본 100건(태그 × 시각 × 값)으로 구 `FN_*` 대 신 `SF_SFMZ_*` 결과 비교 | 완전 일치 |\n| 5 | 함수 본문 | `USER_SOURCE`에서 4개 함수 본문 확보 | 문서화(계산 서비스 이식 근거, `tj` 단위 확정) |\n| 6 | 뷰 | `SFMZ_VCODEDETAIL` 등 6개 조회 가능 | 오류 없음 |\n| 7 | 시퀀스·프로시저 | 컴파일 상태 `VALID` | `VALID` |\n\n```sql\n-- 1. 컬럼 비교 (구 DB에서 추출 → 신 DB에서 추출 → 파일 비교)\nSELECT table_name, column_id, column_name, data_type, data_length, nullable\n  FROM user_tab_columns\n WHERE table_name IN ('TAG_MASTER','DEVICE_MASTER','CODEDETAIL','SUMMARY_INFO',\n                      'TAG_SUMMARY_MAPPING_FROM','TAG_SUMMARY_MAPPING_TO',\n                      'TAG_SUM_TIME_29_DAY','TAG_SUM_TIME_29_MONTH','TAG_STATUS')\n ORDER BY table_name, column_id;\n\n-- 4. 환산 함수 대조 (신 DB) — 같은 표본을 구 DB에서 FN_* 로 실행해 비교\nSELECT SF_SFMZ_ENG_CONVERSION('MJ', '1', '2026-10-2909:30:00', 1000) AS mj,\n       SF_SFMZ_LOD_CONVERSION('LOD', '1', '2026-10-2909:30:00')     AS lod\n  FROM dual;\n\n-- 5. 함수 본문\nSELECT name, line, text FROM all_source\n WHERE name IN ('SF_SFMZ_ENG_CONVERSION','SF_SFMZ_LOD_CONVERSION',\n                'SF_SFMZ_PRDT_COST_CONVERSION','SF_SFMZ_CONF_COST_CONVERSION')\n ORDER BY name, line;\n```\n\n**산출물**: 검증 결과서, 함수 본문 사본(문서 저장소), 컬럼 차이 목록.\n\n---\n\n## W0-04. GMES 원천·Oracle DB Job 확인\n\n| # | 확인 | 방법 | 결과 반영 |\n|---|---|---|---|\n| 1 | `GMES.*` 8개 테이블의 현재 위치(구 `bestmes`인지, MES 팀 DB로 옮겨졌는지)와 접근 계정 | MES 팀 문의 | F4 원천([07](07_P2_집계_피크_Heat_원단위_SQL.md) 7.4), 파라미터 `fems.mes.schema` |\n| 2 | VNTG MES 전환 일정과 Heat·생산실적·Level-2 제공 방식 | MES 팀 | F4 교체 계획 |\n| 3 | DataForge가 이미 수집 중인 세아베스틸 MES·Level-2 데이터셋 | DataForge 팀 | F4를 기존 데이터셋 재사용으로 대체할지 결정 |\n| 4 | 구 DB의 DB Job | `SELECT job_name, job_action, repeat_interval, enabled FROM user_scheduler_jobs;` / `SELECT job, what, interval FROM user_jobs;` | `DATA_ERP_*`·`DATA_WON_DAN_WEE_DAY*`·`DATA_FIX_SET_DAY` 실행 주기 확인 |\n| 5 | 신규 DB에서 위 Job이 이관·가동되는지 | MES 팀 | 가동이면 D13은 신규 DB에서 복제, 아니면 구 DB에서 복제(S2) |\n\n---\n\n## W0-05. DataForge 표준·운영 규모\n\n| # | 항목 | 확인 대상 | 쓰이는 곳 |\n|---|---|---|---|\n| 1 | NiFi 버전·클러스터 구성, 사용할 Kafka 프로세서(클라이언트 버전 — 현행 브로커 2.2.1 호환) | DataForge | F1 |\n| 2 | Mongo 프로세서(`GetMongo`/`GetMongoRecord`) 사용 가능 여부, 또는 스크립트 프로세서 정책 | DataForge | F2-M |\n| 3 | 태그 단위·데이터셋 단위 **표준 메시지 스키마**, 토픽 명명 규칙, 스키마 레지스트리 | DataForge | [11](11_DDL_및_토픽_명세.md) |\n| 4 | 원시 시계열 저장소(InfluxDB / TimescaleDB), PostgreSQL·BigQuery 할당, 보존 정책 | DataForge | [11](11_DDL_및_토픽_명세.md) |\n| 5 | Grafana·Metabase 조직·권한·고객 접근 방식 | DataForge | [09](09_P3_Grafana_Metabase_화면구성.md) |\n| 6 | 계산 서비스 배포 방식(Kubernetes/Docker)과 모니터링 | DataForge | [06](06_P2_FeMS계산서비스_개발.md) |\n| 7 | **운영 규모**: 분당 Kafka 메시지 수, `COLL_YN='Y'` 태그 수, Mongo 컬렉션별 문서 수·용량 | 현행 측정 | 용량 산정, 백필 시간 |\n\n```bash\n# 운영 규모 측정 (현행 서버, 읽기 전용) — 1분 간격 두 번 측정한 오프셋 차이 = 분당 메시지 수\nkafka_2.11-2.2.1/bin/kafka-run-class.sh kafka.tools.GetOffsetShell \\\n  --broker-list 172.17.1.34:9092 --topic collect --time -1\n```\n\n```javascript\n// Mongo (읽기 전용 계정)\ndb.getCollectionNames().filter(n => /^collect_|^TAG_SUM|^PEAK_|^HEAT_/.test(n))\n  .forEach(n => { const s = db[n].stats(); print(n, s.count, s.size); });\n```\n\n---\n\n## W0-06. 정책 결정과 알려진 차이 목록\n\n[12](12_체크리스트_결정사항_확인필요.md)의 D1~D6을 결정권자와 확정하고, [08](08_P2_병행검증_비교체계.md) 8.4의 알려진 차이 목록(K1~K9)을 합의합니다. 결정 없이 P2 계산 서비스를 만들면 비교 단계에서 다시 고쳐야 합니다.\n\n---\n\n## G0 게이트 체크리스트\n\n- [ ] W0-01 접속 5종 확인, 계정은 NiFi 민감 파라미터로만 등록\n- [ ] W0-02 동기화 방식 결정서 서명\n- [ ] W0-03 컬럼·행 수·함수 결과 검증 통과(또는 차이 반영 완료)\n- [ ] W0-04 GMES 위치, DB Job 실행 주체 확인\n- [ ] W0-05 표준 스키마·저장소·운영 규모 확보\n- [ ] W0-06 D1~D6 결정, 알려진 차이 목록 합의\n"}, {"id": "05", "file": "05_P1_NiFi_그림자이관_구성.md", "title": "P1 NiFi 그림자 이관 구성 (4주)", "content": "# 05. P1 NiFi 그림자 이관 구성 (4주)\n\n**목적**: 현행을 고치지 않고 ① 원시값(F1) ② 현행 계산 결과(F2) ③ 기준정보(F3)를 DataForge로 실시간 복제하고 과거분을 백필합니다. P1이 끝나면 **현행 화면과 같은 숫자를 Grafana·Metabase에서 볼 수 있고**, P2 자체 계산의 입력이 준비됩니다.\n\n**현행 영향**: 없음(읽기만). Mongo·Oracle 조회 부하는 W1-09 감시로 관리합니다.\n\n---\n\n## W1-01. 스키마·토픽 생성\n\n[11](11_DDL_및_토픽_명세.md)의 DDL을 순서대로 실행합니다: `fems_raw` → `fems_master` → `fems_legacy` → `fems_mes` → `fems_calc`(P2에서 사용). 토픽은 `fems.raw`, `fems.raw.dlq`, `fems.legacy.*`, `fems.master.*`를 먼저 만듭니다.\n\n## W1-02. NiFi 파라미터 컨텍스트 `fems`\n\n| 파라미터 | 예시 값 | 민감 | 설명 |\n|---|---|---|---|\n| `legacy.kafka.bootstrap` | `172.17.1.34:9092` | | 현행 Kafka |\n| `legacy.kafka.group` | `dataforge-shadow` | | 전용 소비 그룹 |\n| `legacy.mongo.uri` | `mongodb://<user>:<pw>@172.17.1.35:17001/SEAH_FEMS` | ✓ | 읽기 전용 계정 |\n| `fems.master.source` | `mes` 또는 `legacy` | | W0-02 S1/S2 전환 스위치 |\n| `fems.master.jdbc` / `.user` / `.password` | MES 팀 DB | ✓(pw) | |\n| `fems.legacy.jdbc` / `.user` / `.password` | 구 `bestmes` | ✓(pw) | S2 기간 |\n| `fems.master.schema` | (MES 팀 확정값) | | TO-BE 소유 스키마 |\n| `fems.mes.schema` | `GMES` | | F4 |\n| `df.kafka.bootstrap` | DataForge Kafka | | |\n| `df.pg.*`, `df.ts.*` | DataForge PostgreSQL / TimescaleDB | ✓(pw) | |\n\n> 객체명(`SFMZ0104` 등)도 파라미터 `obj.tag_master` 등으로 두면 S2(구 이름) ↔ S1(신 이름) 전환이 설정 변경만으로 됩니다.\n\n---\n\n## W1-03. F1 — 현행 Kafka 원시값 탭\n\n```mermaid\nflowchart LR\n    A[\"ConsumeKafka<br/>#{legacy.kafka.bootstrap}<br/>topic collect<br/>group #{legacy.kafka.group}<br/>offset reset: latest\"] --> B[\"ConvertRecord<br/>Reader: GrokReader<br/>Writer: JSON(표준 스키마)\"]\n    B --> C[\"UpdateRecord<br/>/ts = 시각 파싱<br/>/source = 'legacy-collect'<br/>/raw = 원본 문자열\"]\n    C --> D{\"ValidateRecord\"}\n    D -->|valid| E[\"PublishKafkaRecord<br/>fems.raw<br/>key = tag_id\"]\n    D -->|invalid| F[\"PublishKafkaRecord<br/>fems.raw.dlq\"]\n    E --> G[\"(적재 흐름) ConsumeKafkaRecord fems.raw<br/>→ PutDatabaseRecord fems_raw.raw_collect\"]\n```\n\n| 설정 | 값 | 이유 |\n|---|---|---|\n| 메시지 형식 | 아래 코드 블록 참조(키 없음, 메시지 1개 = 태그 값 1건) | `realtime.sendtokafka()` |\n| 파서 | GrokReader(아래 패턴) | 구분자가 두 글자(`\\|\\|`)라 CSVReader 불가 |\n| 시각 형식 | `yyyy-MM-dd HH:mm:ss.SSSSSS` 우선, 실패 시 `yyyy-MM-dd HH:mm:ss` | 현행 `.000000`·초 단위 혼재 |\n| 시간대 | `Asia/Seoul` | 현행은 로컬 시각 문자열 |\n| 값 | **이미 `CORRECT_RATIO`가 곱해진 값** — `fems.raw`에 `correct_applied = true` 표시 | 계산 서비스가 다시 곱하지 않도록(06 W2-01) |\n| 배치 | ConsumeKafka `Message Demarcator` 사용, 레코드 단위 처리 | 분당 메시지 수가 많음 |\n| 키 | `tag_id` | 파티션별 태그 순서 보장 |\n\n```text\n# 현행 메시지 형식\nTAG_ID||VALUE||YYYY-MM-DD HH:MM:SS.ffffff||KIND||FACTORY_ID\n\n# GrokReader 패턴\n%{DATA:tag_id}\\|\\|%{NUMBER:value}\\|\\|%{TIMESTAMP_ISO8601:ts_str}\\|\\|%{DATA:kind}\\|\\|%{GREEDYDATA:factory_id}\n```\n\n**검증**: 분당 건수 = 현행 Mongo `collect_YYYYMM`의 같은 분 건수(±0.1%).\n\n---\n\n## W1-04. F2-M — Mongo 산출물 복제\n\n| 흐름 | 원천 컬렉션 | 조회 조건 | 주기 | 대상 | 키(UPSERT) |\n|---|---|---|---|---|---|\n| F2-M1 | `collect_m1` | `time > ${last_time}` (문자열 비교, 고정 형식) | 1분 | `fems_legacy.usage_1m` | (`tag`, `time`, `vtag`) |\n| F2-M2 | `TAG_SUM_TIME_29_15M_${yyyymm}` | `from_date >= ${now - 30분}` | 15분 | `fems_legacy.summary` (`unit='15m'`) | (`unit`, `tag`, `from_date`) |\n| F2-M3 | `TAG_SUM_TIME_29_1H_${yyyymm}` | `from_date >= ${현재 시 - 1시간}` **진행 구간 재조회** | 15분 | 상동 (`'1h'`) | 상동 |\n| F2-M4 | `TAG_SUM_TIME_29_DAY` | `from_date >= ${오늘 00시 - 1일}` | 15분 | 상동 (`'1d'`/`'1d_elc'`) | 상동 |\n| F2-M5 | `TAG_SUM_TIME_29_MONTH` | `from_date >= ${이번 달 1일 - 1개월}` | 15분 | 상동 (`'1mon'`/`'1mon_elc'`) | 상동 |\n| F2-M6 | `PEAK_SUM_TIME_29_15M_${yyyymm}` | `from_date >= ${now - 30분}` | 15분 | `fems_legacy.peak` | (`tag`, `from_date`) |\n| F2-M7 | `HEAT_ENERGY_15M_${yyyymm}` | `create_to_date >= ${전일}` | 07:30, 10:30 | `fems_legacy.heat` | (`heat_no`, `tag_id`) |\n\n```mermaid\nflowchart LR\n    A[\"GenerateFlowFile<br/>(타이머)\"] --> B[\"UpdateAttribute<br/>컬렉션명·조건 계산<br/>(월 경계 처리)\"]\n    B --> C[\"GetMongoRecord<br/>#{legacy.mongo.uri}\"]\n    C --> D[\"UpdateRecord<br/>문자열 시각 → timestamptz<br/>원본 보존\"]\n    D --> E[\"PutDatabaseRecord<br/>UPSERT fems_legacy.*\"]\n    E --> F[\"상태 저장<br/>last_time 갱신\"]\n```\n\n**주의 사항**\n\n1. **요약은 덮어쓰기 구조**: 현행 `mm_246`·`mm_24month`는 15분마다 진행 중인 시간·일·월 문서를 `delete_many` 후 다시 씁니다. 복제는 반드시 UPSERT이고, 진행 구간을 매번 다시 읽어야 합니다.\n2. **일 요약 두 종류**: `day`(06시 경계)와 `day_elc`(00시 경계, 전기만)가 같은 `TAG_SUM_TIME_29_DAY`에 들어갑니다. `from_date`의 시각(06:00/00:00)으로 `unit`을 `1d`/`1d_elc`로 구분합니다(월 요약도 같음).\n3. **월 경계**: `_${yyyymm}` 컬렉션은 매월 1일에 바뀝니다. 1일 00:00~06:15에는 전월·당월 두 컬렉션을 모두 조회합니다.\n4. **`collect_m1` 재기록**: 현행은 같은 분을 `delete_many` 후 다시 쓸 수 있어(체이닝 재실행, 백필) `last_time`만으로는 놓칠 수 있습니다 → 최근 15분 구간은 매번 재조회 UPSERT.\n5. **조회 인덱스**: 원천 조회는 현행 인덱스(`tag`·`time`)를 타는 조건만 사용. 전체 스캔 금지.\n\n## W1-05. F2-O — Oracle 산출물 복제\n\n| 흐름 | 원천(TO-BE / S2 기간 AS-IS) | SQL | 주기 | 대상 |\n|---|---|---|---|---|\n| F2-O1 | `SFMZ0306` / `TAG_SUM_TIME_29_DAY` | [03](03_SQL_신규명칭_재작성_명세.md) Q6 | 매일 11:00(+수동) | `fems_legacy.basic_unit_day` |\n| F2-O2 | `SFMZ0307` / `TAG_SUM_TIME_29_MONTH` | Q6 | 매일 11:00 | `fems_legacy.basic_unit_month` |\n| F2-O3 | `SFMZ0917` / `TAG_STATUS` | Q7 | 15분 | `fems_legacy.tag_status` |\n| F2-O4 | `SFMZ0301~0303`, `SFMZ0922/0923` | `SELECT * ... WHERE` 기준일 증분 | 일 | `fems_legacy.unit_level_*`, `fix_value_*` |\n\n**S1 동기화 지연 고려**: 신규 DB가 구 DB를 주기적으로 따라가는 구조라면 복제 시각을 동기화 시각 이후로 둡니다(예: `mm_28` 10:30 → 동기화 11:00 → F2-O1 11:15).\n\n## W1-06. F3 — 기준정보 동기화\n\n| 흐름 | 원천(TO-BE) | 대상 | 주기 | 방식 |\n|---|---|---|---|---|\n| F3-1 | `SFMZ0104`(태그), `SFMZ0101`(장비) | `fems_master.tag`, `.device` | 10분 + 수동 트리거 | 전체 조회 → UPSERT, 원천에 없는 행은 `deleted_at` 표시 |\n| F3-2 | `SFMZ0001~0004`(코드) | `fems_master.code_*` | 일 | 상동 |\n| F3-3 | `SFMZ0914`, `SFMZ0919`, `SFMZ0920`, `SFMZ0921` | `fems_master.summary_*` | 1시간 | 상동 |\n| F3-4 | `SFMZ0105~0108`, `SFMZ0911`, `SFMZ0201~0203`, `SFMZ0305`, `SFMZ0304`, `SFMZ0910`, `SFMZ0929`, `SFMZ0401/0402` | `fems_master.*` | 일 | 상동 |\n\n```mermaid\nflowchart LR\n    A[\"GenerateTableFetch / ExecuteSQLRecord<br/>#{fems.master.jdbc}<br/>SELECT * FROM #{obj.tag_master}\"] --> B[\"PublishKafkaRecord<br/>fems.master.tag (데이터셋 단위)\"]\n    B --> C[\"PutDatabaseRecord<br/>UPSERT fems_master.tag\"]\n    C --> D[\"변경 이벤트<br/>fems.master.changed\"]\n    D --> E[\"계산 서비스 캐시 재적재\"]\n```\n\n> 변경 감지 컬럼(수정일)이 없으면 전체 조회 후 해시 비교로 변경분만 반영합니다. 태그·장비는 행 수가 작아(수천 행 이하 예상) 10분 전체 조회가 부담되지 않습니다.\n\n---\n\n## W1-07. 과거 데이터 백필\n\n| 순서 | 대상 | 범위 | 방식 | 비고 |\n|---|---|---|---|---|\n| 1 | Mongo `collect_m1` → `fems_legacy.usage_1m` | 결정 D5(보존 범위) | 월 단위 분할, 야간 실행 | 비교 기준선 |\n| 2 | 요약·피크·Heat → `fems_legacy.*` | 상동 | 컬렉션 단위 | |\n| 3 | Mongo `collect_YYYYMM` → `fems_raw.raw_collect` | 상동 | 월 컬렉션 단위, `time` 범위 분할 | 가장 큼 — W0-05 용량 측정 후 일정 확정 |\n| 4 | Oracle `SFMZ0306/0307`, `SFMZ0301~0303` | 전체 | 일괄 | |\n\n- 백필은 실시간 흐름과 **같은 테이블·같은 키로 UPSERT** → 겹치는 구간도 안전.\n- 현행 Mongo 부하를 피하기 위해 야간(00:30~05:30, 단 매일 06:01·06:00 월 리셋 시각은 피함)에 실행하고, 동시 조회 1개로 제한.\n- 백필 진행률·건수는 `fems_legacy.backfill_log`에 기록.\n\n## W1-08. 조기 대시보드\n\n`fems_legacy.*` 기준으로 [09](09_P3_Grafana_Metabase_화면구성.md) 9.2의 1차 대시보드(실시간·일/월 사용량·피크·Heat·원단위)를 만듭니다. 이 단계의 숫자는 **현행 화면과 같아야 정상**입니다.\n\n## W1-09. 감시·알림\n\n| 지표 | 경고 기준 | 대응 |\n|---|---|---|\n| F1 소비 지연(현행 Kafka 그룹 lag) | 5분 이상 | NiFi 백프레셔·노드 확인 |\n| `fems.raw.dlq` 유입 | 분당 1건 이상 | 형식 변경 여부 확인 |\n| F2-M 마지막 성공 시각 | 주기 × 2 초과 | Mongo 접속·계정 확인 |\n| F3 동기화 실패 | 1회 | 원천 DB 확인 |\n| 분당 원시 건수 급감 | 직전 1시간 평균 대비 30% 이하 | 현행 수집기 장애 가능 — 현행 운영자 통보 |\n\n---\n\n## G1 게이트 체크리스트\n\n- [ ] 분당 원시 건수 일치율 99.9% 이상, 7일 연속\n- [ ] `fems_legacy.*` 값이 Mongo·Oracle 원천과 100% 일치(표본 비교), 7일 연속\n- [ ] DLQ 비율 0.01% 이하\n- [ ] F3 동기화 누락 0건, `fems.master.source` 전환(S2 → S1) 시험 완료\n- [ ] 백필 완료, `backfill_log` 검토\n- [ ] 조기 대시보드 수치가 현행 화면과 일치(현업 확인)\n"}, {"id": "06", "file": "06_P2_FeMS계산서비스_개발.md", "title": "P2 FeMS 계산 서비스 개발 (4주)", "content": "# 06. P2 FeMS 계산 서비스 개발 (4주)\n\n**목적**: DataForge가 현행과 **같은 규칙으로** 1분 사용량·가상태그·환산값을 직접 계산하게 합니다. 이 서비스가 FeMS 고유 로직의 유일한 개발 대상입니다(수집·적재·화면은 DataForge 표준).\n\n**입력/출력**: Kafka `fems.raw` → `fems.usage.1m`(실태그·가상태그) → NiFi 적재 → `fems_calc.usage_1m`.\n\n**기반 코드**: 신규 bst_FeMS `fems/05_processor`(FastAPI + aiokafka, 801줄). 아래 차이 때문에 **재사용보다 재구현에 가까운 수정**이 필요합니다.\n\n## 6.1 현행 알고리즘과 `05_processor`의 차이\n\n| 항목 | 현행 `mm_226` / `mm_236` | `05_processor` 현재 | 조치 |\n|---|---|---|---|\n| 실행 단위 | 매분 cron. 창 `[T−20분, T−5분)`, 귀속 시각 `T−12분` | 메시지 수신 즉시 버퍼, 60초마다 flush | 분 단위 스케줄러 + 지연 창(5분 대기) 구현 |\n| 대표값 선정 | 15분 창의 원시값을 `(값, 시각)`으로 정렬한 **중앙값** → 귀속 시각에 가장 가까운 행으로 이동(2차 필터) | 없음(버퍼의 첫·마지막 값) | 3단 필터 이식(W2-02) |\n| 차분 기준 | **직전 1분 결과의 `current_tag_value`** 대비 차분(분 경계 연속) | 같은 1분 버퍼 안의 `마지막 − 처음` → **분 사이 증가분 누락** | 태그별 직전 대표값 상태 보관 |\n| 음수 | 0으로 클램프(롤오버 보정 없음) | 음수면 행 생략 | 현행 규칙(또는 D1 결정) |\n| 0 연속 | 직전·현재 모두 0이면 행 생략 | 없음 | 이식 |\n| 상한 | 가스(`C`) 200만, 전력(`E`) 1,000만 초과 시 0, 그 외 종류는 생략 | 없음 | 이식(설정값화) |\n| 보정계수 | 수집 시점에 이미 곱해짐(Kafka 값) | flush 때 `correct_ratio`를 **다시 곱함** | `correct_applied=true` 입력은 곱하지 않음 |\n| 가스 kg | `val × CODEDETAIL(FE113).MGT_CHAR1`(`sql_20` `[5]`) | 없음 | 이식 |\n| 월 누적 `total` | 매월 1일 06:01에만 리셋(CRIT-3) | 없음 | 월 비교로 리셋(알려진 차이 K1) |\n| 환산 | Oracle 함수 `UNION ALL` 일괄 호출, 순서로 매칭(CRIT-4) | 설정 DB 계수 곱셈(TJ·TOE·tCO2만) | TO-BE 함수 호출 또는 이식, **태그 키 매칭** |\n| 부하시간대·비용 | `lod_tmzon`, `cost`, `conf` | 없음 | 이식 |\n| 가상태그 | 1분 **사용량**에 수식 적용, 모든 필드(`val`·`tj`·`cost`…)에 같은 수식, 3단 수렴(CRIT-5 결함) | 원시 **최신값**에 수식 적용, 제한 `eval`, 의존 순서 없음 | 1분 사용량 기반, AST 평가기, 위상 정렬 |\n| 시각 | 문자열 `'YYYY-MM-DD HH:MM:00'` | `datetime.now()`(처리 시각) | 귀속 분(정각) `timestamptz` |\n\n## 6.2 파일별 변경 목록\n\n| 파일 | 현재 역할 | 변경 내용 | 작업 ID |\n|---|---|---|---|\n| `app/main.py` | FastAPI 수명주기, 토픽 `KAFKA_TOPIC_RAW` 기본 `fems.raw.data` | 기본 토픽 `fems.raw`, 출력 토픽 `fems.usage.1m`, 분 스케줄러 태스크 등록, `/status`에 태그별 상태 지표 | W2-01 |\n| `app/consumer.py` | JSON `tag_id`·`timestamp`·값 소비, 60초 flush·가상태그 루프 | ① DataForge 표준 스키마 필드 매핑 ② `correct_applied` 처리 ③ 원시값을 **태그별 시계열 버퍼(최근 25분)**에 저장 ④ flush 루프를 \"매분 정각 + 5분 지연 창\" 스케줄로 교체 ⑤ 결과를 Kafka로 발행(DB 직접 쓰기 제거 — 적재는 NiFi) | W2-01, W2-06 |\n| `app/config_loader.py` | `df_fems_setting`에서 태그·규칙·계수 로드 | 원천을 **`fems_master.*`(F3 동기화본)**으로 교체: 대상 태그(Q3, `SUMMARY_ID='14'`), 가상태그 수식(Q4), kg 계수(`sql_20` `[5]`), 에너지 종류(`DEVICE_USE`), 상한값. `fems.master.changed` 이벤트로 재적재 | W2-01 |\n| `app/processors/usage.py` | 버퍼 첫·끝 차분, 비율 이상치 | **전면 교체** — 6.3 알고리즘 | W2-02, W2-05 |\n| 🆕 `app/processors/conversion.py` | - | 환산(6.4): TO-BE 함수 일괄 호출(태그 키 포함) 또는 이식 로직, 결과 캐시 | W2-03 |\n| `app/processors/virtual.py` | 원시 최신값 + 제한 `eval` | **전면 교체** — 6.5 AST 평가기·위상 정렬, 1분 사용량 기반 | W2-04 |\n| 🆕 `app/state.py` | - | 태그별 직전 대표값(`current_tag_value`, `curr_time`)·월 누적 `total` 상태 저장(재시작 복구용으로 `fems_calc.calc_state` 테이블에 주기 저장) | W2-02, W2-05 |\n| `app/storage.py` | TimescaleDB 직접 INSERT | 상태 테이블 읽기·쓰기만 남김(결과 적재는 NiFi) | W2-06 |\n| `tests/` | 단위 테스트 | 6.6 시험 케이스 추가(현행 `collect_m1` 표본 대조 포함) | 전체 |\n| `Dockerfile`, `requirements.txt` | | Oracle 클라이언트(`oracledb` thin 모드) 추가 — 환산 함수 호출 시 | W2-03 |\n\n## 6.3 W2-02 1분 사용량 알고리즘 (현행 재현)\n\n```text\n매분 T(정각)에 실행:\n  to_time    = floor_minute(T) - 5분\n  from_time  = to_time - 15분\n  insert_time = to_time - 7분                      # 귀속 분\n  대상 태그 = fems_master 기준 SUMMARY_ID '14' 매핑 실태그(Q3)\n\n  태그별:\n    rows = 버퍼에서 from_time <= ts < to_time, value >= 0\n    문자열/None 값은 0으로                          # 현행 방어 로직\n    정렬키 = (round(value, 3), ts)                   # 현행: zfill(20) 문자열 정렬과 동등\n    sorted = sort(rows, 정렬키)\n    mid    = sorted[len/2]                           # 1차: 중앙값\n    # 2차: 귀속 시각에 가장 가까운 행으로 이동\n    if mid.ts > insert_time: 배열 앞쪽으로 ts <= insert_time 인 첫 행\n    else:                    배열 뒤쪽으로 ts == insert_time 이면 그 행, ts > insert_time 직전 행\n    to = 선택 행\n\n    from = state[tag]                                # 직전 1분 결과의 current 값\n           (없으면 창 이전 마지막 원시값으로 부트스트랩, total = 0)\n    use = to.value - from.current                    # 3차\n    if use < 0: use = 0                              # 롤오버 보정 없음(D1)\n    if from.current == 0 and to.value == 0: 행 생략  # 0 연속\n    elif 태그 첫 글자 'C': use > 2,000,000 → 0;  kg = use × kg계수\n    elif 태그 첫 글자 'E': use > 10,000,000 → 0\n    else: 행 생략\n    total = (insert_time 이 새 달의 첫 귀속 분 이후 처음이면 0) + use   # K1: 월 비교 리셋\n    state[tag] = (to.value, to.ts, total)\n    emit {tag, time=insert_time, val=use, kg, total, before=from.current,\n          bf_time=from.ts, current=to.value, curr_time=to.ts, kind, factory_id}\n```\n\n> 정렬 방식은 현행 `str(round(val,3)).zfill(20) + time` 문자열 정렬과 결과가 같아야 합니다. 음수·지수 표기 값은 현행에서도 문자열 정렬이 깨지므로(작업-02 05 5.1), 대조 시 차이 원인으로 분류합니다.\n\n## 6.4 W2-03 환산\n\n| 방식 | 내용 | 장단점 | 권장 |\n|---|---|---|---|\n| A. TO-BE 함수 호출 | 분당 대상 태그 수만큼 `SF_SFMZ_*` 호출([03](03_SQL_신규명칭_재작성_명세.md) 3.3). 같은 분의 태그를 묶되 **결과에 `TAG_ID` 포함** | 현행과 동일 결과 보장. MES 팀 DB에 분당 호출 부하 | **P2 병행 기간 권장** |\n| B. 로직 이식 | 함수 본문(W0-03)과 `SFMZ0201/0202/0305` 계수·단가를 `fems_master`로 동기화해 서비스 안에서 계산 | DB 부하 없음, 독립성 | P3 이후 전환(A와 결과 일치 확인 후) |\n\n- 호출 시각 인자: `insert_time − 1분`을 `'YYYY-MM-DDHH:MI:SS'`(공백 없음) 형식으로.\n- 반환: `MJ`(현행은 `tj` 필드에 저장 — D6 결정), `TOE`, `GHG`(tCO2), `LOD`(L/M/H), 추정 비용, 확정 비용. 확정 비용이 NULL이면 추정 비용 사용·`conf='N'`.\n- 같은 (에너지 종류, 분) 조합은 부하시간대·단가가 같으므로 캐시하여 호출 수를 줄입니다.\n\n## 6.5 W2-04 가상태그\n\n```mermaid\nflowchart LR\n    A[\"가상태그 수식 로드<br/>(Q4, fems_master)\"] --> B[\"수식 파싱 → AST<br/>허용: 숫자 · tag[...] · + - * / ( )\"]\n    B --> C[\"참조 그래프 구성<br/>위상 정렬, 순환 검출\"]\n    C --> D[\"매분: 같은 insert_time 의<br/>실태그 결과(usage)로 계산\"]\n    D --> E[\"필드별 동일 수식 적용<br/>val · kg · total · tj · toe · tco2 · cost\"]\n    E --> F[\"결측 참조 → 0 대입 + quality=Uncertain\"]\n    F --> G[\"emit is_virtual = true\"]\n```\n\n| 규칙 | 현행 | 신규 |\n|---|---|---|\n| 수식 문법 | `tag[\"E00076\"]` 형태를 문자열 치환 후 `eval` | 같은 문법을 **AST로 파싱**, 허용 노드 외 거부(CRIT-6 해소) |\n| 다단 의존 | 2차 루프가 1회만 돌아 3단 이상은 0 치환(CRIT-5) | 위상 정렬로 끝까지 계산(알려진 차이 K3) |\n| 적용 필드 | 모든 필드에 같은 수식 | 동일(현행 의미 보존) |\n| 하드코딩 0 초기화 | `E00003/04/09/18/19_ACTIVE-ENERGY-LOW` 5개를 0으로 시작 | 동일하게 설정값으로 유지(근거 확인 전까지) |\n| 부하시간대 | `sql_23`(비용 제외)로 `lod` 계산 | 함수 호출(6.4)로 동일 |\n\n## 6.6 시험 계획\n\n| # | 시험 | 기대 |\n|---|---|---|\n| T1 | 현행 `collect_YYYYMM` 1시간 분량을 재생(replay) → 결과를 `fems_legacy.usage_1m`과 비교 | 알려진 차이 외 일치 |\n| T2 | 0 연속, 음수, 상한 초과, 부트스트랩(직전 결과 없음) 경계 케이스 | 현행 규칙대로 |\n| T3 | 월 경계(1일 06:00 전후), 서비스 재시작 후 상태 복구 | `total` 연속성, K1 |\n| T4 | 가상태그 3단 의존(예: `E00149 = E00129 + E00148`) | 정확 계산(K3) |\n| T5 | 수식에 허용 외 구문(`__import__` 등) | 거부·로그 |\n| T6 | 환산 A방식 결과에 태그 키 일치 | CRIT-4 미재현 |\n| T7 | 부하: 운영 규모 태그 수 × 1분 | 1분 안에 처리 완료 |\n\n## 6.7 완료 기준\n\n- [ ] `fems.usage.1m`이 매분 발행되고, 귀속 시각이 정각 분\n- [ ] T1~T7 통과\n- [ ] 재시작 시 상태 복구(직전 대표값·월 누적)\n- [ ] `eval` 미사용, 자격증명은 환경변수·시크릿에서만\n"}, {"id": "07", "file": "07_P2_집계_피크_Heat_원단위_SQL.md", "title": "P2 집계·피크·Heat·원단위·태그 상태 (3주)", "content": "# 07. P2 집계·피크·Heat·원단위·태그 상태 (3주)\n\n**목적**: 1분 결과(`fems_calc.usage_1m`)에서 요약·피크·Heat·원단위·태그 상태를 DataForge DB 안에서 만듭니다. 상태를 기억하는 계산이 아니므로 **TimescaleDB 연속 집계와 SQL 스케줄 작업**으로 처리합니다(NiFi 안에서 계산하지 않음).\n\n## 7.1 W2-07 요약 — 연속 집계\n\n현행 요약 대상은 `sql_20`(요약 정의 \"15mi·사용량\" 매핑 태그)이며 15분·1시간·일·월 모두 같은 목록입니다. 전기 00시 기준(`day_elc`/`month_elc`)은 `DEVICE_ID LIKE 'E%'`인 태그만 대상입니다.\n\n| 단위 | 하루·월 경계 | 대상 | 구현 |\n|---|---|---|---|\n| 15분 | - | `sql_20` 대상 | 연속 집계 `summary_15m` |\n| 1시간 | - | 상동 | 연속 집계 `summary_1h` |\n| 일 | **06:00** | 상동 | 연속 집계 `summary_1d` (`time_bucket('1 day', time, origin => '2000-01-01 06:00+09')`) |\n| 일(전기) | **00:00** | `DEVICE_ID LIKE 'E%'` | 연속 집계 `summary_1d_elc` |\n| 월 | **1일 06:00** | 상동 | 계층 집계(일 → 월) `summary_1mon` |\n| 월(전기) | 1일 00:00 | 전력 | `summary_1mon_elc` |\n\n```sql\nCREATE MATERIALIZED VIEW fems_calc.summary_15m\nWITH (timescaledb.continuous) AS\nSELECT time_bucket('15 minutes', u.time) AS from_date,\n       u.tag_id, u.kind, u.factory_id,\n       sum(u.val)  AS value, sum(u.kg)  AS kg,\n       sum(u.mj)   AS mj,    sum(u.toe) AS toe, sum(u.tco2) AS tco2,\n       sum(u.cost) AS cost,\n       last(u.total, u.time)         AS total,\n       last(u.current_val, u.time)   AS acc_value\n  FROM fems_calc.usage_1m u\n GROUP BY 1, 2, 3, 4\nWITH NO DATA;\n\nSELECT add_continuous_aggregate_policy('fems_calc.summary_15m',\n  start_offset => INTERVAL '2 days', end_offset => INTERVAL '15 minutes',\n  schedule_interval => INTERVAL '5 minutes');\n```\n\n> 현행 요약 문서에는 `lod`(부하시간대)와 `group_time`이 있습니다. 현행 `mm_246`은 태그별 1문서로 저장하고 `lod`는 마지막 행 값입니다 → 비교는 (태그, 구간) 기준으로 하고, 부하시간대별 합계는 별도 뷰 `summary_15m_lod`로 제공합니다.\n> 요약 대상 필터(`sql_20`)는 연속 집계 안에 넣지 않고, 조회 뷰에서 `fems_master.summary_target` 조인으로 적용합니다(대상 변경 시 재집계 불필요).\n\n## 7.2 W2-08 피크\n\n| 규칙(현행 `mm_266`) | DataForge |\n|---|---|\n| 대상 태그: `SUMMARY_ID='20'` 매핑(`sql_22`) | `fems_master.peak_target` |\n| 대상 1분값: **부하시간대 `M`·`H`만**(`lod_tmzon IN ('M','H')`) | 동일 조건 |\n| 15분 구간(직전 15분)의 M·H 1분값 합을 구한 뒤: **`m15_mxmm_kw`는 합계 그대로(×4 없음, 실제 단위 kWh)**, `hh/de/mt/yy_mxmm_kw`는 **합계 × 4(kW)** 를 직전 문서의 같은 시·일·월·연 최대값과 비교해 승계 | 같은 규칙으로 계산. 15분 값의 단위 불일치는 알려진 차이 K9로 관리하고, 화면 표시는 kW로 통일(D6과 함께 결정) |\n| 연도 경계 비대칭(MED-5) | 알려진 차이로 분류 |\n\n```sql\n-- 15분 M·H 사용량 합(kWh)과 수요(kW = ×4)를 함께 보관 — 현행 m15 값(×4 없음)과 비교하기 위함\nCREATE VIEW fems_calc.peak_15m AS\nSELECT time_bucket('15 minutes', time) AS from_date, tag_id, factory_id,\n       sum(val)     AS energy_kwh,     -- 현행 m15_mxmm_kw 와 비교\n       sum(val) * 4 AS demand_kw       -- 현행 hh/de/mt/yy_mxmm_kw 의 기준값\n  FROM fems_calc.usage_1m\n WHERE lod IN ('M','H')\n   AND tag_id IN (SELECT tag_id FROM fems_master.peak_target)\n GROUP BY 1, 2, 3;\n-- 시·일·월·연 피크는 peak_15m 에서 max(demand_kw) 와 그 시각(argmax)으로 15분마다 갱신하는 작업(W2-08 job)\n```\n\n## 7.3 W2-09 F4 — MES Heat·Level-2 수집 (NiFi)\n\n| 흐름 | 원천 SQL([03](03_SQL_신규명칭_재작성_명세.md)) | 주기 | 대상 |\n|---|---|---|---|\n| F4-1 전기로 Heat | `sql_04`(조회 기간 = 전일~당일) | 07:00, 10:00 (+수동) | `fems_mes.heat_work` (`line='EAF'`) |\n| F4-2 2차가공 Heat | `sql_28` | 07:00, 10:00 | `fems_mes.heat_work` (`line='SECOND'`, `pon` 포함) |\n| F4-3 Heat 대상 태그 | `sql_05` | 일 | `fems_master.heat_target` |\n| F4-4 Level-2 가열로 | `sql_25` | 1분 | `fems.raw`(태그 단위) — F1과 중복되므로 **P4 이전에는 비활성**, F1에서 받음 |\n\n- 원천 스키마는 `#{fems.mes.schema}`(W0-04). DataForge가 같은 MES 데이터를 이미 수집 중이면 F4-1·F4-2는 그 데이터셋을 재사용하고 이 흐름은 만들지 않습니다.\n- `sql_04`의 4호기 분기(`EAF_WRK_TOT_TIMES=11` 고정, 교대 정보 공란)는 현행 그대로 가져옵니다(값 보정은 MES 쪽 책임).\n- VNTG MES 전환 시 F4만 교체합니다. 계산 SQL은 `fems_mes.heat_work`만 읽습니다.\n\n## 7.4 W2-10 Heat 에너지\n\n```sql\n-- 현행 mm_256/mm_27: Heat 조업 구간 [시작, 종료) 의 1분 사용량 합\nINSERT INTO fems_calc.heat_energy (heat_no, line, tag_id, from_time, to_time, prod_wgt, pon,\n                                   total_use, mj_total, toe_total, tco2_total, cost_total, plan_code)\nSELECT h.heat_no, h.line, h.tag_id, h.from_time, h.to_time, h.prod_wgt, h.pon,\n       sum(u.val), sum(u.mj), sum(u.toe), sum(u.tco2), sum(u.cost),\n       CASE h.line WHEN 'EAF' THEN 'S' ELSE 'Q' END\n  FROM fems_mes.heat_work h\n  JOIN fems_calc.usage_1m u\n    ON u.tag_id = h.tag_id AND u.time >= h.from_time AND u.time < h.to_time\n WHERE h.work_date >= current_date - 1\n GROUP BY h.heat_no, h.line, h.tag_id, h.from_time, h.to_time, h.prod_wgt, h.pon\nON CONFLICT (heat_no, tag_id) DO UPDATE SET\n  total_use = EXCLUDED.total_use, mj_total = EXCLUDED.mj_total, toe_total = EXCLUDED.toe_total,\n  tco2_total = EXCLUDED.tco2_total, cost_total = EXCLUDED.cost_total;\n```\n\n- 실행: 07:15, 10:15(F4 이후). 현행처럼 10시 재실행으로 지연 입력을 보완합니다.\n- 현행은 전기로·2차가공이 같은 컬렉션에서 `heat_no`만으로 지워 충돌 위험이 있었습니다(MED-6) → 키를 `(heat_no, tag_id)`로.\n- 현행 `plan_code`는 전기로 `'S'`, 2차가공 `'Q'`(`fid`로 덮어씀) — 비교 시 확인.\n\n## 7.5 W2-11 원단위\n\n현행 `mm_28`은 매일 10:30 Heat 사용량·06시 기준 일 사용량을 Oracle `TAG_SUM_TIME_29_DAY`(→ `SFMZ0306`)에 INSERT하고 월은 일 합계로 만듭니다(중복 INSERT 결함 CRIT-2).\n\n| 항목 | DataForge |\n|---|---|\n| 일 원단위 | `fems_calc.basic_unit_day` = 태그별 Heat 사용량 합(`value_heat`) + 06시 기준 일 사용량(`value_am6`) + 환산 합 — `(tag, std_date)` 키 UPSERT(멱등) |\n| 월 원단위 | `basic_unit_day`의 월 합계 뷰 |\n| Oracle 쓰기 | **하지 않음**(D4) — 현행 Java 원단위 화면이 남아 있는 동안은 현행 `mm_28`이 계속 채움 |\n| ERP 원단위(`UNIT_LEVEL_*`) | P2에서는 F2-O 복제본을 그대로 사용, 생산 로직(DB Job) 이식은 W0-04 결과에 따라 별도 결정 |\n\n## 7.6 W2-12 태그 수집 상태\n\n현행 `mm_146`은 Redis 최신값 시각으로 '정상/비정상'을 판정해 `TAG_STATUS`에 MERGE합니다. DataForge는 원시 테이블의 마지막 수신 시각으로 같은 판정을 하는 뷰를 둡니다.\n\n```sql\nCREATE VIEW fems_calc.tag_status AS\nSELECT t.tag_id, t.factory_id, t.device_use,\n       r.last_time, r.last_value,\n       CASE WHEN r.last_time IS NULL OR now() - r.last_time > make_interval(mins => t.status_threshold_min)\n            THEN '비정상' ELSE '정상' END AS tag_status\n  FROM fems_master.tag t\n  LEFT JOIN LATERAL (\n       SELECT time AS last_time, raw_value AS last_value\n         FROM fems_raw.raw_collect\n        WHERE tag_id = t.tag_id AND time > now() - interval '1 day'\n        ORDER BY time DESC LIMIT 1) r ON true\n WHERE t.coll_yn = 'Y';\n```\n\n- `status_threshold_min`은 현행 `mm_146`의 `std_not_time = 30`(분)과 같게 설정. 현행은 Redis 최신값 시각과 **전체 태그 중 최신 시각** 사이 차이로 판정하므로(86행) 판정 시점 차이는 허용 오차로 관리.\n- Grafana 알림: 비정상 태그 수 급증 시 통보.\n\n## 7.7 완료 기준\n\n- [ ] 연속 집계 6종 생성·정책 동작, 지연 15분 이내\n- [ ] 피크(15분·시·일·월·연) 갱신 작업 동작\n- [ ] F4 Heat 수신(또는 DataForge 기존 MES 데이터셋 연결) 확인\n- [ ] Heat 에너지·원단위 SQL 작업 07:15·10:15·10:45 동작, 멱등\n- [ ] 태그 상태 뷰·알림 동작\n"}, {"id": "08", "file": "08_P2_병행검증_비교체계.md", "title": "P2 병행 검증·비교 체계 (2주 + 반복)", "content": "# 08. P2 병행 검증·비교 체계 (2주 + 반복)\n\n**목적**: 현행 결과(`fems_legacy.*`)와 DataForge 결과(`fems_calc.*`)를 같은 PostgreSQL 안에서 매일 비교하여, 차이를 **(가) 현행 결함 수정에 따른 정상 차이**와 **(나) DataForge 오류**로 분류합니다. (나)가 0건이 되면 G2를 통과합니다.\n\n## 8.1 W2-13 비교 뷰\n\n| 뷰 | 비교 키 | 비교 값 |\n|---|---|---|\n| `fems_cmp.usage_1m` | (태그, 분) | `val`, `kg`, `total`, `mj(tj)`, `toe`, `tco2`, `cost`, `lod`, `conf` |\n| `fems_cmp.summary` | (단위, 태그, 구간 시작) | `value`, `total`, `kg`, 환산값, `cost` |\n| `fems_cmp.peak` | (태그, 구간) | 최대수요, 발생 시각 |\n| `fems_cmp.heat` | (`heat_no`, 태그) | `total_use`, 환산 합 |\n| `fems_cmp.basic_unit` | (태그, 기준일) | `value_heat`, `value_am6`, 환산 합 |\n| `fems_cmp.tag_status` | 태그 | 상태 |\n\n```sql\nCREATE VIEW fems_cmp.usage_1m AS\nSELECT coalesce(l.tag_id, c.tag_id) AS tag_id,\n       coalesce(l.time,   c.time)   AS time,\n       l.val AS legacy_val, c.val AS df_val,\n       CASE WHEN l.val IS NULL THEN 'DF_ONLY'\n            WHEN c.val IS NULL THEN 'LEGACY_ONLY'\n            WHEN abs(l.val - c.val) <= greatest(abs(l.val), 1e-9) * 0.001 THEN 'MATCH'\n            ELSE 'DIFF' END AS verdict,\n       fems_cmp.known_diff(l.*, c.*) AS known_reason      -- K1~K8 판정 함수\n  FROM fems_legacy.usage_1m l\n  FULL JOIN fems_calc.usage_1m c\n    ON c.tag_id = l.tag_id AND c.time = l.time AND c.is_virtual = (l.vtag = 'Y')\n WHERE coalesce(l.time, c.time) >= now() - interval '2 days';\n```\n\n## 8.2 허용 오차\n\n| 대상 | 기준 | 통과 조건 |\n|---|---|---|\n| 1분 사용량 | 상대오차 0.1% | `MATCH` 비율 99% 이상(알려진 차이 제외) |\n| 요약 | 0.5% | 상동 |\n| 피크 | 값 일치, 시각 ±1분 | 상동 |\n| MJ/TOE/tCO2 | 0.5% | 단위 확정(D6) 후 |\n| 비용 | 1% | 확정/추정 단가 구분 반영 후 |\n| Heat 에너지 | 0.5% | |\n| 원단위 | 0.5% | 현행 중복 행(K5)은 제외 |\n| 태그 상태 | 상태 일치 | 95% 이상(판정 시점 차이 허용) |\n\n## 8.3 W2-14 차이 판정 절차\n\n```mermaid\nflowchart LR\n    A[\"일일 비교 리포트<br/>(Metabase, 07:30)\"] --> B{\"verdict = DIFF?\"}\n    B -->|아니오| OK[\"통과\"]\n    B -->|예| C{\"known_reason 있음?\"}\n    C -->|예| K[\"(가) 정상 차이<br/>건수 추이만 감시\"]\n    C -->|아니오| D[\"원인 분석<br/>원시 재생으로 재현\"]\n    D --> E{\"DataForge 오류?\"}\n    E -->|예| F[\"(나) 수정 → 재계산\"]\n    E -->|아니오| G[\"알려진 차이 목록에 추가<br/>(결정권자 승인)\"]\n```\n\n## 8.4 알려진 차이 목록 (W0-06에서 합의)\n\n| # | 현행 동작 | DataForge 동작 | 판정 함수 기준 |\n|---|---|---|---|\n| K1 | 월 누적 `total`이 매월 1일 06:01 실행 성공 시에만 리셋(CRIT-3) | 월 비교로 항상 리셋 | `total`만 다르고 `val` 같음, 해당 월 06:01 결과 부재 |\n| K2 | 환산값을 `UNION ALL` 순서로 매칭 — 태그 간 뒤섞임 가능(CRIT-4) | 태그 키 매칭 | 같은 분 다른 태그의 환산값과 일치 |\n| K3 | 가상태그 3단 이상 의존 시 참조 0 치환(CRIT-5) | 위상 정렬 | 가상태그이고 참조 깊이 3 이상 |\n| K4 | 롤오버 시 0(D1 결정에 따름) | 결정에 따름 | `before > current` |\n| K5 | 원단위 Oracle 중복 행(CRIT-2) | 멱등 | 같은 키 다건 |\n| K6 | Ecosense 루프 기록분(CRIT-10) | 미이관 | `_202001` 출처 |\n| K7 | 가상태그 결측 하위 태그 0 계산 | 0 + `quality=Uncertain` | quality 플래그 |\n| K8 | 체이닝 실패로 가상태그 누락된 분(HIGH-14, 예: 2020-05-15 10:03) | 계산됨 | `LEGACY_ONLY`가 아니라 `DF_ONLY`, 가상태그 |\n| K9 | 15분 피크 `m15_mxmm_kw`는 ×4를 하지 않음(이름은 kW, 실제 kWh). 시·일·월·연 피크만 ×4 | `energy_kwh`·`demand_kw` 둘 다 보관, 비교는 각각 대응 값으로 | 피크 비교 시 단위별 매핑 |\n\n## 8.5 G2 게이트 체크리스트\n\n- [ ] 14일 연속 일일 리포트에서 미분류 `DIFF` 0건\n- [ ] (가) 정상 차이 건수 추이 안정\n- [ ] 전 대상 허용 오차 충족\n- [ ] 결정권자 검토·승인\n"}, {"id": "09", "file": "09_P3_Grafana_Metabase_화면구성.md", "title": "P3 Grafana·
