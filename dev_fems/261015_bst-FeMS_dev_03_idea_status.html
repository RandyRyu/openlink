<script>
const DOCS = [{"id": "00", "file": "00_기안_요약.md", "title": "기안 요약 — FeMS 데이터 플랫폼 이관", "content": "# 00. 기안 요약 — FeMS 데이터 플랫폼 이관\n\n| 항목 | 내용 |\n|---|---|\n| 건명 | 세아베스틸 군산공장 FeMS 데이터의 DataForge 데이터 플랫폼 이관 |\n| 기안일 | 2026-10-15 (2차 개정: DataForge 실제 구조 반영) |\n| 근거 자료 | [작업-02-현행소스분석](../작업-02-현행소스분석/index.html) (운영 서버 2차 복사본, crontab, `fems.monitoring`, MariaDB `SQL_INFO`) |\n| 결정 요청 | ① 이관 방식 선택 ② P1(NiFi 그림자 이관) 착수 승인 ③ 09번 문서의 선행 정보 확보 요청 |\n\n## 1. 목표\n\n현재 운영 중인 FeMS를 **멈추지 않고**, 태그 데이터와 설정 정보를 DataForge 데이터 플랫폼과 VNTG MES로 옮깁니다. 데이터 처리와 고객 화면을 먼저 안정화한 뒤, 검증된 기능부터 하나씩 기존 시스템을 걷어 냅니다.\n\n## 2. DataForge 데이터 플랫폼 (이관 대상)\n\n```mermaid\nflowchart LR\n    SRC[\"KepServerEX(PLC) · 자체 수집 소스<br/>MES · Level-2\"] --> N1[\"NiFi<br/>태그·데이터셋 단위 수신\"]\n    N1 --> K{{\"Kafka\"}} --> N2[\"NiFi<br/>적재\"]\n    N2 --> DB[(\"PostgreSQL · InfluxDB/TimescaleDB · BigQuery\")]\n    DB --> GF[\"Grafana 모니터링\"] & MB[\"Metabase 리포트\"]\n```\n\n이 구조 위에 FeMS를 얹으면, FeMS만의 개발 대상은 **상태를 기억해야 하는 계산(1분 사용량·가상태그) 서비스 하나**로 줄어듭니다. 나머지(수집·적재·화면)는 DataForge 표준 구성으로 처리합니다([10](10_DataForge_표준파이프라인_적용설계.md)).\n\n## 3. 검토한 안\n\n| 안 | 요지 | 현행 소스 수정 | DataForge 기준 판단 |\n|---|---|---|---|\n| **1안** 저장소 이관 | Mongo·MariaDB → PostgreSQL, 현행 소스 수정 | **큼** | 목표(태그 데이터를 PostgreSQL로)는 **4안-B로 소스 수정 없이 달성**. MariaDB는 해체 |\n| **2안** 수집 이관 | Modbus → KepServerEX, Autobase 등 유지 | 큼 | **DataForge 표준 수집 경로와 일치** → P4에 채택 |\n| **3안** 전체 이중화 | DataForge에 전체 구성, 병행 운영 | 없음 | **최종 목표형** — DataForge 표준 + FeMS 계산 서비스 + Grafana·Metabase |\n| 🆕 **4안** NiFi 그림자 이관 | A: 현행 Kafka 원시값 탭 / B: 현행 계산 결과(Mongo·Oracle) 복제 | **0줄** | **출발점** — NiFi 흐름 구성만으로 가능 |\n| 🆕 **5안** 단계적 전환 | 4안 → 자체 계산 병행 → 화면 공식화 → 수집 이관 → 현행 제거 | 없음 | **권고** |\n\n## 4. 권고\n\n**5안을 권고합니다.** 4안(NiFi 그림자 이관)으로 시작해 3안(DataForge 표준 운영)으로 수렴하고, 2안(KepServerEX 수집)은 P4에서 게이트웨이 단위로 진행합니다.\n\n1. **현행 소스를 고치지 않습니다.** 현행 FeMS는 모든 원천을 Kafka `collect` 토픽 하나에 `태그||값||시각||종류||공장` 형식으로 모읍니다. NiFi가 이 토픽과 Mongo 결과 컬렉션을 **읽기만** 하면 됩니다.\n2. **고객 화면을 먼저 엽니다.** 현행이 계산한 결과를 NiFi로 복제(4안-B)하면, 착수 후 약 7~9주부터 Grafana·Metabase에서 **현행 화면과 같은 숫자**를 볼 수 있습니다.\n3. **검증이 쉽습니다.** 현행 결과(`legacy_*`)와 DataForge 자체 계산 결과가 같은 PostgreSQL에 있어 Metabase 비교 대시보드로 매일 확인합니다.\n4. **DataForge 표준을 그대로 씁니다.**\n   - 수집·적재: NiFi\n   - 데이터 버스: Kafka\n   - 화면: Grafana·Metabase\n   - 수집 장비: KepServerEX\n   - 신규 bst_FeMS의 계산 로직(`05_processor`)과 테이블 설계는 재사용합니다.\n5. **현장 위험은 마지막에 한 번씩 감수합니다.** Modbus 게이트웨이에 현행 수집기와 KepServerEX가 동시에 붙으면 충돌할 수 있습니다. 그래서 수집 이관은 게이트웨이 하나씩, 즉시 롤백할 수 있는 절차로 진행합니다.\n\n## 5. 단계 개요 (상세: [08](08_단계별_실행계획_및_검증.md))\n\n| 단계 | 내용 | 현행 영향 | 완료 기준 |\n|---|---|---|---|\n| P0 준비 (3주) | NiFi 접근 경로·전용 계정, DataForge 표준 스키마, MES 데이터셋 대조 | 없음 | 선행 정보 확보 |\n| P1 그림자 이관 (4주) | 원시 탭 + 현행 산출물 복제 + 기준정보 동기화 → **조기 대시보드** | 없음 | 건수·복제 일치 |\n| P2 자체 계산 병행 (6주) | FeMS 계산 서비스, 연속 집계, Heat·원단위 SQL, 비교 리포트 | 없음 | 오차 기준 충족 |\n| P3 화면 공식화 (4주) | Grafana·Metabase를 공식 화면으로, 원본을 DataForge 계산으로 전환 | 조회 화면 사용 중단 | 사용자 승인 |\n| P4 수집 이관 (8주) | KepServerEX → NiFi → Kafka, 게이트웨이 단위 | **제조사별 전환** | 제조사별 2주 무결 |\n| P5 현행 제거 (4주) | 가공 cron, Mongo, MariaDB, 현행 Kafka, Java 화면 | 단계별 정지 | 최종 승인 |\n\n**합계: 약 29주, 23~36인·주 (추정).**\n\n## 6. 문서 구성\n\n| 번호 | 문서 | 내용 |\n|---|---|---|\n| 01 | [현행 구성 및 이관 대상](01_현행_구성_및_이관_대상.md) | 이관 관점의 현행 구조, 의존 관계 |\n| 02 | [1안 — 저장소 이관](02_1안_저장소_이관.md) | 변경 지점 전수, DataForge 기준 재평가 |\n| 03 | [2안 — Modbus 수집 KepServerEX 이관](03_2안_Modbus수집_KepServerEX_이관.md) | 제조사별 파싱 규칙, 이중 폴링 위험 |\n| 04 | [3안 — DataForge 전체 이중화](04_3안_DataForge_전체_이중화.md) | 목표 아키텍처, 병행 운영 |\n| 05 | [추가 제안 — 4안 NiFi 그림자 이관 / 5안 단계적 전환](05_추가제안_Kafka탭_및_단계적전환.md) | 무수정 공급 경로, 보조 아이디어 |\n| 06 | [비교 평가 및 권고안](06_비교평가_및_권고안.md) | 기준별 비교, 결정 요청 |\n| 07 | [데이터 매핑 명세](07_데이터_매핑_명세.md) | 현행 → DataForge 테이블·코드 대응 |\n| 08 | [단계별 실행 계획 및 검증](08_단계별_실행계획_및_검증.md) | 일정·게이트·비교 기준·롤백 |\n| 09 | [리스크, 전제 조건, 확인 필요 정보](09_리스크_전제조건_확인필요정보.md) | 착수 전 확보 목록 |\n| 10 | [DataForge 표준 파이프라인 적용 설계](10_DataForge_표준파이프라인_적용설계.md) | NiFi 흐름 F1~F5, 토픽, 저장소 배치, 계산 위치, 화면 대응 |\n\n## 7. 개정 이력\n\n| 판 | 일자 | 내용 |\n|---|---|---|\n| 1차 | 2026-10-15 | 1~3안 검토, 4안(Kafka 탭 브리지)·5안 제안 |\n| 2차 | 2026-10-15 | DataForge 실제 구조(NiFi·Kafka·PostgreSQL/InfluxDB/TimescaleDB·BigQuery·Grafana·Metabase) 반영. 브리지 코드 → NiFi 흐름, **4안-B(현행 산출물 복제)** 추가, 화면을 Grafana·Metabase로, 일정·공수 재산정(26~43 → 23~36인·주), 10번 문서 신설 |\n\n> 수치(공수·기간)는 현행 소스 분석에 근거한 **추정치**입니다. DataForge 표준 스키마, NiFi·Kafka 버전, KepServerEX 라이선스, 장비 수가 확정되면 다시 산정합니다.\n"}, {"id": "01", "file": "01_현행_구성_및_이관_대상.md", "title": "현행 구성 및 이관 대상", "content": "# 01. 현행 구성 및 이관 대상\n\n> 근거: [작업-02-현행소스분석](../작업-02-현행소스분석/index.html) 전체. 이 문서는 그 내용을 **\"무엇을 옮겨야 하고, 무엇이 무엇에 기대고 있는가\"** 관점으로 다시 묶은 것입니다.\n\n## 1.1 한 장으로 보는 현행 구조\n\n```mermaid\nflowchart LR\n    subgraph SRC[\"원천\"]\n        MB[\"Modbus 계측기<br/>구망 10.1.2.x / 신망 172.31.x.x\"]\n        AB[\"Autobase HMI\"]\n        L2[\"MES Level2<br/>GMES.SPRC3059 등\"]\n    end\n    subgraph COL[\"수집 (Python 3.6)\"]\n        C00[\"mm_00_collect ×9 + _v1(J2)\"]\n        CC[\"mm_collec ⚠미등록\"]\n        CAB[\"mm_Autobase\"]\n        CL2[\"mm_206_lv2_send\"]\n        CVT[\"mm_creatVTag\"]\n    end\n    K{{\"Kafka 2.2.1<br/>topic: collect<br/>tag#124;#124;val#124;#124;time#124;#124;kind#124;#124;fid\"}}\n    subgraph ST[\"적재\"]\n        K2M[\"mm_02 → Mongo collect_YYYYMM\"]\n        K2R[\"mm_07 → Redis\"]\n        K2K[\"mm_21 → topic collect1m\"]\n    end\n    subgraph PR[\"가공 (cron)\"]\n        M1[\"mm_226 1분 → mm_236 가상태그\"]\n        SM[\"mm_246 / mm_24month 요약\"]\n        PK[\"mm_266 피크\"]\n        HT[\"mm_256 / mm_27 Heat\"]\n        BU[\"mm_28 원단위 → Oracle\"]\n        CT[\"mm_146 태그상태 → Oracle\"]\n    end\n    MG[(\"MongoDB SEAH_FEMS<br/>.35:17001\")]\n    ORA[(\"Oracle bestmes<br/>SF_FEMS 기준정보 + GMES(MES)\")]\n    MA[(\"MariaDB fems<br/>SQL_INFO · monitoring\")]\n    FE[\"Java Spring 화면<br/>MyBatis 300 mapper + Mongo 직접 조회\"]\n\n    MB --> C00 & CC\n    AB -->|Mongo Autobase 컬렉션| CAB\n    L2 --> CL2\n    C00 & CC & CAB & CL2 & CVT --> K\n    K --> K2M & K2R & K2K\n    K2M --> MG --> PR --> MG\n    BU & CT --> ORA\n    ORA -. 기준정보·SQL 실행 .-> COL & PR\n    MA -. SQL 본문·감시 목록 .-> COL & PR\n    MG & ORA & K2K --> FE\n```\n\n## 1.2 저장소별 역할과 이관 대상\n\n| 저장소 | 현재 역할 | 누가 쓰나 | 누가 읽나 | 이관 방향(사용자 구상) |\n|---|---|---|---|---|\n| **MongoDB** `SEAH_FEMS` (.35:17001) | 원시값, 1분 사용량, 요약(15분/1시간/일/월), 피크, Heat, Autobase 스냅샷 | `mm_02`, `mm_226`, `mm_236`, `mm_246`, `mm_24month`, `mm_266`, `mm_256`, `mm_27`, `mm_03`(eco 루프), **Autobase HMI(외부)** | 위 가공 스크립트 전부, `mm_28`, `mm_Autobase`, **Java 화면** | DataForge PostgreSQL/TimescaleDB |\n| **MariaDB** `fems` (.34:3306) | SQL 본문(`SQL_INFO` 34행), 접속정보 프로시저 5종, 프로세스 감시 목록(`monitoring`), 오류 로그(`err_log`) | 운영자, 수집기(`err_log`), `monitoring.py` | **거의 모든 스크립트**(`common.my_conn()` 90곳) | DataForge PostgreSQL |\n| **Oracle** `bestmes` (172.31.209.30) | 태그·장비·저장소 라우팅 기준정보, 환산 함수(`FN_ENG_CONVERSION` 등), Oracle 일·월 요약, `TAG_STATUS`. **같은 인스턴스에 MES 스키마 `GMES`** | `mm_28`, `mm_146`, Java 화면(기준정보 관리) | 모든 수집·가공 스크립트, Java 화면 | **유지**(향후 VNTG MES로) |\n| **Redis** | 태그 최신값 캐시 | `mm_07` | `mm_creatVTag`, `mm_146` | DataForge Redis(선택) |\n| **Kafka** `collect`, `collect1m` | 전 원천 통합 버스 / 주요설비 1분 스트림 | 수집기 5종, `mm_21` | `mm_02`, `mm_07`, `mm_21`, Java 화면(WebSocket) | NiFi로 DataForge Kafka에 연결(F1) |\n\n## 1.3 이관 관점에서 중요한 의존 관계 7가지\n\n| # | 사실 | 이관에 주는 의미 | 근거 |\n|---|---|---|---|\n| D1 | 모든 원천이 Kafka `collect` 토픽 하나로 모이고, 메시지 형식은 하나뿐(키 없는 메시지 1개 = 태그 값 1건, 구분자 `\\|\\|`) | **NiFi가 이 토픽 하나만 구독하면 현행 수집 전체를 복제**할 수 있음 → 4안-A의 근거 | 작업-02 01 1.3, `realtime.sendtokafka()` |\n| D2 | Java 화면이 Mongo 요약 컬렉션을 직접 조회(15M 79곳, 1H 31, DAY 47, MONTH 44, PEAK 21, HEAT 10) | Mongo를 없애면 화면도 바꿔야 함 → 1안의 숨은 비용 | 작업-02 07 |\n| D3 | Autobase HMI가 Mongo `Autobase` 컬렉션에 직접 기록 | Mongo를 완전히 없애려면 Autobase 쪽 출력도 바꿔야 함 | 작업-02 04 S2 |\n| D4 | 태그별 저장 위치가 Oracle `TAG_STORE_TABLE_INFO`+`CONNECT_INFO`로 데이터화되어 있으나, 요약·Heat·원단위 5개 배치는 **전기로 4개 태그의 저장소 좌표(`sql_02`)를 대표값으로** 씀 | \"라우팅 테이블만 바꾸면 이관된다\"가 성립하지 않음 | 작업-02 02 2.2 |\n| D5 | 환산(TJ/TOE/tCO2/비용/부하시간대)은 Oracle 함수 `FN_*_CONVERSION`이 계산 | Oracle을 유지하는 동안은 새 시스템도 이 함수를 호출하거나 로직을 옮겨야 함 | `sql_23`, `sql_27` |\n| D6 | Heat·Level2는 MES 스키마(`GMES.SPRB3010`, `SPRI3010`, `SPRC3059`, `SPRF3640` 등)를 직접 조회 | VNTG MES로 바뀌면 이 SQL이 모두 깨짐 → **MES 인터페이스 정의가 이관의 선행 조건** | `sql_04/05/25/28` |\n| D7 | 운영 소스: Python 3.6(지원 종료), git 커밋 0건, 테스트 없음, `osLogger` 소스 없음 | 현행 소스 수정은 그 자체가 고위험 작업 | 작업-02 08 HIGH-1/3/25 |\n\n## 1.4 이관 대상 기능 목록\n\n| 기능 | 현행 구현 | 처리 주기 | DataForge 대응 (2차 개정 — 10번 문서 기준) | 비고 |\n|---|---|---|---|---|\n| Modbus 수집 | `mm_00_collect`(EL/ECO/MI/LS/VI/WON/DA/AUTO/JB), `_v1`(J2), `mm_collec`(MPM/AVT/DEVC/VITZRO) | 매분(제조사별 0/1/5/45초) | KepServerEX → NiFi → Kafka | 2안 대상, P4 |\n| Autobase 수집 | `mm_Autobase`(Mongo `Autobase.VAL` 파이프 문자열 → 태그) | 초 단위 | 유지 또는 OPC-UA 직결 | 위치 기반 매핑(HIGH-6) |\n| Level2 수집 | `mm_206_lv2_send` (`sql_25`) | 매분 | VNTG MES 인터페이스 | MES 의존 |\n| 실시간 가상태그 | `mm_creatVTag` (Redis 기반, `eval`) | 60초 | `virtual_tag` | `eval` 제거 |\n| 원시 적재 | `mm_02` → `collect_YYYYMM` | 실시간 | NiFi 적재 → TimescaleDB/InfluxDB | |\n| 최신값 캐시 | `mm_07` → Redis | 실시간 | 불필요(Grafana가 시계열 DB 직접 조회) | |\n| 주요설비 1분 스트림 | `mm_21` → `collect1m` | 60초 | Grafana 1분 갱신 대시보드 | 실시간 화면 |\n| 1분 사용량 | `mm_226` (3단 필터, 환산 `sql_27`) | 매분 | FeMS 계산 서비스 → `fems.usage.1m` | 핵심 로직 |\n| 1분 가상태그 | `mm_236` (`eval`, 3단 수렴) | 매분(체이닝) | FeMS 계산 서비스 → `fems.vtag.1m` | CRIT-5 결함 |\n| 요약 | `mm_246`/`mm_24month` (15분/1시간/일/월, 전기 00시 기준 별도) | 15분 연속 재계산 | TimescaleDB 연속 집계 | |\n| 피크 | `mm_266` | 15분 | SQL 작업 → `peak_data` | |\n| Heat 에너지 | `mm_256`(전기로), `mm_27`(2차가공) | 07·10시 | NiFi F4(MES) + SQL 작업 | MES 의존 |\n| 원단위 | `mm_28` → Oracle DAY/MONTH | 10:30 | SQL 작업 → Metabase | Oracle 중복 적재 결함 |\n| 태그 상태 | `mm_146` → Oracle `TAG_STATUS` | 15분 | Grafana 알림(마지막 수신 시각) | |\n| 인덱스 선생성 | `mm_create_collect_idx` | 매월 25일 | hypertable 자동 청크 | 불필요해짐 |\n| 프로세스 감시 | `monitoring.py` + `fems.monitoring` | 매분 | NiFi·컨테이너 감시 | |\n| Ecosense 요약 루프 | `eco*.sh` → `mm_03_summary` | 셸 루프(미등록) | **이관 제외 권고** | 202001 컬렉션 하드코딩 결함 |\n| 전기 부하시간대 집계 | `mm_30_val_summary` | 08:30(결과 저장 안 함) | **이관 제외** | 결과를 버림 |\n\n## 1.5 이관하지 않아도 되는 것\n\n- `/home/seah/bestFems`(1세대), `SeAH_DCS`, `SeahModbus`, `FemsCollector`, `temp_python/` — 미사용 잔재(작업-02 03 3.1·3.7·3.8)\n- 미사용 스크립트 60여 개(작업-02 03 3.4 C표)\n- MongoDB의 1세대 DB(`FEMS_5MIN_DATA`, `FEMS_5M_DATA`, `BigDataCollector`, `SEAH_5MIN_DATA`)\n- `SQL_INFO`의 `_test`·구버전 키 17개, `PRO_INFO`/`PRO_USE_SQL`(2019년 이후 미갱신)\n"}, {"id": "02", "file": "02_1안_저장소_이관.md", "title": "1안 — 저장소 이관 (MongoDB·MariaDB → DataForge PostgreSQL)", "content": "# 02. 1안 — 저장소 이관 (MongoDB·MariaDB → DataForge PostgreSQL)\n\n## 2.1 제안 내용 (사용자 구상)\n\n- 현행 FeMS 인프라와 서비스는 그대로 둔다.\n- 태그 데이터 저장소를 **MongoDB → DataForge PostgreSQL**로 바꾼다.\n- **MariaDB 기능 → PostgreSQL**로 옮긴다.\n- 설정 정보는 **Oracle에 그대로** 둔다.\n- 현행 소스를 수정해 새 DB를 쓰게 한다.\n\n```mermaid\nflowchart LR\n    SRC[\"원천\"] --> COL[\"현행 수집기 (그대로)\"] --> K{{\"현행 Kafka\"}}\n    K --> W[\"mm_02 수정<br/>→ PostgreSQL\"]\n    W --> PG[(\"DataForge PostgreSQL<br/>+ TimescaleDB\")]\n    PG --> PR[\"현행 가공 스크립트 수정<br/>pymongo → psycopg2\"] --> PG\n    ORA[(\"Oracle 기준정보 (유지)\")] -.-> COL & PR\n    MAPG[(\"MariaDB 기능 → PostgreSQL<br/>SQL_INFO · monitoring · err_log\")] -.-> COL & PR\n    PG --> FE[\"Java 화면<br/>⚠ Mongo 조회부 수정 필요\"]\n    AB[\"Autobase HMI\"] -->|\"⚠ Mongo에 직접 기록\"| MG[(\"MongoDB<br/>Autobase 컬렉션만 잔존\")]\n    MG --> CAB[\"mm_Autobase\"] --> K\n```\n\n## 2.2 변경 지점 전수 (운영본 기준)\n\n### A. MongoDB 사용 운영 스크립트 — 11개\n\n| 스크립트 | 줄 수 | Mongo 호출 | 바꿔야 할 것 |\n|---|---|---|---|\n| `mm_02_kafka_to_mongo.py` | 190 | 5 | 원시 적재 대상 → `raw_collect` INSERT. 저장소 라우팅(`sql_07/08`) 재해석 |\n| `mm_226_1m_use.py` | 571 | 10 | 원시 조회(`.hint()` 포함) → SQL, `collect_m1` 쓰기 → `usage_1m`. 중앙값 필터 로직은 그대로 |\n| `mm_236_vtag_1m_use.py` | 429 | 5 | `collect_m1` 읽기/쓰기, 하드코딩된 Mongo 주소 |\n| `mm_246_summary.py` | 204 | 17 | Mongo `aggregate($match/$group)` → SQL `GROUP BY`, `delete_many/insert_many` → `DELETE/INSERT` 또는 `UPSERT` |\n| `mm_24month_summary.py` | 191 | 19 | 상동 |\n| `mm_266_peek.py` | 239 | 7 | 피크 상위 주기 승계 로직 |\n| `mm_256_heat.py` | 164 | 4 | Heat 구간 합계 |\n| `mm_27_heat_LNG.py` | 166 | 4 | 상동 |\n| `mm_28_basic_unit.py` | 260 | 6 | 읽기만 Mongo → PG. Oracle 쓰기는 유지 |\n| `mm_Autobase.py` | 185 | 2 | **읽기 대상이 Autobase HMI가 쓰는 Mongo 컬렉션** → Autobase 측 변경 없이는 Mongo 유지 |\n| `mm_create_collect_idx.py` | 69 | 7 | TimescaleDB 사용 시 **폐기**(청크 자동 생성) |\n\n합계 약 2,670줄, Mongo 호출 86곳. `common.py`의 `create_collection()`/컬렉션 분할 규칙도 테이블·파티션 규칙으로 바꿔야 합니다.\n\n### B. MariaDB 사용 지점\n\n| 대상 | 규모 | 바꿔야 할 것 |\n|---|---|---|\n| `common.my_conn('172.17.1.34', 3306, 'root', ..., 'fems')` 하드코딩 | **90곳**(운영 16개 스크립트 + 미사용 포함) | 접속 인자 교체. `common.py`의 `pymysql` → `psycopg2` |\n| 프로시저 5종(`SP_GET_SQL`, `SP_ORACLE_CONN`, `SP_GET_CONNECT_INFO`, `SP_GET_SAVE_INFO`, `SP_GET_SUM_INTERVAL`) | 5개 | PostgreSQL 함수로 재작성. **본문 미확보 4종**(SQL_INFO 외) |\n| `SQL_INFO` 34행 | 운영 키 17개 | 그대로 옮기면 됨. 단 **Oracle에서 실행되는 SQL**이므로 PG 문법 변환은 불필요 |\n| `monitoring.py` | `pymysql.connect` 4곳 | 접속 교체, `fems.monitoring`/`monitoring_log`/`_dtl` 테이블 이관 |\n| `err_log` | `sql_06` | 테이블 이관, INSERT 문 플레이스홀더 `%s` 유지 가능(psycopg2) |\n\n### C. Java 화면 (src_frontend)\n\n| 대상 | 규모 | 바꿔야 할 것 |\n|---|---|---|\n| Spring Data MongoDB 사용 Java 파일 | **113개** | Mongo 쿼리 → JDBC/MyBatis(PostgreSQL) |\n| 요약 컬렉션 참조 | 15M 79곳, 1H 31, DAY 47, MONTH 44, PEAK 21, HEAT 10 | 조회문 재작성 |\n\n> 화면을 고치지 않으면 1안 적용 즉시 화면 데이터가 멈춥니다. 대안은 **이중 쓰기**(Mongo와 PG에 동시 기록)인데, 그러면 Mongo를 없애지 못하고 쓰기 코드만 두 배가 됩니다.\n\n### D. 인프라·런타임\n\n| 항목 | 내용 |\n|---|---|\n| Python 3.6 + `psycopg2` | 3.6을 지원하는 구버전으로 고정 필요(설치 가능 여부 사전 검증). 이미 `cryptography`가 3.6 지원 종료 경고 출력 중 |\n| 네트워크 | 현행 서버(172.17.1.34) → DataForge PostgreSQL 방화벽 개방 |\n| 시간 표현 | 현행은 시각을 **문자열**로 저장·비교(`'2020-09-20 09:31:00.123456'`, `'.000000'` 혼재). PG `timestamptz` 전환 시 비교 로직 전수 확인 |\n\n## 2.3 장점\n\n- 수집·Kafka·Oracle·감시 체계가 그대로라 **원천 쪽 변경이 없음**.\n- 저장소가 하나(PostgreSQL)로 모여 SQL로 분석·연계가 쉬워짐.\n- MariaDB를 없앨 수 있음(단, Mongo는 Autobase 때문에 일부 잔존).\n\n## 2.4 단점과 위험\n\n| 위험 | 수준 | 설명 |\n|---|---|---|\n| 현행 소스 직접 수정 | **높음** | 버전 관리·테스트가 없는 Python 3.6 코드 약 2,700줄 + Java 113파일 수정. 수정 후 회귀를 확인할 기준이 없음 |\n| 현행 결함의 이식 | 높음 | 순서 의존 환산 매칭(CRIT-4), 가상태그 수렴 결함(CRIT-5), 월 누적 리셋 단일 시점(CRIT-3)을 고치지 않으면 새 DB에도 그대로 옮겨짐. 고치면 \"이관\"이 아니라 \"재개발\"이 됨 |\n| 전환 시점의 단절 | 높음 | 쓰기 경로를 바꾸는 순간 Mongo·PG 중 한쪽 데이터가 끊김 → 이중 쓰기 기간 필수 |\n| Autobase 의존 | 중간 | Mongo 완전 제거 불가 |\n| 대표 저장소 하드코딩(`sql_02`) | 중간 | 요약 5개 배치가 전기로 4개 태그의 저장소를 따라가므로, 태그별 이관 시 엉뚱한 저장소를 읽음 |\n| 사용자 목표와의 정합 | 높음 | \"현행 서비스는 그대로 두고\"와 달리 **현행 서비스 자체를 개조**하는 안 |\n\n## 2.5 공수 추정 (참고)\n\n| 작업 | 추정(인·주) |\n|---|---|\n| Python 가공 11개 + common 수정·단위 검증 | 6~8 |\n| MariaDB 프로시저·테이블 이관, 접속부 90곳 교체 | 2~3 |\n| Java 화면 113파일 수정 | 8~12 |\n| 이중 쓰기 기간 운영·정합성 검증 | 4~6 |\n| **합계** | **20~29 인·주** |\n\n## 2.6 판단\n\n**단독 추진은 권장하지 않습니다.** 고치는 대상이 \"곧 걷어 낼 시스템\"이라 투자 대비 남는 것이 적습니다. 다만 아래 두 요소는 다른 안에서도 재사용합니다.\n\n- MariaDB `SQL_INFO`의 운영 SQL 17건 → DataForge 코드 저장소로 옮겨 버전 관리([07](07_데이터_매핑_명세.md) 7.3).\n- Mongo 과거 데이터 → PostgreSQL 일괄 이관 절차(백필, [08](08_단계별_실행계획_및_검증.md) P1).\n\n## 2.7 DataForge 기준 재평가 (2차 개정)\n\nDataForge는 NiFi로 외부 저장소를 읽어 Kafka·PostgreSQL에 적재하는 것이 표준입니다. 따라서 1안의 목표는 **현행 소스를 고치지 않고** 다음과 같이 달성할 수 있습니다.\n\n| 1안 목표 | DataForge 방식 | 현행 수정 |\n|---|---|---|\n| 태그 데이터를 Mongo가 아닌 PostgreSQL에 | NiFi가 Mongo `collect_m1`·요약·피크·Heat를 증분 복제(4안-B) + 원시값은 Kafka 탭(4안-A) | 없음 |\n| MariaDB 기능을 PostgreSQL로 | 이관하지 않고 해체: SQL → NiFi 흐름·계산 서비스, 감시 → NiFi·컨테이너, 오류 로그 → 로그 수집 | 없음 |\n| Oracle 설정 유지 | NiFi F3로 단방향 동기화 | 없음 |\n\n→ **1안은 4안-B로 대체합니다.** 현행 Python·Java를 수정하는 작업(20~29인·주)이 NiFi 흐름 구성(약 3~5인·주)으로 바뀝니다. 상세: [05](05_추가제안_Kafka탭_및_단계적전환.md), [10](10_DataForge_표준파이프라인_적용설계.md).\n"}, {"id": "03", "file": "03_2안_Modbus수집_KepServerEX_이관.md", "title": "2안 — Modbus 수집을 KepServerEX로 이관 + 저장소 이관", "content": "# 03. 2안 — Modbus 수집을 KepServerEX로 이관 + 저장소 이관\n\n## 3.1 제안 내용 (사용자 구상)\n\n- 현행 FeMS 인프라와 서비스는 그대로 둔다.\n- **Modbus 수집만 DataForge의 KepServerEX로** 옮긴다.\n- Autobase, Citect 등 자체 시스템을 쓰는 수집은 그대로 둔다.\n- 태그 데이터는 DataForge PostgreSQL로 옮긴다.\n- 설정은 Oracle에 유지하고, MariaDB 기능은 PostgreSQL로 옮긴다(1안과 동일).\n\n```mermaid\nflowchart LR\n    subgraph FIELD[\"현장 Modbus 게이트웨이\"]\n        GW[\"구망 10.1.2.x:1470<br/>신망 172.31.x.x:502/1470\"]\n    end\n    KEP[\"DataForge KepServerEX<br/>Modbus 드라이버\"]\n    OLD[\"현행 mm_00_collect / mm_collec\"]\n    GW -->|\"⚠ 같은 게이트웨이에<br/>두 마스터 동시 접속\"| KEP\n    GW --> OLD\n    KEP --> BR[\"DataForge NiFi\"]\n    BR --> DFK{{\"DataForge Kafka\"}} --> DFPG[(\"DataForge PostgreSQL · TimescaleDB\")]\n    BR -.->|\"레거시 형식으로 역공급<br/>tag#124;#124;val#124;#124;time#124;#124;kind#124;#124;fid\"| LK{{\"현행 Kafka collect\"}}\n    OLD --> LK\n    AB[\"Autobase · Level2<br/>(현행 유지)\"] --> LK\n```\n\n> **Citect 관련**: 운영 서버의 Citect 연동 흔적은 윈도우 전용 `pyctapi` 래퍼뿐이며 리눅스에서 동작하지 않습니다(작업-02 01 1.5). 현재 FeMS가 Citect에서 실제로 받는 데이터는 확인되지 않았습니다. \"유지 대상\"은 사실상 **Autobase**(Mongo 경유)와 **MES Level2**(Oracle `GMES` 경유)입니다.\n\n## 3.2 이관 대상 Modbus 수집 — 제조사별 처리 규칙\n\n현행 수집기의 제조사별 처리를 KepServerEX 설정으로 옮겨야 합니다. 대부분 데이터 타입·워드 순서 설정으로 해결되지만, **블록 분해·합산·보정**은 KepServerEX만으로 어려워 후단 처리가 필요합니다.\n\n| 제조사 | 장비 | 현행 처리 | KepServerEX 대응 | 난이도 |\n|---|---|---|---|---|\n| JB / J2 | SF2200 가스보정기 | Func 03, 16워드 블록 1회 → 5개 태그(무보정·보정 적산 `!L`, 온도·압력·보정계수 `!f`) | 태그 5개를 개별 주소로 정의, 블록 읽기는 드라이버가 최적화. J2는 CRC 계산 시 JB로 취급 | 중 |\n| EL | Elinko GSU | 적산값을 **정수부(`!I`) + 소수부(`!f`) 합산** | 두 태그를 읽고 파생 태그(Advanced Tags) 또는 후단 Processor에서 합산 | **상** |\n| LS | GIMAC-i | Func 04, `!f` × `CORRECT_RATIO`, NaN 제외 | Float + 스케일링 | 하 |\n| VI | VIPAM3300 | `E2`면 8바이트 `!d` 바이트 스왑, 그 외 `!f` 워드 스왑 | Double/Float + 바이트·워드 순서 옵션 | 중 |\n| ECO / MI / WON | ES-WCTN / ME110NSR / 원 | `dtype` 11 → `!f`, 03 → 2바이트 `!i`, 05 → `!i`. WON은 포트 502 | 태그별 데이터 타입 지정 | 하 |\n| DA | 대성 가스보정기 | 13바이트 응답 `!d`, 레지스터 행 `07` `!i`, 그 외 `!f` | 태그별 타입 지정(규칙 문서화 필요 — HIGH-20) | 중 |\n| AUTO | 오토플로우 가스보정기 | 8바이트 응답이면 슬레이브 바이트 보정 후 **워드 스왑 `!f`** | 워드 순서 옵션. 응답 누락 보정은 드라이버 처리 여부 확인 | 중 |\n| MPM / AVT / DEVC / VITZRO | 신망 장비(`mm_collec`, `.conf` 기반) | 길이 코드별 바이트 재배열 | 태그별 타입·순서 지정 | 중 |\n\n**공통 처리** (KepServerEX 밖에서 필요)\n\n- `TAG_MASTER` 화이트리스트 매칭, `CORRECT_RATIO` 곱셈, `kind`·`factory_id` 부여 → NiFi 레코드 변환 또는 FeMS 계산 서비스에서 Oracle 기준정보(F3 동기화본)로 처리\n- 태그 ID 규칙 `{DEVICE_ID}_{ITEM}` 유지(현행 데이터와 이어 붙이기 위함)\n- 장비 목록 출처 일원화: 현행은 Oracle `DEVICE_MASTER`(mm_00_collect)와 로컬 `.conf`(mm_collec) 두 곳 → KepServerEX 프로젝트로 일원화하면서 Oracle과 대조\n\n## 3.3 핵심 위험 — 같은 게이트웨이에 두 마스터\n\n현행 장비 대부분은 **Modbus RTU를 TCP로 감싼 시리얼 게이트웨이**(포트 1470)입니다. 이런 게이트웨이는 보통 다음 제약이 있습니다.\n\n- 동시 TCP 접속 수 제한(1~4개가 흔함)\n- 시리얼 버스는 한 번에 한 요청만 처리 → 두 마스터의 요청이 섞이면 응답 혼선·타임아웃\n\n현행 수집기도 이미 이를 의식해 제조사별로 수집 초를 나눠 두었습니다(기본 0초, JB 1초, J2 5초, VI 45초).\n\n| 운영 방식 | 설명 | 판단 |\n|---|---|---|\n| 동시 폴링(병행) | 현행과 KepServerEX가 같은 장비를 함께 읽음 | 게이트웨이별 동시 접속 한도를 **사전 시험**한 뒤에만 허용 |\n| 시간 분할 | KepServerEX 폴링을 비어 있는 초에 배치 | 충돌은 줄지만 장비 응답 시간이 길면 겹침 |\n| **게이트웨이 단위 전환** | 한 게이트웨이씩 현행 수집기를 끄고 KepServerEX로 넘김 | **권장.** 전환 시 레거시 Kafka로 역공급해 현행 화면 유지 |\n\n## 3.4 \"현행 서비스 유지\"를 지키려면 — NiFi 역공급\n\nModbus 수집을 KepServerEX로 넘기고 현행 수집기를 끄면, 현행 가공·화면은 그 장비 데이터를 잃습니다. 현행을 계속 살려 두려면 **KepServerEX 값을 현행 Kafka `collect` 토픽에 현행 형식으로 다시 넣는 흐름**(NiFi `PublishKafka`)이 필요합니다.\n\n```\n{TAG_ID}||{VALUE×CORRECT_RATIO}||{YYYY-MM-DD HH:MM:SS.ffffff}||{DEVICE_USE}||{FACTORY_ID}\n```\n\n- 시각 문자열은 현행과 같은 마이크로초 포함 형식이어야 함(현행 비교 로직이 문자열 비교)\n- 수집 주기를 현행과 맞춰야 함: `mm_226`은 15분 창의 **중앙값**을 쓰므로 표본 수가 크게 달라지면 결과가 달라짐\n- KepServerEX → DataForge 연결은 **DataForge 표준 경로(KepServerEX → NiFi → Kafka)**를 그대로 씁니다. 역공급도 NiFi `PublishKafka`로 현행 브로커에 발행하면 되므로 별도 개발이 필요 없습니다.\n\n## 3.5 장점\n\n- 수집 계층이 상용 제품(KepServerEX)으로 바뀌어 **드라이버 유지보수·진단 도구**를 얻음.\n- 장비 목록이 하나의 KepServerEX 프로젝트로 모임(현행의 `DEVICE_MASTER`/`.conf` 이원화 해소).\n- 현행 수집기의 알려진 결함(CRC 미검증 HIGH-5, 수집 주기 예산 초과 HIGH-4, 관리 밖 `mm_collec` HIGH-18)이 함께 사라짐.\n\n## 3.6 단점과 위험\n\n| 위험 | 수준 | 설명 |\n|---|---|---|\n| 게이트웨이 동시 접속 | **높음** | 3.3절 |\n| 제조사별 특수 파싱 | 중간 | EL 합산, AUTO 응답 보정 등은 KepServerEX 밖 처리 필요 |\n| 1안의 모든 위험 | 높음 | 저장소 이관 부분은 1안과 동일(현행 소스·화면 수정) |\n| 라이선스·용량 | 중간 | KepServerEX 태그 수 라이선스, 드라이버 구성(Modbus Ethernet / RTU over TCP 캡슐화) 확인 필요 |\n| 네트워크 | 중간 | DataForge(KepServerEX) → 구망 10.1.2.x, 신망 172.31.x.x 경로 개방 |\n\n## 3.7 공수 추정 (참고)\n\n| 작업 | 추정(인·주) |\n|---|---|\n| KepServerEX 프로젝트 구성(제조사 코드 14종, 태그 설정·검증) | 4~6 |\n| NiFi 흐름(KepServerEX → DataForge Kafka, 레거시 역공급) | 1~2 |\n| 게이트웨이별 동시 접속 시험·전환(게이트웨이 수에 비례) | 3~6 |\n| 1안의 저장소 이관분 | 20~29 |\n| **합계** | **29~44 인·주** |\n\n## 3.8 판단\n\n**수집 이관 자체는 필요하지만, 1안과 묶어 한 번에 하는 것은 권장하지 않습니다.** 저장소 이관(1안 부분)을 빼고, \"데이터 정합성이 검증된 뒤 게이트웨이 단위로 넘기는 단계\"로 5안 로드맵의 P5에 넣습니다([06](06_비교평가_및_권고안.md)). 이때 KepServerEX와 신규 bst_FeMS `03_collector` 중 무엇을 쓸지는 제조사별로 정할 수 있습니다(특수 파싱이 많은 EL·AUTO는 자체 수집기가 유리할 수 있음).\n\n## 3.9 DataForge 기준 재평가 (2차 개정)\n\n| 항목 | 1차 기안 | DataForge 기준 |\n|---|---|---|\n| KepServerEX 출력 | MQTT/REST → 별도 브리지 개발 | **DataForge 표준 경로 KepServerEX → NiFi → Kafka** 재사용 |\n| 레거시 역공급 | 브리지 개발 | NiFi `PublishKafka`(현행 브로커, 현행 문자열 형식) |\n| 특수 파싱(EL 합산, AUTO 응답 보정 등) | KepServerEX 파생 태그 또는 후단 처리 | KepServerEX 파생 태그, NiFi 레코드 변환, 또는 **DataForge 자체 수집 소스** 중 선택 |\n| 저장소 이관(1안 부분) | 2안에 포함 | 4안-B로 대체 → 2안은 **수집 이관만** 남음 |\n| 공수 | 29~44인·주 | 수집 이관분 **5~8인·주**(08 P4) |\n\n→ 2안은 DataForge 표준 수집 경로와 일치하므로 **P4 단계로 채택**합니다. 게이트웨이 이중 폴링 위험(3.3)은 그대로이므로 게이트웨이 단위 전환 절차를 지킵니다.\n"}, {"id": "04", "file": "04_3안_DataForge_전체_이중화.md", "title": "3안 — DataForge 데이터 플랫폼에 전체 시스템 이중화", "content": "# 04. 3안 — DataForge 데이터 플랫폼에 전체 시스템 이중화\n\n> 2차 개정(2026-10-15): DataForge 실제 구조(NiFi·Kafka·PostgreSQL/InfluxDB/TimescaleDB·BigQuery·Grafana·Metabase) 기준으로 목표 아키텍처를 다시 그렸습니다.\n\n## 4.1 제안 내용 (사용자 구상)\n\n현행 인프라 전체를 그대로 두고, DataForge 데이터 플랫폼에 **전체 시스템을 새로 구성**해 이중화 운영합니다. DataForge가 안정되면 현행을 정리합니다.\n\n## 4.2 목표 아키텍처 — DataForge 표준 + FeMS 계산 서비스\n\n```mermaid\nflowchart TB\n    subgraph LEGACY[\"현행 FeMS (그대로 운영)\"]\n        LSRC[\"수집기 · Autobase · Level2\"] --> LK{{\"Kafka 2.2.1 collect\"}}\n        LK --> LMG[(\"MongoDB\")] --> LFE[\"Java 화면\"]\n        LORA[(\"Oracle 기준정보 + GMES\")]\n    end\n\n    subgraph DF[\"DataForge 데이터 플랫폼\"]\n        KEP[\"KepServerEX / 자체 수집 소스<br/>(P4부터)\"]\n        NI[\"NiFi 수집 흐름<br/>F1 원시 탭 · F2 산출물 복제<br/>F3 기준정보 · F4 MES · F5 KepServerEX\"]\n        DK{{\"DataForge Kafka<br/>fems.*\"}}\n        CALC[\"FeMS 계산 서비스<br/>1분 사용량 · 가상태그\"]\n        NO[\"NiFi 적재 흐름\"]\n        TS[(\"TimescaleDB / InfluxDB\")]\n        PG[(\"PostgreSQL\")]\n        BQ[(\"BigQuery\")]\n        GF[\"Grafana\"]\n        MB[\"Metabase\"]\n        KEP --> NI --> DK\n        DK --> CALC --> DK\n        DK --> NO --> TS & PG & BQ\n        TS & PG --> GF\n        PG & BQ --> MB\n    end\n\n    LK -->|\"F1 (현행 영향 없음)\"| NI\n    LMG -->|\"F2\"| NI\n    LORA -->|\"F3 · F4\"| NI\n    VNTG[\"VNTG MES\"] -.->|\"MES 전환 후 F4 교체\"| NI\n```\n\n상세 흐름·토픽·저장소 배치는 [10](10_DataForge_표준파이프라인_적용설계.md)을 참고하세요.\n\n## 4.3 기능별 대응 (현행 → DataForge)\n\n| 현행 | DataForge | 구성 방식 | 상태 |\n|---|---|---|---|\n| Modbus 수집 `mm_00_collect`·`_v1`·`mm_collec` | KepServerEX → NiFi → `fems.raw` | 표준 구성 | P4 |\n| Autobase·Level-2·실시간 가상태그 수집 | 초기: 현행 Kafka 탭(F1) / 이후: DataForge 수집 또는 MES 데이터셋(F4) | NiFi | P1 / P5 |\n| `mm_02` 원시 적재 | NiFi 적재 → 시계열 DB | 표준 구성 | P1 |\n| `mm_07` Redis 캐시, `mm_21` `collect1m` | Grafana가 시계열 DB를 직접 조회 | 불필요 | - |\n| `mm_226` 1분 사용량 | **FeMS 계산 서비스**(bst_FeMS `05_processor` 재사용) | 개발(조정) | P2 |\n| `mm_236` 가상태그 | FeMS 계산 서비스(`eval` 미사용, 위상 정렬) | 개발(조정) | P2 |\n| `mm_246`/`mm_24month` 요약 | TimescaleDB 연속 집계(06시·00시 기준) | SQL | P2 |\n| `mm_266` 피크 | SQL 연속 집계·스케줄 작업 | SQL | P2 |\n| `mm_256`/`mm_27` Heat | F4 MES 데이터 + 1분 사용량 SQL 작업 | NiFi + SQL | P2 |\n| `mm_28` 원단위 | SQL 작업 → Metabase | SQL | P2 |\n| `mm_146` 태그 상태 | NiFi·Grafana 알림(마지막 수신 시각 기준) | 표준 구성 | P2 |\n| `monitoring.py` 프로세스 감시 | NiFi·컨테이너 감시 | 표준 구성 | - |\n| 환산(TJ/TOE/tCO2/비용/부하시간대) | Oracle `FN_*` 로직 이식 후 계산 서비스 또는 DB 함수 | 개발 | P2 |\n| Java 조회 화면(MyBatis 300 + Mongo 113파일) | **Grafana(모니터링)·Metabase(리포트)** | 대시보드 구성 | P1'~P3 |\n| Java 관리 화면(기준정보·가상태그 수식·목표·ISMART 입력) | 이관 기간 현행 유지 → VNTG MES 또는 DataForge 관리 화면 | - | P5 |\n\n## 4.4 데이터 공급 — 이중화의 핵심 쟁점\n\n| 방법 | 설명 | 현행 영향 | 위험 |\n|---|---|---|---|\n| A. 장비 이중 폴링 | DataForge(KepServerEX)가 현장 장비를 직접 읽음 | 없음(소스) | **게이트웨이 동시 접속 충돌**(03 3.3) |\n| B. **현행 Kafka 탭(NiFi F1)** | 현행 `collect` 토픽을 전용 소비 그룹으로 구독 | **없음** | 현행 Kafka 장애 시 함께 끊김 |\n| C. **현행 산출물 복제(NiFi F2)** | Mongo 결과 컬렉션·Oracle 원단위를 증분 복제 | 없음 | 현행 결함도 함께 복제 |\n\n**B와 C를 함께 쓰는 것을 권장합니다.** C로 고객 화면을 먼저 열고, B로 DataForge 자체 계산을 검증합니다. A(수집 이관)는 정합성 검증 후 게이트웨이 단위로 진행합니다(P4).\n\n## 4.5 설정 정보 — Oracle과 DataForge\n\n| 단계 | 기준정보 원본 | DataForge |\n|---|---|---|\n| P1~P4 | Oracle(`TAG_MASTER`, `DEVICE_MASTER`, `VIRTUAL_TAG_FORMULA`, `CODEDETAIL` 등) | NiFi F3로 PostgreSQL에 단방향 동기화(읽기 전용) |\n| P5 이후 | VNTG MES 또는 DataForge 관리 화면 | 원본 전환 |\n\n## 4.6 장점\n\n- **현행을 전혀 건드리지 않음** — 사용자 목표와 가장 잘 맞음.\n- **DataForge 표준 구성 재사용** — 수집·적재·화면은 표준 도구, FeMS 고유 개발은 계산 서비스 하나.\n- **같은 DB에서 비교 검증** — 현행 결과(`legacy_*`)와 DataForge 결과를 Metabase로 매일 대조.\n- 현행 결함(CRIT-1/3/4/5/6 등)을 새 쪽에서 처음부터 제거.\n\n## 4.7 단점과 위험\n\n| 위험 | 수준 | 설명 |\n|---|---|---|\n| 이중 운영 비용 | 중간 | 병행 기간 동안 현행 + DataForge 자원 |\n| 결과 차이 해석 | 중간 | \"알려진 차이 목록\"(08 8.3)으로 관리 |\n| 관리 기능 공백 | 중간 | Grafana·Metabase는 입력 기능이 없음 → 관리 화면은 현행 유지 후 VNTG MES 등으로 |\n| MES 의존 | 높음 | Heat·Level-2가 GMES 직접 조회 → DataForge 기존 MES 수집분 재사용 여부와 VNTG MES 일정이 관건 |\n| 원시 저장소 선택 | 낮음 | DataForge 표준이 InfluxDB라면 1분 사용량 이후는 TimescaleDB/PostgreSQL로 분리 배치(10 10.4) |\n\n## 4.8 공수 추정 (참고)\n\n| 작업 | 추정(인·주) |\n|---|---|\n| NiFi 흐름 F1~F4 구성·백필 | 3~5 |\n| FeMS 계산 서비스 조정(입출력·3단 필터 규칙·환산) | 4~6 |\n| 연속 집계·피크·Heat·원단위 SQL | 3~4 |\n| Grafana·Metabase 대시보드(조기 + 공식) | 4~6 |\n| 병행 검증·비교 리포트 | 3~4 |\n| 수집 이관(KepServerEX, 게이트웨이 단위) | 5~8 |\n| 준비·제거 | 3~5 |\n| **합계** | **23~36 인·주** (1차 기안 26~43에서 감소) |\n\n## 4.9 판단\n\n**최종 목표형으로 채택합니다.** 데이터 공급은 NiFi로 현행 Kafka 탭(F1)과 산출물 복제(F2)를 함께 쓰고, 수집 이관(2안)은 P4에서 진행합니다.\n"}, {"id": "05", "file": "05_추가제안_Kafka탭_및_단계적전환.md", "title": "추가 제안 — 4안 NiFi 그림자 이관(A 원시 탭 · B 산출물 복제) / 5안 단계적 전환", "content": "# 05. 추가 제안 — 4안 NiFi 그림자 이관(A 원시 탭 · B 산출물 복제) / 5안 단계적 전환\n\n> 2차 개정(2026-10-15): DataForge의 실제 구조(NiFi → Kafka → NiFi → PostgreSQL·InfluxDB/TimescaleDB·BigQuery → Grafana·Metabase)를 반영했습니다. 1차의 \"브리지 코드 개발\"은 **NiFi 흐름 구성**으로 바뀌었고, **현행 계산 결과를 그대로 복제하는 4안-B**를 추가했습니다. NiFi 흐름 상세는 [10](10_DataForge_표준파이프라인_적용설계.md).\n\n---\n\n## 5.1 4안 — NiFi 기반 그림자(Shadow) 이관\n\n현행 FeMS를 한 줄도 고치지 않고, DataForge NiFi가 현행 데이터를 **두 갈래**로 가져옵니다.\n\n```mermaid\nflowchart LR\n    subgraph LEG[\"현행 FeMS (변경 없음)\"]\n        SRC[\"수집기 5종\"] --> LK{{\"Kafka 2.2.1 collect\"}}\n        LK --> PROC[\"현행 가공 cron\"] --> MG[(\"MongoDB<br/>collect_m1 · 요약 · 피크 · Heat\")]\n        ORA[(\"Oracle<br/>원단위 · TAG_STATUS · 기준정보\")]\n    end\n    LK -->|\"4안-A 원시 탭<br/>NiFi ConsumeKafka\"| DFK{{\"DataForge Kafka\"}}\n    MG -->|\"4안-B 산출물 복제<br/>NiFi 증분 조회·UPSERT\"| DFK\n    ORA -->|\"기준정보 동기화\"| DFK\n    DFK -->|NiFi 적재| DB[(\"PostgreSQL · TimescaleDB · BigQuery\")]\n    DB --> GF[\"Grafana\"] & MB[\"Metabase\"]\n```\n\n### 4안-A. 원시값 탭 — DataForge가 직접 계산하기 위한 입력\n\n| 항목 | 내용 |\n|---|---|\n| 착안점 | 현행의 5개 원천(Modbus·Autobase·Level-2·실시간 가상태그·신규 장비)이 **모두 Kafka `collect` 토픽 하나에 같은 형식**(`태그\\|\\|값\\|\\|시각\\|\\|종류\\|\\|공장`)으로 모임 |\n| 현행 소비자 | `mm_02`, `mm_07`, `mm_21` — 셋 다 `group_id` 없이 접속(소비 그룹·오프셋 커밋 없음) → NiFi가 전용 그룹으로 붙어도 서로 간섭 없음 |\n| 구현 | NiFi `ConsumeKafka`(그룹 `dataforge-shadow`) → 파싱(`\\|\\|` 두 글자 구분자: GrokReader 또는 치환) → 시각 변환 → `fems.raw` 발행 |\n| 용도 | DataForge 자체 계산(1분 사용량·가상태그·요약)의 입력. 현행과 **같은 입력**이므로 결과 비교가 공정 |\n| 한계 | 현행 Kafka·수집기 장애 시 함께 끊김. 이미 `CORRECT_RATIO`가 곱해진 값이라 원천 재해석 불가 |\n\n### 4안-B. 현행 산출물 복제 — 🆕 고객에게 가장 빨리 보여 주는 길\n\n| 항목 | 내용 |\n|---|---|\n| 착안점 | 현행이 매분·15분마다 계산해 Mongo에 쌓는 결과(`collect_m1`, 요약 4종, 피크, Heat)와 Oracle 원단위·`TAG_STATUS`를 **그대로 복제**하면, DataForge 계산이 완성되기 전에도 Grafana·Metabase로 서비스할 수 있음 |\n| 구현 | NiFi로 Mongo 증분 조회(시각 문자열 비교) → `fems.legacy.*` → PostgreSQL `legacy_*` 테이블 **UPSERT** |\n| 주의 | 현행 요약은 \"지금까지의 누적\"을 15분마다 지우고 다시 씀 → 진행 중인 시간·일·월 구간을 매번 다시 읽어 **갱신**해야 함 |\n| 효과 | ① 고객이 **현행 화면과 같은 숫자**를 Grafana·Metabase에서 바로 확인 ② DataForge 자체 계산 결과와 **같은 DB 안에서 SQL 한 번으로 비교** ③ 사용자 1안의 의도(태그 데이터를 PostgreSQL로)를 **현행 소스 수정 없이** 달성 |\n| 한계 | 현행 결함(CRIT-3/4/5 등)도 그대로 복제됨 → 4안-A 기반 자체 계산으로 교체하기 전까지의 임시 원본 |\n\n### 현행에 주는 영향\n\n| 항목 | 영향 |\n|---|---|\n| 현행 소스·설정 | **없음** |\n| 현행 Kafka | NiFi 소비자 1개 추가(읽기). 브로커 보존 기간 내에서만 재처리 가능 |\n| MongoDB | 증분 조회 부하(1분·15분 주기). 조회는 기존 인덱스(`tag`·`time`) 범위 안에서 수행 |\n| Oracle | 기준정보·원단위 주기 조회(일 1회~15분) |\n| 네트워크·계정 | NiFi → 172.17.1.34:9092, 172.17.1.35:17001, 172.31.209.30:1521 접근. **NiFi 전용 읽기 계정** 신규 발급(현행 `root`/`SF_FEMS` 재사용 금지) |\n\n---\n\n## 5.2 5안 — 단계적 교살자(Strangler Fig) 전환 ★ 권고\n\n새 시스템이 옛 시스템을 **기능 단위로 감싸며 하나씩 대체**합니다. 4안-B로 고객 화면을 먼저 열고, 4안-A로 자체 계산을 검증한 뒤, 수집(2안 방식)을 마지막에 넘깁니다.\n\n```mermaid\nflowchart LR\n    P0[\"P0 준비<br/>NiFi 접근·스키마·계정\"] --> P1[\"P1 그림자 이관<br/>4안-A + 4안-B + 기준정보\"]\n    P1 --> P2[\"P2 자체 계산 병행<br/>계산 서비스 · 연속 집계 · Heat\"]\n    P2 --> P3[\"P3 화면 전환<br/>Grafana · Metabase 공식화\"]\n    P3 --> P4[\"P4 수집 이관<br/>KepServerEX 게이트웨이 단위\"]\n    P4 --> P5[\"P5 현행 제거\"]\n    P1 -.->|\"고객 화면 조기 개통<br/>(현행 산출물 기준)\"| GV[\"Grafana · Metabase\"]\n    P2 -.->|\"게이트: 비교 대시보드 기준 충족\"| P3\n    P4 -.->|\"게이트: 제조사별 2주 무결\"| P5\n```\n\n### 단계별 \"무엇을 끄는가\"\n\n| 단계 | DataForge가 맡게 되는 것 | 현행에서 끌 수 있는 것 |\n|---|---|---|\n| P1 | 데이터 보관, 조회 화면(현행 산출물 기준) | 없음 |\n| P2 | 계산(병행) | 없음 |\n| P3 | 공식 조회 화면·리포트, 계산 결과 원본 | Java **조회** 화면, Mongo 산출물 복제(4안-B 흐름) |\n| P4 (제조사별) | Modbus 수집 | `mm_00_collect -d {제조사}`, `_v1`, `mm_collec` |\n| P5 | Autobase·Level-2 수집(또는 MES 데이터셋), 관리 기능 | 가공 cron, Mongo, MariaDB, 현행 Kafka, Java 관리 화면 |\n\nP4 진행 중에도 현행 계산이 필요하면 KepServerEX 값을 NiFi로 현행 Kafka `collect`에 **현행 형식으로 역공급**합니다(NiFi `PublishKafka`, [03](03_2안_Modbus수집_KepServerEX_이관.md) 3.4).\n\n---\n\n## 5.3 보조 아이디어\n\n| # | 아이디어 | 효과 | 단계 |\n|---|---|---|---|\n| I1 | **\"알려진 차이 목록\"을 먼저 정의**(CRIT-3 월 누적, CRIT-4 환산 순서 매칭, CRIT-5 가상태그 0 치환, 롤오버, `bulk basic` 중복 등) | 4안-B(현행) 대 자체 계산 차이를 \"버그 수정인지 오류인지\" 바로 판정 | P2 이전 |\n| I2 | **MariaDB는 이관하지 않고 해체**: `SQL_INFO` 운영 SQL은 NiFi 흐름·계산 서비스 코드로, `monitoring`은 NiFi·컨테이너 감시로, `err_log`는 로그 수집으로 | MariaDB → PostgreSQL 작업 자체가 불필요 | P1~P3 |\n| I3 | **Oracle 환산 함수 대조 시험**(`FN_ENG_CONVERSION` 등 vs DataForge 환산) | 비용·TJ 차이 사전 제거, `tj` 단위 문제(작업-02 MED-23) 확정 | P2 |\n| I4 | **MES·Level-2는 DataForge 기존 수집분 우선 활용**: FeMS가 쓰는 GMES 테이블이 이미 DataForge 데이터셋에 있으면 재사용, 없으면 NiFi `ExecuteSQLRecord`로 추가 | 중복 수집 방지, VNTG MES 전환 시 NiFi 흐름만 교체 | P1~P2 |\n| I5 | **비교 대시보드를 Metabase로**: `legacy_*` 대 DataForge 결과의 태그·구간별 오차를 일일 리포트로 | 병행 검증을 고객·운영자가 직접 확인 | P2 |\n| I6 | **Mongo CDC(Change Streams)** | 4안-B의 실시간성 향상 | 비권장 — 단일 인스턴스면 불가(복제셋 필요), 증분 조회로 충분 |\n| I7 | **Ecosense 루프·`mm_30` 등 결함 기능은 이관 제외** | 범위 축소 | 범위 확정 시 |\n| I8 | **관리(입력) 기능은 마지막까지 현행 유지**: 태그·장비·가상태그 수식, 목표·ISMART 입력은 Grafana·Metabase로 대체 불가 → Oracle + 현행 Java 관리 화면 유지 후 VNTG MES 또는 DataForge 관리 화면으로 | 화면 전환 범위를 조회 기능으로 한정 | P3~P5 |\n| I9 | **BigQuery는 장기·전사 분석 계층으로**: 원시·1분 데이터의 장기 보관과 타 공장 결합 분석 | 운영 DB 용량 부담 감소 | P2 이후 |\n"}, {"id": "06", "file": "06_비교평가_및_권고안.md", "title": "비교 평가 및 권고안", "content": "# 06. 비교 평가 및 권고안\n\n> 2차 개정(2026-10-15): DataForge 실제 구조(NiFi·Kafka·PostgreSQL/InfluxDB/TimescaleDB·BigQuery·Grafana·Metabase) 기준으로 다시 평가했습니다.\n\n## 6.1 DataForge 구조가 각 안에 주는 영향\n\n| 안 | 1차 평가 | DataForge 기준 재평가 |\n|---|---|---|\n| 1안 저장소 이관(현행 소스 수정) | 단독 추진 비권장 | **목표는 4안-B로 달성 가능.** Mongo 데이터를 PostgreSQL로 옮기는 일은 NiFi 복제로 소스 수정 없이 됨. MariaDB → PostgreSQL은 해체로 대체 |\n| 2안 Modbus 수집 → KepServerEX | 마지막 단계로 흡수 | **DataForge 표준 수집 경로(KepServerEX → NiFi → Kafka)와 일치** → 채택 확정. 게이트웨이 이중 폴링 위험은 그대로라 P4에 배치 |\n| 3안 전체 이중화 | 최종 목표형 | **DataForge 표준 파이프라인 + FeMS 계산 서비스 + Grafana·Metabase**로 구체화. 신규 React 화면·API 개발 범위가 크게 줄어듦 |\n| 4안 Kafka 탭 | 출발점(브리지 코드) | **NiFi 흐름 구성**으로 개발 코드 없음. 산출물 복제(4안-B) 추가 |\n| 5안 단계적 전환 | 권고 | 권고 유지. P1에서 **고객 화면을 조기 개통**하도록 순서 조정 |\n\n## 6.2 평가 기준\n\n| 기준 | 질문 | 가중치 |\n|---|---|---|\n| G1 현행 무중단 | 이관 중 현행 서비스가 멈추거나 바뀌는가 | 높음 |\n| G2 현행 소스 수정량 | 테스트·버전 관리 없는 현행 코드를 고치는가 | 높음 |\n| G3 검증 가능성 | 새 결과가 맞는지 객관적으로 확인할 수 있는가 | 높음 |\n| G4 DataForge 표준 정합 | NiFi·Kafka·표준 저장소·Grafana·Metabase 구조를 따르는가 | 높음 |\n| G5 고객 가치 시점 | 고객이 새 화면을 언제부터 쓸 수 있는가 | 중간 |\n| G6 롤백 용이성 | 즉시 원상 복귀가 가능한가 | 중간 |\n| G7 현장 위험 | 장비 이중 폴링 등 현장 설비 영향 | 중간 |\n| G8 공수 | 추정 인·주 | 중간 |\n\n## 6.3 비교표\n\n| 기준 | 1안 | 2안 | 3안 | 4안(A+B) | **5안** |\n|---|---|---|---|---|---|\n| G1 현행 무중단 | △ | △ | ◎ | ◎ | ◎ (P4 제조사별 전환) |\n| G2 현행 수정량 | ✕ Python 11개·Java 113파일·접속부 90곳 | ✕ | ◎ 없음 | ◎ 없음 | ◎ 없음 |\n| G3 검증 가능성 | △ | △ | ○ | ◎ 같은 입력 + 같은 DB 비교 | ◎ |\n| G4 DataForge 표준 | ✕ 현행 Python이 PG에 직접 씀 | ○ 수집만 표준 | ◎ | ◎ | ◎ |\n| G5 고객 가치 시점 | 늦음(전환 완료 후) | 늦음 | 중간(자체 계산 완성 후) | **빠름**(4안-B로 P1 직후) | **빠름** |\n| G6 롤백 | △ | ✕ | ○ | ◎ NiFi 흐름 정지 | ◎ 단계별 |\n| G7 현장 위험 | ◎ | ✕ 게이트웨이 동시 접속 | △ | ◎ | ○ P4만, 게이트웨이 단위 |\n| G8 공수(인·주) | 20~29 | 29~44 | 23~36 | 3~5(단독) | **23~36**(단계 분산) |\n\n◎ 매우 좋음 · ○ 좋음 · △ 보통 · ✕ 나쁨\n\n공수는 1차 기안(26~43)보다 줄었습니다. 브리지·API·React 화면 개발이 NiFi 흐름 구성과 Grafana·Metabase 대시보드 작업으로 바뀌었기 때문입니다. 상세는 [08](08_단계별_실행계획_및_검증.md) 8.1.\n\n## 6.4 권고안\n\n### 권고: 5안 — 4안(NiFi 그림자 이관)으로 시작해 3안(DataForge 표준 운영)으로 수렴, 2안(KepServerEX)은 P4\n\n```mermaid\nflowchart TB\n    subgraph S1[\"P1 — 현행 무수정, 고객 화면 조기 개통\"]\n        A[\"4안-B: 현행 산출물 복제 → Grafana · Metabase\"]\n        A2[\"4안-A: 원시값 탭 → fems.raw\"]\n    end\n    subgraph S2[\"P2~P3 — 자체 계산 검증 후 공식화\"]\n        B[\"FeMS 계산 서비스 + 연속 집계 + Heat/원단위 SQL<br/>legacy_* 와 같은 DB에서 비교\"]\n    end\n    subgraph S3[\"P4~P5 — 현장 수집 이관, 현행 제거\"]\n        C[\"KepServerEX → NiFi → Kafka (게이트웨이 단위)\"]\n        D[\"현행 제거\"]\n    end\n    A --> B\n    A2 --> B --> C --> D\n    X[\"1안: 현행 소스 개조\"]:::no -. \"4안-B로 대체\" .-> A\n    classDef no fill:#f4d6d6,stroke:#b44,color:#600\n```\n\n### 근거\n\n1. **DataForge 표준을 그대로 쓴다** — 수집·적재는 NiFi, 버스는 Kafka, 화면은 Grafana·Metabase. FeMS만의 것은 계산 서비스 하나뿐입니다.\n2. **현행을 고치지 않는다** — Python 3.6·커밋 0건·테스트 없음. NiFi가 Kafka와 Mongo를 읽기만 하면 됩니다.\n3. **고객 가치를 먼저 낸다** — 4안-B로 P1 직후부터 Grafana·Metabase에서 현행과 같은 숫자를 볼 수 있습니다.\n4. **검증이 쉽다** — 현행 결과(`legacy_*`)와 DataForge 결과가 같은 PostgreSQL에 있어 Metabase 비교 대시보드로 매일 확인합니다.\n5. **현장 위험은 마지막에 한 번씩** — KepServerEX 수집 이관은 게이트웨이 하나씩, 즉시 롤백 가능한 절차로 진행합니다.\n\n### 사용자 구상과의 대응\n\n| 사용자 구상 | 권고안에서의 위치 |\n|---|---|\n| 태그 데이터를 DataForge PostgreSQL로 | P1 — 4안-B(현행 산출물), 4안-A(원시) |\n| 설정은 Oracle에 유지 | P1~P4 동안 Oracle이 원본, NiFi로 단방향 동기화 |\n| MariaDB를 PostgreSQL로 | 해체: SQL → NiFi 흐름·계산 서비스, 감시 → NiFi·컨테이너, 오류 로그 → 로그 수집 |\n| Modbus 수집 → KepServerEX | P4, DataForge 표준 수집 경로 |\n| Autobase·Citect 등 자체 시스템 유지 | P4까지 현행 탭으로 받음. Citect는 현재 실제 연동 흔적 없음 |\n| 데이터 처리 우선, 안정 후 하나씩 제거 | P1~P3 데이터·계산·화면 → P4 수집 → P5 제거 |\n| VNTG MES로 설정·생산정보 | 관리 기능과 MES 데이터셋(Heat·Level-2)을 P3~P5에 VNTG MES로 전환 |\n\n## 6.5 결정 요청 사항\n\n| # | 결정 | 권고 |\n|---|---|---|\n| 1 | 이관 방식 | 5안 |\n| 2 | P1 착수 | 승인 요청 — 현행 영향 없음, NiFi 흐름·대시보드 구성 |\n| 3 | 원시 시계열 저장소 | DataForge 표준이 InfluxDB면 원시만 InfluxDB, **1분 사용량부터는 TimescaleDB/PostgreSQL**(Metabase SQL·기준정보 조인) |\n| 4 | FeMS 계산 위치 | 상태 보유 계산은 **FeMS 계산 서비스**, 집계는 TimescaleDB 연속 집계·SQL 작업(NiFi 내 계산 지양) |\n| 5 | 관리(입력) 기능 | 이관 기간 현행 Java 관리 화면 + Oracle 유지, 이후 VNTG MES 또는 DataForge 관리 화면 |\n| 6 | 선행 정보 확보 | [09](09_리스크_전제조건_확인필요정보.md) 9.3 — 특히 DataForge 표준 메시지 스키마, NiFi·Kafka 버전, MES 데이터셋 보유 현황 |\n"}, {"id": "07", "file": "07_데이터_매핑_명세.md", "title": "데이터 매핑 명세 (현행 → DataForge)", "content": "# 07. 데이터 매핑 명세 (현행 → DataForge)\n\n> 현행 스키마: [작업-02 02번 문서](../작업-02-현행소스분석/02_데이터_저장소_및_메타모델.md). 신규 스키마: `fems/infra/postgres/01_schema.sql`(설정 DB), `03_data_db.sql`(데이터 DB, TimescaleDB).\n> 이 표는 **백필(과거 데이터 이관)과 병행 검증 비교의 기준**입니다.\n>\n> 2차 개정: DataForge에서는 NiFi가 적재를 담당하므로, 아래 \"신규 컬럼\"은 **NiFi 레코드 스키마 → 적재 테이블**의 필드 정의로 읽으면 됩니다. 현행 계산 결과를 그대로 복제하는 `legacy_*` 테이블(4안-B)은 7.5절을 참고하세요. 원시값 저장소가 InfluxDB라면 `raw_collect`는 measurement·tag·field로 대응합니다(`tag_id`·`factory_id` → tag, `raw_value` → field).\n\n## 7.1 시계열 데이터 — MongoDB → TimescaleDB\n\n### 원시값: `collect_YYYYMM` → `raw_collect`\n\n| 현행 필드 | 예 | 신규 컬럼 | 변환 |\n|---|---|---|---|\n| `tag` | `E00091_Total Active Energy` | `tag_id` | 그대로 |\n| `val` | `1234567.8` | `raw_value` | 그대로(이미 `CORRECT_RATIO` 적용된 값) |\n| `time` | `2020-09-20 09:31:00.123456` (문자열, `.000000` 혼재) | `time` | 문자열 → `timestamptz`(Asia/Seoul) |\n| `kind` | `'1'` | (없음) | `tag_master.energy_kind`로 조회. **코드 체계 상이 — 7.4** |\n| `factory_id` | `GS` | `factory_id` | 그대로 |\n| `server_time` | Consumer 수신 시각 | `created_at` | 그대로 |\n| - | - | `quality` | 0(Good) 기본 |\n| - | - | `collector_id` | `legacy-kafka-bridge` / `legacy-backfill` |\n\n### 1분 사용량: `collect_m1` → `usage_1m` (+ `virtual_tag_value`)\n\n| 현행 필드 | 의미 | 신규 컬럼 | 상태 |\n|---|---|---|---|\n| `tag`, `time` | 태그, 귀속 시각 | `tag_id`, `time` | 대응 |\n| `val` | 1분 사용량 | `value` | 대응 |\n| `before_tag_value` / `current_tag_value` | 차분 시작·종료 누적값 | `before_val` / `current_val` | 대응 |\n| `bf_time` / `curr_time` | 차분 시작·종료 시각 | **없음** | ⚠ 추가 필요(검증·재처리 근거) |\n| `tj`, `toe`, `tco2` | 환산 | `tj`, `toe`, `tco2` | 대응 — 단 현행 `tj`는 `FN_ENG_CONVERSION('MJ')` 결과라 **단위 확인 필요**(작업-02 MED-23) |\n| `cost`, `conf` | 비용, 확정 단가 여부(Y/N) | **없음** | ⚠ 추가 필요 |\n| `lod_tmzon` | 부하시간대 L/M/H | **없음** | ⚠ 추가 필요(전기 요금·피크 분석 핵심) |\n| `kg` | 가스 질량 환산(`CODEDETAIL` FE113 계수) | **없음** | ⚠ 추가 필요 |\n| `total` | 월 누적(매월 1일 06:01 리셋) | **없음** | ⚠ 추가 또는 연속 집계로 대체 |\n| `kind`, `fid` | 에너지 종류, 공장 | `energy_kind`, `factory_id` | 코드 변환(7.4) |\n| `vtag` | `'N'` 실태그 / `'Y'` 가상태그 | 테이블 분리: `usage_1m` / `virtual_tag_value` | 대응 |\n| `createTime` | 생성 시각 | (없음) | 선택 |\n| - | - | `correct_ratio`, `unit`, `quality` | 신규 |\n\n### 요약·피크·Heat\n\n| 현행 컬렉션 | 신규 | 비고 |\n|---|---|---|\n| `TAG_SUM_TIME_29_15M_YYYYMM` | `energy_summary`(`unit_type='15m'`) | 현행 `from_date`/`to_date` 문자열 → `time_from`/`time_to`. 부하시간대(`lod`)별 행 → 컬럼 추가 또는 별도 행 |\n| `TAG_SUM_TIME_29_1H_YYYYMM` | `energy_summary`(`'1h'`) 또는 `usage_1h` 연속 집계 | |\n| `TAG_SUM_TIME_29_DAY` | `energy_summary`(`'1d'`) | **하루 경계 06시 / 전기 00시(`day_elc`) 구분 필요** |\n| `TAG_SUM_TIME_29_MONTH` | `energy_summary`(`'1month'`) | 상동 |\n| `PEAK_SUM_TIME_29_15M_YYYYMM` | `peak_data` | 15분/시/일/월/연 피크 승계 |\n| `HEAT_ENERGY_15M_YYYYMM` | `heat_data` | 현행은 Heat 1건 = 문서 1건(heat_no, 조업 시작·종료, 생산량). 신규는 `unit_type` 1d/1month 집계형 → **Heat 단위 원장 테이블 추가 검토** |\n| `Autobase` | (이관 안 함) | Autobase HMI 입력 버퍼. 원천은 Kafka 탭으로 받음 |\n\n### 백필 순서와 규모 산정\n\n1. `collect_YYYYMM`(원시) — 재처리의 근거이므로 우선. 월별 컬렉션 단위로 나눠 이관.\n2. `collect_m1`(1분) — 비교 기준선. 현행 산출물을 \"현행 기준값\" 테이블(예: `legacy_usage_1m`)로 그대로 보관해 신규 계산과 대조.\n3. 요약·피크·Heat — 화면 이력 조회용.\n\n규모(문서 수, 저장 용량)는 Mongo에서 `db.collection.stats()`로 확인해야 합니다 → [09](09_리스크_전제조건_확인필요정보.md) 9.3.\n\n## 7.2 기준정보 — Oracle → DataForge 설정 DB (단방향 동기화)\n\n| Oracle (`SF_FEMS`) | 주요 컬럼 | DataForge 설정 DB | 비고 |\n|---|---|---|---|\n| `DEVICE_MASTER` | DEVICE_ID, MAKER, DEVICE_TYPE(E/C/D), DEVICE_ADDRESS, PORT, USE_YN(Y/M/N), DEVICE_USE, FACTORY_ID, ENERGY_KIND_DETAIL, COM_CONNECT_DEVICE_ID | `device`, `device_register` | `USE_YN='M'` 의미 확인 필요. 게이트웨이(`'D'`)·하위 계측기 계층 표현 필요 |\n| `TAG_MASTER` | TAG_ID, DEVICE_ID, DATA_ADDRESS, CORRECT_RATIO, COLL_YN, VIRTUAL_TAG_YN, VIRTUAL_TAG_FORMULA, ORDER_SEQ | `tag_master`, `virtual_tag` | 수식 문법 변환: 현행 `tag[\"E00076\"]` 형태 → 신규 수식 문법 |\n| `TAG_STORE_TABLE_INFO`, `TAG_MAPPING_STORE`, `CONNECT_INFO` | 저장소 라우팅 | `storage_db_config`, `storage_table_config` | 신규는 단일 TimescaleDB → 라우팅은 이관 대상 아님 |\n| `TAG_SUMMARY_MAPPING_FROM/TO`, `SUMMARY_INFO` | 요약 대상 | `processor_rule` 등 | 실제 요약 대상은 `sql_20`(15mi·사용량)로 결정됨(작업-02 HIGH-26) |\n| `CODEDETAIL`(`FE113` 등) | 공통 코드, kg 환산계수 | `energy_conversion_factor` 등 | |\n| 환산 함수 `FN_ENG_CONVERSION`, `FN_LOD_CONVERSION`, `FN_PRDT_COST_CONVERSION`, `FN_CONF_COST_CONVERSION` | 환산·부하시간대·비용 | `energy_conversion_factor`, `energy_tariff` | **함수 본문 확보 후 로직 이식**. 부하시간대·확정/추정 단가 구분은 신규 `energy_tariff`(에너지별 단일 단가)에 없음 → 확장 필요 |\n| `MESSAGE_QUEUE` | Kafka 토픽 | `kafka_topic` | |\n\n**동기화 방식(권고)**: 일 1회 + 수동 즉시 실행. Oracle 쪽 변경 감지 컬럼이 없으면 전체 비교(diff) 방식. 동기화 기간 동안 DataForge 설정 화면은 읽기 전용.\n\n## 7.3 MariaDB `fems` — 이관 대신 해체\n\n| 현행 | 내용 | 처리 |\n|---|---|---|\n| `SQL_INFO` 운영 키 17건 | Oracle에서 실행하는 SQL 본문 | DataForge 코드 저장소의 SQL 파일로 이관(버전 관리). `sql_02` 대표 저장소 하드코딩, `sql_04/05/25/28` 설비→태그 `DECODE`는 기준정보 테이블로 분리 |\n| `SQL_INFO` 기타 17건 | `_test`, 구버전, 중복(`sql_29`) | 이관 제외 |\n| `SP_GET_SQL` 등 프로시저 5종 | 접속정보·SQL 조회 | 불필요(설정은 환경변수·시크릿, SQL은 코드) |\n| `monitoring`, `monitoring_log`, `_dtl` | 프로세스 감시 | Docker 재시작 정책 + 헬스체크 + 모니터링 대시보드 |\n| `err_log` | 수집기 오류 | 구조화 로그 → 로그 수집 |\n| `PRO_INFO`, `PRO_USE_SQL` | 2019년 이후 미갱신 | 이관 제외 |\n\n## 7.4 코드 체계 차이 — 반드시 정해야 할 것\n\n| 항목 | 현행 | 신규 bst_FeMS | 결정 필요 |\n|---|---|---|---|\n| 에너지 종류 | `DEVICE_USE`: 1 전기, 2 LNG, 3 LPG, 4 스팀, 5 공기, 6 산소, 7 질소, 8 알곤, 9 냉각수, A 용수, Z 기타 (11종) | `energy_kind` SMALLINT: 1 전기, 2 가스, 3 스팀, 4 수도 (4종) | **현행 11종 수용하도록 신규 코드 확장** 권고 |\n| 하루 경계 | 06:00(교대 기준), 전기만 00:00(`day_elc`) | 06:00 기준(`total_value` 주석) | 전기 00시 집계 병행 여부 |\n| 시각 | 문자열(로컬, 마이크로초) | `timestamptz` | 시간대 Asia/Seoul 고정 |\n| 장비 제조사 | JB, J2, EL, LS, VI, ECO, MI, WON, DA, AUTO + MPM, AVT, DEVC, VITZRO | LS, JB, EL, MI, VI, ECO, AUTOBASE, CITECH | J2/WON/DA/AUTO/MPM/AVT/DEVC/VITZRO 추가 |\n| 부하시간대 | `lod_tmzon` L/M/H (Oracle `FN_LOD_CONVERSION`) | 없음 | 계절·요일·시간대 테이블 신설 |\n| 가상태그 수식 | `tag[\"E00076\"] - tag[\"E00051\"]` (`eval`) | 수식 문자열 + `formula_tags` | 변환기 작성, `eval` 미사용 유지 |\n\n## 7.5 현행 산출물 복제 테이블 (`legacy_*`, 4안-B) — 🆕 2차 개정\n\n현행 계산 결과를 **필드 그대로** 보존해 고객 화면 조기 개통과 비교 검증에 씁니다. 시각 필드만 `timestamptz`로 변환하고, 원본 문자열은 함께 보관합니다.\n\n| 테이블 | 원본 | 기본 키 | 적재 방식 |\n|---|---|---|---|\n| `legacy_usage_1m` | Mongo `collect_m1` | (`tag`, `time`, `vtag`) | 증분 INSERT(이미 있으면 UPSERT — 현행이 같은 분을 `delete_many` 후 재기록) |\n| `legacy_summary` | `TAG_SUM_TIME_29_15M/1H_YYYYMM`, `_DAY`, `_MONTH` | (`unit_type`, `tag`, `from_date`, `lod`) | **UPSERT** — 진행 중 구간을 15분마다 재조회 |\n| `legacy_peak` | `PEAK_SUM_TIME_29_15M_YYYYMM` | (`tag`, 구간 키) | UPSERT |\n| `legacy_heat` | `HEAT_ENERGY_15M_YYYYMM` | (`heat_no`, `tag`) | UPSERT(07·10시 재실행 반영) |\n| `legacy_basic_unit` | Oracle `TAG_SUM_TIME_29_DAY/MONTH` | (`TAG`, `FROM_DATE`) | Oracle 중복 행(CRIT-2)이 있으므로 **원본 행 ID 포함 그대로** 적재 후 비교 시 중복 표시 |\n| `legacy_tag_status` | Oracle `TAG_STATUS` | (`TAG_ID`) | 전체 갱신 |\n\n**비교 뷰(예)**: `cmp_usage_1m` = `legacy_usage_1m` ⟗ DataForge `usage_1m` on (태그, 분) → 상대오차, 알려진 차이(K1~K7) 분류 컬럼. Metabase 비교 대시보드의 원본.\n"}, {"id": "08", "file": "08_단계별_실행계획_및_검증.md", "title": "단계별 실행 계획 및 검증 (5안, DataForge 기준)", "content": "# 08. 단계별 실행 계획 및 검증 (5안, DataForge 기준)\n\n> 2차 개정(2026-10-15): DataForge 표준 파이프라인(NiFi·Kafka·PostgreSQL/TimescaleDB·BigQuery·Grafana·Metabase) 기준으로 단계를 다시 짰습니다. 고객 화면을 P1 직후 조기 개통하도록 순서를 바꿨습니다.\n\n## 8.1 일정과 공수 (추정)\n\n```mermaid\ngantt\n    dateFormat  YYYY-MM-DD\n    axisFormat  %m/%d\n    title 5안 단계별 일정 (상대 일정, 추정)\n\n    section 준비\n    P0 NiFi 접근·스키마·계정·확인정보     :p0, 2026-11-02, 3w\n    section 데이터·화면\n    P1 그림자 이관 (4안-A/B, 기준정보)    :p1, after p0, 4w\n    P1' 조기 대시보드 (현행 산출물 기준)    :p1b, after p1, 2w\n    section 계산\n    P2 자체 계산 병행·비교                :p2, after p1, 6w\n    P3 화면 공식화 (Grafana·Metabase)     :p3, after p2, 4w\n    section 수집\n    P4 KepServerEX 게이트웨이 단위 이관    :p4, after p3, 8w\n    section 정리\n    P5 현행 제거                         :p5, after p4, 4w\n```\n\n| 단계 | 기간 | 공수(인·주) | 현행 영향 |\n|---|---|---|---|\n| P0 준비 | 3주 | 2~3 | 없음 |\n| P1 그림자 이관 + 조기 대시보드 | 4주(+2주 병행) | 5~8 | 없음 |\n| P2 자체 계산 병행 | 6주 | 7~10 | 없음 |\n| P3 화면 공식화 | 4주 | 3~5 | 없음(조회 화면 사용 중단) |\n| P4 수집 이관 | 8주(게이트웨이 수 비례) | 5~8 | **제조사별 전환** |\n| P5 현행 제거 | 4주 | 1~2 | 단계별 정지 |\n| **합계** | **약 29주** | **23~36** | |\n\n고객이 Grafana·Metabase로 FeMS 데이터를 처음 보는 시점은 **착수 후 약 7~9주**(P1 직후, 현행 산출물 기준)입니다.\n\n## 8.2 단계별 상세\n\n### P0. 준비 (3주)\n\n| 작업 | 산출물 |\n|---|---|\n| NiFi → 현행 Kafka(172.17.1.34:9092)·Mongo(172.17.1.35:17001)·Oracle(172.31.209.30:1521) 경로 개방 | 방화벽 요청서, 접속 확인 |\n| NiFi 전용 **읽기 계정** 발급(Mongo, Oracle `SF_FEMS` 기준정보 + 필요한 `GMES` 테이블) | 계정을 NiFi 파라미터 컨텍스트(민감 값)에 등록 |\n| DataForge 표준 확인: 태그 단위 메시지 스키마, 토픽 명명 규칙, 원시 시계열 저장소(InfluxDB/TimescaleDB), NiFi·Kafka 버전 | 표준 적용 결정서 |\n| DataForge가 이미 수집 중인 MES·Level-2 데이터셋과 FeMS가 쓰는 GMES 테이블 대조 | 재사용/추가 수집 목록 |\n| 09 문서 9.3 확인 항목 해소 | 확인 결과 |\n| \"알려진 차이 목록\" 초안(8.3) | v1 |\n\n**게이트**: 접속 확인 + 표준 스키마 확정 + 확인 항목 80% 이상\n\n### P1. 그림자 이관 (4주) + 조기 대시보드 (2주)\n\n| 흐름 | 내용 | 산출물 |\n|---|---|---|\n| F1 원시 탭(4안-A) | `ConsumeKafka`(그룹 `dataforge-shadow`) → 파싱 → `fems.raw` → 시계열 DB | `raw` 테이블/측정값 |\n| F2 산출물 복제(4안-B) | Mongo `collect_m1`·요약 4종·피크·Heat, Oracle 원단위·`TAG_STATUS` → `legacy_*` UPSERT | `legacy_usage_1m`, `legacy_summary`, `legacy_peak`, `legacy_heat`, `legacy_basic_unit`, `legacy_tag_status` |\n| F3 기준정보 | Oracle `TAG_MASTER`·`DEVICE_MASTER`·`CODEDETAIL` 등 → PostgreSQL | `fems_master.*` |\n| 백필 | Mongo 과거 데이터(보존 범위 결정 D5) → 같은 테이블 | 이력 |\n| 조기 대시보드 | `legacy_*` 기반 Grafana(실시간·사용량·피크), Metabase(일·월 보고, 원단위, Heat) | 고객 확인용 화면 |\n| 운영 감시 | NiFi 백프레셔·지연·실패 건수 알림 | 감시 대시보드 |\n\n**게이트 (정량)**\n\n| 지표 | 기준 |\n|---|---|\n| 분당 원시 건수 일치율(Mongo `collect_YYYYMM` 대비) | 99.9% 이상, 7일 연속 |\n| `legacy_*` 복제 일치율(태그·구간 키 기준, Mongo 대비) | 100%(값 동일), 7일 연속 |\n| 파싱 실패율(`fems.raw.dlq`) | 0.01% 이하 |\n| 원시 지연(현행 수집 시각 → DataForge 적재) | p95 10초 이하 |\n\n### P2. 자체 계산 병행 (6주)\n\n| 구성 | 내용 |\n|---|---|\n| FeMS 계산 서비스 | bst_FeMS `05_processor`를 `fems.raw` → `fems.usage.1m`·`fems.vtag.1m` 입출력으로 조정. 현행 3단 필터(15분 창 중앙값 → 시각 근접 → 차분·음수·상한·0 연속) 규칙 이식 |\n| 환산 | Oracle `FN_*` 함수 본문 확보 후 이식, 이식 전에는 대조용으로 Oracle 함수 결과 병행 |\n| 요약 | TimescaleDB 연속 집계 15분·1시간·일·월(06시 기준 + 전기 00시 기준) |\n| 피크·Heat·원단위 | SQL 스케줄 작업(Heat는 F4 MES 데이터 사용) |\n| 비교 대시보드 | Metabase: `legacy_*` 대 DataForge 결과 태그·구간별 오차 일일 리포트 |\n\n| 비교 대상 | 키 | 허용 오차 |\n|---|---|---|\n| 1분 사용량 | (태그, 분) | 상대오차 0.1% 이내 행 비율 99% 이상 |\n| 15분·시간·일·월 요약 | (태그, 구간[, 부하시간대]) | 0.5% 이내 |\n| 피크 | (태그, 구간) | 값 일치, 시각 ±1분 |\n| TJ/TOE/tCO2 | (태그, 구간) | 0.5% 이내(단위 확정 후) |\n| 비용 | (태그, 구간) | 1% 이내(확정/추정 단가 반영 후) |\n| Heat 에너지 | heat_no | 0.5% 이내 |\n\n오차를 벗어난 건은 \"알려진 차이 목록\"과 대조해 **(가) 현행 결함 수정에 따른 차이**와 **(나) DataForge 오류**로 분류하고, (나)가 0건이 될 때까지 반복합니다.\n\n### P3. 화면 공식화 (4주)\n\n- 현행 Java 조회 화면 메뉴 전수 대조표 → Grafana 대시보드·Metabase 질의로 매핑([10](10_DataForge_표준파이프라인_적용설계.md) 10.7)\n- 대시보드 데이터 원본을 `legacy_*`에서 DataForge 계산 결과로 전환\n- 주요 사용자 병행 사용 → 승인\n- 관리(입력) 기능은 현행 Java 관리 화면 + Oracle 유지\n- **게이트**: 사용자 승인, 미대응 조회 메뉴 0건(또는 폐기 합의)\n\n### P4. 수집 이관 (8주)\n\nDataForge 표준 경로 **KepServerEX → NiFi → Kafka `fems.raw`**로 게이트웨이 하나씩 전환합니다.\n\n```mermaid\nflowchart LR\n    A[\"1 게이트웨이 동시 접속 시험<br/>(비가동 시간대)\"] --> B{\"동시 접속 가능?\"}\n    B -->|예| C[\"2a KepServerEX 병행 폴링 1주<br/>F1(현행)과 값 비교\"]\n    B -->|아니오| D[\"2b 전환 시간 확보<br/>현행 수집기 정지 → KepServerEX 기동\"]\n    C --> E[\"3 현행 수집기 정지<br/>fems.monitoring 해당 행 N\"]\n    D --> E\n    E --> F[\"4 필요 시 NiFi로 현행 Kafka 역공급<br/>(현행 계산·관리 화면 유지용)\"]\n    F --> G[\"5 2주 무결 확인\"]\n```\n\n| 순서(권고) | 대상 | 이유 |\n|---|---|---|\n| 1 | LS, ECO, MI, WON (전력량계) | 파싱 단순 |\n| 2 | VI, MPM, AVT, DEVC, VITZRO | 바이트·워드 순서 |\n| 3 | JB, J2, DA, AUTO (가스보정기) | 블록 분해·응답 보정 |\n| 4 | EL | 정수부+소수부 합산 — KepServerEX 파생 태그 또는 DataForge 자체 수집 소스 |\n\n**롤백**: KepServerEX 채널 비활성 → `fems.monitoring` 해당 행 `EXECUTE_TYPE='Y'` → 1분 내 현행 수집기 자동 재기동.\n\n### P5. 현행 제거 (4주)\n\n| 순서 | 제거 대상 | 조건 |\n|---|---|---|\n| 1 | Java 조회 화면 | P3 승인 후 1개월 무사용 |\n| 2 | F2 산출물 복제 흐름, 현행 가공 cron | DataForge 계산 결과가 원본으로 인정된 후 |\n| 3 | `mm_28` Oracle 원단위 적재 | Oracle 원단위를 쓰는 다른 시스템·보고서가 없을 때(D4) |\n| 4 | Autobase·Level-2 현행 수집 | DataForge 직접 수집 또는 MES 데이터셋으로 대체 완료 |\n| 5 | Java 관리 화면 | 관리 기능이 VNTG MES 또는 DataForge 관리 화면으로 이전된 후 |\n| 6 | Mongo, MariaDB, 현행 Kafka, Redis | 보존 기간 경과 후 백업·폐기 |\n\n## 8.3 \"알려진 차이 목록\" 초안\n\n현행 결함 때문에 **DataForge 결과가 현행과 달라야 정상인** 항목입니다(근거: 작업-02 08번 문서).\n\n| # | 현행 동작 | DataForge 기대 동작 | 영향 |\n|---|---|---|---|\n| K1 | 월 누적 `total`은 매월 1일 06:01 실행이 성공할 때만 리셋(CRIT-3) | 월 비교로 항상 리셋 | 월 누적 |\n| K2 | 환산값을 `UNION ALL` 결과 순서로 매칭(CRIT-4) | 태그 키로 매칭 | TJ/TOE/tCO2/비용/부하시간대 |\n| K3 | 가상태그 다단 의존 시 참조값 0(CRIT-5) | 위상 정렬로 정확 계산 | 공장 MAIN 등 상위 집계 |\n| K4 | 적산값 롤오버 시 사용량 0 | 정책 결정(D1)에 따름 | 롤오버 발생 분 |\n| K5 | Oracle DAY/MONTH 재실행 시 중복 행(CRIT-2) | 멱등 | 원단위·효율 |\n| K6 | Ecosense 루프가 `_202001`·DAY/MONTH에 별도 기록(CRIT-10) | 미이관 | 일·월 요약(루프 가동 시) |\n| K7 | 가상태그 결측 하위 태그를 0으로 계산 | 품질 플래그 부여 | 가상태그 |\n\n## 8.4 운영 체크리스트 (각 단계 공통)\n\n- [ ] 현행 프로세스 영향 없음(`fems.monitoring` 재기동 이력 변화 없음)\n- [ ] NiFi 백프레셔·지연·실패 건수 정상\n- [ ] Metabase 비교 리포트 일일 검토\n- [ ] 자격증명은 NiFi 파라미터 컨텍스트(민감 값)·시크릿 저장소에만 존재\n- [ ] 단계 게이트 결과 기록 및 결정권자 승인\n"}, {"id": "09", "file": "09_리스크_전제조건_확인필요정보.md", "title": "리스크, 전제 조건, 확인 필요 정보", "content": "# 09. 리스크, 전제 조건, 확인 필요 정보\n\n> 2차 개정(2026-10-15): DataForge 실제 구조(NiFi·Kafka·PostgreSQL/InfluxDB/TimescaleDB·BigQuery·Grafana·Metabase)에 맞춰 리스크와 확인 항목을 고쳤습니다.\n\n## 9.1 이관 리스크\n\n| # | 리스크 | 가능성 | 영향 | 대응 | 해당 단계 |\n|---|---|---|---|---|---|\n| R1 | Modbus 게이트웨이에 두 마스터가 붙어 현행 수집 실패 | 중 | **높음** | 게이트웨이별 동시 접속 시험, 비가동 시간대 전환, 즉시 롤백 절차 | P5 |\n| R2 | VNTG MES 전환으로 GMES 테이블(`SPRB3010`, `SPRI3010`, `SPRC3059`, `SPRF3640`, `FPRB3010` 등)이 사라져 Heat·Level2 중단 | 중 | 높음 | MES 인터페이스 항목 선확정(05 I4), 전환 일정 연동 | P2~P6 |\n| R3 | 현행 Kafka 장애 시 DataForge 입력도 함께 중단 | 중 | 중 | NiFi 지연·백프레셔 경보, 보존 기간 내 재처리, P4 이후 독립 수집 | P1~P4 |\n| R11 | 현행 요약이 15분마다 지우고 다시 쓰는 구조라 복제(4안-B)가 어긋남 | 중 | 중 | 진행 중 구간 재조회 + UPSERT, 복제 일치율 게이트 | P1 |\n| R12 | NiFi로 상태 보유 계산(차분·중앙값·가상태그)을 구현하려다 복잡도 폭증 | 중 | 중 | 상태 계산은 FeMS 계산 서비스로 분리(10 10.5) | P2 |\n| R13 | 원시 저장소를 InfluxDB로 두면 Metabase SQL·기준정보 조인 곤란 | 중 | 낮음 | 1분 사용량 이후는 TimescaleDB/PostgreSQL 배치 | P1~P2 |\n| R14 | Grafana·Metabase로 대체할 수 없는 입력·관리 기능 누락 | 중 | 중 | 현행 Java 관리 화면 유지, VNTG MES·DataForge 관리 화면 이전 계획 별도 수립 | P3~P5 |\n| R4 | 신규 처리 결과가 현행과 달라 사용자 신뢰 저하 | 높음 | 중 | \"알려진 차이 목록\"(08 8.3)을 사전 공유, 검증 화면 제공 | P2·P4 |\n| R5 | 환산 함수 로직(부하시간대, 확정/추정 단가) 미확보로 비용 불일치 | 중 | 중 | Oracle 함수 본문 확보, 이관 전까지 Oracle 함수 호출 병행 | P2 |\n| R6 | 운영 규모(전체 태그·분당 메시지)에서 NiFi 처리량·FlowFile 수 부족 | 중 | 중 | 메시지 묶음 처리(Demarcator·레코드 처리), P0 용량 산정, P1 실데이터로 부하 확인 | P0~P1 |\n| R7 | Oracle 기준정보와 설정 DB가 양쪽에서 수정되어 원본 이원화 | 중 | 중 | 동기화 기간 DataForge 설정 화면 읽기 전용 | P3 |\n| R8 | 현행 평문 자격증명이 이관 경로로 확산 | 중 | 높음 | NiFi 전용 읽기 계정 신규 발급, NiFi 파라미터 컨텍스트(민감 값) 사용 | P0 |\n| R9 | 관리 밖 프로세스(`mm_collec`, `eco*.sh`)의 실제 가동 여부 불명 → 이관 범위 누락 | 중 | 중 | P0에서 `ps aux` 확인, Kafka 탭으로 받는 태그 목록과 대조 | P0 |\n| R10 | Python 3.6 기반 현행이 이관 기간 중 OS·패키지 문제로 중단 | 낮음 | 높음 | 현행 서버 패키지 변경 동결, 현재 `pip freeze` 보관 | 전 기간 |\n\n## 9.2 전제 조건\n\n| # | 전제 | 깨질 경우 |\n|---|---|---|\n| A1 | DataForge NiFi·Kafka·PostgreSQL·시계열 DB(InfluxDB 또는 TimescaleDB)·BigQuery·Grafana·Metabase를 FeMS용으로 할당 가능 | 저장소 배치 재설계 |\n| A2 | DataForge NiFi에서 현행 서버망(172.17.1.x: Kafka·Mongo)과 Oracle(172.31.209.30)에 접근 가능 | 4안 불가 → 현행망 쪽 NiFi 에지 노드(MiNiFi 등) 필요 |\n| A3 | 현행 Kafka `collect` 토픽에 추가 소비자 접속이 허용됨(운영 정책상) | Mongo 주기 복제(4.4 방법 C)로 대체 |\n| A4 | 이관 기간 동안 현행 FeMS 소스·설정은 동결 | 비교 기준 흔들림 |\n| A5 | P4 수집 이관 시 KepServerEX 라이선스(태그 수·Modbus 드라이버)가 확보됨 | DataForge 자체 수집 소스로 대체 |\n| A6 | FeMS 계산 서비스(bst_FeMS `05_processor` 기반)를 DataForge 배포·모니터링 체계에 올릴 수 있음 | 계산을 DB 측 SQL로 옮기는 설계 검토 |\n\n## 9.3 확인 필요 정보 — 착수 전 확보 목록\n\n### DataForge 플랫폼\n\n| # | 항목 | 용도 | 담당(안) |\n|---|---|---|---|\n| F1 | NiFi 버전, 클러스터 구성, 사용 가능한 Kafka·Mongo·Oracle 프로세서(클라이언트 버전 — 현행 Kafka 2.2.1 호환) | F1~F4 흐름 설계 | DataForge 팀 |\n| F2 | **태그 단위·데이터셋 단위 표준 메시지 스키마**, 토픽 명명 규칙, 스키마 레지스트리 사용 여부 | `fems.*` 토픽·레코드 설계 | DataForge 팀 |\n| F3 | 원시 시계열 표준 저장소(InfluxDB / TimescaleDB), PostgreSQL·BigQuery 할당 용량과 보존 정책 | 저장소 배치(10 10.4) | DataForge 팀 |\n| F4 | Grafana·Metabase 운영 방식(조직·권한·고객 접근 방법), 공통 관리 화면 존재 여부 | 화면 전환, 관리 기능 이전 | DataForge 팀 |\n| F5 | **DataForge가 이미 수집 중인 세아베스틸 MES·Level-2 데이터셋 목록**(GMES `SPRB3010`·`SPRI3010`·`SPRC3059`·`SPRF3640`·`FPRB3010` 포함 여부) | F4 재사용 판단 | DataForge 팀 |\n| F6 | KepServerEX 버전, 라이선스(태그 수, Modbus Ethernet / RTU 캡슐화 드라이버), 세아베스틸 현장 연결 현황 | P4 | DataForge 팀 |\n| F7 | 커스텀 계산 서비스 배포 방식(Kubernetes/Docker), 모니터링·로그 수집 체계 | FeMS 계산 서비스 운영 | DataForge 팀 |\n| F8 | DataForge NiFi·KepServerEX ↔ 현행 서버망·Oracle·현장망(10.1.2.x, 172.31.x.x) 네트워크 경로 | 4안, P4 | 인프라 |\n\n### 현행 시스템 (운영 서버 직접 확인)\n\n| # | 항목 | 확인 방법 | 용도 |\n|---|---|---|---|\n| L1 | Kafka 브로커 보존 기간, 파티션 수, `advertised.listeners` | `server.properties` | NiFi 장애 시 재처리 한도 |\n| L2 | `mm_collec.py`, `eco*_excuete.sh` 가동 여부 | `ps aux` | 이관 범위 |\n| L3 | Mongo 컬렉션별 문서 수·용량(`collect_YYYYMM`, `collect_m1`, 요약) | `db.<컬렉션>.stats()` | 백필 시간·용량 |\n| L4 | Mongo 배포 형태(단일/복제셋) | `rs.status()` | CDC 가능 여부(05 I6) |\n| L5 | 분당 Kafka 메시지 수, 전체 활성 태그 수 | 토픽 오프셋 증가량, `TAG_MASTER COLL_YN='Y'` 건수 | 용량 산정 |\n| L6 | Modbus 게이트웨이 목록과 동시 접속 한도 | 장비 사양서·현장 확인 | P5 |\n\n### Oracle·MES\n\n| # | 항목 | 용도 |\n|---|---|---|\n| O1 | `SUMMARY_INFO` 전체 행(\"15mi·사용량\"의 SUMMARY_ID) | 요약 대상 규칙 이식 |\n| O2 | `FN_ENG_CONVERSION`, `FN_LOD_CONVERSION`, `FN_PRDT_COST_CONVERSION`, `FN_CONF_COST_CONVERSION` 본문 | 환산·부하시간대·비용 로직 이식, `tj` 단위 확정 |\n| O3 | `CODEDETAIL` `CODE_TYPE='FE113'` 값 | 가스 kg 환산계수 |\n| O4 | `DEVICE_MASTER.USE_YN='M'`의 의미 | 수집 대상 판정 |\n| O5 | DataForge용 Oracle 읽기 계정(SF_FEMS 기준정보 + GMES 필요 테이블 SELECT 권한) | 동기화·Heat |\n| O6 | VNTG MES 전환 일정, Heat·생산실적·Level2 인터페이스 방식(API/DB/메시지) | R2 대응 |\n\n### 이해관계자 결정\n\n| # | 결정 | 시점 |\n|---|---|---|\n| D1 | 롤오버 처리 정책(현행: 0 처리 / 대안: 보정) | P2 이전 |\n| D2 | 전기 하루 경계(00시) 집계를 계속 제공할지 | P2 이전 |\n| D3 | 에너지 종류 코드 체계(현행 11종 유지 여부) | P3 이전 |\n| D4 | Oracle 원단위 테이블(`TAG_SUM_TIME_29_DAY/MONTH`)을 계속 채워야 하는지(다른 시스템 사용 여부) | P6 이전 |\n| D5 | 과거 데이터 보존 범위(전체 이관 / 최근 N년) | P1 이전 |\n"}, {"id": "10", "file": "10_DataForge_표준파이프라인_적용설계.md", "title": "DataForge 표준 파이프라인 적용 설계", "content": "# 10. DataForge 표준 파이프라인 적용 설계\n\n> 개정 배경(2026-10-15 2차): DataForge 데이터 플랫폼의 실제 구조를 기준으로 기안을 다시 검토했습니다.\n> **수집**(KepServerEX·자체 수집 소스·MES/Level-2) → **NiFi**(태그 단위·데이터셋 단위 수신) → **Kafka** → **NiFi** → **PostgreSQL / InfluxDB(또는 TimescaleDB) / BigQuery** → **Grafana**(모니터링) · **Metabase**(리포트)\n\n## 10.1 무엇이 달라지는가\n\n| 1차 기안의 가정 | DataForge 실제 구조 | 기안에 주는 변화 |\n|---|---|---|\n| 레거시 Kafka → DataForge 연결은 **별도 브리지 코드** 개발 | NiFi가 Kafka 소비·변환·발행을 표준으로 수행 | 브리지 = **NiFi 흐름 구성**. 개발 코드 없음 |\n| 신규 bst_FeMS가 수집·처리·API·화면을 모두 담당 | 수집은 KepServerEX·NiFi, 적재는 NiFi, 화면은 Grafana·Metabase | 신규 bst_FeMS에서 남는 것은 **FeMS 전용 계산 로직**(1분 사용량, 가상태그 등) |\n| 화면 전환 = 신규 React 화면 개통 | 고객 화면 = Grafana(실시간)·Metabase(리포트) | 화면 작업이 **대시보드·질의 구성**으로 축소 |\n| MES/Level-2 연동은 신규 개발 | DataForge가 이미 MES·Level-2를 수집 중 | Heat·Level-2 원천은 **DataForge 기존 수집분 재사용 가능성** 확인 |\n| 저장소는 TimescaleDB 하나 | PostgreSQL·InfluxDB/TimescaleDB·BigQuery 중 용도별 선택 | 데이터 계층별 저장소 배치 필요(10.4) |\n\n## 10.2 목표 구조 (DataForge 표준 위에 FeMS 얹기)\n\n```mermaid\nflowchart LR\n    subgraph LEG[\"현행 FeMS (유지)\"]\n        LSRC[\"수집기 · Autobase · Level2\"] --> LK{{\"레거시 Kafka 2.2.1<br/>collect\"}}\n        LK --> LMG[(\"MongoDB<br/>collect_m1 · 요약 · 피크 · Heat\")]\n        LORA[(\"Oracle bestmes<br/>SF_FEMS 기준정보 · GMES\")]\n    end\n\n    subgraph DF[\"DataForge 데이터 플랫폼\"]\n        subgraph ING[\"NiFi — 수집 계층\"]\n            F1[\"F1 레거시 Kafka 탭\"]\n            F2[\"F2 레거시 산출물 복제\"]\n            F3[\"F3 Oracle 기준정보 동기화\"]\n            F4[\"F4 MES · Heat · Level-2\"]\n            F5[\"F5 KepServerEX Modbus (P4)\"]\n        end\n        DK{{\"DataForge Kafka<br/>fems.* 토픽\"}}\n        CALC[\"FeMS 계산 서비스<br/>1분 사용량 · 가상태그<br/>(bst_FeMS 05_processor 재사용)\"]\n        subgraph SINK[\"NiFi — 적재 계층\"]\n            S1[\"→ TimescaleDB/InfluxDB\"]\n            S2[\"→ PostgreSQL\"]\n            S3[\"→ BigQuery\"]\n        end\n        TS[(\"시계열 DB<br/>원시 · 1분\")]\n        PG[(\"PostgreSQL<br/>요약 · 피크 · Heat · 기준정보 · 레거시 비교본\")]\n        BQ[(\"BigQuery<br/>장기 보관 · 전사 분석\")]\n        GF[\"Grafana<br/>실시간 모니터링\"]\n        MB[\"Metabase<br/>일·월 리포트 · 원단위 · 비용\"]\n    end\n\n    KEP[\"KepServerEX<br/>Modbus 드라이버\"]\n    LK --> F1\n    LMG --> F2\n    LORA --> F3 & F4\n    KEP --> F5\n    F1 & F2 & F3 & F4 & F5 --> DK\n    DK --> CALC --> DK\n    DK --> S1 & S2 & S3\n    S1 --> TS\n    S2 --> PG\n    S3 --> BQ\n    TS --> GF\n    PG --> GF & MB\n    BQ --> MB\n```\n\n## 10.3 NiFi 흐름 설계\n\n### F1. 레거시 Kafka 탭 (원시값 복제)\n\n현행 `collect` 토픽은 **키 없는 메시지 1개 = 태그 값 1건**이고 형식은 `태그||값||시각||종류||공장`입니다(`realtime.sendtokafka()`가 행마다 `producer.send()`).\n\n```mermaid\nflowchart LR\n    A[\"ConsumeKafka<br/>broker 172.17.1.34:9092<br/>topic collect<br/>group.id dataforge-shadow\"] --> B[\"레코드 파싱<br/>GrokReader 또는<br/>ReplaceText 구분자 #124;#124; → 탭<br/>+ CSVReader\"]\n    B --> C[\"UpdateRecord<br/>· time 문자열 → timestamp(Asia/Seoul)<br/>· source = legacy-collect<br/>· 원본 문자열 보존\"]\n    C --> D{\"ValidateRecord\"}\n    D -->|정상| E[\"PublishKafka<br/>fems.raw (태그 단위)\"]\n    D -->|실패| F[\"PublishKafka<br/>fems.raw.dlq\"]\n```\n\n| 설정 | 값 / 주의 |\n|---|---|\n| 소비 그룹 | `dataforge-shadow` 전용. 현행 소비자 3개는 그룹이 없어 서로 간섭하지 않음 |\n| 구분자 | `\\|\\|`(두 글자) — NiFi CSVReader는 한 글자 구분자만 지원하므로 GrokReader 또는 치환 후 파싱 |\n| 시각 | `YYYY-MM-DD HH:MM:SS.ffffff`, 일부 `.000000` 혼재 → 형식 두 개 허용 |\n| 배치 | 메시지 수가 많으므로 `Message Demarcator`로 묶어 FlowFile 수 줄이기 |\n| 클라이언트 호환 | 브로커 2.2.1 — 사용하는 NiFi Kafka 프로세서의 클라이언트 버전과 호환 범위 실측 확인 |\n| 출력 스키마 | **DataForge 태그 단위 표준 스키마**에 맞춤(스키마 미확보 → 09) |\n\n### F2. 레거시 산출물 복제 (현행 계산 결과를 그대로 가져오기) — 🆕\n\n현행이 이미 계산한 결과를 그대로 DataForge로 복사합니다. 고객은 **현행 화면과 같은 숫자**를 Grafana·Metabase에서 바로 볼 수 있고, DataForge 자체 계산이 완성되면 같은 DB 안에서 두 결과를 비교할 수 있습니다.\n\n| 원본(Mongo `SEAH_FEMS`) | 복제 방식 | 대상 테이블(예) | 주의 |\n|---|---|---|---|\n| `collect_m1` | 1분마다 `time > 마지막 시각` 증분 조회 | `legacy_usage_1m` | 시각이 문자열이지만 고정 형식이라 문자열 비교로 증분 가능 |\n| `TAG_SUM_TIME_29_15M_YYYYMM` | 15분마다 현재 월 컬렉션에서 최근 구간 재조회 | `legacy_summary` (`unit_type='15m'`) | 월이 바뀌면 컬렉션명 변경 |\n| `TAG_SUM_TIME_29_1H_YYYYMM` | 15분마다 **현재 시간대 구간 재조회 + UPSERT** | `legacy_summary` (`'1h'`) | 현행이 15분마다 덮어씀(연속 재계산) |\n| `TAG_SUM_TIME_29_DAY` / `_MONTH` | 15분마다 **오늘·이번 달 구간 재조회 + UPSERT** | `legacy_summary` (`'1d'`, `'1month'`) | 상동. 키 = (태그, `from_date`, 부하시간대) |\n| `PEAK_SUM_TIME_29_15M_YYYYMM` | 15분 증분 | `legacy_peak` | |\n| `HEAT_ENERGY_15M_YYYYMM` | 일 2회(07·10시 이후) | `legacy_heat` | `heat_no` 키 UPSERT |\n| Oracle `TAG_SUM_TIME_29_DAY/MONTH`, `TAG_STATUS` | `QueryDatabaseTableRecord` | `legacy_basic_unit`, `legacy_tag_status` | 원단위·상태 |\n\n> 현행 요약은 \"지금까지의 누적\"을 15분마다 지우고 다시 쓰는 구조입니다(작업-02 06 6.2). 따라서 복제는 **추가(INSERT)가 아니라 갱신(UPSERT)**이어야 하며, 진행 중인 구간을 매번 다시 읽어야 합니다.\n\n### F3. Oracle 기준정보 동기화\n\n| Oracle | NiFi | 대상 |\n|---|---|---|\n| `TAG_MASTER`, `DEVICE_MASTER`, `CODEDETAIL`(FE113 등), `TAG_SUMMARY_MAPPING_*`, `SUMMARY_INFO` | `QueryDatabaseTableRecord`(변경 컬럼 없으면 전체 조회) → `PutDatabaseRecord`(UPSERT) | PostgreSQL `fems_master.*` |\n\n동기화 기간 동안 원본은 Oracle이며 DataForge 쪽은 읽기 전용입니다.\n\n### F4. MES · Heat · Level-2\n\n현행 FeMS가 Oracle에서 실행하는 MES 조회(`SQL_INFO`의 `sql_04`/`sql_05` 전기로 Heat, `sql_28` 2차가공 Heat, `sql_25` 소형압연 가열로 Level-2)를 NiFi `ExecuteSQLRecord`로 옮기거나, **DataForge가 이미 수집 중인 MES/Level-2 데이터셋**으로 대체합니다.\n\n| 현행 SQL | 원천 MES 테이블 | DataForge 기존 수집분과 대조 |\n|---|---|---|\n| `sql_04`, `sql_05` | `GMES.FPRB3010`, `FPRB2110`, `FPRB3022`, `SPRB3010`, `SPRB3080` | 확인 필요 |\n| `sql_28` | `GMES.SPRI3010` | 확인 필요 |\n| `sql_25` | `GMES.SPRC3059`, `GMES.SPRF3640` | 확인 필요 |\n\nVNTG MES로 바뀌면 F4만 바꾸면 되도록 **FeMS 계산은 F4가 만든 Kafka 토픽만 읽게** 설계합니다.\n\n### F5. KepServerEX Modbus 수집 (P4 단계)\n\nDataForge 표준 PLC 수집 경로(KepServerEX → NiFi → Kafka)를 그대로 씁니다. 제조사별 파싱 규칙과 게이트웨이 이중 폴링 위험은 [03](03_2안_Modbus수집_KepServerEX_이관.md)과 같습니다. 특수 파싱(EL 정수+소수 합산, AUTO 응답 보정 등)은 **DataForge 자체 수집 소스**로 처리할지 함께 검토합니다.\n\n## 10.4 데이터 계층별 저장소 배치\n\n| 데이터 | 특성 | 권장 저장소 | 이유 |\n|---|---|---|---|\n| 원시값(`fems.raw`) | 분당 대량, 시계열, 단순 조회 | TimescaleDB 또는 InfluxDB | 재처리·감사용. 보존 기간 정책 적용 |\n| 1분 사용량·가상태그 | 시계열 + 기준정보 조인 + 금액·부하시간대 | **TimescaleDB** | Metabase는 SQL이 필요하고, 태그·장비·공장 조인이 잦음 → InfluxDB보다 유리 |\n| 15분·시간·일·월 요약, 피크 | 집계 결과 | TimescaleDB 연속 집계 또는 PostgreSQL | Grafana·Metabase 모두 조회 |\n| Heat·원단위·비용 | 업무 리포트 | PostgreSQL | Metabase 리포트 중심 |\n| 기준정보(동기화본) | 마스터 | PostgreSQL | 조인용 |\n| 레거시 비교본(`legacy_*`) | F2 복제 결과 | PostgreSQL | 병행 검증 |\n| 장기 이력·전사 분석 | 수년치 | BigQuery | 장기 보관, 타 공장·타 시스템과 결합 분석 |\n\n> DataForge가 원시 시계열 표준으로 InfluxDB를 쓰고 있다면 원시값만 InfluxDB에 두고, **1분 사용량부터는 TimescaleDB/PostgreSQL**에 두는 이원 배치를 권장합니다. 이 데이터는 금액·부하시간대·기준정보 조인이 많기 때문입니다.\n\n## 10.5 FeMS 계산을 어디서 할 것인가\n\nNiFi는 수집·변환·전달에 강하지만, **직전 상태를 기억해야 하는 계산**(누적값 차분, 15분 창 중앙값, 가상태그 다단 의존, 월 누적)에는 맞지 않습니다.\n\n| 계산 | 성격 | 권장 위치 |\n|---|---|---|\n| 1분 사용량(3단 필터: 중앙값 → 시각 근접 → 차분·상한·0 연속) | 상태 보유, 태그별 직전값 필요 | **FeMS 계산 서비스**(bst_FeMS `05_processor`를 DataForge Kafka 토픽 입출력으로 조정) |\n| 환산(TJ·TOE·tCO2·비용·부하시간대) | 기준정보 조회 | 계산 서비스 또는 DB 함수(Oracle `FN_*` 로직 이식 후) |\n| 가상태그 | 수식, 다단 의존 | 계산 서비스(위상 정렬, `eval` 미사용) |\n| 15분·시간·일·월 요약 | 단순 집계 | **TimescaleDB 연속 집계**(06시·00시 두 기준) |\n| 피크 | 창 최대값 | SQL(연속 집계 또는 스케줄 질의) |\n| Heat 에너지 | MES 조업 구간 × 1분 사용량 | SQL 스케줄 작업(07·10시) |\n| 원단위 | 일 집계 ÷ 생산량 | SQL 스케줄 작업 → Metabase |\n\n계산 서비스는 **Kafka `fems.raw` → `fems.usage.1m` / `fems.vtag.1m`**만 담당하고, 적재는 NiFi 적재 계층이 맡습니다. 이렇게 하면 DataForge 표준(적재는 NiFi)을 지키면서 FeMS 고유 로직만 별도 서비스로 남습니다.\n\n## 10.6 Kafka 토픽 설계(안)\n\n| 토픽 | 생산 | 소비 | 단위 |\n|---|---|---|---|\n| `fems.raw` | F1, F5 | 계산 서비스, 적재(원시) | 태그 단위 |\n| `fems.raw.dlq` | F1, F5 | 운영 확인 | 실패 레코드 |\n| `fems.usage.1m` | 계산 서비스 | 적재(TimescaleDB, BigQuery) | 태그 단위 |\n| `fems.vtag.1m` | 계산 서비스 | 적재 | 태그 단위 |\n| `fems.master.*` | F3 | 계산 서비스(캐시), 적재(PostgreSQL) | 데이터셋 단위 |\n| `fems.mes.heat`, `fems.mes.l2` | F4 | 계산 서비스, 적재 | 데이터셋 단위 |\n| `fems.legacy.*` | F2 | 적재(PostgreSQL `legacy_*`) | 데이터셋 단위 |\n\n토픽 이름·스키마 형식(JSON/Avro, 스키마 레지스트리 여부)은 DataForge 명명 규칙을 따릅니다(09 확인 항목).\n\n## 10.7 화면 — Grafana · Metabase로의 대응\n\n| 현행 Java 화면 기능 | 새 위치 | 비고 |\n|---|---|---|\n| 실시간 주요설비 현황(Kafka `collect1m` WebSocket) | Grafana(TimescaleDB 1분 갱신) | WebSocket 불필요 |\n| 계측기·태그별 현황, 일·월 사용량, 피크 | Grafana 대시보드 | |\n| 원단위·효율, 비용, Heat별 에너지, 월간 보고 | Metabase 질의·대시보드 | |\n| 목표 대비 실적 | Metabase(목표 테이블 + 실적) | 목표 입력 기능 필요 |\n| **기준정보 관리**(태그·장비·가상태그 수식), ISMART·목표 **입력** | Grafana·Metabase로 불가 | 이관 기간에는 **현행 Java 관리 화면 + Oracle 유지** → 이후 VNTG MES 또는 DataForge 관리 화면 |\n\n신규 bst_FeMS React 프론트엔드는 전체 화면이 아니라 **관리(입력) 기능만** 담당하도록 범위를 줄이거나, DataForge 공통 관리 화면이 있으면 그것으로 대체합니다.\n\n## 10.8 신규 bst_FeMS 개발분의 재배치\n\n| 신규 bst_FeMS | DataForge 적용 후 |\n|---|---|\n| `03_collector` (Modbus·OPC-UA) | KepServerEX가 대체. 특수 파싱 제조사에만 선택 사용 |\n| `04_kafka` | DataForge Kafka 사용 |\n| `05_processor` (usage_1m·가상태그) | **FeMS 계산 서비스로 유지**(입출력을 Kafka 토픽으로 조정) |\n| `06_storage` (TimescaleDB 스키마) | 테이블 설계 재사용, 적재는 NiFi |\n| `07_api` | Grafana·Metabase 직접 조회로 대부분 불필요. 관리 기능 API만 유지 검토 |\n| `08_frontend` | 관리 기능만, 또는 DataForge 공통 화면으로 대체 |\n| `01_setting_db` | F3 동기화 대상 스키마로 재사용 |\n"}];

const listEl = document.getElementById('doc-list');
const docEl = document.getElementById('doc');
const crumbEl = document.getElementById('doc-crumb');
const fileEl = document.getElementById('doc-file');
const prevBtn = document.getElementById('prev');
const nextBtn = document.getElementById('next');
const sidebar = document.getElementById('sidebar');
const menuBtn = document.querySelector('.menu-btn');
const byFile = Object.fromEntries(DOCS.map((d, i) => [d.file, i]));
let current = 0;
let mermaidSeq = 0;

function isDark(){
  const forced = document.documentElement.dataset.theme;
  if (forced) return forced === 'dark';
  return window.matchMedia('(prefers-color-scheme: dark)').matches;
}

function initMermaid(){
  if (!window.mermaid) return;
  mermaid.initialize({ startOnLoad: false, securityLevel: 'strict', theme: isDark() ? 'dark' : 'neutral', fontFamily: 'IBM Plex Sans KR, sans-serif' });
}

function buildNav(){
  DOCS.forEach((d, i) => {
    const li = document.createElement('li');
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.dataset.index = String(i);
    const num = document.createElement('span');
    num.className = 'num';
    num.textContent = d.id;
    const label = document.createElement('span');
    label.textContent = d.title;
    btn.append(num, label);
    btn.addEventListener('click', () => show(i));
    li.append(btn);
    listEl.append(li);
  });
}

function renderMarkdown(text){
  if (!window.marked){
    const pre = document.createElement('pre');
    pre.textContent = text;
    return pre.outerHTML;
  }
  return marked.parse(text, { gfm: true });
}

async function renderMermaid(){
  const blocks = docEl.querySelectorAll('pre > code.language-mermaid');
  for (const code of blocks){
    const box = document.createElement('div');
    box.className = 'mermaid-box';
    const source = code.textContent;
    code.parentElement.replaceWith(box);
    if (!window.mermaid){ box.textContent = source; continue; }
    try {
      const { svg } = await mermaid.render('mmd-' + (++mermaidSeq), source);
      box.innerHTML = svg;
    } catch (err) {
      const pre = document.createElement('pre');
      pre.textContent = source;
      box.replaceChildren(pre);
      console.error('mermaid 렌더링 실패', err);
    }
  }
}

function wireLinks(){
  docEl.querySelectorAll('a[href]').forEach(a => {
    const href = a.getAttribute('href');
    const name = decodeURIComponent(href.split('#')[0].split('/').pop());
    const isLocal = !href.includes('/') || href.startsWith('./');
    if (isLocal && name in byFile){
      a.addEventListener('click', e => { e.preventDefault(); show(byFile[name]); });
    } else if (/^https?:/.test(href) || href.startsWith('../')){
      a.target = '_blank';
      a.rel = 'noopener';
    }
  });
  docEl.querySelectorAll('table').forEach(t => {
    const wrap = document.createElement('div');
    wrap.className = 'table-wrap';
    t.replaceWith(wrap);
    wrap.append(t);
  });
}

async function show(i){
  current = i;
  const d = DOCS[i];
  docEl.innerHTML = renderMarkdown(d.content);
  crumbEl.textContent = d.id + ' / ' + String(DOCS.length - 1).padStart(2, '0');
  fileEl.textContent = d.file;
  listEl.querySelectorAll('button').forEach(b => {
    if (Number(b.dataset.index) === i) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');
  });
  const prev = DOCS[i - 1], next = DOCS[i + 1];
  prevBtn.hidden = !prev; nextBtn.hidden = !next;
  prevBtn.textContent = prev ? '← ' + prev.id + ' ' + prev.title : '';
  nextBtn.textContent = next ? next.id + ' ' + next.title + ' →' : '';
  wireLinks();
  try { history.replaceState(null, '', '#' + d.id); } catch (e) { /* file:// 등에서 실패해도 무시 */ }
  sidebar.dataset.open = 'false';
  menuBtn.setAttribute('aria-expanded', 'false');
  window.scrollTo({ top: 0 });
  await renderMermaid();
}

prevBtn.addEventListener('click', () => current > 0 && show(current - 1));
nextBtn.addEventListener('click', () => current < DOCS.length - 1 && show(current + 1));
menuBtn.addEventListener('click', () => {
  const open = sidebar.dataset.open !== 'true';
  sidebar.dataset.open = String(open);
  menuBtn.setAttribute('aria-expanded', String(open));
});
document.getElementById('theme-toggle').addEventListener('click', () => {
  document.documentElement.dataset.theme = isDark() ? 'light' : 'dark';
  try { localStorage.setItem('fems-migration-theme', document.documentElement.dataset.theme); } catch (e) { /* 저장 불가 환경 */ }
  initMermaid();
  show(current);
});
document.addEventListener('keydown', e => {
  if (e.target.closest('input, textarea')) return;
  if (e.key === 'ArrowRight' && current < DOCS.length - 1) show(current + 1);
  if (e.key === 'ArrowLeft' && current > 0) show(current - 1);
});

try {
  const saved = localStorage.getItem('fems-migration-theme');
  if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
} catch (e) { /* 저장 불가 환경 */ }

initMermaid();
buildNav();
const start = DOCS.findIndex(d => '#' + d.id === location.hash);
show(start >= 0 ? start : 0);
</script>
</body>
</html>
