<title>DataForge 드라이브 문서 지도</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f3f5f6; --panel:#ffffff; --ink:#172126; --muted:#5b6a71; --faint:#8b989e;
  --line:#dde3e6; --soft:#e9eef0; --accent:#0e6b70; --accent-soft:#dcefef; --hot:#b4541f;
  --chip:#eef2f3; --shadow:0 1px 2px rgba(20,40,50,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101719; --panel:#162023; --ink:#e3eaec; --muted:#9aabb1; --faint:#6f8187;
    --line:#26343a; --soft:#1c282c; --accent:#5cc3c2; --accent-soft:#17383a; --hot:#e59561;
    --chip:#1f2c30; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#101719; --panel:#162023; --ink:#e3eaec; --muted:#9aabb1; --faint:#6f8187;
  --line:#26343a; --soft:#1c282c; --accent:#5cc3c2; --accent-soft:#17383a; --hot:#e59561;
  --chip:#1f2c30; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans KR",-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:14px;line-height:1.55;padding-inline:16px;padding-block:0 48px}
.wrap{max-width:1280px;margin:0 auto}
a{color:inherit}
.mono{font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
header.top{padding-block:28px 18px;display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-end;justify-content:space-between}
h1{font-size:26px;line-height:1.2;margin:0 0 6px;font-weight:700;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:0;max-width:62ch}
.stats{display:flex;gap:22px;flex-wrap:wrap}
.stat b{display:block;font-size:20px;font-weight:600}
.stat span{font-size:11px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.controls{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.search{flex:1 1 280px;position:relative}
.search input{width:100%;padding:9px 12px 9px 34px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);font:inherit}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--faint)}
input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.seg{display:flex;flex-wrap:wrap;gap:4px}
.seg button,.btn{border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:6px 10px;border-radius:999px;font:inherit;font-size:12.5px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--panel)}
select{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:6px 8px;border-radius:8px;font:inherit;font-size:12.5px}
label.tog{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);cursor:pointer}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:24px;margin-top:18px}
nav.rail{position:sticky;top:70px;align-self:start;display:flex;flex-direction:column;gap:1px;max-height:calc(100vh - 90px);overflow:auto}
nav.rail button{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;color:var(--ink);padding:7px 10px;border-radius:6px;font:inherit;cursor:pointer}
nav.rail button:hover{background:var(--soft)}
nav.rail button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.rail .n{color:var(--faint);font-size:12px}
.rail-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);padding:4px 10px 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.tcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--shadow)}
.tcard h3{margin:0;font-size:16px;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.tcard h3 button{all:unset;cursor:pointer}
.tcard h3 button:hover{color:var(--accent);text-decoration:underline}
.tcard p{margin:0;color:var(--muted);font-size:13px}
.tcard ul{margin:4px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;border-top:1px solid var(--soft);padding-top:8px}
.tcard li{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tcard li a{text-decoration:none}.tcard li a:hover{text-decoration:underline;color:var(--accent)}
.bar{height:4px;border-radius:2px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.thead h2{margin:0 0 4px;font-size:22px;text-wrap:balance}
.thead p{margin:0 0 14px;color:var(--muted);max-width:75ch}
.meta-line{font-size:12px;color:var(--faint);margin-bottom:10px}
.list{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,1.6fr) 92px;gap:14px;padding:11px 14px;border-top:1px solid var(--soft);align-items:start}
.row:first-child{border-top:0}
.row.h{background:var(--soft);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding-block:7px}
.doc a{font-weight:500;text-decoration:none;word-break:break-word}
.doc a:hover{color:var(--accent);text-decoration:underline}
.doc .unk{color:var(--muted);font-style:italic;font-weight:400}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.tag{font-size:11px;padding:1px 7px;border-radius:4px;background:var(--chip);color:var(--muted)}
.tag.t{font-family:"IBM Plex Mono",monospace}
.tag.c{background:var(--accent-soft);color:var(--accent)}
.tag.tp{border:1px solid var(--line);background:none}
.src{font-size:12.5px;color:var(--muted);display:flex;flex-direction:column;gap:2px;min-width:0}
.src a{text-decoration:none;color:var(--ink)}
.src a:hover{color:var(--accent);text-decoration:underline}
.src .path{font-size:11px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.src .sp{font-size:10px;color:var(--hot);margin-right:4px}
.when{text-align:right;font-size:12px;color:var(--muted)}
.when b{display:block;color:var(--ink);font-weight:500}
.more{display:flex;justify-content:center;padding:14px}
.empty{padding:30px;text-align:center;color:var(--muted)}
.note{margin-top:28px;font-size:12px;color:var(--faint);max-width:90ch}
.toprail{display:none}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  nav.rail{display:none}
  .toprail{display:block}
  .row{grid-template-columns:1fr;gap:6px}
  .row.h{display:none}
  .when{text-align:left}
  .when b{display:inline;margin-right:6px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>DataForge 드라이브 문서 지도</h1>
      <p class="sub">Confluence <b>DataForge팀</b>·<b>유병재</b> 스페이스 전체 페이지에 걸린 Google Drive 링크를 파일 단위로 모아 주제별로 묶었습니다. 고객 요청이나 문서 작업 전에 비슷한 자료를 찾는 용도입니다.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <div class="controls">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="문서명·페이지명 검색 (예: 청구서, 소형압연, 태그리스트)" autocomplete="off">
    </div>
    <div class="seg" id="cust" role="group" aria-label="고객사"></div>
    <select id="type" aria-label="파일 유형"></select>
    <select id="sort" aria-label="정렬">
      <option value="refs">많이 참조된 순</option>
      <option value="last">최근 참조 순</option>
      <option value="title">이름 순</option>
    </select>
    <label class="tog"><input type="checkbox" id="unk"> 제목 미확인 링크 포함</label>
  </div>

  <div class="layout">
    <nav class="rail" id="rail" aria-label="주제"></nav>
    <main id="main">
      <div class="toprail"><select id="railSel" aria-label="주제 선택" style="width:100%;margin-bottom:14px"></select></div>
      <div id="view"></div>
    </main>
  </div>

  <p class="note" id="note"></p>
</div>

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  .map(([b,s])=>`<div class="stat"><b class="mono">${b}</b><span>${s}</span></div>`).join('');

function passBase(d){
  if(!st.unk && !d.title) return false;
  if(st.type!=='all' && d.type!==st.type) return false;
  if(st.cust!=='all'){
    if(st.cust==='기타'){ if(!d.cust.some(c=>!['창특','베스틸','동국제강','세아씨엠'].includes(c))) return false; }
    else if(!d.cust.includes(st.cust)) return false;
  }
  if(st.q){ for(const w of st.q.split(/\s+/)) if(!d.hay.includes(w)) return false; }
  return true;
}
function sorted(a){
  const s=[...a];
  if(st.sort==='refs') s.sort((x,y)=>(!!y.title-!!x.title)||y.refs-x.refs||y.last.localeCompare(x.last));
  else if(st.sort==='last') s.sort((x,y)=>y.last.localeCompare(x.last)||y.refs-x.refs);
  else s.sort((x,y)=>(!!y.title-!!x.title)||x.title.localeCompare(y.title,'ko'));
  return s;
}
function pageLink(p){return `${BASE}${SP[p[2]]}/pages/${p[1]}`}
function docLink(d,short){

  return `<a href="${esc(d.url)}" target="_blank" rel="noopener">${t}</a>`;
}
function rowHTML(d){
  const p=d.pages;
  const src=p.map((x,i)=>i===0?`<a href="${pageLink(x)}" target="_blank" rel="noopener">${x[2]?'<span class="sp">개인</span>':''}${esc(x[0])}</a>${x[3]?`<span class="path">${esc(x[3])}</span>`:''}`:'').join('');
  const others=d.refs>1?`<span class="path">외 ${d.refs-1}개 페이지${p[1]?' · '+esc(p.slice(1).map(x=>x[0]).join(' · ')):''}</span>`:'';
  return `<div class="row"><div class="doc">${docLink(d)}<div class="tags"><span class="tag tp">${esc(d.type)}</span>${st.topic==='all'?`<span class="tag">${esc(T[d.topic].name)}</span>`:''}${d.cust.map(c=>`<span class="tag c">${esc(c)}</span>`).join('')}${d.mod?`<span class="tag t">수정 ${d.mod}</span>`:''}</div></div>
  <div class="src">${src}${others}</div>
  <div class="when"><b class="mono">${d.last}</b><span class="mono">참조 ${d.refs}</span></div></div>`;
}
function listHTML(arr){
  if(!arr.length) return `<div class="list"><div class="empty">조건에 맞는 문서가 없습니다. 검색어나 필터를 줄여 보세요.</div></div>`;
  const s=sorted(arr), shown=s.slice(0,st.limit);
  return `<div class="list"><div class="row h"><div>문서</div><div>링크된 Confluence 페이지</div><div style="text-align:right">최근 참조</div></div>${shown.map(rowHTML).join('')}</div>
  ${s.length>shown.length?`<div class="more"><button class="btn" id="moreBtn" type="button">${(s.length-shown.length).toLocaleString()}건 더 보기</button></div>`:''}`;
}
function render(){
  save();
  [...$('cust').children].forEach(b=>b.setAttribute('aria-pressed',b.dataset.k===st.cust));
  const base=docs.filter(passBase);
  const counts={};base.forEach(d=>counts[d.topic]=(counts[d.topic]||0)+1);
  const items=[['all','전체 주제',base.length],...DATA.topics.map(t=>[t[0],t[1],counts[t[0]]||0])];
  $('rail').innerHTML='<div class="rail-label">주제</div>'+items.map(([k,n,c])=>`<button type="button" data-k="${k}" aria-current="${st.topic===k}"><span>${esc(n)}</span><span class="n mono">${c}</span></button>`).join('');
  $('railSel').innerHTML=items.map(([k,n,c])=>`<option value="${k}" ${st.topic===k?'selected':''}>${esc(n)} (${c})</option>`).join('');
  const v=$('view');
  if(st.topic==='all' && !st.q){
    const max=Math.max(...DATA.topics.map(t=>counts[t[0]]||0),1);
    v.innerHTML=`<div class="grid">${DATA.topics.map(([k,n,desc])=>{
      const a=sorted(base.filter(d=>d.topic===k&&d.title)).slice(0,4);
      const c=counts[k]||0;
      return `<section class="tcard"><h3><button type="button" data-k="${k}">${esc(n)}</button><span class="n mono" style="font-size:13px;color:var(--muted)">${c}</span></h3>
      <div class="bar"><i style="width:${Math.round(c/max*100)}%"></i></div><p>${esc(desc)}</p>
      ${a.length?`<ul>${a.map(d=>`<li>${docLink(d)}</li>`).join('')}</ul>`:''}</section>`}).join('')}</div>`;
  } else {
    const arr=st.topic==='all'?base:base.filter(d=>d.topic===st.topic);
    const t=T[st.topic];
    v.innerHTML=`<div class="thead"><h2>${t?esc(t.name):'검색 결과'}</h2>${t?`<p>${esc(t.desc)}</p>`:''}</div>
      <div class="meta-line mono">${arr.length.toLocaleString()}건${st.q?` · “${esc(st.q)}”`:''}</div>${listHTML(arr)}`;
    const mb=$('moreBtn'); if(mb) mb.onclick=()=>{st.limit+=150;render()};
  }
}
$('rail').onclick=e=>{const b=e.target.closest('button');if(!b)return;st.topic=b.dataset.k;st.limit=80;render();window.scrollTo({top:0})};
$('railSel').onchange=e=>{st.topic=e.target.value;st.limit=80;render()};
$('view').addEventListener('click',e=>{const b=e.target.closest('h3 button');if(!b)return;st.topic=b.dataset.k;st.limit=80;render();window.scrollTo({top:0})});
$('note').innerHTML=`수집 방법: 두 스페이스의 모든 페이지 본문에서 docs/drive.google.com 링크를 추출하고 파일 ID로 중복을 제거했습니다(총 ${docs.length.toLocaleString()}개 파일). 문서명은 Google Drive 메타데이터 또는 링크 텍스트에서 가져왔고, 주제는 문서명과 링크된 페이지 경로의 키워드로 자동 분류해 일부 경계 사례가 섞일 수 있습니다. 삭제됐거나 접근 권한이 없는 파일, 개별 조회하지 않은 폴더 ${(docs.length-known).toLocaleString()}개는 “제목 미확인”으로 표시되며 체크박스로 볼 수 있습니다. “개인” 표시는 유병재 스페이스 페이지입니다.`;
render();
</script>
